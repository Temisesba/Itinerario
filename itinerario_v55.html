    head._dragWired = true;
    head.style.cursor = 'grab';
    let sx, sy, startLeft, startTop;
    head.addEventListener('pointerdown', (e) => {
      if (e.target.closest('button')) return;
      e.preventDefault();
      const rect = box.getBoundingClientRect();
      sx = e.clientX; sy = e.clientY;
      startLeft = rect.left; startTop = rect.top;
      head.setPointerCapture(e.pointerId);
      head.style.cursor = 'grabbing';
      // Sacar el modal del flujo flex del overlay para posicionarlo libremente
      box.style.position = 'fixed';
      box.style.left = startLeft + 'px';
      box.style.top = startTop + 'px';
      box.style.margin = '0';

    });

      box.style.top = Math.max(0, Math.min(window.innerHeight - 60, startTop + dy)) + 'px';
    });

function siguienteFechaSugerida() {
  const dias = diasFiltrados().filter(d => d.fecha);
  if (!dias.length) return '';
  const maxFecha = dias.reduce((max, d) => (d.fecha > max ? d.fecha : max), dias[0].fecha);
  const next = new Date(maxFecha + 'T00:00:00');
  next.setDate(next.getDate() + 1);
  return fechaLocalISO(next);
}
function openDiaForm(existingId) {

  modalEsFormulario = true;

      <div class="modal-actions">

function attachTextPicker(inputId, listId, getOpciones) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  function mostrar() {
    const todos = getOpciones();
    const q = input.value.trim().toLowerCase();
    const filtrados = q ? todos.filter(n => n.toLowerCase().includes(q)) : todos;
    if (!filtrados.length) { list.classList.remove('show'); return; }
    list.innerHTML = filtrados.map((n, i) => `<div data-idx="${i}">${escHtml(n)}</div>`).join('');
    list.dataset.opciones = JSON.stringify(filtrados);
    list.classList.add('show');
  }
  input.addEventListener('focus', mostrar);
  input.addEventListener('input', mostrar);
  list.addEventListener('mousedown', (e) => {
    const item = e.target.closest('div[data-idx]'); if (!item) return;
    const opciones = JSON.parse(list.dataset.opciones || '[]');
    input.value = opciones[Number(item.dataset.idx)] || input.value;
    list.classList.remove('show');
  });

}

function construirModosDataInicial(t) {
  if (t && t.modosData && Array.isArray(t.modosData.modos) && t.modosData.modos.length) {
    const data = JSON.parse(JSON.stringify(t.modosData));
    if (!data.mixto) data.mixto = { requiere: false, descripcion: '' };
    data._elegido = { modo: t.tipo || data.modos[0].modo, idx: t.opcionElegida || 0 };
    return data;
  }
  // Sin desglose guardado todavía (transporte nuevo, o uno viejo de antes de este cambio): arrancamos con un solo bloque.
  const modo = (t && t.tipo) || 'otro';
  const opcionVacia = MODOS_SIN_HORARIO.includes(modo) ? { duracionMin: '', salida: '', notas: '' } : { salida: '', llegada: '', notas: '' };
  const opciones = (t && t.opciones && t.opciones.length) ? t.opciones : [opcionVacia];
  return {
    modos: [{ modo, aplica: true, tiempoTotal: '', opciones }],
    mixto: { requiere: false, descripcion: '' },
    _elegido: { modo, idx: t ? (t.opcionElegida || 0) : 0 }
  };
}

let currentModosData = null;

const MODOS_SIN_HORARIO = ['caminando', 'carro', 'bicicleta', 'otro']; // se mueven cuando tú quieras: van por minutos, no por horario fijo

function renderModosEditor() {
  const list = document.getElementById('transComparacionList');

  const elegido = currentModosData._elegido || {};
  let html = '';
  currentModosData.modos.forEach((m) => {

    const colapsado = !!m._colapsado;
    html += `<div class="modo-bloque">
      <div class="modo-header-row" style="cursor:pointer" onclick="toggleModoColapsado('${m.modo}')">
        <span class="modo-header">${colapsado ? '▸' : '▾'} ${escHtml(TIPO_LABEL[m.modo] || m.modo)}${m.aplica === false ? ' · No aplica' : (m.tiempoTotal ? ' · ' + escHtml(m.tiempoTotal) : '')}</span>
        ${currentModosData.modos.length > 1 ? `<button class="icon-btn" type="button" onclick="event.stopPropagation(); eliminarModoBloque('${m.modo}')" title="Quitar este modo">🗑</button>` : ''}
      </div>
      <div style="display:${colapsado ? 'none' : 'block'}" onclick="event.stopPropagation()">
        ${(m.opciones || []).map((o, i) => porMinutos ? `
          <div class="opt-edit-row">
            <input type="radio" name="modoOpcionElegida" class="opt-radio" ${elegido.modo === m.modo && Number(elegido.idx) === i ? 'checked' : ''} onclick="marcarModoElegido('${m.modo}',${i})" title="Marcar como la elegida">
            <input type="number" min="0" class="time" style="max-width:64px" placeholder="min" value="${o.duracionMin != null ? o.duracionMin : ''}" onchange="actualizarModoOpcion('${m.modo}',${i},'duracionMin',this.value)">
            <input class="time" placeholder="Salida (opcional)" value="${escHtml(o.salida || '')}" onchange="actualizarModoOpcion('${m.modo}',${i},'salida',this.value)">
            <input class="time" style="max-width:80px" placeholder="Cotiz. ~¥" value="${escHtml(o.precioEstimado || '')}" onchange="actualizarModoOpcion('${m.modo}',${i},'precioEstimado',this.value)" title="Cotización aproximada — no es un gasto real, solo para comparar">
            <input placeholder="Notas" value="${escHtml(o.notas || '')}" onchange="actualizarModoOpcion('${m.modo}',${i},'notas',this.value)">
            <button class="icon-btn" type="button" onclick="eliminarModoOpcion('${m.modo}',${i})">🗑</button>
          </div>` : `
          <div class="opt-edit-row">
            <input type="radio" name="modoOpcionElegida" class="opt-radio" ${elegido.modo === m.modo && Number(elegido.idx) === i ? 'checked' : ''} onclick="marcarModoElegido('${m.modo}',${i})" title="Marcar como la elegida">
            <input class="time" placeholder="Sale 08:05" value="${escHtml(o.salida || '')}" onchange="actualizarModoOpcion('${m.modo}',${i},'salida',this.value)">
            <input class="time" placeholder="Llega 09:45" value="${escHtml(o.llegada || '')}" onchange="actualizarModoOpcion('${m.modo}',${i},'llegada',this.value)">
            <input class="time" style="max-width:80px" placeholder="Cotiz. ~¥" value="${escHtml(o.precioEstimado || '')}" onchange="actualizarModoOpcion('${m.modo}',${i},'precioEstimado',this.value)" title="Cotización aproximada — no es un gasto real, solo para comparar">
            <input placeholder="Notas" value="${escHtml(o.notas || '')}" onchange="actualizarModoOpcion('${m.modo}',${i},'notas',this.value)">
            <button class="icon-btn" type="button" onclick="eliminarModoOpcion('${m.modo}',${i})">🗑</button>
          </div>`).join('')}
        <button class="btn-mini" type="button" onclick="agregarModoOpcion('${m.modo}')">＋ Agregar ${porMinutos ? 'duración' : 'horario'}</button>
      </div>
    </div>`;
  });

  html += `<div class="modo-bloque">
    <label style="display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:#8a3a0c; cursor:pointer">
      <input type="checkbox" ${currentModosData.mixto.requiere ? 'checked' : ''} onchange="currentModosData.mixto.requiere=this.checked; document.getElementById('mixtoDescWrap').style.display=this.checked?'block':'none'">
      ⚠️ Requiere mixto / conexión
    </label>
    <div id="mixtoDescWrap" style="display:${currentModosData.mixto.requiere ? 'block' : 'none'}; margin-top:6px">
      <textarea placeholder="Ej: caminar a la parada, bus hasta X, luego tren..." onchange="currentModosData.mixto.descripcion=this.value" style="min-height:50px">${escHtml(currentModosData.mixto.descripcion || '')}</textarea>
    </div>
  </div>`;

  const yaUsados = new Set(currentModosData.modos.map(m => m.modo));
  const disponibles = Object.keys(TIPO_LABEL).filter(k => !yaUsados.has(k));
  if (disponibles.length) {
    html += `<div style="display:flex; gap:6px; align-items:center; margin-top:2px">
      <select id="fNuevoModoSelect" style="flex:1">${disponibles.map(k => `<option value="${k}">${TIPO_LABEL[k]}</option>`).join('')}</select>
      <button class="btn-mini" type="button" style="white-space:nowrap" onclick="agregarModoBloque()">＋ Agregar modo</button>
    </div>`;
  }

  list.innerHTML = html;
  document.getElementById('transComparacionWrap').style.display = 'block';
}

function toggleModoColapsado(modo) {
  const m = currentModosData.modos.find(x => x.modo === modo);
  if (m) m._colapsado = !m._colapsado;
  renderModosEditor();
}

function actualizarModoOpcion(modo, idx, campo, valor) {
  const m = currentModosData.modos.find(x => x.modo === modo);
  if (m && m.opciones[idx]) m.opciones[idx][campo] = campo === 'duracionMin' ? (valor === '' ? '' : Number(valor)) : valor;
}
function eliminarModoOpcion(modo, idx) {
  const m = currentModosData.modos.find(x => x.modo === modo);
  if (m) m.opciones.splice(idx, 1);
  renderModosEditor();
}
function agregarModoOpcion(modo) {
  const m = currentModosData.modos.find(x => x.modo === modo);
  if (m) {
    m.opciones = m.opciones || [];
    m.opciones.push(MODOS_SIN_HORARIO.includes(modo) ? { duracionMin: '', salida: '', notas: '', precioEstimado: '' } : { salida: '', llegada: '', notas: '', precioEstimado: '' });
    m.aplica = true;
  }
  renderModosEditor();
}
function eliminarModoBloque(modo) {
  currentModosData.modos = currentModosData.modos.filter(m => m.modo !== modo);
  if (currentModosData._elegido && currentModosData._elegido.modo === modo && currentModosData.modos.length) {
    currentModosData._elegido = { modo: currentModosData.modos[0].modo, idx: 0 };
  }
  renderModosEditor();
}
function agregarModoBloque() {
  const sel = document.getElementById('fNuevoModoSelect');
  if (!sel || !sel.value) return;
  currentModosData.modos.push({ modo: sel.value, aplica: true, tiempoTotal: '', opciones: [{ salida: '', llegada: '', notas: '' }] });
  renderModosEditor();
}
function marcarModoElegido(modo, idx) {
  currentModosData._elegido = { modo, idx };
  document.getElementById('fTransTipo').value = modo;
  actualizarEtiquetasDireccion();
}
// Las etiquetas de dirección cambian según el modo: aeropuerto, estación, parada, puerto, o punto genérico.
function actualizarEtiquetasDireccion() {
  const sel = document.getElementById('fTransTipo');
  const tipo = sel ? sel.value : 'otro';
  const et = ETIQUETA_DIRECCION[tipo] || ETIQUETA_DIRECCION.otro;
  const lo = document.getElementById('lblDireccionOrigen');
  const ld = document.getElementById('lblDireccionDestino');
  if (lo) lo.textContent = et.origen;
  if (ld) ld.textContent = et.destino;
}
// v57 fix: "Horarios por modo" arrancaba SIEMPRE en "Otro" (hardcoded), sin importar lo que se
// eligiera arriba en "Tipo" — si llenabas el form a mano (sin usar sugerencias IA) y nunca
// tocabas el editor de modos, se guardaba como "Otro" aunque arriba dijera "Bus". Mientras el
// editor siga teniendo un solo bloque (el caso común: recién abierto, sin tocar todavía), se
// renombra para que coincida con lo elegido arriba. Si ya se agregó un segundo modo a mano, se
// deja como está (ya es una elección real, no hay "el único" que renombrar).
function sincronizarTipoConModoUnico() {
  actualizarEtiquetasDireccion();

  if (currentModosData && currentModosData.modos && currentModosData.modos.length === 1) {
    currentModosData.modos[0].modo = nuevoTipo;

}

// Combina el nombre del lugar (ej. "Aeropuerto Benito Juárez") con su dirección detallada,
// para saber de un vistazo QUÉ es ese punto (aeropuerto/estación/parada) y no solo la calle.
function formatearDireccionConNombre(nombre, direccion) {
  if (!direccion) return nombre || '';
  return nombre ? `${nombre} (${direccion})` : direccion;
}
// Normaliza el array "modos" que devuelve la IA (sugerirTransporteCompleto) a la forma que usa el resto
// de la app (direccionOrigen/origenLat/... en vez de origenDireccion/origenLat/...), para que elegirModoEnCard
// y demás lectores de modosData.modos[] encuentren siempre los mismos nombres de campo.
function normalizarModosIA(modosRaw) {
  return (modosRaw || []).map(m => ({
    modo: m.modo, aplica: m.aplica !== false, tiempoTotal: m.tiempoTotal || '', opciones: m.opciones || [],
    direccionOrigen: formatearDireccionConNombre(m.origenNombre, m.origenDireccion), origenLat: m.origenLat || '', origenLng: m.origenLng || '',
    direccionDestino: formatearDireccionConNombre(m.destinoNombre, m.destinoDireccion), destinoLat: m.destinoLat || '', destinoLng: m.destinoLng || ''
  }));
}

async function sugerirTransporteCompletoForm(btnEl) {
  const origenTexto = document.getElementById('fTransOrigen').value;
  const destinoTexto = document.getElementById('fTransDestino').value;
  const pista = document.getElementById('fTransPista').value;

  if (btnEl) { btnEl.disabled = true; btnEl.innerHTML = '<span class="spinner-mini"></span> Pensando…'; }
  showToast('Pensando la mejor ruta…');
  const dia = itinerario.dias.find(d => d.id === currentDiaId);
  const r = await postGAS({ action: 'sugerirTransporteCompleto', origenTexto, destinoTexto, pista, zona: dia ? dia.zona : '', fecha: dia ? dia.fecha : '' });

    (d.destinoMotivo ? `Destino: ${d.destinoMotivo}\n` : '') +
    (d.notaRuta ? `Ruta: ${d.notaRuta}` : '');

  // El desglose por modo (lo verde) reemplaza el editor: esto es ahora lo único que existe, y se guarda literal.
  const tramosDesc = ((d.mixto && d.mixto.tramos) || []).map(tr => `${TIPO_LABEL[tr.modo] || tr.modo}${tr.detalle ? ', ' + tr.detalle : ''}`).join(' → ');
  currentModosData = {
    modos: normalizarModosIA(d.modos),
    mixto: { requiere: !!(d.mixto && d.mixto.requiere), descripcion: tramosDesc },

  };
  if (d.tipoSugerido) { document.getElementById('fTransTipo').value = d.tipoSugerido; actualizarEtiquetasDireccion(); }
  renderModosEditor();

  showToast('✨ Listo — toca el círculo del horario que quieras usar');
}

async function guardarTransporte() {
  if (!guardarBtnLock(true)) return;
  const id = document.getElementById('fTransId').value;
  const diaNuevoId = document.getElementById('fTransDia').value;
  const diaOriginalId = document.getElementById('fTransDiaOriginal').value;
  if (id && diaNuevoId !== diaOriginalId) {
    const fechaDe = (itinerario.dias.find(d => d.id === diaOriginalId) || {}).fecha || '(sin fecha)';
    const fechaA = (itinerario.dias.find(d => d.id === diaNuevoId) || {}).fecha || '(sin fecha)';
    if (!confirm(`Estás moviendo esto de ${fechaDe} a ${fechaA}. ¿Estás de acuerdo?`)) { guardarBtnLock(false); return; }
  }
  const elegido = (currentModosData && currentModosData._elegido) || {};
  const modoFinal = currentModosData.modos.find(m => m.modo === elegido.modo) || currentModosData.modos[0];
  const tipoFinal = modoFinal ? modoFinal.modo : document.getElementById('fTransTipo').value;
  // Para modos sin horario fijo (carro/caminando/bici/otro): si pusiste salida + minutos, calculamos la llegada sola.
  if (modoFinal && MODOS_SIN_HORARIO.includes(modoFinal.modo)) {
    (modoFinal.opciones || []).forEach(o => {
      if (o.salida && o.duracionMin !== '' && o.duracionMin != null) {
        const ini = hhmmToMin(o.salida);
        if (ini !== null) o.llegada = minToHHMM(ini + Number(o.duracionMin));
      }
    });
  }
  const opcionesFinal = modoFinal ? (modoFinal.opciones || []) : [];
  const idxFinal = Math.max(0, Math.min(opcionesFinal.length - 1, Number(elegido.idx) || 0));
  const modosDataAGuardar = { modos: currentModosData.modos, mixto: currentModosData.mixto };

  const body = {
    diaId: document.getElementById('fTransDia').value,
    tipo: tipoFinal,
    origen: document.getElementById('fTransOrigen').value,
    destino: document.getElementById('fTransDestino').value,
    direccionOrigen: document.getElementById('fTransDireccionOrigen').value,
    direccionDestino: document.getElementById('fTransDireccionDestino').value,
    origenLat: document.getElementById('fTransOrigenLat').value,
    origenLng: document.getElementById('fTransOrigenLng').value,
    destinoLat: document.getElementById('fTransDestinoLat').value,
    destinoLng: document.getElementById('fTransDestinoLng').value,
    opciones: opcionesFinal,
    opcionElegida: idxFinal,
    modosData: modosDataAGuardar,
    reservado: getReservadoVal('fTransReservado'),
    notas: document.getElementById('fTransNotas').value,
    sugerenciasIAOrigen: document.getElementById('fTransSugTexto').value,
    sugerenciasIADestino: ''
  };
  body.action = id ? 'updateTransporte' : 'saveTransporte';
  if (id) body.id = id;
  const r = await postGAS(body);
  if (r.ok) { modalClose(); showToast('Guardado ✦'); await loadItinerario(); }
  else { showToast('⚠️ El servidor no guardó el cambio. Intenta de nuevo.'); }
  guardarBtnLock(false);
}

// diaIdInicio/diaIdFin (mismo criterio que nochesDeHospedaje, usado para repartir el gasto del
// hotel entre los días en "Gastos del día").

  const hint = document.getElementById('fHospNochesHint'); if (!hint) return;

function pendCheckHorarioAlerta() {
  const aviso = document.getElementById('fPendHorarioAviso');
  if (!aviso) return;
  const apertura = document.getElementById('fPendHorarioApertura').value;
  const cierre = document.getElementById('fPendHorarioCierre').value;
  const horaIni = document.getElementById('fPendHoraIni').value;
  const horaFin = document.getElementById('fPendHoraFin').value;
  if (!apertura || !cierre || !horaIni) { aviso.style.display = 'none'; return; }
  const aM = hhmmToMin(apertura), cM = hhmmToMin(cierre);
  const iniM = hhmmToMin(horaIni), finM = horaFin ? hhmmToMin(horaFin) : null;
  const dentro = (m) => (cM >= aM) ? (m >= aM && m <= cM) : (m >= aM || m <= cM); // cM < aM = cierra después de medianoche
  const fueraIni = !dentro(iniM);
  const fueraFin = finM !== null && !dentro(finM);
  if (fueraIni || fueraFin) {
    aviso.style.display = 'block';
    aviso.textContent = `⚠️ A esta hora el lugar podría estar cerrado — abre ${apertura} y cierra ${cierre}`;
  } else {
    aviso.style.display = 'none';
  }
}

function guardarColaPendiente(cola) { try { localStorage.setItem('itin_colaPendiente', JSON.stringify(cola)); } catch (e) {} }

// A qué colección de itinerario corresponde una acción tipo saveHospedaje/updateHospedaje/deleteHospedaje.
function coleccionDeAccion(action) {
  const COLECCION_POR_ENTIDAD = { Dia: 'dias', Transporte: 'transporte', Hospedaje: 'hospedaje', Pendiente: 'pendientes', Evento: 'eventos' };
  const m = /^(save|update|delete)(Dia|Transporte|Hospedaje|Pendiente|Evento)$/.exec(action || '');
  return m ? COLECCION_POR_ENTIDAD[m[2]] : null;
}
// Aplica un cambio (el mismo body que se le manda al backend) directo sobre el itinerario en
// memoria — espejo mínimo de lo que hace cada saveX/updateX/deleteX del backend, campo por campo.
function aplicarCambioLocal(itin, body) {
  const col = coleccionDeAccion(body.action);
  if (!col || !itin[col]) return;
  const lista = itin[col];
  if (body.action.startsWith('save')) {
    if (lista.some(x => x.id === body.id)) return; // ya estaba aplicado
    const nuevo = { id: body.id };
    Object.keys(body).forEach(k => { if (k !== 'action' && k !== 'id' && k !== '_opId') nuevo[k] = body[k]; });
    lista.push(nuevo);
  } else if (body.action.startsWith('update')) {
    const item = lista.find(x => x.id === body.id);
    if (!item) return;
    Object.keys(body).forEach(k => { if (k !== 'action' && k !== 'id' && k !== '_opId') item[k] = body[k]; });
  } else if (body.action.startsWith('delete')) {
    itin[col] = lista.filter(x => x.id !== body.id);
  }
}
// Reconstruye itinerario a partir de la última base confirmada + lo que sigue pendiente de mandar.
function reconstruirDesdeCache() {
  const base = cargarBaseline();
  if (!base) { showToast('Sin datos guardados todavía en este dispositivo — necesitás conexión la primera vez'); return; }
  itinerario = JSON.parse(JSON.stringify(base));
  cargarColaPendiente().forEach(c => aplicarCambioLocal(itinerario, c));
  itinerario.dias.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  if (currentProyecto === null) currentProyecto = pickDefaultProyecto();
  if (!currentDiaId || !diasFiltrados().some(d => d.id === currentDiaId)) currentDiaId = pickTodayOrFirst();
}
function encolarCambioOffline(body) {
  const clon = { ...body, _opId: 'OP-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7) };
  if (/^save/.test(body.action) && !clon.id) clon.id = 'TMP-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const cola = cargarColaPendiente();
  cola.push(clon);
  guardarColaPendiente(cola);
  aplicarCambioLocal(itinerario, clon);
  actualizarIndicadorConexion();
  return { ok: true, id: clon.id, offline: true };
}

// ── Indicador de conexión / cola pendiente ─────────────────────
function actualizarIndicadorConexion() {
  const btn = document.getElementById('btnConexion');
  if (!btn) return;
  const pendientes = cargarColaPendiente().length;
  if (!navigator.onLine) {
    btn.style.display = '';
    btn.textContent = pendientes ? `🔌 Sin conexión · ${pendientes}` : '🔌 Sin conexión';
    btn.title = 'Sin conexión — tus cambios se guardan acá y se mandan solos al volver';
  } else if (pendientes) {
    btn.style.display = '';
    btn.textContent = `☁️ ${pendientes} sin sincronizar`;
    btn.title = 'Tocá para sincronizar ahora';
  } else {
    btn.style.display = 'none';
  }
}

// ── Sincronización + detección de conflictos (comparación de 3 vías) ──
// Para cada campo que cambió localmente: si el servidor no lo tocó desde la última vez que lo
// vimos (baseline), se manda tal cual; si el servidor ya tiene puesto lo mismo que queríamos
// mandar, no hace falta nada; si el servidor tiene un valor distinto a los otros dos, es conflicto.
function detectarConflicto(cambio, baseline, fresco) {
  const col = coleccionDeAccion(cambio.action);
  if (!col) return null; // acción que no sabemos comparar (ej. notas/chat) — se manda directo
  if (cambio.action.startsWith('delete')) {
    const existeAhora = (fresco[col] || []).some(x => x.id === cambio.id);
    return existeAhora ? null : { tipo: 'yaBorrado' };
  }
  if (cambio.action.startsWith('save')) return null; // creado con id temporal propio, no compite con nada
  const idFresco = (fresco[col] || []).find(x => x.id === cambio.id);
  if (!idFresco) return { tipo: 'borrado' }; // lo borraron del otro lado
  const idBase = (baseline[col] || []).find(x => x.id === cambio.id);
  if (!idBase) return null; // no había base para comparar, se manda directo
  const campos = [];
  Object.keys(cambio).forEach(k => {
    if (k === 'action' || k === 'id' || k === '_opId') return;
    const j = v => JSON.stringify(v === undefined ? null : v);
    if (j(idFresco[k]) === j(idBase[k])) return; // el servidor no tocó este campo
    if (j(idFresco[k]) === j(cambio[k])) return; // ya coincide
    campos.push({ campo: k, base: idBase[k], servidor: idFresco[k], local: cambio[k] });
  });
  return campos.length ? { tipo: 'campos', campos } : null;
}
let _sincronizando = false;
async function sincronizarPendientes(silencioso) {
  if (_sincronizando) return;
  const cola = cargarColaPendiente();
  if (!cola.length) { if (!silencioso) showToast('No hay cambios pendientes'); return; }
  if (!navigator.onLine) { if (!silencioso) showToast('Seguís sin conexión'); return; }
  _sincronizando = true;
  actualizarIndicadorConexion();
  try {
    let fresco;
    try {
      const r = await fetch(`${GAS_URL}?action=getItinerario&t=${Date.now()}`);
      fresco = await r.json();
    } catch (e) { return; } // en realidad seguimos sin señal, se reintenta después
    const baseline = cargarBaseline() || fresco;
    for (const cambio of cargarColaPendiente()) {
      const conflicto = detectarConflicto(cambio, baseline, fresco);
      if (conflicto && conflicto.tipo === 'yaBorrado') { quitarDeColaPendiente(cambio._opId); continue; }
      if (conflicto && conflicto.tipo === 'borrado') {
        showToast(`${elOtro() || 'El otro lado'} borró algo que habías editado sin conexión — se descartó ese cambio`);
        quitarDeColaPendiente(cambio._opId);
        continue;
      }
      if (conflicto && conflicto.tipo === 'campos') { mostrarModalConflicto(cambio, conflicto.campos, fresco); return; }
      const { _opId, ...bodyReal } = cambio;
      try {
        const form = new FormData(); form.append('payload', JSON.stringify(bodyReal));
        const resp = await fetch(GAS_URL, { method: 'POST', body: form });
        await resp.json();
      } catch (e) { return; } // se cortó la señal a mitad de camino
      quitarDeColaPendiente(_opId);
    }
    if (!cargarColaPendiente().length) {
      guardarBaseline(fresco);
      await loadItinerario();
      showToast('✅ Todo sincronizado');
    }
  } finally {
    _sincronizando = false;
    actualizarIndicadorConexion();
  }
}

async function guardarResolucionConflicto() {
  const { cambio, campos } = _conflictoActual;
  const bodyFinal = { action: cambio.action, id: cambio.id };
  Object.keys(cambio).forEach(k => { if (k !== 'action' && k !== 'id' && k !== '_opId') bodyFinal[k] = cambio[k]; });
  campos.forEach(c => { if (c._elegido === 'servidor') bodyFinal[c.campo] = c.servidor; });
  showToast('Guardando...');
  try {
    const form = new FormData(); form.append('payload', JSON.stringify(bodyFinal));

  quitarDeColaPendiente(cambio._opId);

  modalClose();
  sincronizarPendientes(true);
}

async function postGAS(body) {
  if (!navigator.onLine) return encolarCambioOffline(body);
  _showGasSaving(true);
  try {
    const form = new FormData(); form.append('payload', JSON.stringify(body));
    const r = await fetch(GAS_URL, { method: 'POST', body: form });

}
function escHtml(s) { return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

  document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 2600);
}

// ── Copiar texto de un visor (para pegarlo, por ej., en el chat con la IA) ──
async function copiarAlPortapapeles(texto) {
  if (!texto) { showToast('Nada para copiar'); return; }
  try {
    await navigator.clipboard.writeText(texto);
    showToast('📋 Copiado');
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = texto; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('📋 Copiado'); }
    catch (e2) { showToast('No se pudo copiar'); }
    document.body.removeChild(ta);
  }
}

}

let tablaSortState = {}; // { hospedaje: {key, dir}, pendientes: {...}, transporte: {...} }
function ordenarTabla(tabla, key) {
  const cur = tablaSortState[tabla];
  const dir = (cur && cur.key === key && cur.dir === 'asc') ? 'desc' : 'asc';
  tablaSortState[tabla] = { key, dir };
  renderTabla();
}
function aplicarOrden(tabla, rows, mapFn) {
  const st = tablaSortState[tabla];
  if (!st) return rows;
  const sorted = [...rows].sort((a, b) => {
    const va = String((mapFn(a)[st.key] ?? '')).replace(/<[^>]+>/g, '').toLowerCase();
    const vb = String((mapFn(b)[st.key] ?? '')).replace(/<[^>]+>/g, '').toLowerCase();
    return va < vb ? -1 : va > vb ? 1 : 0;
  });
  return st.dir === 'desc' ? sorted.reverse() : sorted;
}

      return (!busqueda || Object.values(r).some(v=>filtra(v))) && filtraFecha(r.desde||r.hasta||'');

function toggleGastoSuma(id) {
  if (_gastosSumaSel.has(id)) _gastosSumaSel.delete(id); else _gastosSumaSel.add(id);

}
function toggleSumarTodosGastos(marcar, esCot) {
  // Selecciona/deselecciona TODOS los gastos reales, o todas las cotizaciones si esCot=true
  Object.values(gastosVinculados).forEach(lista => lista.forEach(g => {
    if (!!g.cotizacion === !!esCot) {
      if (marcar) _gastosSumaSel.add(g.id); else _gastosSumaSel.delete(g.id);
    }
  }));
  actualizarSumaSeleccion();
  renderTabla(); // re-render para actualizar los checkboxes individuales
}
function actualizarSumaSeleccion() {
  // Recolectar todos los gastos y sumar los seleccionados
  let suma = 0, n = 0;
  Object.values(gastosVinculados).forEach(lista => lista.forEach(g => {
    if (_gastosSumaSel.has(g.id)) { suma += Number(g.costo||0); n++; }
  }));
  let bar = document.getElementById('sumaSelBar');
  if (!bar) {
    bar = document.createElement('div');
    bar.id = 'sumaSelBar';
    bar.style.cssText = 'position:fixed; bottom:16px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 22px; border-radius:30px; font-size:13px; font-weight:600; z-index:999; box-shadow:0 4px 16px rgba(0,0,0,.3); display:flex; gap:12px; align-items:center';
    document.body.appendChild(bar);
  }
  if (n === 0) { bar.remove(); return; }
  bar.innerHTML = `Σ ${n} seleccionado${n>1?'s':''}: <b>¥${suma.toLocaleString()}</b> <button onclick="_gastosSumaSel.clear(); actualizarSumaSeleccion(); renderTabla();" style="background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:14px;padding:2px 10px;cursor:pointer;font-size:11px">Limpiar</button>`;
}

function tablaGastosSeccion() {
  const busqueda = (document.getElementById('tablaBusqueda') || {}).value || '';
  // Mismo filtro "Vista" (día / varios días / todos) que el resto de la tabla.
  const diasFiltroG = tablaVistaModo === 'todos' ? diasFiltrados() : diasFiltrados().filter(d => tablaDiasSel.has(d.id));
  const diaIdsFiltroG = new Set(diasFiltroG.map(d => d.id));
  // v57 fix: antes solo se recorría gastosVinculados — los gastos SIN item asociado (solo con
  // "Día en itinerario" directo, ej. un Lawson o un puesto de comida suelto) nunca aparecían acá,
  // aunque sí se vieran bien en "Gastos del día" del panel lateral. Ahora se juntan ambas fuentes,
  // igual que ya hace gastosDeEsteDia()/todosLosGastosReales(), sin repetir el mismo gasto dos veces.
  const filas = [];
  const vistosTablaGastos = new Set();
  const procesarGastoTabla = (itemId, g) => {
    if (vistosTablaGastos.has(g.id)) return; vistosTablaGastos.add(g.id);
    const pend = itemId ? itinerario.pendientes.find(p => p.id === itemId) : null;
    const trans = itemId ? itinerario.transporte.find(t => t.id === itemId) : null;
    const hosp = itemId ? itinerario.hospedaje.find(h => h.id === itemId) : null;
    const evt = itemId ? itinerario.eventos.find(e => e.id === itemId) : null;
    if (tablaVistaModo !== 'todos') {
      const perteneceDia = diaIdsFiltroG.has(g.diaItinerario)
        || (pend && diaIdsFiltroG.has(pend.diaId))
        || (trans && diaIdsFiltroG.has(trans.diaId))
        || (hosp && (diaIdsFiltroG.has(hosp.diaIdInicio) || diaIdsFiltroG.has(hosp.diaIdFin)))
        || (evt && (diaIdsFiltroG.has(evt.diaIdInicio) || diaIdsFiltroG.has(evt.diaIdFin)));
      if (!perteneceDia) return;
    }
    const nombre = pend ? pend.nombre : trans ? `${trans.origen} → ${trans.destino}` : hosp ? hosp.nombre : evt ? evt.nombre : (g.concepto || '(sin item)');
    const categoria = pend ? (pend.esRestaurante ? '🍴 Restaurante' : '📌 Lugar') : trans ? '🚆 Transporte' : hosp ? '🏨 Hospedaje' : evt ? '🎪 Evento' : '💴 General';
    const visorFn = pend ? 'Pendiente' : trans ? 'Transporte' : hosp ? 'Hospedaje' : evt ? 'Evento' : '';
    filas.push({ ...g, nombre, visorFn, itemId: itemId || '' });
  };
  Object.entries(gastosVinculados).forEach(([itemId, gastos]) => gastos.forEach(g => procesarGastoTabla(itemId, g)));
  Object.values(gastosDelDia).forEach(gastos => gastos.forEach(g => procesarGastoTabla(g.itemId || '', g)));
  if (filas.length === 0) return '';
  if (!window._gastoCols) window._gastoCols = { categoria:1, concepto:1, fecha:1, costo:1, quien_paga:1, notas:1, compartido:0 };
  const _gastoCols = window._gastoCols;
  const COL_LABELS = { categoria:'Categoría', concepto:'Concepto', fecha:'Fecha', costo:'Monto', quien_paga:'¿Quién?', notas:'Notas', compartido:'Cómo' };
  if (!window._gastoSort) window._gastoSort = { key:'', dir:'asc' };
  const st = window._gastoSort;
  const activeCols = Object.keys(_gastoCols).filter(k => _gastoCols[k]);
  const busqG = (document.getElementById('tablaBusqueda') || {}).value || '';
  const fDesde = (document.getElementById('tablaFechaDesde') || {}).value || '';
  const fHasta = (document.getElementById('tablaFechaHasta') || {}).value || '';
  const filtraBusq = (f) => !busqG || [f.nombre,f.concepto,f.tienda,f.quien_paga,f.compartido].some(v=>String(v||'').toLowerCase().includes(busqG.toLowerCase()));
  const filtraBusqYFecha = (f) => {
    if (!filtraBusq(f)) return false;
    if (!fDesde && !fHasta) return true;
    const s = f.fecha || '';
    if (fDesde && fHasta) return s >= fDesde && s <= fHasta;
    if (fDesde) return s >= fDesde;
    return s <= fHasta;
  };
  const sortFn = (a, b) => {
    const vA = String(a[st.key]||''), vB = String(b[st.key]||'');
    if (st.key === 'costo') return st.dir==='asc' ? Number(a.costo||0)-Number(b.costo||0) : Number(b.costo||0)-Number(a.costo||0);
    return st.dir==='asc' ? vA.localeCompare(vB) : vB.localeCompare(vA);
  };
  const reales = filas.filter(f => !f.cotizacion && filtraBusqYFecha(f)).sort(sortFn);
  const cots   = filas.filter(f =>  f.cotizacion && filtraBusqYFecha(f)).sort(sortFn);
  const totalJPY = reales.reduce((s,f) => s + (f.moneda==='JPY' ? Number(f.costo||0) : 0), 0);

  const colSelector = `<div style="position:relative; display:inline-block" id="gastoColSel">
    <button class="btn-mini" onclick="toggleGastoColSel(); event.stopPropagation()" style="font-size:11px">⚙ Columnas</button>
    <div id="gastoColMenu" style="display:none; position:absolute; top:110%; right:0; background:#fff; border:1px solid var(--line); border-radius:8px; padding:8px; z-index:50; min-width:130px; box-shadow:0 4px 16px rgba(0,0,0,.12)">
      ${Object.keys(COL_LABELS).map(k => `<label style="display:flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;padding:2px 0"><input type="checkbox" ${_gastoCols[k]?'checked':''} onchange="window._gastoCols['${k}']=this.checked; renderTabla()"> ${COL_LABELS[k]}</label>`).join('')}
    </div>
  </div>`;

  const buildTable = (rows, showTotals, esCot) => {
    if (!rows.length) return `<div class="empty-mini">Sin registros</div>`;
    const rowsTotal = rows.reduce((s,f)=>s+(f.moneda==='JPY'?Number(f.costo||0):0),0);
    const theadHtml = activeCols.map(k => {
      const arrow = st && st.key===k ? (st.dir==='asc'?' ▲':' ▼') : '';
      return `<th style="cursor:pointer; user-select:none; text-align:${k==='costo'?'right':'left'}" onclick="window._gastoSort={key:'${k}',dir:window._gastoSort&&window._gastoSort.key==='${k}'&&window._gastoSort.dir==='asc'?'desc':'asc'}; renderTabla()">${COL_LABELS[k]}${arrow}</th>`;
    }).join('') + `<th style="text-align:center; white-space:nowrap">Σ Sumar</th>`;
    const tbodyHtml = rows.map(f => `<tr style="cursor:pointer" onclick="${f.visorFn ? `abrirVisor${f.visorFn}('${f.itemId}')` : `editarGastoVisor('', '', '${f.id}')`}">
      ${activeCols.map(k => {
        if(k==='costo') return `<td style="text-align:right; font-weight:600">¥${Number(f.costo||0).toLocaleString()}</td>`;
        if(k==='concepto') return `<td>${escHtml(f.concepto||'')}${f.tienda?` <span style="color:var(--ink-3);font-size:10px">· ${escHtml(f.tienda)}</span>`:''}</td>`;
        return `<td>${escHtml(String(f[k]||''))}</td>`;
      }).join('')}
      <td style="text-align:center" onclick="event.stopPropagation()">
        <input type="checkbox" ${_gastosSumaSel.has(f.id)?'checked':''} onchange="toggleGastoSuma('${f.id}')" style="cursor:pointer; width:15px; height:15px">
      </td>
    </tr>`).join('');
    const tfootHtml = showTotals ? `<tfoot><tr><td colspan="${activeCols.length-1}" style="padding:7px 12px; font-weight:600">${esCot?'Total estimado en ¥':'Total en ¥'}</td><td style="padding:7px 12px; font-weight:700; text-align:right">¥${rowsTotal.toLocaleString()}</td><td style="text-align:center" onclick="event.stopPropagation()"><input type="checkbox" ${rows.length && rows.every(f=>_gastosSumaSel.has(f.id))?'checked':''} onchange="toggleSumarTodosGastos(this.checked${esCot?', true':''})" title="Seleccionar/deseleccionar todos los ${esCot?'cotizaciones':'gastos'}" style="cursor:pointer; width:15px; height:15px"></td></tr></tfoot>` : '';
    return `<div class="tabla-scroll"><table class="data-table"><thead><tr>${theadHtml}</tr></thead><tbody>${tbodyHtml}</tbody>${tfootHtml}</table></div>`;
  };

  return `<div>
    <div class="tabla-head-row">
      <h3 class="tabla-title">💴 Gastos del viaje</h3>
      ${colSelector}
    </div>
    ${buildTable(reales, true)}
    ${cots.length ? `<div class="tabla-head-row" style="margin-top:10px"><h3 class="tabla-title">💬 Cotizaciones</h3>${colSelector.replace('gastoColMenu','gastoColMenuCot').replace('id="gastoColSel"','id="gastoColSelCot"').replace('toggleGastoColSel()','toggleGastoColSel(true)')}</div>${buildTable(cots, true, true)}` : ''}
  </div>`;
}

        <div id="respaldosPdfList">Cargando…</div>
      </div>
      <div class="field"><label>Conteo de datos cargados</label><textarea readonly style="font-size:11.5px; min-height:84px">Días: ${itinerario.dias.length}\nTransporte: ${itinerario.transporte.length}\nHospedaje: ${itinerario.hospedaje.length}\nPendientes: ${itinerario.pendientes.length}</textarea></div>

        <label>✏️ Versión HTML activa <span style="text-transform:none;font-weight:400;font-size:11px;color:var(--ink-3)">(editable — se guarda en _NOTAS_DEV A1)</span></label>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="fDevVersion" style="flex:1" placeholder="ej: itinerario_v39.html" value="Cargando…">
          <button class="btn-mini" onclick="guardarVersionDev(this)">💾 Guardar</button>
        </div>
      </div>
      <div class="field">
        <label>📝 Notas de desarrollo <span style="text-transform:none;font-weight:400;font-size:11px;color:var(--ink-3)">(se guarda en _NOTAS_DEV A2)</span></label>
        <div style="display:flex; gap:5px; margin-bottom:5px; flex-wrap:wrap; align-items:center">
          <button type="button" class="btn-mini" style="font-weight:700" onclick="document.execCommand('bold')" title="Negrita"><b>B</b></button>
          <button type="button" class="btn-mini" style="font-style:italic" onclick="document.execCommand('italic')" title="Cursiva"><i>I</i></button>
          <button type="button" class="btn-mini" onclick="resaltarTextoDevNota()" title="Resaltar / quitar resaltado al texto seleccionado">✦ Resaltar</button>
          <button type="button" class="btn-mini" onclick="insertarCheckbox()" title="Insertar checkbox">☑ Check</button>
        </div>
        <div id="fDevNota" contenteditable="true" style="min-height:100px; max-height:220px; overflow-y:auto; font-size:12px; border:1px solid var(--line); border-radius:var(--radius); padding:8px; background:var(--paper-2); outline:none; line-height:1.7" oninput="window._devNotaModificada=true; window._devNotaModif=true;" placeholder="Apuntes de desarrollo, pendientes técnicos, ideas..."></div>
        <div style="display:flex; gap:8px; margin-top:6px; flex-wrap:wrap">
          <button class="btn-mini" onclick="guardarNotaDevForm(this)">💾 Guardar notas</button>
          <button class="btn-mini" onclick="copiarNotaDev()">📋 Copiar</button>
          <button class="btn-mini" style="color:#b91c1c" onclick="limpiarNotaDev()">🗑 Limpiar</button>
        </div>
      </div>
      <div class="modal-actions"><button class="btn-cancel" onclick="modalClose()">Cerrar</button><button class="btn-save" onclick="guardarTodoYCerrar(this)">💾 Guardar todo y cerrar</button></div>
    </div>`);
  window._devNotaModif = false; window._devVerModif = false;
  gRenderRespaldosPdf();
  // Cargar con caché inmediato (actualiza en background)
  const cached = window._devInfoCache;
  if (cached) {
    const elVC = document.getElementById('fDevVersion'); if (elVC) elVC.value = cached.version||'';
    const elNC = document.getElementById('fDevNota'); if (elNC) elNC.innerHTML = cached.nota||'';
  }
  postGAS({ action: 'cargarNotaDev' }).then(r => {
    window._devInfoCache = r;
    const elV = document.getElementById('fDevVersion');
    const elN = document.getElementById('fDevNota');
    if (elV) elV.value = (r && r.version) || 'itinerario_v40.html';
    if (elN) elN.innerHTML = (r && r.nota) || '';
    if (elV) elV.addEventListener('input', () => window._devVerModif = true);
    if (elN) elN.addEventListener('input', () => window._devNotaModif = true);
  }).catch(() => {});
  // Confirmar al dar click fuera si hay cambios sin guardar
  setTimeout(() => {
    const ov = document.getElementById('modalOverlay');
    if (ov && !ov._devGuard) {
      ov._devGuard = true;
      const handler = (e) => {
        if (e.target !== ov) return;
        if (window._devNotaModif || window._devVerModif) {
          if (!confirm('Tienes cambios sin guardar. ¿Salir de todos modos?')) { e.stopImmediatePropagation(); return; }
          window._devNotaModif = false; window._devVerModif = false;
        }
        ov.removeEventListener('click', handler, true);
        ov._devGuard = false;
      };
      ov.addEventListener('click', handler, true);
    }
  }, 100);
}

async function guardarTodoYCerrar(btnEl) {
  await guardarTodoDev(btnEl);
  modalClose();
}
async function guardarTodoDev(btnEl) {
  if (btnEl) { btnEl.textContent = '⏳'; btnEl.disabled = true; }
  const elV = document.getElementById('fDevVersion');
  const elN = document.getElementById('fDevNota');
  await postGAS({ action: 'guardarNotaDev', field: 'version', value: elV ? elV.value : '' });
  await postGAS({ action: 'guardarNotaDev', nota: elN ? (elN.innerHTML || elN.value || '') : '' });
  window._devVerModif = false; window._devNotaModif = false;
  if (window._devInfoCache) { window._devInfoCache.version = elV ? elV.value : ''; window._devInfoCache.nota = elN ? (elN.innerHTML||'') : ''; }
  if (btnEl) { btnEl.textContent = '✅ Guardado'; setTimeout(() => { btnEl.textContent = '💾 Guardar todo'; btnEl.disabled = false; }, 1500); }
}
function scrollDevNotaTop() {
  const el = document.getElementById('fDevNota'); if (el) el.scrollTop = 0;
}
async function guardarVersionDev(btnEl) {
  const el = document.getElementById('fDevVersion');
  if (!el) return;
  if (btnEl) { btnEl.textContent = '⏳'; btnEl.disabled = true; }
  await postGAS({ action: 'guardarNotaDev', field: 'version', value: el.value });
  window._devVerModif = false;
  if (btnEl) { btnEl.textContent = '✅'; setTimeout(() => { btnEl.textContent = '💾 Guardar'; btnEl.disabled = false; }, 1200); }
}
async function guardarNotaDevForm(btnEl) {
  const el = document.getElementById('fDevNota');
  if (!el) return;
  if (btnEl) { btnEl.textContent = '⏳'; btnEl.disabled = true; }
  // Usar innerHTML para preservar negritas/formato
  await postGAS({ action: 'guardarNotaDev', nota: el.innerHTML || el.value || '' });
  window._devNotaModif = false;
  if (window._devInfoCache) window._devInfoCache.nota = el.innerHTML || el.value || '';
  if (btnEl) { btnEl.textContent = '✅ Guardado'; setTimeout(() => { btnEl.textContent = '💾 Guardar'; btnEl.disabled = false; }, 1500); }
}
function resaltarTextoDevNota() {
  const el = document.getElementById('fDevNota');
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) { showToast('Selecciona texto primero'); return; }
  // Asegurar foco en el contenteditable antes de ejecutar el comando
  if (el) el.focus();
  // Verificar si el texto ya tiene resaltado amarillo en el nodo contenedor
  const range = sel.getRangeAt(0);
  const container = range.startContainer;
  let node = container.nodeType === 3 ? container.parentElement : container;
  let hasYellow = false;
  while (node && node !== el) {
    const bg = window.getComputedStyle(node).backgroundColor;
    if (bg === 'rgb(254, 240, 138)' || (node.style && node.style.backgroundColor === 'rgb(254, 240, 138)')) {
      hasYellow = true; break;
    }
    node = node.parentElement;
  }
  document.execCommand('hiliteColor', false, hasYellow ? 'rgba(0,0,0,0)' : '#fef08a');
  window._devNotaModif = true;
}
function insertarCheckbox() {
  const el = document.getElementById('fDevNota');
  if (!el) return; el.focus();
  document.execCommand('insertHTML', false, '<span class="dev-chk" onclick="toggleDevChk(this)" style="cursor:pointer;user-select:none;margin-right:4px">☐</span>&nbsp;');
}
function toggleDevChk(el) {
  el.textContent = el.textContent.trim() === '☐' ? '☑' : '☐';
  window._devNotaModif = true;
}
function copiarNotaDev() {
  const el = document.getElementById('fDevNota');
  if (!el) return;
  const texto = el.innerText || el.textContent || '';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(texto).then(() => showToast('Copiado ✦')).catch(() => { document.execCommand('selectAll'); document.execCommand('copy'); showToast('Copiado ✦'); });
  } else {
    const ta = document.createElement('textarea'); ta.value = texto; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showToast('Copiado ✦');
  }
}
function limpiarNotaDev() {
  if (!confirm('¿Seguro que quieres eliminar el contenido de las notas? Esta acción no se puede deshacer.')) return;
  const el = document.getElementById('fDevNota');
  if (el) { el.innerHTML = ''; el.innerText = ''; }
  postGAS({ action: 'guardarNotaDev', nota: '' });
  if (window._devInfoCache) window._devInfoCache.nota = '';
  window._devNotaModif = false;
  showToast('Notas limpiadas');
}
async function cargarNotaDevForm() {
  const r = await postGAS({ action: 'cargarNotaDev' });
  const el = document.getElementById('fDevNota');
  if (el) el.value = (r && r.ok) ? (r.nota || '') : '';
}
