<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#faf7f0">
<link rel="manifest" href="manifest.json">
<title>Itinerario ✦</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  color-scheme: light only;
  --ink: #1b1a17; --ink-2: #5c574c; --ink-3: #9c9690;
  --paper: #faf7f0; --paper-2: #f1ece1; --paper-3: #e6dfd0; --line: rgba(27,26,23,0.12);
  --route: #c2410c; --route-light: #fdebe0;
  --ok: #15803d; --ok-light: #e7f5ea;
  --pending: #b45309; --pending-light: #fdf1de;
  --sky: #0c5f8c; --sky-light: #e3f0f7;
  --radius: 12px;
  --font-serif: 'Instrument Serif', Georgia, serif;
  --font-sans: 'DM Sans', sans-serif;
}
html { color-scheme: light only; }
html, body { height: 100%; font-family: var(--font-sans); background: var(--paper); color: var(--ink); font-size: 14px; line-height: 1.55; }
button, input, textarea, select { font-family: var(--font-sans); font-size: 13px; color: var(--ink); }

/* ── Layout ───────────────────────────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
.topbar { background: var(--paper); border-bottom: 1px solid var(--line); flex-shrink: 0; position: sticky; top: 0; z-index: 100; }
.topbar-compact { display:flex; align-items:center; gap:8px; padding: 6px 14px; overflow-x:auto; }
.topbar-logo-block { display:flex; flex-direction:column; gap:2px; flex-shrink:0; }
.topbar-logo-main { display:flex; align-items:center; gap:6px; }
.topbar-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 8px; }
.logo { font-family: var(--font-serif); font-size: 22px; letter-spacing: -0.3px; }
.logo span { color: var(--route); }
.tabs { display: flex; gap: 6px; }
.tab-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--line); background: #fff; cursor: pointer; font-size: 12.5px; font-weight: 500; color: var(--ink-2); }
.tab-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* Trip spine */
.spine-wrap { padding: 0; flex: 1; overflow-x: auto; white-space: nowrap; min-width:0; scrollbar-width:none; }
.spine-track { display: inline-flex; align-items: flex-end; gap: 4px; position: relative; }
.day-chip { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 4px 8px 5px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; min-width: 44px; flex-shrink: 0; }
.day-chip:hover { background: var(--paper-2); }
.day-chip.active { background: var(--route-light); border-color: var(--route); }
.day-chip .dnum { font-family: var(--font-serif); font-size: 19px; line-height: 1; }
.day-chip .dmonth { font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); }
.day-chip .dzona { font-size: 9.5px; color: var(--ink-2); max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dstatus { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--ink-3); background: transparent; }
.dstatus.ok { background: var(--ok); border-color: var(--ok); }
.dstatus.pending { background: var(--pending); border-color: var(--pending); }
.day-chip.today { box-shadow: 0 0 0 2px var(--route); }
.day-chip.drop-hover { background: var(--ok-light); border-color: var(--ok); }
.add-day-chip { display:flex; align-items:center; justify-content:center; width:40px; height:54px; border:1px dashed var(--ink-3); border-radius:10px; cursor:pointer; color:var(--ink-3); flex-shrink:0; font-size:18px; }
.add-day-chip:hover { color: var(--route); border-color: var(--route); }

/* Main scroll area */
.main { flex: 1; overflow-y: auto; padding: 4px 18px 40px; }
.section { margin-top: 18px; }
.section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.section-head .section-title { margin-right: auto; }
.section-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.btn-mini { padding: 5px 11px; border-radius: 20px; background: #fff; border: 1px solid var(--line); cursor: pointer; font-size: 12px; font-weight: 500; color: var(--ink-2); display:inline-flex; align-items:center; gap:5px; }
.btn-mini:hover { border-color: var(--route); color: var(--route); }
.btn-mini.ai { background: var(--route-light); border-color: #eab98a; color: #8a3a0c; }
.spinner-mini { display:inline-block; width:11px; height:11px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation: spinmini 0.7s linear infinite; vertical-align:-1.5px; }
@keyframes spinmini { to { transform: rotate(360deg); } }

/* Día header */
.day-header { display:flex; align-items:baseline; gap:10px; flex-wrap: wrap; }
.day-header .fecha-grande { font-family: var(--font-serif); font-size: 28px; }
.day-header input.zona-input { border:none; background:none; font-family: var(--font-serif); font-size: 19px; color: var(--ink-2); outline:none; border-bottom: 1px dashed transparent; min-width: 120px; }
.day-header input.zona-input:focus { border-bottom-color: var(--route); }
.notas-dia { width:100%; margin-top:8px; border:1px solid var(--line); background:#fff; border-radius:var(--radius); padding:8px 10px; font-size:12.5px; resize: vertical; min-height: 34px; outline:none; }
.notas-dia:focus { border-color: var(--route); }

.cal-grid-layout { display:flex; flex-direction:column; gap: 16px; margin-top: 16px; }
.cal-splitter { display: none; }
@media (min-width: 760px) {
  .cal-grid-layout { display:flex; flex-direction:row; align-items:stretch; gap:0; }
  .cal-col-left { flex: 1 1 auto; min-width: 240px; }
  .cal-splitter { width: 14px; flex: 0 0 auto; cursor: col-resize; display:flex; align-items:center; justify-content:center; touch-action:none; }
  .cal-splitter::after { content:''; width:4px; height:52px; background: var(--line); border-radius:4px; transition: background .15s; }
  .cal-splitter:hover::after, .cal-splitter.active::after { background: var(--route); }
  .cal-col-right { flex: 0 0 320px; min-width: 220px; max-width: 60vw; max-height: 62vh; overflow-y: auto; padding-right: 4px; }
}
@media (max-width: 759px) {
  .cal-col-right.floating {
    position: fixed; left: 8px; right: 8px; bottom: 8px;
    max-height: 65vh; overflow-y: auto;
    background: var(--paper); border-radius: 16px;
    box-shadow: 0 -10px 32px rgba(0,0,0,0.25);
    z-index: 70; padding: 14px 14px 18px; border: 1px solid var(--line);
  }
  .cal-backdrop { display: none; }
  .cal-backdrop.show { display: block; position: fixed; inset: 0; background: rgba(26,24,20,0.35); z-index: 65; }
  /* El menú flotante de abajo (#mobileTabFloat) ya cubre Itinerario/Tabla/Mapa con solo íconos —
     ocultamos las pestañas verticales de arriba (redundantes) para que el carril de días tenga
     más ancho; el logo de texto se deja, no ocupa espacio de más junto al nombre del viaje. */
  .tab-btn { display: none; }
}

.cal-zoom-row { display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap; }

/* Calendario por horas */
.cal-hint { font-size: 11px; color: var(--ink-3); margin-bottom: 6px; }
.cal-scroll { position: relative; height: 62vh; overflow-y: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.cal-inner { position: relative; }
.cal-hour-label { position: absolute; left: 6px; width: 42px; font-size: 10px; color: var(--ink-3); }
.cal-line { position: absolute; left: 52px; right: 8px; border-top: 1px solid var(--line); }
.cal-now-line { position: absolute; left: 48px; right: 8px; border-top: 2px solid var(--route); z-index: 5; }
.cal-events { position: absolute; left: 52px; right: 8px; top: 0; bottom: 0; }
.cal-events.drop-hover { background: var(--ok-light); border-radius: 8px; }
.cal-block { position: absolute; left: 0; right: 0; border-radius: 8px; padding: 4px 8px 3px; font-size: 11.5px; overflow: hidden; cursor: grab; touch-action: none; border: 1px solid; user-select: none; }
body.drag-locked .cal-block { touch-action: pan-y; cursor: default; }
body.drag-locked .cal-resize-handle { display: none; }
.cal-block.pendiente { background: var(--route-light); border-color: #eab98a; color: #8a3a0c; }
.cal-block.transporte { background: var(--sky-light); border-color: #9cc6dc; color: #0c4a68; }
.cal-block.comida { background: #dcf5e3; border-color: #7fc99a; color: #14532d; }
.cal-block.evento, .cal-block.eventoActividad { background: #f3e8ff; border-color: #c4b5fd; color: #5b21b6; }
.cal-block.prioritaria { background: #fff3c4; border-color: #e8c44a; color: #7a5d00; border-width: 2px; }
.cal-block.comida.prioritaria { background: #c5ecd1; border-color: #e8c44a; color: #7a5d00; border-width: 3px; }
/* Realizado: no se pone gris parejo — se desatura hacia una versión pálida del color de su tipo */
.cal-block.realizado { opacity: 0.75; }
.cal-block.realizado .cbtitle { text-decoration: line-through; }
.cal-block.pendiente.realizado { background: #ece5dd; border-color: #cdb499; color: #8a7360; }
.cal-block.transporte.realizado { background: #e2e9eb; border-color: #a7bdc5; color: #5c7178; }
.cal-block.comida.realizado { background: #e1e9e3; border-color: #a7c4ae; color: #55705f; }
.cal-block.evento.realizado, .cal-block.eventoActividad.realizado { background: #e9e2ec; border-color: #bfaec8; color: #6b5878; }
.cbnota { font-size: 9.5px; opacity: 0.8; margin-top: 1px; line-height: 1.25; }
.cal-block.dragging { opacity: 0.75; z-index: 20; box-shadow: 0 4px 14px rgba(0,0,0,0.18); cursor: grabbing; }
.drag-arm-fill { position: absolute; left: 0; bottom: 0; height: 5px; width: 0; background: var(--ink); opacity: 0.75; transition: width 1.6s linear; border-radius: 0 0 6px 6px; pointer-events: none; z-index: 2; }
/* z-index más alto que el bloque arrastrado (que queda en 3000, sin resetear, mientras se
   confirma el drop) — si no, el clic en ✓/✗ cae sobre el bloque de abajo en vez del botón. */
.drop-confirm { position: fixed; transform: translateX(-50%); z-index: 4000; display: flex; gap: 6px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 4px 6px; box-shadow: 0 6px 16px rgba(0,0,0,0.25); }
.drop-confirm button { border: none; background: var(--paper-2); font-size: 16px; line-height: 1; cursor: pointer; padding: 4px 10px; border-radius: 14px; }
.drop-confirm button.ok { background: var(--ok-light); color: #0d5c2a; }
.drop-confirm button.cancel { background: #fee2e2; color: #b91c1c; }
.cal-block .cbtitle { font-weight: 500; line-height: 1.25; }
.cal-block .cbtime { font-size: 10px; opacity: 0.85; }
.cal-resize-handle { position: absolute; right: 2px; width: 22px; height: 12px; cursor: ns-resize; }
.cal-resize-handle.top { top: 0; } .cal-resize-handle.bottom { bottom: 0; }
.cal-resize-handle::after { content:''; position:absolute; right:4px; width:14px; height:3px; border-radius:2px; background:currentColor; opacity:0.35; }
.cal-resize-handle.top::after { top:2px; } .cal-resize-handle.bottom::after { bottom:2px; }

/* Vista semanal */
.semana-wrap { padding: 12px 18px 40px; height: calc(100vh - 56px); overflow-y: auto; }
.semana-controls { display:flex; gap:16px; flex-wrap:wrap; margin-bottom: 10px; }
.semana-group { display:flex; align-items:center; gap:6px; }
/* El encabezado de días (.week-header-row) vive FUERA de .week-scroll a propósito — ver
   comentario en renderSemana(). Por eso .week-scroll ya no necesita sticky ni border-radius. */
.week-header-row { display: flex; border: 1px solid var(--line); border-bottom: none; border-radius: var(--radius) var(--radius) 0 0; background: #fff; overflow: hidden; }
.week-header-gutter { width: 48px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line); }
.week-header-cols { display: flex; }
.week-scroll { position: relative; height: 64vh; overflow: auto; border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); background: #fff; display: flex; }
.week-gutter { position: sticky; left: 0; z-index: 10; width: 48px; flex-shrink: 0; background: #fff; border-right: 1px solid var(--line); will-change: transform; }
.week-gutter-labels { background: #fff; }
.week-cols { display: flex; }
.week-col { flex-shrink: 0; border-right: 1px solid var(--line); background: #fff; }
.week-col-header { background: #fff; border-right: 1px solid var(--line); padding: 6px 8px; font-size: 11.5px; font-weight: 500; display: flex; flex-direction: column; gap: 1px; }
.week-col-header:last-child { border-right: none; }
.reservado-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.reservado-btns button { flex: 1; min-width: 100px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 20px; background: var(--paper-2); cursor: pointer; font-family: var(--font-sans); font-size: 12.5px; transition: all .15s; }
.reservado-btns button.active { background: var(--route-light); border-color: var(--route); color: var(--route); font-weight: 600; }
.reservado-btns button:hover:not(.active) { border-color: var(--route); }

/* ── Gastos form (estilo gastos_v8) ── */
.g-overlay { position: fixed; inset: 0; background: rgba(30,25,20,.45); z-index: 2000; display: none; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 20px 12px; }
.g-modal { background: #fff; border-radius: 14px; width: calc(100vw - 24px); max-width: 460px; margin: auto; box-shadow: 0 8px 40px rgba(0,0,0,.22); }
.g-mhdr { padding: 18px 20px 0; display: flex; align-items: center; justify-content: space-between; }
.g-mtitle { font-family: var(--font-mono); font-size: 15px; font-weight: 500; }
.g-mclose { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 18px; padding: 4px; }
.g-mbody { padding: 16px 20px 20px; }
.g-field { margin-bottom: 13px; }
.g-field label { display: block; font-size: 11px; font-weight: 500; color: var(--ink-2); text-transform: uppercase; letter-spacing: .07em; margin-bottom: 5px; }
.g-uzone { border: 2px dashed var(--line); border-radius: var(--radius); padding: 18px; text-align: center; cursor: pointer; background: var(--paper-2); position: relative; transition: border-color .15s; }
.g-uzone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.g-uzone.drag { border-color: #1a6fd4; background: #f0f5ff; }
.g-tprev { position: relative; display: inline-block; }
.g-tprev img { max-width: 100%; max-height: 140px; border-radius: 8px; object-fit: cover; border: 1px solid var(--line); }
.g-rimg { position: absolute; top: -6px; right: -6px; background: #fff; border: 1px solid var(--line); border-radius: 50%; width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; }
.g-row2-dates { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 13px; }
.g-row2-dates input { font-size: 12.5px; padding: 8px 7px; }
.amounts-row { display: flex; gap: 6px; margin-bottom: 13px; width: 100%; }
.amount-pair { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px; }
.amount-pair .pair-inputs { display: flex; gap: 6px; }
.amount-pair .pair-inputs input { flex: 1; min-width: 0; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; transition: border-color .15s; }
.amount-pair .pair-inputs select { width: 80px; flex-shrink: 0; padding: 9px 6px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); font-family: var(--font-sans); font-size: 12px; color: var(--ink); outline: none; cursor: pointer; }
.g-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 13px; }
.g-tgroup { display: flex; gap: 6px; flex-wrap: wrap; }
.g-tbtn { flex: 1; min-width: 70px; padding: 8px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--paper-2); color: var(--ink-2); cursor: pointer; font-family: var(--font-sans); font-size: 12px; font-weight: 500; transition: all .2s; text-align: center; }
.g-tbtn.sel { background: var(--ink) !important; border-color: var(--ink) !important; color: #fff !important; font-weight: 600; }
.g-ai-btns { display: flex; gap: 8px; margin-top: 10px; }
.g-btn-gem { flex: 1; padding: 8px; border-radius: var(--radius); border: 1px solid #7fc99a; background: #f0fdf4; color: #15803d; cursor: pointer; font-size: 12px; font-weight: 500; font-family: var(--font-sans); display: flex; align-items: center; justify-content: center; gap: 5px; transition: all .15s; }
.g-btn-gem:disabled { opacity: .4; cursor: not-allowed; }
.g-mfooter { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; padding-top: 14px; border-top: 1px solid var(--line); }
.g-bcnl { padding: 8px 16px; border-radius: var(--radius); background: none; border: 1px solid var(--line); color: var(--ink-2); cursor: pointer; font-family: var(--font-sans); font-size: 13px; }
.g-bsave { padding: 8px 20px; border-radius: var(--radius); background: var(--ink); color: #fff; border: none; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 600; }
.g-chip { display: inline-flex; align-items: center; gap: 3px; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; white-space: nowrap; background: rgba(184,92,138,.1); border: 1px solid rgba(184,92,138,.3); color: #b85c8a; }
.g-cot-block { background: rgba(184,92,138,.07); border: 1px solid rgba(184,92,138,.28); border-radius: var(--radius); padding: 10px 14px; margin-bottom: 13px; }
.g-shop-del { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 13px; }
.g-shop-del:hover { color: #b02a2a; }
.g-prod-row { display: grid; grid-template-columns: 1.6fr .5fr .7fr .8fr .8fr .9fr 24px 42px; gap: 4px; align-items: center; margin-bottom: 4px; }
.g-prod-row input, .g-prod-row select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 6px; font-family: var(--font-sans); font-size: 12px; background: #fff; outline: none; }
.g-prod-hdr { display: grid; grid-template-columns: 1.6fr .5fr .7fr .8fr .8fr .9fr 24px 42px; gap: 4px; font-size: 9px; text-transform: uppercase; letter-spacing: .05em; color: var(--ink-3); margin-bottom: 3px; }
.g-prod-scroll { overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; }
.g-prod-scroll .g-prod-hdr, .g-prod-scroll #gProdList { min-width: 560px; }
.g-prod-scroll::-webkit-scrollbar { height: 7px; }
.g-prod-scroll::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
/* Crop overlay */
.crop-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,.9); z-index: 9999; display: none; flex-direction: column; justify-content: center; align-items: center; }
.crop-btn { padding: 10px 22px; border-radius: var(--radius); border: none; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; }
.g-input { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; transition: border-color .15s; }
.g-select { width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; cursor: pointer; }
.week-col-header.today { background: var(--route-light); color: #8a3a0c; }
.week-col-header.active { box-shadow: inset 0 0 0 2px var(--ink); }

.dev-btn { background: none; border: none; font-size: 11px; color: var(--ink-3); opacity: 0.35; cursor: pointer; margin-left: 4px; }
.dev-btn:hover { opacity: 1; }

.tabla-wrap { flex: 1; overflow-y: auto; padding: 14px 18px 40px; }
.tabla-title { font-family: var(--font-serif); font-size: 18px; margin: 0; }
.tabla-head-row { display: flex; align-items: center; justify-content: space-between; margin: 18px 0 8px; }
.tabla-head-row:first-child { margin-top: 4px; }
.data-table th:hover { color: var(--ink); }
.tabla-scroll { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; }
.data-table { border-collapse: collapse; width: 100%; font-size: 12.5px; white-space: nowrap; }
.data-table th { text-align: left; padding: 8px 12px; background: var(--paper-2); border-bottom: 1px solid var(--line); font-weight: 500; color: var(--ink-2); position: sticky; top: 0; }
.data-table td { padding: 7px 12px; border-bottom: 1px solid var(--line); }
.data-table tr:last-child td { border-bottom: none; }
.week-col-body { position: relative; }
.week-col-events { position: absolute; inset: 0; }
.week-block { }
.week-col.drop-target { background: var(--ok-light); }
#opcionesHost.drop-target { background: var(--ok-light); border-radius: 8px; outline: 2px dashed var(--ok); }

  .mtf-rotate-hint { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); font-size: 10px; line-height: 16px; text-align: center; color: var(--ink-2); padding: 0; cursor: pointer; }

async function cargarGastosVinculos() {
  if (!currentProyecto || !GAS_URL_GASTOS) return; // sin URL configurada todavía, no hay de dónde leer
  try {
    // Lee directamente del Sheet de Gastos (GAS_URL_GASTOS) filtrando por Proyecto
    const form = new FormData(); form.append('payload', JSON.stringify({ action: 'getGastos' }));
    const resp = await fetch(GAS_URL_GASTOS, { method: 'POST', body: form });
    const d = await resp.json();
    gastosVinculados = {};
    gastosDelDia = {};
    if (d.gastos) {
      d.gastos.filter(g => g.proyecto === currentProyecto && (g.itemId || g.diaItinerario)).forEach(g => {
        // Normalizar campos
        const norm = {
          id: g.gastoId || ('imported-' + g.rowIndex),
          rowIndex: g.rowIndex || null,  // para poder editar/eliminar del Sheet de Gastos
          itemId: g.itemId, proyecto: g.proyecto, diaItinerario: g.diaItinerario || '',
          costo: g.costo || '', moneda: g.moneda_pago || 'JPY',
          monedaConv: g.moneda || 'MXN', conversion: g.otra_moneda || '',
          quien_paga: g.quien_paga || '', compartido: g.compartido || '', pago: g.pago || '',
          concepto: g.concepto || '', tienda: g.producto || g.tienda || '',
          fecha: g.fecha || '', categoria: g.categoria || '',
          notas: g.notas || '', cotizacion: (g.compartido||'').toLowerCase().includes('cotiz'),
          foto_ticket: g.foto_ticket_url || '', sesion: g.sesion || '',
          pagadores: Array.isArray(g.pagadores) ? g.pagadores : []
        };
        if (g.itemId) {
          if (!gastosVinculados[g.itemId]) gastosVinculados[g.itemId] = [];
          gastosVinculados[g.itemId].push(norm);
        }
        if (g.diaItinerario) {
          if (!gastosDelDia[g.diaItinerario]) gastosDelDia[g.diaItinerario] = [];
          gastosDelDia[g.diaItinerario].push(norm);
        }
      });
    }
    // Los mismos gastos ya traen las filas de producto (TipoFila='producto') — se
    // reusan como catálogo, sin pedirle nada nuevo al backend.
    gAllProds = (d.gastos || []).filter(g => g.tipoFila === 'producto');
    gProdsCargados = true;
    gPoblarDatalistsProductos();
  } catch(e) { console.warn('No se pudieron cargar gastos:', e); }
}

  const cats = [...new Set(gAllProds.map(p => p.categoria).filter(Boolean))].sort();

  const lugares = [...new Set(gAllProds.map(p => p.ubicacion).filter(Boolean))].sort();

}
function gCatalogoProductos() {
  const cat = {};
  gAllProds.forEach(p => {
    const k = gNormTxt(p.concepto); if (!k) return;

// Ancho del panel lateral (ajustable arrastrando el divisor)
let poolWidth = 320;
let splitterAttached = false;
function attachSplitter() {
  const splitter = document.getElementById('calSplitter');
  const poolEl = document.getElementById('poolHost');
  if (!splitter || !poolEl) return;
  if (window.innerWidth < 760) return; // en mobile el layout es apilado, sin divisor
  poolEl.style.flex = `0 0 ${poolWidth}px`;
  if (splitterAttached) return; // el divisor ya no se recrea en cada render; solo conectar una vez
  splitterAttached = true;
  splitter.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    splitter.setPointerCapture(e.pointerId);
    splitter.classList.add('active');
    const startX = e.clientX, startW = poolWidth;
    function onMove(ev) {
      const dx = startX - ev.clientX;
      const newW = Math.max(220, Math.min(window.innerWidth * 0.6, startW + dx));
      poolEl.style.flex = `0 0 ${newW}px`;
    }
    function onUp(ev) {
      splitter.releasePointerCapture(e.pointerId);
      splitter.classList.remove('active');
      document.removeEventListener('pointermove', onMove);
      document.removeEventListener('pointerup', onUp);
      const dx = startX - ev.clientX;
      poolWidth = Math.max(220, Math.min(window.innerWidth * 0.6, startW + dx));
    }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

async function loadItinerario() {
  // v57: cache-first — si ya hay algo guardado en este dispositivo, se pinta de inmediato
  // con eso (sin esperar al servidor) y la llamada en vivo se dispara en segundo plano nada
  // más para refrescar. Antes, aunque "estuviera offline" la app SIEMPRE esperaba primero a
  // que la llamada de red resolviera o fallara — en una conexión lenta/inestable eso puede
  // tardar bastante antes de caer al respaldo local, aunque el respaldo ya estuviera ahí.
  const baseline = cargarBaseline();
  if (baseline) {
    reconstruirDesdeCache();
    renderSpine();
    renderItinerario();
    actualizarIndicadorConexion();
    // No bloquean el primer pintado — cuando lleguen, refrescan solas.
    cargarAntojosMaestros().then(() => renderItinerario()).catch(() => {});
    cargarGastosVinculos().then(() => renderItinerario()).catch(() => {});
  }
  if (!navigator.onLine) {
    if (!baseline) { reconstruirDesdeCache(); renderSpine(); renderItinerario(); actualizarIndicadorConexion(); }
    return;
  }
  try {
    const r = await fetch(`${GAS_URL}?action=getItinerario&t=${Date.now()}`);
    const d = await r.json();
    itinerario = { dias: d.dias || [], transporte: d.transporte || [], hospedaje: d.hospedaje || [], pendientes: d.pendientes || [], eventos: d.eventos || [] };
    itinerario.dias.sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
    guardarBaseline(itinerario); // esta es la foto confirmada por el servidor — nueva base para futuros conflictos
    cargarColaPendiente().forEach(c => aplicarCambioLocal(itinerario, c)); // reaplicar lo que siga sin sincronizar
    if (currentProyecto === null) currentProyecto = pickDefaultProyecto();
    if (!currentDiaId || !diasFiltrados().some(d => d.id === currentDiaId)) currentDiaId = pickTodayOrFirst();
    if (!baseline) { await cargarAntojosMaestros(); await cargarGastosVinculos(); } // primera vez en este dispositivo: sin cache que mostrar mientras tanto, sí hay que esperarlas
    renderSpine();
    renderItinerario();
    actualizarIndicadorConexion();
  } catch (e) {

  }
}

// Días del proyecto actualmente activo
function diasFiltrados() {
  return itinerario.dias.filter(d => (d.proyecto || '') === currentProyecto);
}

// Elige el proyecto a mostrar al abrir la app: el que tiene el día de hoy,
// si no, el del día futuro más próximo, si no, el más reciente del pasado.
function pickDefaultProyecto() {
  const proyectos = [...new Set(itinerario.dias.map(d => d.proyecto || ''))];
  if (!proyectos.length) return '';
  const hoy = fechaLocalISO(new Date());
  for (const p of proyectos) {
    if (itinerario.dias.some(d => (d.proyecto || '') === p && d.fecha === hoy)) return p;
  }
  let best = null, bestFecha = '';
  proyectos.forEach(p => {
    const futuros = itinerario.dias.filter(d => (d.proyecto || '') === p && d.fecha >= hoy);
    if (futuros.length) {
      const min = futuros.reduce((m, d) => (d.fecha < m ? d.fecha : m), futuros[0].fecha);
      if (best === null || min < bestFecha) { bestFecha = min; best = p; }
    }
  });
  if (best !== null) return best;
  let bestPast = proyectos[0], bestPastFecha = '';
  proyectos.forEach(p => {
    const max = itinerario.dias.filter(d => (d.proyecto || '') === p).reduce((m, d) => (d.fecha > m ? d.fecha : m), '');
    if (max > bestPastFecha) { bestPastFecha = max; bestPast = p; }
  });
  return bestPast;
}

function pickTodayOrFirst() {
  const dias = diasFiltrados();
  if (!dias.length) return null;
  const hoy = fechaLocalISO(new Date());
  const match = dias.find(d => d.fecha === hoy);
  return match ? match.id : dias[0].id;
}

function gPagoParse(str) {
  if (!str) return null;
  const p = String(str).split('§');
  const tipo = p[0] || '', tarjeta = p[1] || '';
  let msi = 0;
  if (p[2] && /^MSI/.test(p[2])) msi = parseInt(p[2].replace('MSI', '')) || 0;
  return { tipo, tarjeta, msi };
}

function gConceptoGasto(tipo, datos) {
  const fechaDia = () => { const d = itinerario.dias.find(x => x.id === currentDiaId); return d ? d.fecha : fechaLocalISO(new Date()); };
  if (tipo === 'transporte') return `${TIPO_LABEL[datos.tipo] || 'Transporte'}: ${datos.origen||''} → ${datos.destino||''} · ${fechaDia()}`;
  if (tipo === 'hospedaje') {
    const ini = datos.diaIdInicio ? (itinerario.dias.find(d=>d.id===datos.diaIdInicio)||{}).fecha||'' : '';
    const fin = datos.diaIdFin ? (itinerario.dias.find(d=>d.id===datos.diaIdFin)||{}).fecha||'' : '';
    return `${datos.nombre||''} · ${ini}${fin&&fin!==ini?' al '+fin:''}`;
  }
  if (tipo === 'evento') return `🎪 ${datos.nombre||''} · ${fechaDia()}`;
  return `${datos.nombre||''} · ${fechaDia()}`;
}

  else if (tipo === 'evento') { const ev = itinerario.eventos.find(x=>x.id===id); if (ev) datos = { nombre: ev.nombre }; }
  // "las reglas que ya tenemos": mismo cálculo de concepto que al abrir el form desde ese item.

  const nuevoConcepto = gConceptoGasto(tipo, datos);

  if (anterior && anterior !== nuevoConcepto) {

  concEl.value = nuevoConcepto;
}

// v57: diaIdInicial — de qué día del panel lateral cuelga (campo "Día en itinerario"); si no se
// pasa, se usa el día del item asociado o el día activo del itinerario.
function abrirGastosForm(tipo, itemId, datosStr, editGastoId, diaIdInicial) {
  if (!requiereGasUrlGastos()) return;
  const datos = (() => { try { return typeof datosStr==='string' ? JSON.parse(datosStr) : (datosStr||{}); } catch(e) { return {}; } })();
  const hoy = fechaLocalISO(new Date());
  const concepto = itemId ? gConceptoGasto(tipo, datos) : '';
  const prev = editGastoId
    ? ((itemId && gastosVinculados[itemId] && gastosVinculados[itemId].find(g=>g.id===editGastoId))
      || (gastosDelDia[diaIdInicial] && gastosDelDia[diaIdInicial].find(g=>g.id===editGastoId))
      || Object.values(gastosVinculados).flat().find(g=>g.id===editGastoId)
      || Object.values(gastosDelDia).flat().find(g=>g.id===editGastoId)
      || null)
    : null;
  const diaEfectivo = diaIdInicial || (prev && prev.diaItinerario) || currentDiaId || '';
  // Llenar el overlay fijo
  document.getElementById('gItemId').value = itemId;
  document.getElementById('gTipo').value = tipo;
  document.getElementById('gEditId').value = editGastoId || '';
  gPoblarDiaItinerario(diaEfectivo);
  gPoblarAsociarA(diaEfectivo, itemId);
  gActualizarEstadoDiaItinerario();
  const sesionEfectiva = (prev && prev.sesion) ? prev.sesion : GAS_SESION_GASTOS;
  gPoblarSesionSel(sesionEfectiva);
  gFormPeople = gPeopleDeSesion(sesionEfectiva);
  gRenderPayerGroup();
  document.getElementById('gTitle').textContent = prev ? '💴 Editar gasto' : '💴 Registrar gasto';
  // v57: Fecha de compra por defecto — si el día asociado ya pasó respecto a hoy, se asume que
  // se compró ESE día (solo se está registrando tarde); si el día asociado todavía no llega,
  // se asume que se compra hoy por adelantado para ese día futuro. Fecha captura siempre es hoy
  // (el día en que de verdad estás registrando esto), sin importar cuál sea el día asociado.
  const diaAsociadoObj = diaEfectivo ? itinerario.dias.find(d => d.id === diaEfectivo) : null;
  const fechaCompraDefault = (diaAsociadoObj && diaAsociadoObj.fecha && diaAsociadoObj.fecha < hoy) ? diaAsociadoObj.fecha : hoy;
  document.getElementById('gFecha').value = fechaCompraDefault;
  document.getElementById('gHoraCompra').value = '';
  document.getElementById('gCaptura').value = hoy;
  document.getElementById('gCosto').value = prev ? (prev.costo||'') : '';
  document.getElementById('gMoneda').value = prev ? (prev.moneda||'JPY') : 'JPY';
  document.getElementById('gConversion').value = prev ? (prev.conversion||'') : '';
  document.getElementById('gMonedaConv').value = prev ? (prev.monedaConv||'MXN') : 'MXN';
  document.getElementById('gConc').value = prev ? (prev.concepto||concepto) : concepto;
  document.getElementById('gTienda').value = prev ? (prev.tienda||'') : '';
  document.getElementById('gNotas').value = prev ? (prev.notas||'') : '';
  // Categoria por defecto según tipo de item
    const _esResto = tipo === 'pendiente' && (() => { const p = itinerario.pendientes.find(x=>x.id===itemId); return p && (p.esRestaurante || p.antojo); })();
  const catPorTipo = tipo === 'hospedaje' ? '🏨 Hospedaje' : tipo === 'transporte' ? '🚆 Transporte' : tipo === 'evento' ? '🎟️ Entradas y entretenimiento' : _esResto ? '🍽️ Restaurantes, cafés y delivery' : '🎟️ Entradas y entretenimiento';
  // Detectar si el place es un restaurante
  const datosObj = (() => { try { return typeof datosStr==='object' ? datosStr : JSON.parse(datosStr||'{}'); } catch(_){return {};} })();
  const esResto = datosObj.esRestaurante || datosObj.antojo;
  const catAuto = esResto ? '🍽️ Restaurantes, cafés y delivery' : catPorTipo;
  document.getElementById('gCat').value = prev ? (prev.categoria||catAuto) : catAuto;
  document.getElementById('gChkCot').checked = prev ? !!prev.cotizacion : true;
  gTb64 = ''; gTMime = '';
  // Foto: si el gasto ya tenía una guardada, restaurarla en la vista previa (antes se
  // borraba siempre, aunque estuvieras editando/viendo un gasto que sí tenía foto).
  document.getElementById('gStoredPhoto').value = (prev && prev.foto_ticket) ? prev.foto_ticket : '';
  if (prev && prev.foto_ticket) {
    document.getElementById('gPrevImg').src = prev.foto_ticket;
    document.getElementById('gPrevArea').style.display = 'block';
    document.getElementById('gUzone').style.display = 'none';
  } else {
    document.getElementById('gPrevArea').style.display = 'none';
    document.getElementById('gUzone').style.display = 'block';
  }
  document.getElementById('gAiBanner').style.display = 'none';
  document.getElementById('gAiBanner').innerHTML = '';
  document.getElementById('gBtnGem').disabled = false;
  document.getElementById('gBtnGem').textContent = '🤖 Analizar foto con IA';
  // Payer y tipo
  if (prev && prev.quien_paga) { gSetPayer(prev.quien_paga, true); } else { gCurrentPayer = ''; document.querySelectorAll('#gPayerGroup .g-tbtn').forEach(b => b.className='g-tbtn'); }
  if (prev && prev.compartido) { gSetType(prev.compartido, true); } else { gCurrentType = ''; document.querySelectorAll('#gTipoGroup .g-tbtn').forEach(b => b.className='g-tbtn'); }
  // Varios pagan: precargar si el gasto ya tenía pagadores[], si no dejar apagado.
  gCurrentPagadores = {};
  if (prev && Array.isArray(prev.pagadores) && prev.pagadores.length) {
    prev.pagadores.forEach(p => { if (p && p.persona) gCurrentPagadores[p.persona] = p.monto; });
    document.getElementById('gChkVariosPagan').checked = true;
  } else {
    document.getElementById('gChkVariosPagan').checked = false;
  }
  gOnToggleVariosPagan();
  // Productos del ticket: precargar los ya guardados de esta compra (si los hay), o vaciar para uno nuevo.
  gProdDraft = (prev && prev.id) ? gAllProds.filter(p => p.compraId === prev.id).map(p => ({
    concepto: p.concepto || '', marca: p.marca || '', categoria: p.categoria || '', ubicacion: p.ubicacion || '',
    notas: p.notas || '', piezas: p.piezas || '1', cantidad: p.cantidad || '', unidad: p.unidad || 'unidad',
    precioInd: p.precioInd || '', quienCompra: p.quienCompra || '', inventario: (p.inventario || 'SI') !== 'NA'
  })) : [];
  gRenderProdDraft();
  // Pagado con: reconstruir desde lo guardado, o dejarlo vacío para uno nuevo.
  document.getElementById('gMetodo').value = '';
  document.getElementById('gTarjetaSel').style.display = 'none';
  document.getElementById('gTarjetaHint').style.display = 'none';
  document.getElementById('gMsiWrap').style.display = 'none';
  document.getElementById('gMsi').checked = false;
  document.getElementById('gMsiMeses').value = ''; document.getElementById('gMsiMeses').style.display = 'none';
  gCargarTarjetas().then(() => {
    const pg = prev && prev.pago ? gPagoParse(prev.pago) : null;
    if (!pg || !pg.tipo) return;
    if (pg.tipo === 'Efectivo') { document.getElementById('gMetodo').value = 'Efectivo'; gOnMetodoChange(); return; }
    document.getElementById('gMetodo').value = 'Tarjeta';
    gOnMetodoChange();
    const lbl = (pg.tarjeta || '').toLowerCase();
    const match = gSesionCards.find(c => gCardLabel(c).toLowerCase().indexOf(lbl.split(' ')[0]) !== -1 && (c.termFisica||c.terminacion||'') && lbl.indexOf((c.termFisica||c.terminacion||'').toLowerCase()) !== -1);
    if (match) {
      document.getElementById('gTarjetaSel').value = match.id;
      gOnTarjetaSelChange();
      if (pg.msi) { document.getElementById('gMsi').checked = true; gOnMsiChange(); document.getElementById('gMsiMeses').value = pg.msi; }
    }
  });
  gToggleCot();
  document.getElementById('gOverlay').style.display = 'flex';
}

// Botones de "¿Quién paga?" — ya no son fijos Lot/Temis, se arman desde GPEOPLE (+ N/A) para que
// reflejen a quien de verdad esté en la sesión de Gastos configurada.
function gRenderPayerGroup() {
  const box = document.getElementById('gPayerGroup'); if (!box) return;
  box.innerHTML = gFormPeople.map(n => `<button class="g-tbtn" data-persona="${escHtml(n)}" onclick="gSetPayer('${n.replace(/'/g,"\\'")}')">${gEmojiPersona(n)} ${escHtml(n)}</button>`).join('')
    + `<button class="g-tbtn" data-persona="NA" onclick="gSetPayer('NA')">— N/A</button>`;
}
function gSetPayer(p, silent) {
  gCurrentPayer = p;
  document.querySelectorAll('#gPayerGroup .g-tbtn').forEach(b => {
    b.className = (b.dataset.persona === p || (p === 'Cotizacion' && b.dataset.persona === 'NA')) ? 'g-tbtn sel' : 'g-tbtn';
  });
  if(!silent && p==='Cotizacion') gSetType('Cotizacion');
}

// ── Varios pagan (idéntico a v32* de Compras_v46.html) ──
function gOnToggleVariosPagan() {
  gCurrentVariosPagan = document.getElementById('gChkVariosPagan').checked;
  const pagadoresField = document.getElementById('gPagadoresField');
  if (gCurrentVariosPagan) {
    document.querySelectorAll('#gPayerGroup .g-tbtn').forEach(b => b.style.display = 'none');
    if (pagadoresField) pagadoresField.style.display = 'block';
    gRenderPagadores();
  } else {
    document.querySelectorAll('#gPayerGroup .g-tbtn').forEach(b => b.style.display = '');
    if (pagadoresField) pagadoresField.style.display = 'none';
  }
}
function gRenderPagadores() {
  const box = document.getElementById('gPagadoresBox'); if (!box) return;
  box.innerHTML = gFormPeople.map(n => {
    const val = gCurrentPagadores[n] !== undefined ? gCurrentPagadores[n] : '';
    return '<div style="display:flex;align-items:center;gap:8px">'
      + '<span class="g-chip" style="min-width:76px;justify-content:center">' + gEmojiPersona(n) + ' ' + n + '</span>'
      + '<input type="number" placeholder="0" value="' + escHtml(String(val)) + '" class="g-input" style="flex:1" oninput="gSetPagadorMonto(\'' + n + '\',this.value)">'
      + '</div>';
  }).join('');
  gActualizarHintPagadores();
}
function gSetPagadorMonto(persona, val) {
  const n = parseFloat(val);
  if (val === '' || isNaN(n)) delete gCurrentPagadores[persona];
  else gCurrentPagadores[persona] = n;
  gActualizarHintPagadores();
}
function gPartesIguales() {
  const costo = parseFloat(document.getElementById('gCosto').value) || 0;
  if (!costo || !gFormPeople.length) return;
  const share = Math.round((costo / gFormPeople.length) * 100) / 100;
  gFormPeople.forEach(n => gCurrentPagadores[n] = share);
  gRenderPagadores();
}
function gActualizarHintPagadores() {
  const hint = document.getElementById('gPagadoresHint'); if (!hint) return;
  const costo = parseFloat(document.getElementById('gCosto').value) || 0;
  const suma = Object.values(gCurrentPagadores).reduce((s, v) => s + (parseFloat(v) || 0), 0);
  const dif = Math.round((costo - suma) * 100) / 100;
  if (!costo) { hint.textContent = 'Escribe el monto total arriba.'; hint.style.color = 'var(--ink-3)'; return; }
  if (Math.abs(dif) < 0.5) { hint.textContent = '✓ Cuadra con el total.'; hint.style.color = '#15803d'; }
  else if (dif > 0) { hint.textContent = 'Falta ' + dif + ' para llegar al total.'; hint.style.color = '#b85c8a'; }
  else { hint.textContent = 'Sobra ' + Math.abs(dif) + ' respecto al total.'; hint.style.color = '#b02a2a'; }
}

function gSetType(t, silent) {
  gCurrentType = t;
  ['gBShared','gBLoan','gBPersonal','gBDev'].forEach(id => { const el=document.getElementById(id); if(el) el.className='g-tbtn'; });
  const map = { Compartido:'gBShared', Prestamo:'gBLoan', Personal:'gBPersonal', Devolucion:'gBDev' };
  if(map[t]) { const el=document.getElementById(map[t]); if(el) el.className='g-tbtn sel'; }

    btns.forEach(b=>{b.style.opacity='.3';b.style.pointerEvents='none';});
  } else {
    if(badge) badge.style.display='none';
    btns.forEach(b=>{b.style.opacity='1';b.style.pointerEvents='';});
  }

function gToggleCot() {
  const isCot = document.getElementById('gChkCot').checked;
  const pBadge = document.getElementById('gPayerBadge');
  const payBtns = document.querySelectorAll('#gPayerGroup .g-tbtn');
  const pagoField = document.getElementById('gPagoField');

    payBtns.forEach(b=>{b.style.opacity='.3';b.style.pointerEvents='none';});

    if (pagoField) pagoField.style.display = 'none';
  } else {
    if(pBadge) pBadge.style.display='none';
    payBtns.forEach(b=>{b.style.opacity='1';b.style.pointerEvents='';});

    if(window._gWasCot) { gSetType('Compartido', true); gSetPayer(gFormPeople[0] || 'Lot', true); }

// ── Foto ──
function gHandleFile(e) { const f=e.target.files[0]; if(f) gProcessFile(f); }
function gHandleDrop(e) { e.preventDefault(); document.getElementById('gUzone').classList.remove('drag'); const f=e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) gProcessFile(f); }
function gProcessFile(file) {
  const r=new FileReader(); r.onload=ev=>{
    const img=new Image(); img.onload=()=>{
      const canvas=document.createElement('canvas'); const MAX=400,scale=MAX/img.width;
      canvas.width=MAX; canvas.height=img.height*scale;
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      const dataUrl=canvas.toDataURL('image/jpeg',.7);
      gTMime='image/jpeg'; gTb64=dataUrl.split(',')[1];
      document.getElementById('gPrevImg').src=dataUrl;
      document.getElementById('gStoredPhoto').value=dataUrl;
      document.getElementById('gPrevArea').style.display='block';
      document.getElementById('gUzone').style.display='none';
    }; img.src=ev.target.result;
  }; r.readAsDataURL(file);
}
function gRemoveTicket() { gTb64=''; gTMime=''; document.getElementById('gTicketInput').value=''; document.getElementById('gStoredPhoto').value=''; document.getElementById('gPrevArea').style.display='none'; document.getElementById('gUzone').style.display='block'; }
async function gOpenCrop() {
  if (!gTb64) {
    // Foto ya guardada (viene de una URL de Drive, el navegador no puede leer esos bytes por
    // CORS) — pedirle al backend que los lea directo con DriveApp, para poder recortar sin
    // tener que resubirla.
    const srcUrl = document.getElementById('gPrevImg').src;
    if (!srcUrl) { showToast('No se puede recortar'); return; }
    showToast('Cargando foto…');
    let r;
    try {
      const form = new FormData(); form.append('payload', JSON.stringify({ action: 'obtenerFotoTicketBase64', url: srcUrl }));
      const resp = await fetch(GAS_URL_GASTOS, { method: 'POST', body: form });
      r = await resp.json();
    } catch (e) { showToast('⚠️ No se pudo cargar la foto para recortar'); return; }
    if (!r || !r.ok) { showToast('⚠️ No se pudo cargar la foto para recortar'); return; }
    gTb64 = r.base64; gTMime = r.mime || 'image/jpeg';
    gOpenCrop();
    return;
  }
  document.getElementById('gCropOverlay').style.display='flex';
  const imgEl=document.getElementById('gCropImg');
  imgEl.src='data:'+(gTMime||'image/jpeg')+';base64,'+gTb64;
  if(gCropper) gCropper.destroy();
  gCropper=new Cropper(imgEl,{viewMode:1,dragMode:'move',autoCropArea:1,background:false});
}
function gCloseCrop() { document.getElementById('gCropOverlay').style.display='none'; if(gCropper) gCropper.destroy(); }
function gApplyCrop() {
  if(!gCropper) return;
  const canvas=gCropper.getCroppedCanvas({maxWidth:800,maxHeight:800});
  const dataUrl=canvas.toDataURL('image/jpeg',.8);
  gTb64=dataUrl.split(',')[1]; gTMime='image/jpeg';
  document.getElementById('gPrevImg').src=dataUrl;
  document.getElementById('gStoredPhoto').value=dataUrl;
  gCloseCrop(); showToast('✂️ Foto recortada ✦');
}

// ── IA: analizar foto ──
async function gAnalyzeIA() {
  if(!gTb64) { showToast('⚠️ Sube una imagen primero'); return; }
  const btn=document.getElementById('gBtnGem'); btn.disabled=true; btn.textContent='🤖 Analizando…';
  const banner=document.getElementById('gAiBanner'); banner.style.display='block'; banner.innerHTML='Analizando con Gemini…';
  // v57: candidatos = lo que ya está asignado el día elegido en "Día en itinerario" — si el
  // ticket lo deja claro, la IA devuelve "asociado_a" y se preselecciona solo en "Asociar a".
  const diaElegido = (document.getElementById('gDiaItinerario')||{}).value || '';
  const candidatos = diaElegido ? itemsAsignadosDelDia(diaElegido).map(it => ({ id: it.id, nombre: it.nombre })) : [];
  const payload = { action:'analyzeGemini', base64:gTb64, mimeType:gTMime||'image/jpeg', moneda_local:'JPY', moneda_conv:'MXN', candidatos };
  let r = null;
  // Intento 1: Gemini
  try {
    const f1=new FormData(); f1.append('payload',JSON.stringify(payload));
    const resp1=await fetch(GAS_URL_GASTOS,{method:'POST',body:f1}); r=await resp1.json();
  } catch(e) { r = { ok: false }; }
  // Intento 2: Claude si Gemini falla
  if(!r || !r.ok || !r.result) {
    banner.innerHTML='Gemini falló, probando Claude…';
    try {
      const f2=new FormData(); f2.append('payload',JSON.stringify({...payload, action:'analyzeClaude'}));
      const resp2=await fetch(GAS_URL_GASTOS,{method:'POST',body:f2}); r=await resp2.json();
    } catch(e) { r = { ok: false, error: 'Error de red' }; }
  }
  if(r && r.ok && r.result) {
    const res=r.result;
    if(res.monto) document.getElementById('gCosto').value=res.monto;
    // La tienda SÍ se llena; el concepto queda como está (ya tiene el nombre del evento)
    if(res.tienda) document.getElementById('gTienda').value=res.tienda;
    if(res.fecha) document.getElementById('gFecha').value=res.fecha;
    if(res.categoria) document.getElementById('gCat').value=res.categoria;
    // Notas: combina concepto detectado + notas de pago de la IA
    const notasIA = [res.concepto, res.notas].filter(Boolean).join(' — ');
    if(notasIA) document.getElementById('gNotas').value=notasIA;
    // Auto-conversión: si la IA ya calculó la conversión, úsala; si no, pídela
    // Productos del ticket — la IA ya los manda listos (mismo prompt que usa Compras)
    if (Array.isArray(res.productos) && res.productos.length) {
      gProdDraft = res.productos.map(p => ({
        concepto: String(p.producto || p.nombre || '').trim(),
        marca: String(p.marca || '').trim(),
        categoria: String(p.categoria_producto || p.categoria || res.categoria || '').trim(),
        ubicacion: String(p.ubicacion || '').trim(),
        notas: String(p.notas || '').trim(),
        piezas: p.piezas != null ? String(p.piezas) : '1',
        cantidad: p.cantidad != null ? String(p.cantidad) : '',
        unidad: GUNIDADES.includes(String(p.unidad || '').toLowerCase()) ? String(p.unidad).toLowerCase() : 'unidad',
        precioInd: p.precio != null ? String(p.precio) : '',
        // v57: el prompt de IA es compartido con Compras (donde "inventario" = despensa de casa
        // tiene sentido); acá en un viaje no aplica — siempre arranca desmarcado, sin importar
        // lo que haya sugerido la IA.
        quienCompra: gQuienCompraDefault(), inventario: false
      })).filter(p => p.concepto);
      gRenderProdDraft();
    }
    if(res.conversion && res.moneda_conv) {
      document.getElementById('gConversion').value=res.conversion;
      const selConv=document.getElementById('gMonedaConv'); if(selConv && res.moneda_conv) selConv.value=res.moneda_conv;
      banner.innerHTML='✅ IA llenó los campos con conversión automática.'+(gProdDraft.length?' + '+gProdDraft.length+' productos':'');
    } else {
      banner.innerHTML='✅ IA llenó los campos — calculando conversión…';
      await gConvertirIA();
      banner.innerHTML='✅ IA llenó los campos.'+(gProdDraft.length?' + '+gProdDraft.length+' productos':'');
    }
    // Si la IA reconoció claramente a qué está asociado el ticket, preseleccionarlo en "Asociar a".
    if (res.asociado_a) {
      const match = candidatos.find(c => c.nombre === res.asociado_a) || candidatos.find(c => c.nombre.toLowerCase().includes(String(res.asociado_a).toLowerCase()));
      if (match) {
        const sel = document.getElementById('gAsociarA');

// v58: multiplicación rápida para Monto (idéntico a pAbrirMultiplicador de Compras_v46.html) —
// pensado para cosas como "2 boletos de tren a ¥300 c/u": precio unitario × cantidad, calcula el
// total solo y deja "300*2" en Notas para saber de dónde salió el monto.
function gAbrirMultiplicador() {
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = `<div style="background:var(--paper);border-radius:12px;padding:16px;max-width:280px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)">

    <div class="g-field" style="margin-bottom:10px"><label>Precio unitario</label><input type="number" id="gmPrecio" class="g-input" placeholder="0"></div>
    <div class="g-field" style="margin-bottom:12px"><label>Cantidad</label><input type="number" id="gmCantidad" class="g-input" placeholder="0"></div>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn-cancel" style="flex:1" id="gmCancelar">Cancelar</button>
      <button type="button" class="btn-save" style="flex:1" id="gmCalcular">Calcular</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const pPrecio = ov.querySelector('#gmPrecio'), pCantidad = ov.querySelector('#gmCantidad');

  const cerrar = () => ov.remove();
  const calcular = () => {

    const cant = parseFloat(pCantidad.value) || 0;
    if (!precio || !cant) { showToast('Pon precio y cantidad'); return; }

    gActualizarHintPagadores();
    gAutoConvertir('costo', true);
    const iNotas = document.getElementById('gNotas');
    const formula = (precio % 1 ? precio : precio.toFixed(0)) + '*' + (cant % 1 ? cant : cant.toFixed(0));
    if (iNotas) iNotas.value = iNotas.value.trim() ? (iNotas.value.trim() + ' · ' + formula) : formula;
    cerrar();
    showToast('✓ ' + formula + ' = ' + total);
  };
  ov.addEventListener('click', e => { if (e.target === ov) cerrar(); });
  ov.querySelector('#gmCancelar').addEventListener('click', cerrar);
  ov.querySelector('#gmCalcular').addEventListener('click', calcular);

async function gConvertirIA() {

// v57: autocompleta solo (sin botón) al salir de Monto o de Conversión, igual
// que pAutoConvertir() en Compras — funciona en los dos sentidos y no pisa
// nada si el campo destino ya tiene algo escrito.
let _gAutoConvBusy = false;
// origen: 'costo' calcula Conversión desde Monto; 'conv' calcula Monto desde Conversión.
// force=true (al cambiar de moneda) recalcula aunque el campo destino ya tenga algo escrito.
async function gAutoConvertir(origen, force) {
  if (_gAutoConvBusy) return;
  const costoEl = document.getElementById('gCosto'), convEl = document.getElementById('gConversion');
  const monedaEl = document.getElementById('gMoneda'), monedaConvEl = document.getElementById('gMonedaConv');
  if (!costoEl || !convEl) return;
  const moneda = monedaEl.value, monedaConv = monedaConvEl.value;
  if (moneda === monedaConv) return;
  let monto, monedaOrigen, monedaDest, targetEl;
  if (origen === 'costo') {
    if (!force && convEl.value.trim()) return;
    monto = parseFloat(costoEl.value); if (!monto) return;
    monedaOrigen = moneda; monedaDest = monedaConv; targetEl = convEl;
  } else {
    if (!force && costoEl.value.trim()) return;
    monto = parseFloat(convEl.value); if (!monto) return;
    monedaOrigen = monedaConv; monedaDest = moneda; targetEl = costoEl;
  }
  _gAutoConvBusy = true;
  try {
    const r = await postGAS({ action: 'estimarConversion', monto, monedaOrigen, monedaDest });
    if (r.ok && r.valor && (force || !targetEl.value.trim())) targetEl.value = r.valor;
  } catch (e) { /* silencioso — el usuario siempre puede llenarlo a mano o tocar 🔄 Tasa */ }
  _gAutoConvBusy = false;
}

// v58: "¿quién es este producto?" por línea — igual que v29 de Compras_v46.html. Todas estas
// reciben `personas` explícito (por defecto gFormPeople, la gente de la sesión elegida en el
// formulario abierto) para poder reusarlas también al expandir un gasto YA GUARDADO con su
// propia sesión (que puede no ser la que está activa ahora mismo en el formulario).
// Cada línea puede ser de todos ("Compartido"), de uno solo, o de un subconjunto (ej. 2 de 3) —
// se guarda como texto: 'Compartido', un nombre, o nombres separados por coma.
function gQuienCompraDefault(personas) { personas = personas || gFormPeople; return personas.length > 1 ? 'Compartido' : (personas[0] || ''); }
function gListaQuienCompra(raw, personas) {
  personas = personas || gFormPeople;
  const s = (raw || '').toString().trim();
  if (!s || s === 'Compartido') return personas.slice();
  const partes = s.split(',').map(x => x.trim()).filter(Boolean);
  return partes.length ? partes : personas.slice();
}
function gQuienCompraLabel(raw, personas) {
  personas = personas || gFormPeople;
  const lista = gListaQuienCompra(raw, personas);
  if (personas.length <= 1) return lista[0] || '—';
  if (lista.length >= personas.length) return 'Compartido';
  return lista.join(' + ');
}
// Popover con checkboxes (selección múltiple) para elegir exactamente quiénes comparten esta línea.

  if (gFormPeople.length <= 1) return; // nada que elegir en sesión individual

    <div style="font-size:11px;color:var(--ink-3);margin-bottom:10px">Marca a todos los que aplica — si los marcas todos es lo mismo que "Compartido".</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin-bottom:12px">
      ${gFormPeople.map(n => '<label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" class="gqc-chk" value="' + escHtml(n) + '" ' + (actual.includes(n) ? 'checked' : '') + ' style="width:16px;height:16px"> ' + escHtml(n) + '</label>').join('')}
    </div>
    <div style="display:flex;gap:8px">

      <button type="button" class="btn-save" style="flex:1" id="gqcAplicar">Aplicar</button>

  document.body.appendChild(ov);
  const cerrar = () => ov.remove();
  ov.addEventListener('click', e => { if (e.target === ov) cerrar(); });
  ov.querySelector('#gqcCancelar').addEventListener('click', cerrar);
  ov.querySelector('#gqcAplicar').addEventListener('click', () => {
    const marcados = [...ov.querySelectorAll('.gqc-chk:checked')].map(c => c.value);
    gProdDraft[i].quienCompra = marcados.length ? (marcados.length >= gFormPeople.length ? 'Compartido' : marcados.join(', ')) : 'Compartido';
    cerrar();

  });

// v58: cuánto le toca a cada quien — cada producto se divide entre exactamente la lista de
// nombres que le corresponde. Si hay costo real del ticket, reparte por PROPORCIÓN de cada
// producto sobre ese costo (no sumando precios individuales tal cual, que pueden no cuadrar si
// no se llenó el precio de cada línea); sin costo real, usa el precio individual tal cual.
function gCalcTotalesPorPersona(productos, costoReal, personas) {
  personas = personas || gFormPeople;
  const totales = {}; personas.forEach(n => totales[n] = 0);
  const sumaProductos = (productos || []).reduce((s, p) => s + ((parseFloat(p.precioInd) || 0) * (parseFloat(p.piezas) || 1)), 0);
  const usarProporcion = costoReal > 0 && sumaProductos > 0;
  (productos || []).forEach(p => {
    const monto = (parseFloat(p.precioInd) || 0) * (parseFloat(p.piezas) || 1);
    const lista = gListaQuienCompra(p.quienCompra, personas);
    const valor = usarProporcion ? (costoReal * (monto / sumaProductos)) : monto;
    const cadaUno = valor / Math.max(lista.length, 1);
    lista.forEach(n => { if (totales[n] !== undefined) totales[n] += cadaUno; });
  });
  return totales;
}
function gTextoResumenPorPersona(productos, costoReal, personas) {
  personas = personas || gFormPeople;
  if (!productos || !productos.length || personas.length < 2) return '';
  const totales = gCalcTotalesPorPersona(productos, costoReal, personas);
  return '🙋 Le toca: ' + personas.map(n => n + ' ¥' + Math.round(totales[n] || 0).toLocaleString()).join(' · ');
}
function gRenderQuienResumen() {
  const el = document.getElementById('gProdQuienResumen'); if (!el) return;
  const costoReal = parseFloat(document.getElementById('gCosto').value) || 0;
  el.textContent = gTextoResumenPorPersona(gProdDraft, costoReal);
}

function _gQuitarDeCachesLocales(gastoId) {
  Object.keys(gastosVinculados).forEach(k => { gastosVinculados[k] = gastosVinculados[k].filter(g => g.id !== gastoId); });
  Object.keys(gastosDelDia).forEach(k => { gastosDelDia[k] = gastosDelDia[k].filter(g => g.id !== gastoId); });
}
async function gGuardar() {
  const itemId = document.getElementById('gItemId').value;
  const tipo = document.getElementById('gTipo').value;
  const editId = document.getElementById('gEditId').value;
  const diaItinerarioEl = document.getElementById('gDiaItinerario');
  // v57 fix: "Día en itinerario" solo aplica a gastos SIN item asociado ("Pendiente") — un gasto
  // con itemId ya se ubica solo por el día del item (o, si es hotel, se reparte por noche). Si
  // se guardaba diaItinerario también ahí, ese gasto aparecía DOBLE: una vez como parte del
  // reparto del hotel y otra vez como línea suelta en "Gastos del día" de currentDiaId.
  const diaItinerario = itemId ? '' : (diaItinerarioEl ? diaItinerarioEl.value : '');
  const costo = document.getElementById('gCosto').value;
  const conc = document.getElementById('gConc').value.trim();
  const tienda = document.getElementById('gTienda').value.trim();
  if(!conc && !tienda) { showToast('Escribe el concepto o la tienda'); return; }
  const concepto_final = tienda ? `${conc||''} — ${tienda}` : (conc||'');
  // Si es edición, buscar el rowIndex del gasto para hacer updateGasto (evita duplicar) — puede
  // estar en gastosVinculados (si tiene item asociado) o en gastosDelDia (si no tiene o cambió).
  let editRowIndex = null;
  if (editId) {
    const gExist = (itemId && gastosVinculados[itemId] && gastosVinculados[itemId].find(g => g.id === editId))
      || (gastosDelDia[diaItinerario] && gastosDelDia[diaItinerario].find(g => g.id === editId))
      || Object.values(gastosVinculados).flat().find(g => g.id === editId)
      || Object.values(gastosDelDia).flat().find(g => g.id === editId);
    if (gExist && gExist.rowIndex) editRowIndex = gExist.rowIndex;
    // v57 fix: si se está EDITANDO (hay editId) pero la caché local no tiene ese gasto por el
    // motivo que sea (desactualizada, una carrera con un refresh, etc.), antes esto caía en
    // "crear uno nuevo" reusando el mismo GastoId — dejaba dos filas con el mismo GastoId y
    // texto distinto, en vez de una sola actualizada. Ahora, antes de rendirse, se le pregunta
    // directo al servidor cuál es la fila real de ese GastoId.
    if (!editRowIndex) {
      try {
        const formBuscar = new FormData(); formBuscar.append('payload', JSON.stringify({ action: 'getGastos' }));
        const respBuscar = await fetch(GAS_URL_GASTOS, { method: 'POST', body: formBuscar });
        const dBuscar = await respBuscar.json();
        const filaReal = (dBuscar.gastos || []).find(g => g.gastoId === editId);
        if (filaReal && filaReal.rowIndex) editRowIndex = filaReal.rowIndex;
      } catch (e) { /* si esto falla también, sigue abajo con editRowIndex en null */ }
    }
  }
  // Varios pagan (idéntico a saveExpense() de Compras): cada quien puso lo
  // suyo, sin deuda entre ustedes — se guarda como un solo gasto con el
  // desglose completo en pagadores[].
  let pagadoresBody = [], quienPagaBody = gCurrentPayer, compartidoBody = gCurrentType;
  if (gCurrentVariosPagan) {
    pagadoresBody = Object.keys(gCurrentPagadores).filter(n => (parseFloat(gCurrentPagadores[n])||0) > 0).map(n => ({ persona: n, monto: parseFloat(gCurrentPagadores[n])||0 }));
    if (!pagadoresBody.length) { showToast('Pon cuánto puso cada quien'); return; }
    quienPagaBody = pagadoresBody.map(p => p.persona).join(' + ');
    compartidoBody = (gCurrentType === 'Compartido') ? 'Compartido' : 'VariosPagan';
  }
  const body = {
    action: editRowIndex ? 'updateGasto' : 'saveGasto',
    rowIndex: editRowIndex || undefined,
    fecha:document.getElementById('gFecha').value,
    fecha_captura:document.getElementById('gCaptura').value,
    costo:costo||'0',
    otra_moneda:document.getElementById('gConversion').value||'',
    moneda_pago:document.getElementById('gMoneda').value,
    moneda:document.getElementById('gMonedaConv').value,
    concepto:concepto_final,
    quien_paga:quienPagaBody,
    compartido:compartidoBody,
    participantes: [],
    pagadores: pagadoresBody,
    pago: gPagoBuild(),
    notas:document.getElementById('gNotas').value||'',
    categoria:document.getElementById('gCat').value||'',
    foto_ticket:document.getElementById('gStoredPhoto').value||'',
    sesion: (document.getElementById('gSesionSel').value || GAS_SESION_GASTOS),
    // ★ ITINERARIO — vínculo con evento del itinerario
    gastoId:   editId || ('GV-' + Date.now().toString(36).toUpperCase()),
    itemId:    itemId,
    proyecto:  currentProyecto || '',
    diaItinerario: diaItinerario
  };
  const btn=document.querySelector('#gModal .g-bsave');
  if(btn) { btn.disabled=true; btn.textContent='Guardando…'; }
  try {
    const form=new FormData(); form.append('payload',JSON.stringify(body));
    const resp=await fetch(GAS_URL_GASTOS,{method:'POST',body:form});
    const d=await resp.json();
    if(d && d.ok === true) {
      // Objeto local para mostrar en memoria (moneda = moneda de pago)
      const nuevo = {
        id: body.gastoId,
        rowIndex: editRowIndex || null,
        itemId, proyecto: currentProyecto || '', diaItinerario,
        costo: costo||'0', moneda: document.getElementById('gMoneda').value,
        conversion: document.getElementById('gConversion').value,
        monedaConv: document.getElementById('gMonedaConv').value,
        quien_paga: quienPagaBody, compartido: compartidoBody, pago: body.pago,
        pagadores: pagadoresBody,
        concepto: concepto_final, tienda, fecha: body.fecha,
        fecha_captura: body.fecha_captura,
        categoria: body.categoria, notas: body.notas,
        cotizacion: document.getElementById('gChkCot').checked,
        sesion: body.sesion
      };
      // Si se estaba editando, primero se saca de cualquier bucket viejo (por si cambió a qué
      // item o a qué día está asociado) y luego se vuelve a meter donde corresponda ahora.
      if (editId) _gQuitarDeCachesLocales(editId);
      if (itemId) {
        if (!gastosVinculados[itemId]) gastosVinculados[itemId] = [];
        gastosVinculados[itemId].push(nuevo);
      }
      if (diaItinerario) {
        if (!gastosDelDia[diaItinerario]) gastosDelDia[diaItinerario] = [];
        gastosDelDia[diaItinerario].push(nuevo);
      }
      // Productos del ticket: reemplaza (replace:true) todos los productos ligados
      // a este gastoId — mismo comportamiento que saveExpense() en Compras.
      const prodsLimpios = gProdDraft.filter(p => (p.concepto||'').trim() !== '');
      if (prodsLimpios.length) {
        try {
          const catalogo = gCatalogoProductos();
          const formP = new FormData();
          formP.append('payload', JSON.stringify({
            action: 'saveProductos', sesion: body.sesion, compraId: body.gastoId, replace: true,
            tienda, fecha: body.fecha, quien: gCurrentPayer,
            productos: prodsLimpios.map(p => {
              const c = catalogo[gNormTxt(p.concepto)] || {};
              return {
                concepto: p.concepto.trim(), marca: p.marca || c.marca || '', notas: p.notas || '',
                categoria: p.categoria || c.categoria || '', ubicacion: p.ubicacion || c.ubicacion || '',
                piezas: p.piezas, cantidad: p.cantidad, unidad: p.unidad, precioInd: p.precioInd,
                quienCompra: p.quienCompra || '', inventario: p.inventario ? 'SI' : 'NA'
              };
            })
          }));
          await fetch(GAS_URL_GASTOS, { method: 'POST', body: formP });
        } catch (e) { console.warn('No se pudieron guardar los productos:', e); }
      }
      // Los gastos se guardan SOLO en el Sheet de Gastos (GAS_URL_GASTOS).
      // No uses GASTOS_VINCULOS — esa pestaña ya no se utiliza.
      gCloseModal(true); showToast('Gasto registrado 💴 ✦' + (prodsLimpios.length ? ' + ' + prodsLimpios.length + ' productos' : ''));
      renderPoolPanel(); // refresca "Gastos del día" y los totales de Hospedaje/Eventos
      // Refrescar el visor si hay uno abierto (para ver el gasto inmediatamente)
      const modalEl = document.getElementById('modalBox');
      if (modalEl && modalEl.dataset.visorTipo && modalEl.dataset.visorId) {
        setTimeout(() => abrirVisor(modalEl.dataset.visorTipo, modalEl.dataset.visorId), 100);
      }
    } else showToast('Error: '+(d.error||'desconocido'));
  } catch(e) { showToast('Error de red al guardar'); }
  if(btn) { btn.disabled=false; btn.textContent='Guardar gasto 💴'; }
}

function gastoVinculadoHtml(tipo, itemId, datosStr) {
  const lista = gastosVinculados[itemId] || [];
  if (!lista.length) return '';

async function editarGastoVisor(tipo, itemId, gastoId) {
  // Construir datosStr desde la lista local del visor abierto
  let datos = {};
  const p = itinerario.pendientes.find(x => x.id === itemId);
  const t = itinerario.transporte.find(x => x.id === itemId);
  const h = itinerario.hospedaje.find(x => x.id === itemId);
  const ev = itinerario.eventos.find(x => x.id === itemId);
  if (p) datos = { nombre: p.nombre, antojo: p.antojo, direccion: p.direccion };
  else if (t) datos = { origen: t.origen, destino: t.destino, diaId: t.diaId, tipo: t.tipo };
  else if (h) datos = { nombre: h.nombre, diaIdInicio: h.diaIdInicio, diaIdFin: h.diaIdFin };
  else if (ev) datos = { nombre: ev.nombre };
  abrirGastosForm(tipo, itemId, datos, gastoId);
}

async function eliminarGastoResumen(itemId, gastoId) {
  if (!confirm('¿Eliminar este gasto? Se borrará del Sheet de Gastos también.')) return;
  const lista = gastosVinculados[itemId] || [];
  const g = lista.find(x => x.id === gastoId);
  if (g) {
    const borrarEnSheet = async () => {
      // Si tenemos rowIndex, borrar directo
      if (g.rowIndex) {
        const f = new FormData(); f.append('payload', JSON.stringify({ action: 'deleteGasto', rowIndex: g.rowIndex }));
        const r = await fetch(GAS_URL_GASTOS, { method: 'POST', body: f }); return r.json();
      }
      // Si solo tenemos gastoId, buscar la fila en el Sheet
      const f2 = new FormData(); f2.append('payload', JSON.stringify({ action: 'getGastos' }));
      const r2 = await fetch(GAS_URL_GASTOS, { method: 'POST', body: f2 });
      const d2 = await r2.json();
      const fila = (d2.gastos||[]).find(x => x.gastoId === gastoId || x.gastoId === g.id);
      if (fila && fila.rowIndex) {
        const f3 = new FormData(); f3.append('payload', JSON.stringify({ action: 'deleteGasto', rowIndex: fila.rowIndex }));
        await fetch(GAS_URL_GASTOS, { method: 'POST', body: f3 });
      }
    };
    borrarEnSheet().catch(e => console.warn('Error al borrar del Sheet:', e));
  }
  if (gastosVinculados[itemId]) gastosVinculados[itemId] = lista.filter(x => x.id !== gastoId);
  if (g && g.diaItinerario && gastosDelDia[g.diaItinerario]) gastosDelDia[g.diaItinerario] = gastosDelDia[g.diaItinerario].filter(x => x.id !== gastoId);
  showToast('Gasto eliminado 🗑');
  renderPoolPanel();
  // Refrescar el visor abierto
  const box = document.getElementById('modalBox');
  if (box && box.dataset.visorTipo && box.dataset.visorId) {
    setTimeout(() => abrirVisor(box.dataset.visorTipo, box.dataset.visorId), 100);
  }
}

// v57: editar/eliminar un gasto de "Gastos del día" — puede o no estar asociado a un item real.
// v57 fix: buscar en gastosDeEsteDia(diaId) — no solo en gastosDelDia — porque la mayoría de los
// gastos que aparecen en "Gastos del día" llegan ahí por estar vinculados a un pendiente/
// transporte/evento de ese día (gastosVinculados), no por tener diaItinerario propio. Buscar
// solo en gastosDelDia los dejaba sin encontrar (✏️/🗑 no hacían nada, sin error visible).
function editarGastoDelDia(gastoId, diaId) {
  const g = gastosDeEsteDia(diaId).find(x => x.id === gastoId);
  if (!g) return;
  let tipo = 'dia', datos = {};
  if (g.itemId) {
    const p = itinerario.pendientes.find(x => x.id === g.itemId);
    const t = itinerario.transporte.find(x => x.id === g.itemId);
    const h = itinerario.hospedaje.find(x => x.id === g.itemId);
    const ev = itinerario.eventos.find(x => x.id === g.itemId);
    if (p) { tipo = 'pendiente'; datos = { nombre: p.nombre, antojo: p.antojo, direccion: p.direccion }; }
    else if (t) { tipo = 'transporte'; datos = { origen: t.origen, destino: t.destino, diaId: t.diaId, tipo: t.tipo }; }
    else if (h) { tipo = 'hospedaje'; datos = { nombre: h.nombre, diaIdInicio: h.diaIdInicio, diaIdFin: h.diaIdFin }; }
    else if (ev) { tipo = 'evento'; datos = { nombre: ev.nombre }; }
  }
  abrirGastosForm(tipo, g.itemId || '', datos, gastoId, diaId);
}
// Tocar el NOMBRE de una fila en "Gastos del día": si tiene un item asociado, abre la vista de
// ESE item (donde se ve todo su contexto, no solo el gasto); si no tiene nada asociado, no hay
// otra vista que mostrar y abre directo para editar.
function verGastoDelDia(gastoId, diaId) {
  const g = gastosDeEsteDia(diaId).find(x => x.id === gastoId);
  if (!g) return;
  if (g.itemId) {
    if (itinerario.pendientes.some(x => x.id === g.itemId)) return abrirVisor('pendiente', g.itemId);
    if (itinerario.transporte.some(x => x.id === g.itemId)) return abrirVisor('transporte', g.itemId);
    if (itinerario.hospedaje.some(x => x.id === g.itemId)) return abrirVisor('hospedaje', g.itemId);
    if (itinerario.eventos.some(x => x.id === g.itemId)) return abrirVisorEvento(g.itemId);
  }
  editarGastoDelDia(gastoId, diaId);
}
async function eliminarGastoDelDia(diaId, gastoId) {
  if (!confirm('¿Eliminar este gasto? Se borrará del Sheet de Gastos también.')) return;
  const g = gastosDeEsteDia(diaId).find(x => x.id === gastoId);
  if (g && g.rowIndex) {
    const f = new FormData(); f.append('payload', JSON.stringify({ action: 'deleteGasto', rowIndex: g.rowIndex }));
    fetch(GAS_URL_GASTOS, { method: 'POST', body: f }).catch(e => console.warn('Error al borrar del Sheet:', e));
  }
  if (gastosDelDia[diaId]) gastosDelDia[diaId] = gastosDelDia[diaId].filter(x => x.id !== gastoId);
  if (g && g.itemId && gastosVinculados[g.itemId]) {
    gastosVinculados[g.itemId] = gastosVinculados[g.itemId].filter(x => x.id !== gastoId);
  }
  showToast('Gasto eliminado 🗑');
  renderPoolPanel();
}

function moverPendienteGrupo(id, grupoKey, delta) {
  const lista = itinerario.pendientes
    .filter(p => (grupoKey === '__sincategoria__' ? (!p.antojo && p.esRestaurante) : p.antojo === grupoKey) && (p.proyecto || '') === currentProyecto)
    .sort((a,b) => (a.orden||0)-(b.orden||0));
  const idx = lista.findIndex(p => p.id === id);
  if (idx < 0) return;
  const otro = idx + delta;
  if (otro < 0 || otro >= lista.length) return;
  const oA = lista[idx].orden || idx, oB = lista[otro].orden || otro;
  lista[idx].orden = oB; lista[otro].orden = oA;
  renderPoolPanel();
  postGAS({ action: 'updatePendiente', id: lista[idx].id, orden: lista[idx].orden });
  postGAS({ action: 'updatePendiente', id: lista[otro].id, orden: lista[otro].orden });
}
function aplicarDuracion(cual, ini, fin, dur) {
  const chooser = document.getElementById('durChooser');
  if (chooser) chooser.remove();
  if (cual === 'fin') {
    const el = document.getElementById('fPendHoraFin');
    if (el) el.value = minToHHMM(ini + dur);
  } else {
    const el = document.getElementById('fPendHoraIni');
    if (el) el.value = minToHHMM(Math.max(0, fin - dur));
  }
}

function reservadoResuelto(v) { return v === 'si' || v === 'no_requiere'; }
function diaEstado(dia) {
  const trans = itinerario.transporte.filter(t => t.diaId === dia.id);
  const hosp = hospedajeDelDia(dia.id);
  const transOk = trans.length === 0 || trans.every(t => reservadoResuelto(t.reservado));
  const hospOk = !hosp || reservadoResuelto(hosp.reservado);
  if (trans.length === 0 && !hosp) return 'none';
  return (transOk && hospOk) ? 'ok' : 'pending';
}

function renderSpine() {
  const track = document.getElementById('spineTrack');
  const hoy = fechaLocalISO(new Date());
  const dias = diasFiltrados();
  const enMapa = document.getElementById('viewMapa') && document.getElementById('viewMapa').style.display !== 'none';
  const enTabla = document.getElementById('viewTabla') && document.getElementById('viewTabla').style.display !== 'none';
  const verTodosMapa = (enMapa && mapaVistaModo === 'todos') || (enTabla && tablaVistaModo === 'todos');
  // En modo "Más de un día" cada chip elegido toma el mismo color que "Todos".
  const multiSelMapa = (enMapa && mapaVistaModo === 'multi') || (enTabla && tablaVistaModo === 'multi');
  const diasSelActual = enTabla ? tablaDiasSel : mapaDiasSel;
  track.innerHTML = dias.map((d, idx) => {
    const date = d.fecha ? new Date(d.fecha + 'T00:00:00') : null;
    const dnum = date ? date.getDate() : '–';
    const dmonth = date ? date.toLocaleDateString('es', { month: 'short' }) : '';

    // NUEVO: Obtener la inicial del día de la semana (L, M, Mi, J...)
    const diasSemana = ['D', 'L', 'M', 'Mi', 'J', 'V', 'S'];
    const dday = date ? diasSemana[date.getDay()] : '';

    const estado = diaEstado(d);
    const isToday = d.fecha === hoy;
    const colorMapa = verTodosMapa ? DIA_COLORES[idx % DIA_COLORES.length]
      : (multiSelMapa && diasSelActual.has(d.id)) ? DIA_COLORES[idx % DIA_COLORES.length]
      : null;
    const estiloColor = colorMapa ? `style="border-color:${colorMapa}; background:${colorMapa}22;"` : '';
    const activeClass = verTodosMapa ? '' : ((enMapa || enTabla) ? (diasSelActual.has(d.id) ? 'active' : '') : (d.id === currentDiaId ? 'active' : ''));
    return `<div class="day-chip ${activeClass} ${isToday ? 'today' : ''}" data-dia="${d.id}" onclick="selectDay('${d.id}')" ${estiloColor}>
       <span style="font-size:10px; font-weight:bold; color:${colorMapa || 'var(--route)'}; margin-bottom:-2px;">${dday}</span>
       <span class="dnum">${dnum}</span>
       <span class="dmonth">${escHtml(dmonth)}</span>
       <span class="dzona">${escHtml(d.zona || '')}</span>
       <span class="dstatus ${estado}"></span>
     </div>`;
  }).join('') + `<div class="add-day-chip" onclick="openDiaForm()" title="Agregar día a este viaje">＋</div>`;
  renderProyectoBtn();
}
