// ── Sugerir transportes entre TODOS los eventos con hora de un día ──
// Encadena: hotel del día → evento1 → evento2 → ... → hotel, y por cada hueco sin transporte ya
// agendado, le pide a la IA una sugerencia (acotada a la ventana de tiempo disponible entre eventos).
async function sugerirTransportesDelDia(diaId, instruccion) {
  const dia = itinerario.dias.find(d => d.id === diaId);
  if (!dia) return;
  const eventos = getCalendarBlocks(diaId)
    .filter(b => b.kind === 'pendiente')
    .sort((a, b) => a.ini - b.ini)
    .map(b => itinerario.pendientes.find(p => p.id === b.id))
    .filter(Boolean);
  const hosp = hospedajeDelDia(diaId);
  const stops = [];
  if (hosp) stops.push({ nombre: hosp.nombre, direccion: hosp.direccion, lat: hosp.lat, lng: hosp.lng, horaFin: hosp.horaCheckOut || null });
  eventos.forEach(p => stops.push({ nombre: p.nombre, direccion: p.direccion, lat: p.lat, lng: p.lng, horaInicio: p.horaInicio, horaFin: p.horaFin }));
  if (hosp) stops.push({ nombre: hosp.nombre, direccion: hosp.direccion, lat: hosp.lat, lng: hosp.lng, horaInicio: hosp.horaCheckIn || null });

  if (stops.length < 2) { showToast('Hace falta al menos un hotel + un evento, o 2 eventos con hora este día'); return; }

  const transDia = itinerario.transporte.filter(t => t.diaId === diaId);
  const segmentos = [];
  for (let i = 0; i < stops.length - 1; i++) {
    const A = stops[i], B = stops[i + 1];
    const finA = A.horaFin || null, iniB = B.horaInicio || null;
    // ¿Ya hay un transporte agendado dentro de este hueco? — evita duplicar
    const yaCubierto = transDia.some(t => {
      const op = (t.opciones || [])[t.opcionElegida || 0];
      if (!op || !op.salida) return false;
      if (finA && op.salida < finA) return false;
      if (iniB && op.salida > iniB) return false;
      return true;
    });
    if (!yaCubierto) segmentos.push({ A, B, finA, iniB });
  }
  if (!segmentos.length) { showToast('Ya hay transporte entre todos los eventos de este día ✦'); return; }

  const propuestas = [];
  for (let i = 0; i < segmentos.length; i++) {
    const s = segmentos[i];
    showToast(`Pensando tramo ${i + 1} de ${segmentos.length}…`);
    let pista = '';
    if (s.finA && s.iniB) pista = `Debe salir después de las ${s.finA} y llegar antes de las ${s.iniB}`;
    else if (s.finA) pista = `Debe salir después de las ${s.finA}`;
    else if (s.iniB) pista = `Debe llegar antes de las ${s.iniB}`;
    if (instruccion) pista = pista ? `${pista}. Instrucción del usuario: ${instruccion}` : `Instrucción del usuario: ${instruccion}`;
    const r = await postGAS({ action: 'sugerirTransporteCompleto', origenTexto: s.A.nombre, destinoTexto: s.B.nombre, pista, zona: dia.zona || '', fecha: dia.fecha || '' });
    if (r.ok && r.data) propuestas.push({ A: s.A, B: s.B, finA: s.finA, iniB: s.iniB, data: r.data, modos: normalizarModosIA(r.data.modos), chosenModo: r.data.tipoSugerido, chosenIdx: 0, incluir: true });
  }
  if (!propuestas.length) { showToast('No se pudo generar ninguna sugerencia'); return; }
  _revisionTransportesDia = { dia, propuestas };
  renderRevisionTransportesDia();
}

let _revisionTransportesDia = null;
function makeDraggable(panel, handle) {
  handle.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button, textarea, input')) return;
    const rect = panel.getBoundingClientRect();
    const offX = e.clientX - rect.left, offY = e.clientY - rect.top;
    panel.style.right = 'auto'; panel.style.left = rect.left + 'px'; panel.style.top = rect.top + 'px';
    function onMove(ev) {
      panel.style.left = Math.max(0, Math.min(window.innerWidth - 60, ev.clientX - offX)) + 'px';
      panel.style.top = Math.max(0, Math.min(window.innerHeight - 40, ev.clientY - offY)) + 'px';
    }
    function onUp() { document.removeEventListener('pointermove', onMove); document.removeEventListener('pointerup', onUp); }
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  });
}

async function ajustarRevisionTransportesDia() {

async function crearTransportesRevisados() {
  const { dia, propuestas } = _revisionTransportesDia;
  const seleccion = propuestas.filter(p => p.incluir);
  if (!seleccion.length) { cerrarRevisionTransportesDia(); return; }
  showToast(`Creando ${seleccion.length} transporte${seleccion.length > 1 ? 's' : ''}…`);
  for (const p of seleccion) {
    const m = p.modos.find(x => x.modo === p.chosenModo) || {};
    let opciones = m.opciones || [];
    // Los modos sin horario fijo (caminando/carro/bici/otro) llegan de la IA solo con duracionMin, sin
    // salida/llegada — sin eso no aparecen en el calendario y se van al fondo de la lista (ordena "sin hora"
    // al final). Les anclamos una hora real dentro del hueco disponible entre los dos eventos.
    if (opciones.length && !opciones[0].salida) {
      let baseMin = p.finA ? hhmmToMin(p.finA) : null;
      let ancladoDesdeFin = false;
      if (baseMin === null && p.iniB) { const finMin = hhmmToMin(p.iniB); if (finMin !== null) { ancladoDesdeFin = true; baseMin = finMin; } }
      if (baseMin !== null) {
        opciones = opciones.map(o => {
          const dur = (o.duracionMin != null && o.duracionMin !== '') ? Number(o.duracionMin) : 30;
          return ancladoDesdeFin
            ? { ...o, salida: minToHHMM(baseMin - dur), llegada: minToHHMM(baseMin) }
            : { ...o, salida: minToHHMM(baseMin), llegada: minToHHMM(baseMin + dur) };
        });
      }
    }
    const body = {
      action: 'saveTransporte',
      diaId: dia.id,
      tipo: p.chosenModo,
      origen: p.A.nombre, destino: p.B.nombre,
      direccionOrigen: m.direccionOrigen || p.data.origenDireccion || p.A.direccion || '',
      direccionDestino: m.direccionDestino || p.data.destinoDireccion || p.B.direccion || '',
      origenLat: m.origenLat || p.data.origenLat || p.A.lat || '',
      origenLng: m.origenLng || p.data.origenLng || p.A.lng || '',
      destinoLat: m.destinoLat || p.data.destinoLat || p.B.lat || '',
      destinoLng: m.destinoLng || p.data.destinoLng || p.B.lng || '',
      opciones, opcionElegida: 0,
      modosData: { modos: p.modos, mixto: { requiere: false, descripcion: '' } },
      reservado: 'pendiente',
      sugerenciasIAOrigen: p.data.notaRuta || ''
    };
    await postGAS(body);
  }
  cerrarRevisionTransportesDia();
  showToast('Transportes creados ✦');
  await loadItinerario();
}

async function guardarEvento() {
  if (!guardarBtnLock(true)) return;
  const id = document.getElementById('fEventoId').value;
  const sedes = currentEventoSedes.map((s, i) => ({
    id: s.id,
    nombre: (document.getElementById(`sedeNombre-${i}`)||{}).value || '',
    diaId: (document.getElementById(`sedeDia-${i}`)||{}).value || '',
    diaIdFin: (document.getElementById(`sedeDiaFin-${i}`)||{}).value || '',
    fechaProgramada: (document.getElementById(`sedeFechaProgramada-${i}`)||{}).value || '',
    fechaProgramadaFin: (document.getElementById(`sedeFechaProgramadaFin-${i}`)||{}).value || '',
    horaInicio: (document.getElementById(`sedeHoraIni-${i}`)||{}).value || '',
    horaFin: (document.getElementById(`sedeHoraFin-${i}`)||{}).value || '',
    horaAsignada: (document.getElementById(`sedeHoraAsignada-${i}`)||{}).value || '',
    horaAsignadaFin: (document.getElementById(`sedeHoraAsignadaFin-${i}`)||{}).value || '',
    notas: (document.getElementById(`sedeNotas-${i}`)||{}).value || '',
    direccion: (document.getElementById(`sedeDireccion-${i}`)||{}).value || '',
    lat: (document.getElementById(`sedeLat-${i}`)||{}).value || '',
    lng: (document.getElementById(`sedeLng-${i}`)||{}).value || ''
  })).filter(s => s.nombre || s.direccion || s.diaId);
  const body = {
    nombre: document.getElementById('fEventoNombre').value,
    fechaInicioReal: document.getElementById('fEventoFechaInicio').value,
    fechaFinReal: document.getElementById('fEventoFechaFin').value,
    diaIdInicio: document.getElementById('fEventoDiaInicio').value,
    diaIdFin: document.getElementById('fEventoDiaFin').value,
    categoria: document.getElementById('fEventoCategoria').value,
    reservado: getReservadoVal('fEventoReservado'),
    ciudades: document.getElementById('fEventoCiudades').value,
    direccionGeneral: document.getElementById('fEventoDireccionGeneral').value,
    latGeneral: document.getElementById('fEventoLatGeneral').value,
    lngGeneral: document.getElementById('fEventoLngGeneral').value,
    paginaWeb: document.getElementById('fEventoWeb').value,
    notas: document.getElementById('fEventoNotas').value,
    sugerenciasIA: document.getElementById('fEventoSugIA').value,
    evaluacion: Number(document.getElementById('fEventoEvaluacion').value) || 0,
    sedes,
    proyecto: currentProyecto
  };
  body.action = id ? 'updateEvento' : 'saveEvento';
  if (id) body.id = id;
  // El programa se sube aparte (subirProgramaEvento) apenas se elige el archivo; si el evento
  // era nuevo (sin id todavía), acá recién se manda para guardarlo junto con el resto.
  if (!id || currentEventoProgramaUrl) {
    body.programaUrl = currentEventoProgramaUrl || '';
    body.programaFileId = currentEventoProgramaFileId || '';
  }
  const r = await postGAS(body);
  if (r.ok) { modalClose(); showToast('Evento guardado ✦'); await loadItinerario(); }
  guardarBtnLock(false);
}
// Igual que refinarConIALocal (hotel/lugar), pero para eventos: la IA corrige el nombre,
// propone la sede principal (dirección + coords) y deja tips en "Sugerencias IA".
async function refinarEventoConIA(btnEl) {
  const nombre = document.getElementById('fEventoNombre').value;
  const chatInput = document.getElementById('fEventoChatIA').value;
  const idActual = document.getElementById('fEventoId').value;
  const evActual = idActual ? itinerario.eventos.find(x => x.id === idActual) : null;
  const tieneDocumento = !!(currentEventoProgramaB64 || currentEventoProgramaUrl || (evActual && evActual.programaFileId));
  if (!nombre && !tieneDocumento) { showToast('Escribe el nombre del evento o subí el programa primero'); return; }

  const textoOriginal = btnEl ? btnEl.innerHTML : '';
  if (btnEl) { btnEl.disabled = true; btnEl.innerHTML = '<span class="spinner-mini"></span> Pensando…'; }
  showToast('IA Pensando...');
  const diaIniId = document.getElementById('fEventoDiaInicio').value;
  const dia = itinerario.dias.find(d => d.id === diaIniId);
  const body = { action: 'sugerirUbicacionLocal', tipo: 'evento o festival', zona: dia ? dia.zona : '', nombre: nombre || '(sin nombre — ver documento adjunto)', promptUsuario: chatInput };
  // Si hay un programa (PDF/foto) adjunto, se manda junto — así la IA corrige/completa todo
  // basándose en el documento real, no solo en lo que ya sabía.
  if (currentEventoProgramaB64) body.programaBase64 = currentEventoProgramaB64;
  else if (evActual && evActual.programaFileId) body.programaFileId = evActual.programaFileId;
  const r = await postGAS(body);
  if (btnEl) { btnEl.disabled = false; btnEl.innerHTML = textoOriginal; }

  if (r.ok && r.data) {
    if (r.data.nombreConEmoji) document.getElementById('fEventoNombre').value = r.data.nombreConEmoji;
    // v58 fix: la "locación general" (fuera, en el visor) se estaba quedando siempre vacía
    // porque este bloque solo usaba r.data.direccionExacta cuando NO había actividades[] — si
    // la IA mandaba ambas cosas (lo normal: la sede principal + las actividades puntuales), la
    // general se descartaba. Ahora se llena aparte, sin importar si hay actividades o no — pero
    // sin pisar lo que ya hayas escrito a mano.
    if (r.data.direccionExacta && !document.getElementById('fEventoDireccionGeneral').value.trim()) {
      document.getElementById('fEventoDireccionGeneral').value = r.data.direccionExacta;
      if (r.data.lat) document.getElementById('fEventoLatGeneral').value = r.data.lat;
      if (r.data.lng) document.getElementById('fEventoLngGeneral').value = r.data.lng;
      const coordsTxtEl = document.getElementById('fEventoCoordsGeneralTxt');
      if (coordsTxtEl && r.data.lat && r.data.lng) coordsTxtEl.textContent = `${r.data.lat}, ${r.data.lng}`;
    }
    if (r.data.actividades && r.data.actividades.length) {
      // La IA reconoció varias partes del evento (carrera, ceremonia, etc.) — se agregan como
      // actividades nuevas. "fechaProgramada" es la fecha real en que pasa (independiente de tu
      // viaje); si esa fecha coincide con un día real de tu viaje, además se preasigna ese día
      // (lo puedes quitar si no vas a ir).
      r.data.actividades.forEach(a => {
        const diaMatch = a.fechaSugerida ? diasFiltrados().find(d => d.fecha === a.fechaSugerida) : null;
        // Es un solo día sugerido — inicio y fin del rango asignado quedan en el mismo día.
        currentEventoSedes.push({
          id: 'ACT-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          nombre: a.nombre || '', diaId: diaMatch ? diaMatch.id : '', diaIdFin: diaMatch ? diaMatch.id : '', fechaProgramada: a.fechaSugerida || '',
          horaInicio: a.horaSugerida || '', horaFin: '',
          direccion: a.direccionExacta || '', lat: a.lat || '', lng: a.lng || ''
        });
      });
      renderSedesEditor();

(function () {

  if (!ov) return;
  ov.addEventListener('pointerdown', (e) => { touchStartX = e.clientX; });
  ov.addEventListener('pointerup', (e) => {

// Menú flotante de abajo (Itinerario/Tabla/Mapa en el celular): arrastrable, se puede dejar donde
// quieras y recuerda la posición entre sesiones.
// v57: expandir/colapsar ahora ancla la esquina inferior-derecha del panel (antes anclaba la
// izquierda/arriba, así que si lo dejabas pegado a la derecha, al expandir se salía de la
// pantalla o "saltaba" — y al volver a colapsar el círculo no quedaba en el mismo lugar).
function mtfToggleExpand(el, activar) {
  const before = el.getBoundingClientRect();
  if (activar) el.classList.add('expanded'); else el.classList.remove('expanded');
  requestAnimationFrame(() => {
    const after = el.getBoundingClientRect();
    const dw = after.width - before.width, dh = after.height - before.height;
    const maxLeft = window.innerWidth - after.width - 4, maxTop = window.innerHeight - after.height - 4;
    let left = (parseFloat(el.style.left) || before.left) - dw;
    let top = (parseFloat(el.style.top) || before.top) - dh;
    left = Math.max(4, Math.min(maxLeft, left));
    top = Math.max(4, Math.min(maxTop, top));
    el.style.left = left + 'px'; el.style.top = top + 'px'; el.style.bottom = 'auto';
  });
}
(function () {
  const el = document.getElementById('mobileTabFloat');
  if (!el) return;
  let dragging = false, moved = false, startX, startY, startLeft, startTop, pid;
  let fijado = false;
  try { fijado = localStorage.getItem('itin_tabFloatFijado') === '1'; } catch (e) {}
  el.classList.toggle('fijado', fijado);

  try {
    const pos = JSON.parse(localStorage.getItem('itin_tabFloatPos'));
    if (pos && typeof pos.left === 'number' && typeof pos.top === 'number') {
      el.style.left = pos.left + 'px';
      el.style.top = pos.top + 'px';
      el.style.bottom = 'auto';
    }
  } catch (e) {}
  try { if (localStorage.getItem('itin_tabFloatVertical') === '1') el.classList.add('vertical'); } catch (e) {}

  let longPressTimer = null, longPressFired = false;
  function alternarOrientacion() {
    const vertical = el.classList.toggle('vertical');
    try { localStorage.setItem('itin_tabFloatVertical', vertical ? '1' : '0'); } catch (err) {}
    showToast(vertical ? '↕️ Vertical' : '↔️ Horizontal');
  }
  const rotateBtn = document.getElementById('mtfRotateBtn');
  if (rotateBtn) rotateBtn.addEventListener('click', (e) => { e.stopPropagation(); alternarOrientacion(); });
  const pinBtn = document.getElementById('mtfPinBtn');
  if (pinBtn) {
    pinBtn.classList.toggle('on', fijado);
    pinBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      fijado = !fijado;
      try { localStorage.setItem('itin_tabFloatFijado', fijado ? '1' : '0'); } catch (err) {}
      el.classList.toggle('fijado', fijado);
      pinBtn.classList.toggle('on', fijado);
      showToast(fijado ? '📌 Fijado en esta posición' : '📌 Ya se puede volver a arrastrar');
    });
  }
  el.addEventListener('pointerdown', (e) => {
    if (fijado) return; // fijado: no arma arrastre ni rotación por mantener-presionado, solo toques
    dragging = true; moved = false; longPressFired = false; pid = e.pointerId;
    const r = el.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startLeft = r.left; startTop = r.top;
    // Mantener presionado sin mover ~550ms alterna horizontal/vertical (más confiable en
    // celular que el doble toque, que el navegador a veces confunde con el arrastre).
    longPressTimer = setTimeout(() => {
      if (!moved) { longPressFired = true; alternarOrientacion(); }
    }, 550);
  });
  el.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    if (!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)) {
      moved = true;
      clearTimeout(longPressTimer);
      el.classList.add('mtf-dragging');
      el.setPointerCapture(pid);
    }
    if (!moved) return;
    const maxLeft = window.innerWidth - el.offsetWidth - 4;
    const maxTop = window.innerHeight - el.offsetHeight - 4;
    el.style.left = Math.max(4, Math.min(maxLeft, startLeft + dx)) + 'px';
    el.style.top = Math.max(4, Math.min(maxTop, startTop + dy)) + 'px';
    el.style.bottom = 'auto';
  });
  el.addEventListener('pointerup', () => {
    if (!dragging) return;
    dragging = false;
    clearTimeout(longPressTimer);
    if (moved) {
      el.classList.remove('mtf-dragging');
      el.releasePointerCapture(pid);
      try { localStorage.setItem('itin_tabFloatPos', JSON.stringify({ left: parseFloat(el.style.left), top: parseFloat(el.style.top) })); } catch (e) {}
    }
  });
  // Colapsado (default): solo se ve el botón de la pestaña activa. Un toque lo expande
  // para elegir entre los 3; elegir uno (mtfCollapse() en su onclick) o tocar afuera lo
  // vuelve a colapsar. Si se arrastró o se disparó el mantener-presionado, no dispara
  // el onclick del botón que quedó debajo del dedo.
  el.addEventListener('click', (e) => {
    if (moved || longPressFired) { e.stopPropagation(); e.preventDefault(); moved = false; longPressFired = false; return; }
    if (!el.classList.contains('expanded')) {
      e.stopPropagation(); e.preventDefault();
      mtfToggleExpand(el, true);
      return;
    }
    if (e.target === el) mtfToggleExpand(el, false); // tocaron el fondo del panel: cierra sin elegir
  }, true);
  document.addEventListener('click', (e) => {
    if (el.classList.contains('expanded') && !el.contains(e.target)) mtfToggleExpand(el, false);
  });
})();
function mtfCollapse() { const el = document.getElementById('mobileTabFloat'); if (el && el.classList.contains('expanded')) mtfToggleExpand(el, false); }

function resizeImage(file, maxDim, quality) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.onload = () => {
      let w = img.width, h = img.height;
      if (w > h && w > maxDim) { h = h * maxDim / w; w = maxDim; }
      else if (h > maxDim) { w = w * maxDim / h; h = maxDim; }
      const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    }; img.onerror = reject; img.src = e.target.result; };
    reader.onerror = reject; reader.readAsDataURL(file);
  });
}

function shapeDivIcon(color, shape, inner, size, opacity) {
  size = size || 24;

  const base = `width:${size}px;height:${size}px;display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);background:${color};color:#fff;opacity:${opacity};`;
  let html;
  if (shape === 'square') html = `<div style="${base}border-radius:5px;">${inner || ''}</div>`;
  else if (shape === 'diamond') html = `<div style="${base}border-radius:4px;transform:rotate(45deg);"><span style="display:inline-block;transform:rotate(-45deg)">${inner || ''}</span></div>`;
  else if (shape === 'triangle') {
    const s2 = size + 2;
    html = `<div style="width:0;height:0;border-left:${s2/2}px solid transparent;border-right:${s2/2}px solid transparent;border-bottom:${s2}px solid ${color};opacity:${opacity};filter:drop-shadow(0 1px 3px rgba(0,0,0,.3));position:relative"><span style="position:absolute;top:${Math.round(s2*0.35)}px;left:${-Math.round(s2*0.28)}px;font-size:${Math.round(size*0.45)}px;color:#fff">${inner||''}</span></div>`;
    return L.divIcon({ className: '', html, iconSize: [s2, s2], iconAnchor: [s2/2, s2] });
  }
  else if (shape === 'hexagon') {
    html = `<div style="width:${size}px;height:${size}px;background:${color};opacity:${opacity};display:flex;align-items:center;justify-content:center;font-size:${Math.round(size*0.48)}px;color:#fff;clip-path:polygon(50% 0%,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%);filter:drop-shadow(0 2px 4px rgba(0,0,0,.4));">${inner||''}</div>`;
  }
  else html = `<div style="${base}border-radius:50%;">${inner || ''}</div>`;
  return L.divIcon({ className: '', html, iconSize: [size, size], iconAnchor: [size / 2, size / 2] });
}

      if (miUbicacionCirculo) { leafletMap.removeLayer(miUbicacionCirculo); miUbicacionCirculo = null; }

      miUbicacionMarker = L.circleMarker([latitude, longitude], { radius: 8, color: '#fff', weight: 3, fillColor: '#1a6fd4', fillOpacity: 1 }).addTo(leafletMap);
      leafletMap.flyTo([latitude, longitude], Math.max(leafletMap.getZoom() || 13, 15), { duration: 0.6 });
      if (btn) btn.innerHTML = '📍';
    },
    (err) => {
      showToast(err.code === 1 ? '⚠️ Permiso de ubicación denegado' : '⚠️ No se pudo obtener tu ubicación');

  const colorDeDia = (diaId) => { const idx = dias.findIndex(d => d.id === diaId); return DIA_COLORES[idx >= 0 ? idx % DIA_COLORES.length : 0]; };
  const cats = categoriasMapaActivas();
  const verPendientes = cats.includes('pendientes'), verTransporte = cats.includes('transporte'), verHospedaje = cats.includes('hospedaje'), verResto = mapaRestoMode && cats.includes('restaurantes'), verEventos = cats.includes('eventos');

  const foco = mapaFoco;

      const pendDia = [...todasPendDia.filter(p => p.horaInicio), ...restoDia].sort((a, b) => a.horaInicio.localeCompare(b.horaInicio));
      const pendSinHora = todasPendDia.filter(p => !p.horaInicio);

      const puntosOrdenados = [];
      if (verPendientes) pendDia.forEach((p, i) => {
        const o = op('pendiente', p.id, false);
        const shape = (p.esRestaurante || p.antojo) ? 'hexagon' : 'circle';
        const m = mkr(p.lat, p.lng, shapeDivIcon(color, shape, i + 1, 22, o), o);
        bindEtiquetaMapa(m, p.nombre, () => abrirVisor('pendiente', p.id), o, o >= 0.9);
        puntosOrdenados.push({ lat: p.lat, lng: p.lng, hora: p.horaInicio, esTrans: false });
        puntos.push([p.lat, p.lng]);
        puntosProgramados.push([p.lat, p.lng]);
        if (foco && foco.tipo === 'pendiente' && foco.id === p.id) { puntoFoco = [p.lat, p.lng]; }
      });
      // Sin hora asignada (tenga día o no): siempre gris, no entran en la ruta numerada.
      if (verPendientes) pendSinHora.forEach(p => {
        const m = mkr(p.lat, p.lng, shapeDivIcon(COLOR_SIN_HORA, 'circle', '', mapaModoPendientes ? 24 : 16, 1), 1);
        bindEtiquetaMapa(m, p.nombre, () => abrirVisor('pendiente', p.id), 1, true);
        puntos.push([p.lat, p.lng]);
        if (foco && foco.tipo === 'pendiente' && foco.id === p.id) { puntoFoco = [p.lat, p.lng]; }
      });

      if (verTransporte) {
        // Igual que en el calendario: si no tiene hora fija de salida, no se muestra (mapa y calendario deben coincidir).
        itinerario.transporte.filter(t => t.diaId === dia.id && !t.ocultarMapa && ((t.opciones||[])[t.opcionElegida||0]||{}).salida).forEach(t => {
          const etiqueta = TIPO_LABEL[t.tipo] || t.tipo;
          const emoji = tipoEmoji(t.tipo);
          const opcion = (t.opciones || [])[t.opcionElegida || 0];
          const horarioTxt = opcion && opcion.salida ? `🕐 ${escHtml(opcion.salida)}${opcion.llegada ? '–' + escHtml(opcion.llegada) : ''}` : (opcion && opcion.duracionMin ? `⏱ ~${opcion.duracionMin} min` : '');
          const ot = op('transporte', t.id, false);
          if (t.origenLat && t.origenLng) {
            const m = mkr(t.origenLat, t.origenLng, shapeDivIcon(color, 'square', emoji, 22, ot), ot);
            bindEtiquetaMapa(m, t.origen, () => abrirVisor('transporte', t.id), ot, ot >= 0.9);
            puntosOrdenados.push({ lat: t.origenLat, lng: t.origenLng, hora: (opcion && opcion.salida) || '99:99', esTrans: true, transId: t.id });
            puntos.push([t.origenLat, t.origenLng]);
            puntosProgramados.push([t.origenLat, t.origenLng]);
            if (foco && foco.tipo === 'transporte' && foco.id === t.id) { puntoFoco = [t.origenLat, t.origenLng]; }
          }
          if (t.destinoLat && t.destinoLng) {
            const m = mkr(t.destinoLat, t.destinoLng, shapeDivIcon(color, 'square', emoji, 22, ot), ot);
            bindEtiquetaMapa(m, t.destino, () => abrirVisor('transporte', t.id), ot, ot >= 0.9);
            puntosOrdenados.push({ lat: t.destinoLat, lng: t.destinoLng, hora: (opcion && opcion.llegada) || '99:99', esTrans: true, transId: t.id, esDestino: true });
            puntos.push([t.destinoLat, t.destinoLng]);
            puntosProgramados.push([t.destinoLat, t.destinoLng]);
          }
        });
      }

      if (verEventos) {
        itinerario.eventos.filter(ev => (ev.proyecto || currentProyecto) === currentProyecto).forEach(ev => {
          // v58: cada actividad usa SU propio punto si lo tiene; solo si le falta, se cae en la
          // "locación general" del evento (no al revés — la específica siempre gana). Antes,
          // además, los eventos se dibujaban como marcador suelto sin entrar a la línea de ruta
          // del día (a diferencia de pendientes/transporte), así que la ruta los "brincaba".
          (ev.sedes || []).filter(s => s.diaId === dia.id).forEach(s => {
            const lat = (s.lat && s.lng) ? s.lat : ev.latGeneral;
            const lng = (s.lat && s.lng) ? s.lng : ev.lngGeneral;
            if (!lat || !lng) return;
            const ot = op('evento', ev.id, false);
            const m = mkr(lat, lng, shapeDivIcon(color, 'square', '🎪', 22, ot), ot);
            bindEtiquetaMapa(m, ev.nombre, () => abrirVisor('evento', ev.id, s.id), ot, ot >= 0.9);
            puntos.push([lat, lng]);
            puntosProgramados.push([lat, lng]);
            if (sedeHoraIni(s)) puntosOrdenados.push({ lat, lng, hora: sedeHoraIni(s), esTrans: false });
            if (foco && foco.tipo === 'evento' && foco.id === ev.id) { puntoFoco = [lat, lng]; }
          });
        });
      }

      puntosOrdenados.sort((a, b) => (a.hora||'99:99').localeCompare(b.hora||'99:99'));
      const ruta = [];
      // Buscar por fecha (más fiable que comparar IDs)
      const dFecha = dia ? dia.fecha : '';
      const fechaDia = (diaId) => ((itinerario.dias.find(d=>d.id===diaId)||{}).fecha||'');
      // Entre varios candidatos el mismo día, preferir el elegido (⭐); si hay más de uno y ninguno
      // elegido, no se dibuja línea a ninguno (evita adivinar cuál es el hotel real).
      const elegirCandidato = (grupo) => grupo.length === 1 ? grupo[0] : (grupo.find(h => h.elegido) || null);
      // Hotel del que salgo hoy (check-out = hoy es último día)
      const hospCheckOut = verHospedaje && dFecha ? elegirCandidato(itinerario.hospedaje.filter(h =>
        h.lat && h.lng && h.diaIdFin && fechaDia(h.diaIdFin) === dFecha
      )) : null;
      // Hotel al que llego hoy (check-in = hoy es primer día)
      const hospCheckIn = verHospedaje && dFecha ? elegirCandidato(itinerario.hospedaje.filter(h =>
        h.lat && h.lng && h.diaIdInicio && fechaDia(h.diaIdInicio) === dFecha
      )) : null;
      // Hotel activo hoy (dormí y regreso ahí, no es checkout ni checkin)
      const hospActivo = verHospedaje && dFecha ? elegirCandidato(itinerario.hospedaje.filter(h =>
        h.lat && h.lng && h.diaIdInicio && h.diaIdFin &&
        fechaDia(h.diaIdInicio) < dFecha && fechaDia(h.diaIdFin) > dFecha
      )) : null;
      const hotelAlInicio = hospCheckOut || hospActivo;
      const hotelAlFinal  = hospCheckIn  || hospActivo;
      if (hotelAlInicio) ruta.push({ lat: hotelAlInicio.lat, lng: hotelAlInicio.lng, esTrans: false });
      puntosOrdenados.forEach(pt => ruta.push(pt));
      // Evitar duplicar si es el mismo hotel que el de salida y no hay lugares visitados
      if (hotelAlFinal) {
        if (puntosOrdenados.length > 0 || !hotelAlInicio || hotelAlInicio !== hotelAlFinal) {
          ruta.push({ lat: hotelAlFinal.lat, lng: hotelAlFinal.lng, esTrans: false });
        }
      }
      if (ruta.length > 1) {
        const opacidadRuta = (foco || mapaModoPendientes) ? 0.15 : 0.65;
        // Dibujar segmento a segmento: punteado entre origen y destino del mismo transporte, sólido el resto
        for (let i = 0; i < ruta.length - 1; i++) {
          const a = ruta[i], b = ruta[i + 1];
          const esTranSeg = a.esTrans && b.esTrans && a.transId && a.transId === b.transId;
          L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
            color, weight: 2.5, opacity: opacidadRuta,
            dashArray: esTranSeg ? '8 5' : null
          }).addTo(leafletMap);
        }
        if (_mapaEnModoTodos) {
          const numDia = dias.findIndex(d => d.id === dia.id) + 1;
          L.polyline(ruta.map(pt => [pt.lat, pt.lng]), { color, weight: 0, opacity: 0 }).addTo(leafletMap)
            .bindTooltip(etiquetaDiaHtml(numDia, dia.fecha, color), { permanent: true, direction: 'center', className: 'dia-label-mapa', opacity: mapaModoPendientes ? 0.3 : 0.85 });
        }
      } else if (ruta.length === 1 && _mapaEnModoTodos) {
        const numDia = dias.findIndex(d => d.id === dia.id) + 1;
        L.marker(ruta[0], { icon: L.divIcon({ className: '', html: '', iconSize: [0, 0] }), interactive: false })
          .addTo(leafletMap)
          .bindTooltip(etiquetaDiaHtml(numDia, dia.fecha, color), { permanent: true, direction: 'right', offset: [16, 0], className: 'dia-label-mapa', opacity: mapaModoPendientes ? 0.3 : 0.85 })
          .openTooltip();
      }
    });

    // Pendientes sin día (para después / si hay tiempo) — también grises
    itinerario.pendientes.filter(p => !p.diaId && (p.proyecto || '') === currentProyecto && p.lat && p.lng && !p.antojo && !p.esRestaurante).forEach(p => {
      const o = op('pendiente', p.id, true);
      const m = mkr(p.lat, p.lng, shapeDivIcon(COLOR_SIN_HORA, 'circle', '', mapaModoPendientes ? 24 : 16, 1), 1);
      bindEtiquetaMapa(m, p.nombre, () => abrirVisor('pendiente', p.id), 1, true);
      puntos.push([p.lat, p.lng]);
      if (foco && foco.tipo === 'pendiente' && foco.id === p.id) { puntoFoco = [p.lat, p.lng]; }
    });
  }

  // Restaurantes / antojos: ícono propio, atenuados hasta que "Reservado" = sí (aceptado).
  if (verResto) {
    // IDs de restaurantes con hora (para numerarlos en el mapa igual que los pendientes)
    const restosConHora = itinerario.pendientes
      .filter(p => (p.antojo || p.esRestaurante) && p.diaId && p.horaInicio && p.lat && p.lng && (p.proyecto||'')=== currentProyecto)
      .sort((a,b) => a.horaInicio.localeCompare(b.horaInicio))
      .map(p => p.id);
    // Los restaurantes con hora en el día activo ya se dibujan en pendDia (como cuadrado).
    // Aquí solo dibujamos los que NO tienen hora en el día actual (globales/sin asignar).
    // yaEnRuta: restaurantes que ya aparecen en la ruta del día (tienen diaId + horaInicio)
    const yaEnRuta = new Set(itinerario.pendientes.filter(p2 => (p2.esRestaurante || p2.antojo) && p2.diaId && p2.horaInicio && p2.lat && p2.lng).map(p2 => p2.id));
    itinerario.pendientes.filter(p => (p.antojo || p.esRestaurante) && p.lat && p.lng && (p.proyecto || '') === currentProyecto && !yaEnRuta.has(p.id)).forEach(p => {
      const aceptado = p.reservado === 'si';
      const o = op('pendiente', p.id, !aceptado) * (aceptado ? 1 : 0.55);
      // Número de orden si tiene hora en el día
      const numResto = restosConHora.indexOf(p.id) >= 0 ? restosConHora.indexOf(p.id) + 1 : '';
      const m = mkr(p.lat, p.lng, shapeDivIcon(COLOR_RESTAURANTE, 'hexagon', numResto || '🍴', 26, Math.max(o, 0.7)), o);
      bindEtiquetaMapa(m, p.nombre, () => abrirVisor('pendiente', p.id), o, o >= 0.9);
      puntos.push([p.lat, p.lng]);
      if (aceptado) puntosProgramados.push([p.lat, p.lng]);
      if (foco && foco.tipo === 'pendiente' && foco.id === p.id) { puntoFoco = [p.lat, p.lng]; }
    });
  }

  // Hospedaje (forma diamante, color fijo para distinguirlo de los días)
  if (verHospedaje || mapaHotelesMode) {
    // Un hotel "compite" con otro cuando de verdad se solapan en fechas (hospedajesSeSolapan ya excluye
    // los simples relevos checkout/checkin). Si compite, solo se mapea el elegido (⭐); si no compite,
    // se mapea igual aunque no tenga estrella (es el único candidato de esos días).
    const compiteSinElegir = (h) => !h.elegido && itinerario.hospedaje.some(h2 =>
      h2.id !== h.id && h2.lat && h2.lng && hospedajesSeSolapan(h, h2));
    const hotelFilter = mapaHotelesMode
      ? itinerario.hospedaje.filter(h => h.lat && h.lng)
      : itinerario.hospedaje.filter(h => {
          if (!h.lat || !h.lng) return false;
          if (compiteSinElegir(h)) return false;
          // Check-in o check-out en los días visibles
          if (diaIds.has(h.diaIdInicio) || diaIds.has(h.diaIdFin)) return true;
          // O el hotel está activo en alguno de los días visibles (día cae dentro del rango de fechas)
          const fd = ((itinerario.dias.find(d=>d.id===h.diaIdInicio)||{}).fecha)||'';
          const fh = ((itinerario.dias.find(d=>d.id===h.diaIdFin)||{}).fecha)||'';
          if (!fd || !fh) return false;
          return Array.from(diaIds).some(dId => {
            const dFecha = ((itinerario.dias.find(d=>d.id===dId)||{}).fecha)||'';
            return dFecha > fd && dFecha < fh;
          });
        });
    hotelFilter.forEach(h => {
      const oh = op('hospedaje', h.id, false);
      // Los hoteles siempre en frentePane para que no queden detrás de las líneas de ruta
      const marker = L.marker([h.lat, h.lng], {
        icon: shapeDivIcon('#0c5f8c', 'diamond', '🏨', 22, oh),
        pane: 'frentePane',
        zIndexOffset: 1200
      }).addTo(leafletMap);
      const rango = (!h.diaIdFin || h.diaIdInicio === h.diaIdFin) ? diaNombre(h.diaIdInicio) : `${diaNombre(h.diaIdInicio)} a ${diaNombre(h.diaIdFin)}`;
      bindEtiquetaMapa(marker, h.nombre, () => abrirVisor('hospedaje', h.id), oh, oh >= 0.9);
      if (oh >= 0.9) { puntos.push([h.lat, h.lng]); puntosProgramados.push([h.lat, h.lng]); }
      if (foco && foco.tipo === 'hospedaje' && foco.id === h.id) { puntoFoco = [h.lat, h.lng]; }
    });
  }

  if (_mapaPreservarVista) {
    _mapaPreservarVista = false; // mantener zoom/centro actual — solo esta vez
  } else if (puntoFoco) {
    leafletMap.setView(puntoFoco, 16);
  } else if (mapaModoPendientes && puntos.length) {
    leafletMap.fitBounds(puntos, { padding: [30, 30] });
  } else if (puntosProgramados.length) {
    leafletMap.fitBounds(puntosProgramados, { padding: [30, 30] });
  } else if (puntos.length) {
    leafletMap.fitBounds(puntos, { padding: [30, 30] });
  } else {
    leafletMap.setView([32.75, 129.87], 11);
  }
  setTimeout(() => leafletMap.invalidateSize(), 80);
  setTimeout(() => leafletMap.invalidateSize(), 350);
}

// ── Mini mapa del día, como tarjeta del panel lateral ──────────
function renderMiniMapa(diaIdActivo) {
  const box = document.getElementById('miniMapBox');
  if (!box) return;
  if (miniMap) { try { miniMap.remove(); } catch (e) {} miniMap = null; }
  miniMap = L.map('miniMapBox', { zoomControl: false, attributionControl: false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 20, subdomains: 'abcd' }).addTo(miniMap);

  const dias = diasFiltrados();
  const puntosHoy = [];

  dias.forEach((dia) => {
    const esHoy = dia.id === diaIdActivo;
    const idxGlobal = dias.findIndex(d => d.id === dia.id);
    const color = DIA_COLORES[idxGlobal >= 0 ? idxGlobal % DIA_COLORES.length : 0];
    const opacidad = esHoy ? 1 : 0.16;
    const tamMarker = esHoy ? 20 : 14;
    const zHoy = esHoy ? 2000 : 100;
    const hosp = hospedajeDelDia(dia.id);

    // Recopilar todos los puntos del día con su hora para ordenarlos igual que el mapa principal
    const puntosOrdenados = [];

    // v57 fix: solo lo que tiene HORA se conecta con la línea de ruta (igual que el mapa
    // general) — antes también se metían los pendientes "sin hora" a la ruta, y como pueden
    // ser varios y estar lejos entre sí, la línea zigzagueaba por todo el mapa. Lo sin hora
    // se sigue viendo como marcador suelto, nomás no se conecta con nada.
    const pendConHora = itinerario.pendientes.filter(p => p.diaId === dia.id && p.lat && p.lng && !p.antojo && !p.esRestaurante && p.horaInicio);
    const pendSinHora = itinerario.pendientes.filter(p => p.diaId === dia.id && p.lat && p.lng && !p.antojo && !p.esRestaurante && !p.horaInicio);
    const restoDia = itinerario.pendientes.filter(p => p.diaId === dia.id && p.lat && p.lng && (p.esRestaurante || p.antojo) && p.horaInicio);
    pendConHora.forEach(p => {
      puntosOrdenados.push({ lat: p.lat, lng: p.lng, hora: p.horaInicio, esTrans: false, pendiente: p });
      if (esHoy) puntosHoy.push([p.lat, p.lng]);
    });
    restoDia.forEach(p => {
      puntosOrdenados.push({ lat: p.lat, lng: p.lng, hora: p.horaInicio, esTrans: false, pendiente: p, esResto: true });
      if (esHoy) puntosHoy.push([p.lat, p.lng]);
    });
    pendSinHora.forEach(p => {
      L.marker([p.lat, p.lng], { icon: shapeDivIcon(COLOR_SIN_HORA, 'circle', '', tamMarker, opacidad), zIndexOffset: zHoy }).addTo(miniMap)
        .on('click', () => abrirVisor('pendiente', p.id));
      if (esHoy) puntosHoy.push([p.lat, p.lng]);
    });

    // Igual que el mapa general: sin hora de salida fija, no entra a la ruta (mapa y calendario deben coincidir).
    itinerario.transporte.filter(t => t.diaId === dia.id && ((t.opciones||[])[t.opcionElegida||0]||{}).salida).forEach(t => {
      const emoji = tipoEmoji(t.tipo);
      const opcionSel = (t.opciones || [])[t.opcionElegida || 0];
      const horaOrigen = (opcionSel && opcionSel.salida) || '99:00';
      const horaDestino = (opcionSel && opcionSel.llegada) || '99:01';
      if (t.origenLat && t.origenLng) {
        L.marker([t.origenLat, t.origenLng], { icon: shapeDivIcon(color, 'square', emoji, tamMarker, opacidad), zIndexOffset: zHoy }).addTo(miniMap)
          .on('click', () => abrirVisor('transporte', t.id));
        puntosOrdenados.push({ lat: t.origenLat, lng: t.origenLng, hora: horaOrigen, esTrans: true, transId: t.id });
        if (esHoy) puntosHoy.push([t.origenLat, t.origenLng]);
      }
      if (t.destinoLat && t.destinoLng) {
        L.marker([t.destinoLat, t.destinoLng], { icon: shapeDivIcon(color, 'square', emoji, tamMarker, opacidad), zIndexOffset: zHoy }).addTo(miniMap)
          .on('click', () => abrirVisor('transporte', t.id));
        puntosOrdenados.push({ lat: t.destinoLat, lng: t.destinoLng, hora: horaDestino, esTrans: true, transId: t.id, esDestino: true });
        if (esHoy) puntosHoy.push([t.destinoLat, t.destinoLng]);
      }
    });

    // Eventos/actividades — misma lógica que el mapa general: punto propio de la actividad si lo
    // tiene, si no la "locación general" del evento; entran a la ruta igual que lo demás.
    itinerario.eventos.filter(ev => (ev.proyecto || currentProyecto) === currentProyecto).forEach(ev => {
      (ev.sedes || []).filter(s => s.diaId === dia.id).forEach(s => {
        const lat = (s.lat && s.lng) ? s.lat : ev.latGeneral;
        const lng = (s.lat && s.lng) ? s.lng : ev.lngGeneral;
        if (!lat || !lng) return;
        L.marker([lat, lng], { icon: shapeDivIcon(color, 'square', '🎪', tamMarker, opacidad), zIndexOffset: zHoy }).addTo(miniMap)
          .on('click', () => abrirVisor('evento', ev.id, s.id));
        if (esHoy) puntosHoy.push([lat, lng]);
        if (s.horaInicio) puntosOrdenados.push({ lat, lng, hora: s.horaInicio, esTrans: false });
      });
    });

    // Ordenar por hora igual que el mapa principal (mismo fallback '99:99')
    puntosOrdenados.sort((a, b) => (a.hora||'99:99').localeCompare(b.hora||'99:99'));
    // Dibujar marcadores CON el número según el orden temporal (mismo conteo que el mapa grande)
    let pendNum = 0;
    puntosOrdenados.forEach(pt => {
      if (pt.pendiente) {
        pendNum++;
        const p = pt.pendiente;
        const shape = pt.esResto ? 'hexagon' : 'circle';
        const m = L.marker([p.lat, p.lng], { icon: shapeDivIcon(p.horaInicio ? color : COLOR_SIN_HORA, shape, p.horaInicio ? pendNum : '', tamMarker, opacidad), zIndexOffset: zHoy }).addTo(miniMap);
        m.on('click', () => abrirVisor('pendiente', p.id));
      }
    });

    // Hotel: misma lógica que el mapa general (checkout al inicio, checkin al final, activo ambos)
    const dFechaMini = dia.fecha || '';
    const fechaDiaMini = (dId) => ((itinerario.dias.find(d=>d.id===dId)||{}).fecha||'');
    // v57 fix: si hay más de un candidato para el mismo rol ese día, preferir el elegido (antes
    // .find() tomaba el primero que hubiera en itinerario.hospedaje, sin importar cuál estuviera
    // realmente activo/reservado — se abría el marcador/visor del hotel equivocado).
    const elegirMini = (cands) => cands.find(h => h.elegido) || null;
    const hCheckOut = elegirMini(itinerario.hospedaje.filter(h => h.lat && h.lng && h.diaIdFin && fechaDiaMini(h.diaIdFin) === dFechaMini));
    const hCheckIn  = elegirMini(itinerario.hospedaje.filter(h => h.lat && h.lng && h.diaIdInicio && fechaDiaMini(h.diaIdInicio) === dFechaMini));
    const hActivo   = elegirMini(itinerario.hospedaje.filter(h => h.lat && h.lng && h.diaIdInicio && h.diaIdFin && fechaDiaMini(h.diaIdInicio) < dFechaMini && fechaDiaMini(h.diaIdFin) > dFechaMini));
    const hIni = hCheckOut || hActivo;
    const hFin = hCheckIn  || hActivo;
    // Dibujar los hoteles relevantes
    [hIni, hFin].forEach(hh => {
      if (hh && hh.lat && hh.lng) {
        L.marker([hh.lat, hh.lng], { icon: shapeDivIcon('#0c5f8c', 'diamond', '🏨', tamMarker, opacidad), zIndexOffset: zHoy + 1200 }).addTo(miniMap)
          .on('click', () => abrirVisor('hospedaje', hh.id));
        if (esHoy) puntosHoy.push([hh.lat, hh.lng]);
      }
    });

    // Construir ruta final: checkout/activo al inicio, checkin/activo al final
    const rutaFinal = [];
    if (hIni) rutaFinal.push({ lat: hIni.lat, lng: hIni.lng, esTrans: false });
    puntosOrdenados.forEach(pt => rutaFinal.push(pt));
    if (hFin && (puntosOrdenados.length > 0 || !hIni || hIni !== hFin)) {
      rutaFinal.push({ lat: hFin.lat, lng: hFin.lng, esTrans: false });
    }

    // Dibujar la ruta: sólida entre puntos normales, punteada entre origen y destino del mismo transporte
    for (let i = 0; i < rutaFinal.length - 1; i++) {
      const a = rutaFinal[i], b = rutaFinal[i + 1];
      const esTranSegment = a.esTrans && b.esTrans && a.transId && a.transId === b.transId;
      L.polyline([[a.lat, a.lng], [b.lat, b.lng]], {
        color, weight: esHoy ? 3 : 1.5, opacity: esHoy ? 0.85 : 0.12,
        dashArray: esTranSegment ? '6 4' : null
      }).addTo(miniMap);
    }
  });

  if (puntosHoy.length) miniMap.fitBounds(puntosHoy, { padding: [20, 20] });
  else miniMap.setView([32.75, 129.87], 10);
  setTimeout(() => miniMap && miniMap.invalidateSize(), 80);

}

// ── Vista semanal (1 a 7 días lado a lado) ─────────────────────
function renderSemana() {
  // v57 fix: cada vez que se movía/editaba un bloque (ej. arrastrar un transporte o evento),
  // el re-render subsecuente saltaba el scroll a "ahora" de nuevo, como si fuera la primera vez
  // que se abre el calendario — perdías tu lugar aunque el movimiento se haya guardado bien. Si
  // ya había un scroll previo (no es la primera vez que se pinta), se conserva tal cual.
  const _scrollElPrevio = document.getElementById('weekScroll');
  const _scrollTopPrevio = _scrollElPrevio ? _scrollElPrevio.scrollTop : null;
  const host = document.getElementById('semanaHost');
  const todosDelProyecto = diasFiltrados();
  if (!todosDelProyecto.length) { host.innerHTML = `<div class="empty-mini">Agrega días primero.</div>`; return; }
  weekStartIdx = Math.max(0, Math.min(todosDelProyecto.length - 1, weekStartIdx));
  const count = Math.min(weekDayCount, todosDelProyecto.length);
  const visibleDias = todosDelProyecto.slice(weekStartIdx, weekStartIdx + count);
  const px = pxPerMin();
  const hoy = fechaLocalISO(new Date());
  const colWidth = Math.max(130, Math.floor((Math.max(window.innerWidth, 360) - 70 - 40) / Math.max(1, count)));

  const hourLabels = Array.from({ length: 24 }, (_, h) => `<div class="cal-hour-label" style="top:${h * 60 * px - 5}px">${pad2(h)}:00</div>`).join('');

  // v57 fix: el encabezado de días vivía DENTRO de .week-scroll (el área con scroll vertical de
  // horas) y dependía de position:sticky para quedarse fijo arriba — pero se seguía escondiendo
  // en Chrome de escritorio al bajar. En vez de seguir peleando con sticky, el encabezado ahora
  // vive en su propia fila FUERA del área que scrollea verticalmente — así no hay nada de qué
  // "despegarse": nunca entra en el scroll para empezar.
  let headerCells = '', bodyCols = '';
  visibleDias.forEach(d => {
    const isToday = d.fecha === hoy;
    const blocks = calcularLayoutSolapado(getCalendarBlocks(d.id));
    const date = d.fecha ? new Date(d.fecha + 'T00:00:00') : null;
    const headerTxt = date ? date.toLocaleDateString('es', { weekday: 'short', day: 'numeric', month: 'short' }) : 'Sin fecha';
    const lines = Array.from({ length: 24 }, (_, h) => `<div class="cal-line" style="top:${h * 60 * px}px; left:0; right:0"></div>`).join('');
    let nowLine = '';
    if (isToday) { const n = new Date(); nowLine = `<div class="cal-now-line" style="top:${(n.getHours() * 60 + n.getMinutes()) * px}px; left:0; right:0"></div>`; }
    const evHtml = blocks.map(b => weekBlockHtml(b, px)).join('');
    headerCells += `<div class="week-col-header ${isToday ? 'today' : ''} ${d.id === currentDiaId ? 'active' : ''}" onclick="selectDay('${d.id}')" style="cursor:pointer; width:${colWidth}px">
      <span>${capitalize(headerTxt)}</span>
      ${d.zona ? `<span class="psub">${escHtml(d.zona)}</span>` : ''}
      ${hospedajesParaHeaderDia(d.id).map(({ h, icono, sufijo }) => {
        return `<span style="font-size:10px; color:var(--ink-3); font-weight:400; display:block; min-width:0; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${icono ? icono + ' ' : ''}${escHtml(h.nombre || '')}${sufijo ? escHtml(sufijo) : ''}</span>`;
      }).join('')}
    </div>`;
    bodyCols += `<div class="week-col" data-dia="${d.id}" style="width:${colWidth}px">
      <div class="week-col-body" style="height:${1440 * px}px">
        ${lines}${nowLine}
        <div class="week-col-events">${evHtml}</div>
      </div>
    </div>`;
  });

  host.innerHTML = `
    <div class="semana-controls">
      <div class="semana-group"><button class="btn-mini" onclick="navSemana(-1)">◀ Antes</button><button class="btn-mini" onclick="navSemana(1)">Después ▶</button></div>
      <div class="semana-group"><button class="btn-mini" onclick="adjustWeekCount(-1)">－</button><span class="cal-hint" style="margin:0">${count} día${count > 1 ? 's' : ''}</span><button class="btn-mini" onclick="adjustWeekCount(1)">＋</button></div>
      <div class="semana-group"><button class="btn-mini" onclick="adjustZoom(-1)">－</button><span class="cal-hint" style="margin:0">Zoom ${zoomPct()}</span><button class="btn-mini" onclick="adjustZoom(1)">＋</button></div>
      <button class="btn-mini" id="btnLockDrag" onclick="toggleDragLock()" style="font-weight:700">${dragBloqueado ? '🔒 Arrastre bloqueado' : '🔓 Arrastre libre'}</button>
    </div>
      <div class="week-header-row">
        <div class="week-header-gutter"></div>
        <div class="week-header-cols">${headerCells}</div>
      </div>
      <div class="week-scroll" id="weekScroll">
        <div class="week-gutter"><div class="week-gutter-labels" style="position:relative; height:${1440 * px}px">${hourLabels}</div></div>
        <div class="week-cols">${bodyCols}</div>
      </div>
      <span class="cal-hint" style="display:flex; gap:6px; align-items:center; flex-wrap:wrap; font-size:10.5px; margin-top:6px">
        <span style="display:flex; align-items:center; gap:3px"><span style="width:10px; height:10px; border-radius:2px; background:#fff3c4; border:1px solid #e8c44a; display:inline-block"></span>⭐ Prioritario</span>
        <span style="display:flex; align-items:center; gap:3px"><span style="width:10px; height:10px; border-radius:2px; background:var(--route-light); border:1px solid var(--route); display:inline-block"></span>Lugar</span>
        <span style="display:flex; align-items:center; gap:3px"><span style="width:10px; height:10px; border-radius:2px; background:#dbeafe; border:1px solid #93c5fd; display:inline-block"></span>Transporte</span>
        <span style="display:flex; align-items:center; gap:3px"><span style="width:10px; height:10px; border-radius:2px; background:#f3e8ff; border:1px solid #c4b5fd; display:inline-block"></span>🎪 Evento</span>
        <span style="display:flex; align-items:center; gap:3px"><span style="width:10px; height:10px; border-radius:2px; background:#dcf5e3; border:1px solid #7fc99a; display:inline-block"></span>🍳 Des. &nbsp;🍜 Com. &nbsp;🍷 Cena &nbsp;🍪 Col.</span>
        <span style="display:flex; align-items:center; gap:3px">🔒 Reservado</span>
        <span style="display:flex; align-items:center; gap:3px">⏳ Pendiente</span>
        <span style="display:flex; align-items:center; gap:3px">🍃 No requiere</span>
        <span style="display:flex; align-items:center; gap:3px">💸 Con pago asociado</span>
        <span style="display:flex; align-items:center; gap:3px">✅ Realizado</span>
      </span>`;

  // El encabezado de días vive fuera de .week-scroll (para no depender de sticky), pero cuando
  // las columnas no caben en el ancho visible (ej. 7 días + zoom alto) .week-scroll sí scrollea
  // horizontalmente — hay que espejar ese desplazamiento en el encabezado para que no se desalinee.
  const weekScrollEl = document.getElementById('weekScroll');
  const headerColsEl = host.querySelector('.week-header-cols');
  if (weekScrollEl && headerColsEl) {
    weekScrollEl.onscroll = () => { headerColsEl.style.transform = 'translateX(' + (-weekScrollEl.scrollLeft) + 'px)'; };
  }

  visibleDias.forEach(d => {
    getCalendarBlocks(d.id).forEach(b => {
      const el = document.getElementById('wb-' + b.id);
      attachWeekBlockDrag(el, b, d.id);
    });
  });

  // Click en espacio vacío → nuevo pendiente en ese horario (como Google Calendar)
  document.querySelectorAll('.week-col-body').forEach(body => {
    body.addEventListener('click', (e) => {
      if (e.target.closest('.week-block') || e.target.closest('.cal-resize-handle')) return;
      const col = body.closest('.week-col');
      if (!col) return;
      const diaId = col.dataset.dia;
      const rect = body.getBoundingClientRect();
      const relY = e.clientY - rect.top + body.scrollTop;
      const minuto = Math.round(relY / px / 15) * 15;
      const hhmm = minToHHMM(Math.min(minuto, 1420));
      const fmtSig = minToHHMM(Math.min(minuto + 60, 1440));
      abrirElegirTipoNuevo(diaId, hhmm, fmtSig);
    });
  });

  const scrollEl = document.getElementById('weekScroll');
  const activeCol = scrollEl.querySelector(`.week-col[data-dia="${currentDiaId}"]`);
  if (activeCol) {
    const r = activeCol.getBoundingClientRect();
    const sr = scrollEl.getBoundingClientRect();
    if (r.left < sr.left + 50) scrollEl.scrollLeft -= (sr.left + 50 - r.left);
    else if (r.right > sr.right) scrollEl.scrollLeft += (r.right - sr.right) + 8;
  }
  if (_scrollTopPrevio !== null) {
    scrollEl.scrollTop = _scrollTopPrevio;
  } else {
    const isAnyToday = visibleDias.some(d => d.fecha === hoy);
    scrollEl.scrollTop = (isAnyToday ? Math.max(0, now_minutes() - 120) : 6 * 60) * px;
  }
}

function weekBlockHtml(b, px) {
  const top = b.ini * px, height = Math.max(20, (b.fin - b.ini) * px);
  const totalCols = b._totalCols || 1;
  const col = b._col || 0;
  const widthPct = 100 / totalCols;
  const leftPct = col * widthPct;
  const notaTxt = (height > 38) ? (b.notaPrevia ? `<div class="cbnota">📌 ${escHtml(b.notaPrevia)}</div>` : (b.sugerenciasIA ? `<div class="cbnota">✨ ${escHtml(b.sugerenciasIA)}</div>` : '')) : '';
  return `<div class="cal-block ${b.kind}${b.esComida ? ' comida' : ''}${b.esPrioritaria ? ' prioritaria' : ''}${b.esRealizado ? ' realizado' : ''} week-block" id="wb-${b.id}" style="top:${top}px;height:${height}px;left:${leftPct}%;right:auto;width:calc(${widthPct}% - 3px)">
    <div class="cal-resize-handle top"></div>
    <div class="cbtitle">${escHtml(b.title)}</div>
    <div class="cbtime">${minToHHMM(b.ini)}–${minToHHMM(b.fin)}</div>
    ${notaTxt}
    <div class="cal-resize-handle bottom"></div>
  </div>`;
}

// Arrastrar/redimensionar bloques en la vista semanal (puede cambiar de día)
function attachWeekBlockDrag(el, b, diaId) {
  if (!el) return;
  const topHandle = el.querySelector('.cal-resize-handle.top');
  const bottomHandle = el.querySelector('.cal-resize-handle.bottom');
  el.addEventListener('pointerdown', (e) => {
    if (dragBloqueado) return;

    // Determinar si este bloque tiene duración bloqueada
    let resizeBloqueado = !!b.duracionBloqueada;
    // La duración de un transporte no se ajusta arrastrando (con o sin horario fijo): se edita en el formulario
    if (b.kind === 'transporte') resizeBloqueado = true;

    if ((e.target === topHandle || e.target === bottomHandle) && resizeBloqueado) {
      showToast('Duración bloqueada. Edita el evento para cambiarla.');
      return;
    }
    if (e.target === topHandle) return startResize(e, b, el, 'top');
    if (e.target === bottomHandle) return startResize(e, b, el, 'bottom');
    startWeekMove(e, b, el, diaId);
  });
  el.addEventListener('click', (e) => {
    if (_bloqueRecienMovidoId === b.id) return; // click fantasma justo después de soltar el arrastre
    if (b.kind === 'transporte') {
      // Transporte: click simple abre directo la misma vista que la tarjeta de la barra lateral
      abrirVisor(b.kind, b.id);
    } else if (b.kind === 'eventoActividad') {
      if (dragBloqueado) abrirVisorEvento(b.eventoId, b.id);
    } else {
      if (dragBloqueado) abrirVisor(b.kind, b.id);
    }
  });
}

// Mantener presionado ~2.2s "arma" el arrastre (con una franja que se va llenando como aviso);
// soltar antes de eso, o moverse mucho antes de que termine de llenarse, cancela sin mover nada
// (y si fue un toque simple, abre el detalle, igual que antes). Recién armado sigue al dedo, y al
// soltar no se guarda directo: aparece un ✓/✗ para confirmar o volver a su lugar.
function startWeekMove(e, b, el, origDiaId) {
  e.preventDefault();
  const startY = e.clientY, startX = e.clientX;
  const origIni = b.ini, dur = b.fin - b.ini;
  const HOLD_MS = 1600;

  const fill = document.createElement('div');
  fill.className = 'drag-arm-fill';
  el.appendChild(fill);
  requestAnimationFrame(() => { fill.style.width = '100%'; });

  let rect0 = null;
  const armTimer = setTimeout(() => {
    document.removeEventListener('pointermove', onArmandoMove);
    document.removeEventListener('pointerup', onArmandoUp);
    fill.remove();
    el.classList.add('dragging');
    el.setPointerCapture(e.pointerId);
    // v57: pasa a position:fixed (coordenadas de pantalla) para poder seguir al dedo también
    // de lado a lado — antes solo se movía verticalmente DENTRO de su columna de origen, así
    // que cambiar de día quedaba invisible mientras arrastrabas (recién se notaba al soltar).
    rect0 = el.getBoundingClientRect();
    el.style.position = 'fixed';
    el.style.left = rect0.left + 'px';
    el.style.width = rect0.width + 'px';
    el.style.right = 'auto';
    el.style.zIndex = 3000;
    document.addEventListener('pointermove', onMove);
    document.addEventListener('pointerup', onUp);
  }, HOLD_MS);

  function cancelarArmado() {
    clearTimeout(armTimer);
    fill.remove();
    document.removeEventListener('pointermove', onArmandoMove);
    document.removeEventListener('pointerup', onArmandoUp);
  }
  function onArmandoMove(ev) {
    if (Math.abs(ev.clientY - startY) > 10 || Math.abs(ev.clientX - startX) > 10) cancelarArmado();
  }
  function onArmandoUp() {
    cancelarArmado();
    openBlockDetail(b); // se soltó antes de armarse: toque simple, igual que antes abre el detalle
  }
  document.addEventListener('pointermove', onArmandoMove);
  document.addEventListener('pointerup', onArmandoUp);

  function onMove(ev) {
    const px = pxPerMin();
    const dy = (ev.clientY - startY) / px;
    const newIni = Math.max(0, Math.min(1439 - dur, snap15(origIni + dy)));
    el.querySelector('.cbtime').textContent = `${minToHHMM(newIni)}–${minToHHMM(newIni + dur)}`;
    document.querySelectorAll('.week-col').forEach(c => c.classList.remove('drop-target'));
    const dz = document.getElementById('poolDespuesZone');
    const shz = document.getElementById('poolSinHoraZone');
    if (dz) dz.style.background = '';
    if (shz) shz.style.background = '';
    hideDragPreview();

    const col = elFrom(ev, '.week-col');
    const body = col ? col.querySelector('.week-col-body') : null;
    if (body) {
      // Encaja de verdad en la columna del día que estás tocando (no solo un aviso aparte).
      const bRect = body.getBoundingClientRect();
      el.style.left = (bRect.left + 2) + 'px';
      el.style.width = (bRect.width - 4) + 'px';
      el.style.top = (bRect.top + newIni * px) + 'px';
    } else {
      // Fuera de cualquier columna (p.ej. sobre el panel lateral): sigue al dedo tal cual.
      el.style.left = (rect0.left + (ev.clientX - startX)) + 'px';
      el.style.top = (rect0.top + (ev.clientY - startY)) + 'px';
    }

    if (elFrom(ev, '#poolDespuesZone')) { if (dz) dz.style.background = 'var(--ok-light)'; return; }
    if (elFrom(ev, '#poolSinHoraZone')) { if (shz) shz.style.background = 'var(--ok-light)'; return; }
    if (col) col.classList.add('drop-target');
  }
  function onUp(ev) {
    el.releasePointerCapture(e.pointerId);
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.querySelectorAll('.week-col').forEach(c => c.classList.remove('drop-target'));
    hideDragPreview();
    const dz = document.getElementById('poolDespuesZone');
    const shz = document.getElementById('poolSinHoraZone');
    if (dz) dz.style.background = '';
    if (shz) shz.style.background = '';

    const aPoolDespues = !!elFrom(ev, '#poolDespuesZone');
    const aPoolSinHora = !!elFrom(ev, '#poolSinHoraZone');
    const dy = (ev.clientY - startY) / pxPerMin();
    const newIni = Math.max(0, Math.min(1439 - dur, snap15(origIni + dy)));
    const col = elFrom(ev, '.week-col');
    const newDiaId = col ? col.dataset.dia : origDiaId;

    if (!aPoolDespues && !aPoolSinHora && newIni === origIni && newDiaId === origDiaId) {
      el.classList.remove('dragging'); // se armó pero no se movió a ningún lado: no hay nada que confirmar
      return;
    }
    mostrarConfirmarDrop(el,
      () => {
        if (aPoolDespues) return unscheduleBlock(b, true);
        if (aPoolSinHora) return unscheduleBlock(b, false);
        persistBlockTime(b, newIni, newIni + dur, newDiaId !== origDiaId ? newDiaId : undefined);
      },
      () => renderSemana()
    );
  }
}
function mostrarConfirmarDrop(el, onOk, onCancel) {
  document.querySelectorAll('.drop-confirm').forEach(p => p.remove());
  const pill = document.createElement('div');
  pill.className = 'drop-confirm';
  pill.innerHTML = `<button type="button" class="ok" title="Dejar acá">✓</button><button type="button" class="cancel" title="Volver a su lugar">✗</button>`;
  // Aparte en el body (no adentro del bloque) porque el bloque tiene overflow:hidden y se recortaba.
  document.body.appendChild(pill);
  const r = el.getBoundingClientRect();
  pill.style.left = (r.left + r.width / 2) + 'px';
  pill.style.top = Math.min(window.innerHeight - 40, r.bottom + 6) + 'px';
  // Mientras el pill espera confirmación, el bloque de abajo sigue siendo un área clickeable
  // grande (mucho más grande que el pill) — un clic que no cae justo en ✓/✗ le llega al bloque
  // y le abre el visor en vez de confirmar el movimiento. Se lo desactiva hasta que se resuelva.
  el.style.pointerEvents = 'none';
  const limpiar = () => { pill.remove(); el.classList.remove('dragging'); el.style.pointerEvents = ''; };
  const timer = setTimeout(() => { limpiar(); onCancel(); }, 8000);
  pill.querySelector('.ok').addEventListener('click', (ev) => { ev.stopPropagation(); clearTimeout(timer); limpiar(); onOk(); });
  pill.querySelector('.cancel').addEventListener('click', (ev) => { ev.stopPropagation(); clearTimeout(timer); limpiar(); onCancel(); });
}

function navSemana(dir) {
  const dias = diasFiltrados();
  weekStartIdx = Math.max(0, Math.min(dias.length - 1, weekStartIdx + dir));
  if (dias[weekStartIdx]) currentDiaId = dias[weekStartIdx].id;
  renderSpine(); renderItinerario();
}
function adjustWeekCount(dir) { weekDayCount = Math.max(1, Math.min(7, weekDayCount + dir)); try { localStorage.setItem('itin_dias', weekDayCount); } catch(e) {} renderSemana(); }
function setWeekDayCount(n) { weekDayCount = Math.max(1, Math.min(7, Number(n))); try { localStorage.setItem('itin_dias', weekDayCount); } catch(e) {} renderSemana(); }

// ── Autocompletar direcciones (Nominatim, gratis) ─────────────
let acTimer;
let acResults = {};
function attachAutocomplete(inputId, listId, latHiddenId, lngHiddenId, coordsTxtId) {
  const input = document.getElementById(inputId);
  const list = document.getElementById(listId);
  input.addEventListener('input', () => {
    clearTimeout(acTimer);
    const q = input.value.trim();
    if (q.length < 3) { list.classList.remove('show'); return; }
    acTimer = setTimeout(async () => {
      try {
        const r = await fetch(`${NOMINATIM}?format=json&q=${encodeURIComponent(q)}&limit=5`, { headers: { 'Accept-Language': 'es' } });
        const data = await r.json();
        acResults[listId] = data;
        if (!data.length) { list.classList.remove('show'); return; }
        list.innerHTML = data.map((d, i) => `<div data-idx="${i}">${escHtml(d.display_name)}</div>`).join('');
        list.classList.add('show');
      } catch (e) { /* silencioso */ }
    }, 450);
  });
  list.addEventListener('click', (e) => {
    const item = e.target.closest('div[data-idx]'); if (!item) return;
    const d = (acResults[listId] || [])[Number(item.dataset.idx)]; if (!d) return;
    document.getElementById(inputId).value = d.display_name;
    document.getElementById(latHiddenId).value = d.lat;
    document.getElementById(lngHiddenId).value = d.lon;
    const coordsEl = coordsTxtId && document.getElementById(coordsTxtId);
    if (coordsEl) coordsEl.textContent = `${d.lat}, ${d.lon}`;
    list.classList.remove('show');
  });
  input.addEventListener('blur', () => setTimeout(() => list.classList.remove('show'), 200));
}

// v58: "📍 Ubicar en mapa" — la IA/el buscador de direcciones deja las coordenadas
// "aproximadas" (el punto que Nominatim asocia a ese texto, no necesariamente la entrada exacta
// del lugar); esto abre un mapa para arrastrar el pin al punto exacto y corregir lat/lng a mano.
// Si direccionId viene y está vacío, también intenta rellenarlo con geocodificación inversa
// (best-effort — si falla o no hay direccionId, no pasa nada, solo quedan las coordenadas).
let _mapaPickerLeaflet = null, _mapaPickerMarker = null;
function abrirMapaPicker(latId, lngId, direccionId, coordsTxtId) {
  const latEl = document.getElementById(latId), lngEl = document.getElementById(lngId);
  if (!latEl || !lngEl) return;
  const latIni = parseFloat(latEl.value) || 26.2124; // fallback: Naha, Okinawa
  const lngIni = parseFloat(lngEl.value) || 127.6809;
  const ov = document.createElement('div');
  ov.id = 'mapaPickerOverlay';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10000;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = `<div style="background:var(--paper);border-radius:12px;padding:14px;max-width:480px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)">
    <div style="font-weight:700;font-size:14px;margin-bottom:4px">📍 Ubicar en el mapa</div>
    <div style="font-size:11px;color:var(--ink-3);margin-bottom:8px">Toca el mapa o arrastra el pin al lugar exacto.</div>
    <div id="mapaPickerMap" style="height:320px;border-radius:8px;overflow:hidden;border:1px solid var(--line)"></div>
    <div id="mapaPickerCoords" style="font-size:11px;color:var(--ink-3);margin-top:6px;font-family:monospace"></div>
    <div style="display:flex;gap:8px;margin-top:10px">
      <button type="button" class="btn-cancel" style="flex:1" id="mpCancelar">Cancelar</button>
      <button type="button" class="btn-save" style="flex:1" id="mpConfirmar">Confirmar ubicación</button>
    </div>
  </div>`;
  document.body.appendChild(ov);
  const actualizarTxt = (lat, lng) => { const el = document.getElementById('mapaPickerCoords'); if (el) el.textContent = `${lat.toFixed(6)}, ${lng.toFixed(6)}`; };
  setTimeout(() => {
    _mapaPickerLeaflet = L.map('mapaPickerMap').setView([latIni, lngIni], 15);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(_mapaPickerLeaflet);
    _mapaPickerMarker = L.marker([latIni, lngIni], { draggable: true }).addTo(_mapaPickerLeaflet);
    actualizarTxt(latIni, lngIni);
    _mapaPickerMarker.on('dragend', () => { const p = _mapaPickerMarker.getLatLng(); actualizarTxt(p.lat, p.lng); });
    _mapaPickerLeaflet.on('click', (e) => { _mapaPickerMarker.setLatLng(e.latlng); actualizarTxt(e.latlng.lat, e.latlng.lng); });
  }, 50);
  const cerrar = () => {
    if (_mapaPickerLeaflet) { _mapaPickerLeaflet.remove(); _mapaPickerLeaflet = null; _mapaPickerMarker = null; }
    ov.remove();
  };
  ov.addEventListener('click', e => { if (e.target === ov) cerrar(); });
  ov.querySelector('#mpCancelar').addEventListener('click', cerrar);
  ov.querySelector('#mpConfirmar').addEventListener('click', async () => {
    const p = _mapaPickerMarker.getLatLng();
    latEl.value = p.lat.toFixed(6);
    lngEl.value = p.lng.toFixed(6);
    const coordsTxtEl = coordsTxtId && document.getElementById(coordsTxtId);
    if (coordsTxtEl) coordsTxtEl.textContent = `${latEl.value}, ${lngEl.value}`;
    cerrar();
    showToast('📍 Ubicación actualizada');
    const dirEl = direccionId && document.getElementById(direccionId);
    // v58: si ya había una dirección escrita, se pregunta antes de tocarla — el pin puede estar
    // bien sin que el texto de la dirección coincida exacto (o al revés), así que no se pisa sola.
    const debeActualizarDireccion = dirEl && (!dirEl.value.trim() || confirm('¿También actualizar el texto de la dirección con este punto del mapa?'));
    if (debeActualizarDireccion) {
      try {
        const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${p.lat}&lon=${p.lng}`, { headers: { 'Accept-Language': 'es' } });
        const d = await r.json();
        if (d && d.display_name) { dirEl.value = d.display_name; showToast('📍 Ubicación y dirección actualizadas'); }
      } catch (e) { /* silencioso — ya quedaron las coordenadas, la dirección se puede llenar a mano */ }
    }
  });
}

async function sugerirUbicacionPara(tipo, inputId, listId, latId, lngId, notasId, nombreId, duracionId) {

function mostrarSugerenciasUbicacion(sugerencias, inputId, listId, latId, lngId, notasId, nombreId, duracionId) {
  const list = document.getElementById(listId);
  list.innerHTML = sugerencias.map((s, i) => `<div data-sg="${i}"><b>${escHtml(s.nombre)}</b>${s.motivo ? `<br><span style="color:var(--ink-3)">${escHtml(s.motivo)}${s.duracionMin ? ' · ~' + formatDuracion(s.duracionMin) : ''}</span>` : ''}</div>`).join('');

    const item = e.target.closest('[data-sg]'); if (!item) return;
    const s = sugerencias[Number(item.dataset.sg)];
    const input = document.getElementById(inputId);
    input.value = s.nombre;
    if (nombreId) { const nEl = document.getElementById(nombreId); if (nEl && !nEl.value.trim()) nEl.value = s.nombre; }

    input.dispatchEvent(new Event('input'));
    input.focus();
  };

function chatResize(e, edge) {
  e.preventDefault(); e.stopPropagation();
  const panel = document.querySelector('.chat-panel');
  const startX = e.clientX, startY = e.clientY;
  const rect = panel.getBoundingClientRect();
  const startW = rect.width, startH = rect.height;
  const startRight = window.innerWidth - rect.right;
  const startBottom = window.innerHeight - rect.bottom;
  const startLeft = rect.left;
  panel.setPointerCapture(e.pointerId);
  const onMove = (ev) => {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (edge.includes('r')) panel.style.width = Math.max(280, startW + dx) + 'px';
    if (edge.includes('l')) { const w = Math.max(280, startW - dx); panel.style.width = w + 'px'; panel.style.right = 'auto'; panel.style.left = Math.min(startLeft + dx, window.innerWidth - 280) + 'px'; }
    if (edge.includes('b')) panel.style.height = Math.max(200, startH + dy) + 'px';
    if (edge.includes('t')) { const h = Math.max(200, startH - dy); panel.style.height = h + 'px'; panel.style.bottom = 'auto'; panel.style.top = Math.min(rect.top + dy, window.innerHeight - 200) + 'px'; }
    panel.style.animation = 'none';
  };
  const onUp = () => { panel.removeEventListener('pointermove', onMove); panel.removeEventListener('pointerup', onUp); };
  panel.addEventListener('pointermove', onMove);
  panel.addEventListener('pointerup', onUp);
}

function initChatDrag() {
  const panel = document.querySelector('.chat-panel');
  const head = panel ? panel.querySelector('.chat-head') : null;
  if (!head || head._dragWired) return;
  head._dragWired = true;
  let startX, startY, startLeft, startBottom;
  head.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return; // no interferir con botones
    e.preventDefault();
    const rect = panel.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    startLeft = rect.left; startBottom = window.innerHeight - rect.bottom;
    head.setPointerCapture(e.pointerId);
    panel.style.animation = 'none';
    panel.style.transition = 'none';
  });
  head.addEventListener('pointermove', (e) => {
    if (e.buttons === 0) return;
    const dx = e.clientX - startX, dy = e.clientY - startY;
    const newLeft = Math.max(0, Math.min(window.innerWidth - panel.offsetWidth, startLeft + dx));
    const newBottom = Math.max(0, Math.min(window.innerHeight - panel.offsetHeight, startBottom - dy));
    panel.style.left = newLeft + 'px';
    panel.style.right = 'auto';
    panel.style.bottom = newBottom + 'px';
    panel.style.top = 'auto';
  });
}

function appendChatBubble(role, text, id, destacado, imagenUrl, htmlGuardado) {
  const body = document.getElementById('chatBody');
  const wrap = document.createElement('div');
  wrap.className = `cmsg-wrap ${role}`;
  if (id) wrap.dataset.id = id;
  const botones = id ? `
    <div style="display:flex; flex-direction:column; gap:2px">
      <button class="cmsg-star ${destacado ? 'on' : ''}" onclick="toggleDestacadoChat('${id}', this)" title="Resaltar mensaje">⭐</button>
      <button class="cmsg-star" onclick="copiarMensajeChat('${id}')" title="Copiar texto">📋</button>
      <button class="cmsg-star" onclick="eliminarMensajeChatUI('${id}', this)" title="Eliminar mensaje">🗑</button>
    </div>` : '';
  const contenidoHtml = htmlGuardado || formatoChatMsg(text);
  wrap.innerHTML = `<div class="cmsg ${role} ${destacado ? 'destacado' : ''}" id="${id ? 'cmsg-' + id : ''}">${contenidoHtml}${imagenUrl ? `<img class="cmsg-img" src="${imagenUrl}">` : ''}</div>${botones}`;
  body.appendChild(wrap); body.scrollTop = body.scrollHeight;
  return wrap;
}

async function toggleDestacadoChat(id, btnEl) {

  btnEl.classList.toggle('on', on);

  if (bubble) bubble.classList.toggle('destacado', on);
  await postGAS({ action: 'marcarDestacadoChat', id, destacado: on });
}

function copiarMensajeChat(id) {
  const el = document.getElementById('cmsg-' + id);
  if (!el) return;
  // Texto sin tags HTML
  const texto = (el.innerText || el.textContent || '').trim();
  // Método 1: selección + execCommand (funciona en todos los móviles, incluso sin HTTPS en algunos)
  const rango = document.createRange();
  rango.selectNodeContents(el);
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(rango);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e) {}
  sel.removeAllRanges();
  if (ok) { showToast('Copiado ✦'); return; }
  // Método 2: textarea auxiliar (fallback universal)
  const ta = document.createElement('textarea');
  ta.value = texto;
  ta.style.cssText = 'position:fixed;top:-9999px;left:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); showToast('Copiado ✦'); } catch(e) { showToast('No se pudo copiar'); }
  document.body.removeChild(ta);
}
async function eliminarMensajeChatUI(id, btnEl) {

  const wrap = btnEl.closest('.cmsg-wrap');
  if (wrap) wrap.remove();
  chatConversation = chatConversation.filter(m => m.id !== id);
  await postGAS({ action: 'eliminarMensajeChat', id });
}

// ── Resaltar texto seleccionado dentro de un mensaje (se guarda) ──
function setupChatHighlighting() {
  const body = document.getElementById('chatBody');
  if (body._hlWired) return;
  body._hlWired = true;
  let activeBtn = null;
  function quitarBoton() { if (activeBtn) { activeBtn.remove(); activeBtn = null; } }
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('.chat-hl-btn')) quitarBoton(); });
  body.addEventListener('mouseup', () => {
    quitarBoton();
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) return;
    const range = sel.getRangeAt(0);
    let nodo = range.commonAncestorContainer;
    if (nodo.nodeType !== 1) nodo = nodo.parentElement;
    const cmsg = nodo ? nodo.closest('.cmsg') : null;
    if (!cmsg || !cmsg.id) return;
    const rect = range.getBoundingClientRect();
    if (!rect.width && !rect.height) return;
    const btn = document.createElement('button');
    btn.className = 'chat-hl-btn';
    btn.textContent = '🖍 Resaltar';
    btn.style.cssText = `position:fixed; left:${rect.left + rect.width / 2 - 38}px; top:${rect.top - 34}px; z-index:2100; background:var(--ink); color:#fff; border:none; border-radius:8px; padding:5px 9px; font-size:11.5px; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.25);`;
    btn.onmousedown = (ev) => {
      ev.preventDefault();
      aplicarResaltadoChat(range, cmsg);
      sel.removeAllRanges();
      quitarBoton();
    };
    document.body.appendChild(btn);
    activeBtn = btn;
  });
}
function aplicarResaltadoChat(range, cmsg) {
  const mark = document.createElement('mark');
  mark.className = 'chat-hl';
  try {
    range.surroundContents(mark);
  } catch (e) {
    try { mark.appendChild(range.extractContents()); range.insertNode(mark); } catch (e2) { return; }
  }
  const id = cmsg.id.replace('cmsg-', '');
  postGAS({ action: 'guardarHtmlMensajeChat', id, html: cmsg.innerHTML });
}

// Botón fijo (sirve en celular, donde el menú nativo de copiar/pegar tapa el botón flotante)
function resaltarSeleccionActual() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { showToast('Selecciona texto de un mensaje primero'); return; }
  const range = sel.getRangeAt(0);
  let nodo = range.commonAncestorContainer;
  if (nodo.nodeType !== 1) nodo = nodo.parentElement;
  const cmsg = nodo ? nodo.closest('.cmsg') : null;
  if (!cmsg || !cmsg.id) { showToast('Selecciona texto dentro de un mensaje'); return; }
  aplicarResaltadoChat(range, cmsg);
  sel.removeAllRanges();
}

function asignarIdMensajeChat(wrap, id) {
  if (!wrap || !id) return;

async function sendMainChat() {
  const input = document.getElementById('chatInputMain');
  const msg = input.value.trim();
  const imagen = chatImagenBase64Pendiente;
  if (!msg && !imagen) return;
  input.value = '';
  const textoMostrado = msg || '(imagen adjunta)';
  const wrapUsuario = appendChatBubble('user', textoMostrado, null, false, imagen);
  chatConversation.push({ role: 'user', content: textoMostrado });
  quitarImagenChat();

  // Subir imagen a Drive si hay una adjunta (para persistirla en el historial)
  let imagenUrl = '';
  if (imagen) {
    postGAS({ action: 'subirFoto', base64: imagen, nombre: 'chat_' + Date.now() + '.jpg' }).then(ri => {
      if (ri && ri.ok) imagenUrl = ri.url;
    });
  }

  postGAS({ action: 'guardarMensajeChat', proyecto: currentProyecto, role: 'user', contenido: textoMostrado, imagenUrl }).then(rg => {
    if (rg && rg.ok) { asignarIdMensajeChat(wrapUsuario, rg.id); chatConversation[chatConversation.length - 1].id = rg.id; }
  });
  appendChatBubble('ai', '…');

  const r = await postGAS({ action: 'chatIA', conversacion: chatConversation, proyectoActivo: currentProyecto, diaActivo: currentDiaId, imagenBase64: imagen });
  document.getElementById('chatBody').lastChild.remove();

  if (r.ok) { 
    const wrapIA = appendChatBubble('ai', r.texto); 
    chatConversation.push({ role: 'assistant', content: r.texto }); 
    postGAS({ action: 'guardarMensajeChat', proyecto: currentProyecto, role: 'assistant', contenido: r.texto }).then(rg => {
      if (rg && rg.ok) { asignarIdMensajeChat(wrapIA, rg.id); chatConversation[chatConversation.length - 1].id = rg.id; }
    });
    if (r.modificado) {
        showToast('✨ Itinerario actualizado por la IA');
        await loadItinerario(); // Recarga la pantalla para mostrar lo nuevo
    }
  } else {
    appendChatBubble('ai', 'Tuve un problema respondiendo: ' + (r.error || ''));
  }
}

// v57: evita que un doble-toque en "Guardar" (frecuente con internet lenta, viajando) mande la
// misma acción dos veces y cree el registro duplicado — deshabilita el botón mientras la llamada
// sigue en curso. Se usa como guardia al inicio de cada guardarX() y se libera con guardarBtnLock(false).
function guardarBtnLock(activar) {
  const btn = document.querySelector('#modalBox .btn-save');
  if (!btn) return true;
  if (activar) {
    if (btn.disabled) return false; // ya había una llamada en curso — no dejar que siga
    btn.disabled = true;
    if (btn.dataset.textoOriginal === undefined) btn.dataset.textoOriginal = btn.textContent;
    btn.textContent = 'Guardando…';
  } else {
    btn.disabled = false;
    if (btn.dataset.textoOriginal !== undefined) btn.textContent = btn.dataset.textoOriginal;
  }
  return true;
}

function modalOpen(html) {
