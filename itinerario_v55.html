async function guardarRenombreProyecto() {
  const proyectoOrig = _proyectoEnEdicion || currentProyecto;
  const nuevoNombre = document.getElementById('fProyEditNombre').value.trim();
  if (!nuevoNombre || nuevoNombre === proyectoOrig) return;
  showToast('Renombrando viaje...');
  const r = await postGAS({ action: 'renombrarProyecto', viejo: proyectoOrig, nuevo: nuevoNombre });
  if (r.ok) {
    showToast('Viaje renombrado ✦');
    if (currentProyecto === proyectoOrig) currentProyecto = nuevoNombre;
    modalClose();
    await loadItinerario();
  } else showToast(r.error || 'Error al renombrar');
}

async function guardarRangoDiasProyecto() {
  if (!navigator.onLine) { showToast('🔌 Necesitás conexión para agregar días nuevos'); return; }
  const proyecto = _proyectoEnEdicion || currentProyecto;
  const fechaInicio = document.getElementById('fProyRangoInicio').value;
  const fechaFin = document.getElementById('fProyRangoFin').value || fechaInicio;
  if (!fechaInicio) { showToast('Pon al menos la fecha "Desde"'); return; }
  const zona = document.getElementById('fProyRangoZona').value.trim();
  showToast('Agregando días…');
  const r = await postGAS({ action: 'agregarRangoDias', proyecto, fechaInicio, fechaFin, zona });
  if (r.ok) {
    modalClose();
    showToast(r.agregados ? `${r.agregados} día(s) agregado(s) ✦` : 'Esas fechas ya existían, no se agregó nada nuevo');
    await loadItinerario();
  } else showToast(r.error || 'Error al agregar días');
}


function selectDay(id) {
  const enMapa = document.getElementById('viewMapa').style.display !== 'none';
  const enTabla = document.getElementById('viewTabla').style.display !== 'none';
  if (enMapa) {
    mapaFoco = null;
    currentDiaId = id;
    if (mapaVistaModo === 'multi') {
      // Vista "Más de un día": el clic suma/quita ese día de la selección.
      if (mapaDiasSel.has(id)) mapaDiasSel.delete(id); else mapaDiasSel.add(id);
      if (!mapaDiasSel.size) mapaVistaModo = 'todos'; // nada seleccionado = volver a "Todos"
    } else {
      // Vista "Por día" (o veníamos de "Todos"): el clic filtra a ese único día.
      mapaVistaModo = 'dia';
      mapaDiasSel = new Set([id]);
    }
    syncVistaRadios();
    renderMapaGeneral();
    renderSpine();
    return;
  }
  if (enTabla) {
    currentDiaId = id;
    if (tablaVistaModo === 'multi') {
      if (tablaDiasSel.has(id)) tablaDiasSel.delete(id); else tablaDiasSel.add(id);
      if (!tablaDiasSel.size) tablaVistaModo = 'todos';
    } else {
      tablaVistaModo = 'dia';
      tablaDiasSel = new Set([id]);
    }
    syncTablaVistaRadios();
    renderTabla();
    renderSpine();
    return;
  }
  currentDiaId = id;
  const dias = diasFiltrados();
  const idx = dias.findIndex(d => d.id === id);
  if (idx >= 0 && (idx < weekStartIdx || idx >= weekStartIdx + weekDayCount)) weekStartIdx = idx;
  renderSpine(); renderItinerario();
}

// ── Helpers de relación ─────────────────────────────────────
// Lista de hospedajes ordenada tal como se muestra en el panel: primero los que cubren diaId
// (respetando su orden guardado entre ellos), luego el resto (respetando su orden guardado).
function hospedajeOrdenParaDia(diaId) {
  const dias = diasFiltrados();
  const idx = dias.findIndex(d => d.id === diaId);
  const idxDeDia = (id) => { const i = dias.findIndex(d => d.id === id); return i < 0 ? Infinity : i; };
  // Orden: primero los elegidos (⭐), luego por fecha de check-in, y por último el orden manual.
  const todosHosp = itinerario.hospedaje.filter(h => (h.proyecto || currentProyecto) === currentProyecto || true).sort((a, b) => {
    if (!!b.elegido !== !!a.elegido) return (b.elegido ? 1 : 0) - (a.elegido ? 1 : 0);
    const fa = idxDeDia(a.diaIdInicio), fb = idxDeDia(b.diaIdInicio);
    if (fa !== fb) return fa - fb;
    return (a.orden || 0) - (b.orden || 0);
  });
  // Comparar por POSICIÓN en la lista ordenada por fecha, no por el id (los ids son timestamps de creación,
  // no de fecha del viaje — un día agregado después puede tener un id "mayor" aunque sea cronológicamente antes).
  const hospDelDia = idx < 0 ? [] : todosHosp.filter(h => {
    const i1 = dias.findIndex(d => d.id === h.diaIdInicio);
    const i2 = dias.findIndex(d => d.id === h.diaIdFin);
    if (i1 < 0) return false;
    const fin = i2 < 0 ? i1 : i2;
    return idx >= i1 && idx <= fin;
  });
  const hospSorted = [
    ...todosHosp.filter(h => hospDelDia.some(x=>x.id===h.id)),
    ...todosHosp.filter(h => !hospDelDia.some(x=>x.id===h.id))
  ];
  return { todosHosp, hospDelDia, hospSorted };
}
function hospedajeDelDia(diaId) {
  const dias = diasFiltrados();
  const idx = dias.findIndex(d => d.id === diaId);
  if (idx < 0) return null;
  const candidatos = itinerario.hospedaje.filter(h => {
    const i1 = dias.findIndex(d => d.id === h.diaIdInicio);
    const i2 = dias.findIndex(d => d.id === h.diaIdFin);
    if (i1 < 0) return false;
    const fin = i2 < 0 ? i1 : i2;
    return idx >= i1 && idx <= fin;
  });
  if (!candidatos.length) return null;
  return candidatos.find(h => h.elegido) || candidatos[0];
}

// Para el encabezado del día en el calendario: puede haber hasta DOS hoteles relevantes el mismo día
// (uno saliendo, otro entrando, en un día de relevo) — a diferencia de hospedajeDelDia, que solo da uno.
// Si un rol (checkin/checkout/activo) tiene varios candidatos sin ninguno elegido, no se muestra nada
// para ese rol (evita "adivinar" cuál es, igual que el badge Candidato en la barra lateral).
function hospedajesParaHeaderDia(diaId) {
  const dias = diasFiltrados();
  const idx = dias.findIndex(d => d.id === diaId);
  if (idx < 0) return [];
  const candidatos = itinerario.hospedaje.filter(h => {
    const i1 = dias.findIndex(d => d.id === h.diaIdInicio);
    const i2 = dias.findIndex(d => d.id === h.diaIdFin);
    if (i1 < 0) return false;
    const fin = i2 < 0 ? i1 : i2;
    return idx >= i1 && idx <= fin;
  });
  if (!candidatos.length) return [];
  // Si ya hay un hospedaje elegido que se solapa con otro candidato (misma competencia de fechas),
  // el candidato no elegido pierde y no debe mostrarse — ya sabemos cuál es el real.
  const elegidosDelGrupo = candidatos.filter(h => h.elegido);
  const candidatosFiltrados = candidatos.filter(h => h.elegido || !elegidosDelGrupo.some(e => hospedajesSeSolapan(h, e)));
  const elegirDeGrupo = (grupo) => grupo.find(h => h.elegido) || null;
  const soloCheckout = candidatosFiltrados.filter(h => h.diaIdFin === diaId && h.diaIdInicio !== diaId);
  const soloCheckin = candidatosFiltrados.filter(h => h.diaIdInicio === diaId && h.diaIdFin !== diaId);
  const ambos = candidatosFiltrados.filter(h => h.diaIdInicio === diaId && h.diaIdFin === diaId);
  const activo = candidatosFiltrados.filter(h => h.diaIdInicio !== diaId && h.diaIdFin !== diaId);
  const resultado = [];
  const hCheckout = elegirDeGrupo(soloCheckout); if (hCheckout) resultado.push({ h: hCheckout, icono: '🚪🔑' });
  const hCheckin = elegirDeGrupo(soloCheckin); if (hCheckin) resultado.push({ h: hCheckin, icono: '🛎️🛏️' });
  const hAmbos = elegirDeGrupo(ambos); if (hAmbos) resultado.push({ h: hAmbos, icono: '🛎️🛏️🚪🔑' });
  // v57 fix: antes esto solo se calculaba "si resultado sigue vacío" — un hotel candidato con
  // checkin ese mismo día tapaba por completo al hotel ACTIVO de verdad (elegido), como si ya no
  // estuvieras ahí. "Activo" es un rol aparte (ni entra ni sale ese día) — siempre se calcula.
  const hActivo = elegirDeGrupo(activo);
  if (hActivo) {
    const iInicio = dias.findIndex(d => d.id === hActivo.diaIdInicio);
    const numeroDia = iInicio >= 0 ? (idx - iInicio + 1) : null;
    resultado.push({ h: hActivo, icono: '🛏️', sufijo: numeroDia ? ` (día ${numeroDia})` : '' });
  }
  return resultado;
}

// ¿Comparten al menos un día estos dos hospedajes de forma que REALMENTE compiten? (por posición
// cronológica, no por id). Un solo día compartido que es checkout de uno y checkin del otro es un
// simple relevo (te vas de uno, entras al otro) — no es competencia, ambos pueden estar elegidos.
function hospedajesSeSolapan(hA, hB) {
  const dias = diasFiltrados();
  const iA1 = dias.findIndex(d => d.id === hA.diaIdInicio);
  const iA2 = dias.findIndex(d => d.id === hA.diaIdFin);
  const iB1 = dias.findIndex(d => d.id === hB.diaIdInicio);
  const iB2 = dias.findIndex(d => d.id === hB.diaIdFin);
  if (iA1 < 0 || iB1 < 0) return false;
  const finA = iA2 < 0 ? iA1 : iA2;
  const finB = iB2 < 0 ? iB1 : iB2;
  if (iA1 > finB || iB1 > finA) return false;
  const inicioComun = Math.max(iA1, iB1), finComun = Math.min(finA, finB);
  if (finComun === inicioComun) {
    const esRelevoAaB = finA === inicioComun && iB1 === inicioComun;
    const esRelevoBaA = finB === inicioComun && iA1 === inicioComun;
    if (esRelevoAaB || esRelevoBaA) return false;
  }
  return true;
}
async function marcarHospedajeElegido(id) {
  const h0 = itinerario.hospedaje.find(h => h.id === id);
  if (!h0) return;
  const yaElegido = !!h0.elegido;
  // Solo "compite" (se desmarca) con hoteles que comparten fecha con este — un día de check-out/check-in
  // puede tener dos hoteles distintos elegidos a la vez, uno para salir y otro para entrar.
  const cambios = [];
  itinerario.hospedaje.forEach(h => {
    let val;
    if (h.id === id) val = !yaElegido;
    else if (hospedajesSeSolapan(h0, h)) val = false;
    else return;
    if (h.elegido !== val) {
      h.elegido = val;
      cambios.push({ h, val });
    }
  });
  renderPoolPanel(); renderMapaGeneral(); // feedback visual inmediato
  // v57 fix: antes esto era fire-and-forget (no se esperaba) — si justo después se disparaba
  // otra recarga (ej. editar el mismo hotel y guardar), esa recarga podía llegar antes de que el
  // cambio de estrella terminara de guardarse, y la pisaba: la estrella "no se guardaba" en
  // apariencia. Ahora se espera la confirmación del servidor antes de dar el asunto por hecho.
  const resultados = await Promise.all(cambios.map(c => postGAS({ action: 'updateHospedaje', id: c.h.id, elegido: c.val })));
  if (resultados.some(r => !r || r.ok === false)) {
    showToast('⚠️ La estrella no se guardó bien — intentá de nuevo');
    return;
  }
  showToast(yaElegido ? 'Hotel deseleccionado' : 'Hotel marcado como elegido ✓');
}

function moverHospedajeOrden(id, dir, diaId) {
  const lista = diaId ? hospedajeOrdenParaDia(diaId).hospSorted : hospedajeOrdenParaDia(null).todosHosp;
  const idx = lista.findIndex(h=>h.id===id);
  if(idx<0) return;
  const otro = dir==='up' ? idx-1 : idx+1;
  if(otro<0||otro>=lista.length) return;
  const oA=lista[idx].orden||idx, oB=lista[otro].orden||otro;
  lista[idx].orden=oB; lista[otro].orden=oA;
  renderPoolPanel();
  postGAS({ action:'updateHospedaje', id:lista[idx].id, orden:lista[idx].orden });
  postGAS({ action:'updateHospedaje', id:lista[otro].id, orden:lista[otro].orden });
}

// ── Tiempo: helpers ────────────────────────────────────────────
function pad2(n) { return String(n).padStart(2, '0'); }
// Fecha en YYYY-MM-DD usando el calendario LOCAL (toISOString() usa UTC y puede correr el día en zonas +).
function fechaLocalISO(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, '0');
  const d = String(date.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}
function hhmmToMin(hhmm) { if (!hhmm) return null; const p = hhmm.split(':'); const h = Number(p[0]), m = Number(p[1] || 0); if (isNaN(h) || isNaN(m)) return null; return h * 60 + m; }
// v58: hora "efectiva" de una actividad de evento para el calendario/mapa — la hora a la que de
// verdad voy (horaAsignada, la que se pone al arrastrarla al calendario o en "Asignar a día(s)")
// manda sobre la hora "Programada" (horaInicio/horaFin, cuándo es de verdad el evento, que puede
// durar todo el día). Si nunca se asignó una hora propia, se cae en la Programada como antes.
function sedeHoraIni(s) { return (s && (s.horaAsignada || s.horaInicio)) || ''; }
function sedeHoraFin(s) { return (s && (s.horaAsignadaFin || s.horaFin)) || ''; }
function minToHHMM(min) { min = Math.max(0, Math.min(1439, Math.round(min))); return pad2(Math.floor(min / 60)) + ':' + pad2(min % 60); }
function snap15(min) { return Math.round(min / 15) * 15; }

// ── Bloques del calendario (transporte + pendientes con hora) ──
function getCalendarBlocks(diaId) {
  const blocks = [];
  itinerario.pendientes.forEach(p => {
    if (p.diaId !== diaId) return;
    const ini = hhmmToMin(p.horaInicio), fin = hhmmToMin(p.horaFin);
    if (ini === null || fin === null) return;
    const icono = RESERVADO_ICON[p.reservado || 'pendiente'] + ' ';
    const comida = p.tipoComida ? (TIPO_COMIDA_ICON[p.tipoComida] || '') + ' ' : '';
    const estrella = p.prioritaria ? '⭐ ' : '';
    const check = p.realizado ? '✅ ' : '';
    const gasto = (gastosVinculados[p.id]||[]).some(g => !g.cotizacion) ? '💸 ' : '';
    // Orden: realizado, reservación, pago asociado, y el resto (prioritaria, comida).
    blocks.push({ id: p.id, kind: 'pendiente', esComida: !!(p.tipoComida || p.esRestaurante || p.antojo), esPrioritaria: !!p.prioritaria, esRealizado: !!p.realizado, duracionBloqueada: !!p.duracionBloqueada, notaPrevia: p.notasPrevias || '', sugerenciasIA: p.sugerenciasIA || '', title: `${check}${icono}${gasto}${estrella}${comida}` + (p.nombre || '(sin nombre)'), ini, fin: Math.max(fin, ini + 15) });
  });
  itinerario.transporte.forEach(t => {
    if (t.diaId !== diaId) return;
    if (t.ocultarMapa) return; // oculto del visor de horas y del mapa
    const idx = t.opcionElegida || 0;
    const op = (t.opciones || [])[idx];
    if (!op) return;
    const ini = hhmmToMin(op.salida), fin = hhmmToMin(op.llegada);
    if (ini === null || fin === null) return;
    const icono = RESERVADO_ICON[t.reservado || 'pendiente'] + ' ';
    const emoji = tipoEmoji(t.tipo) + ' ';
    const checkT = t.realizado ? '✅ ' : '';
    const gastoT = (gastosVinculados[t.id]||[]).some(g => !g.cotizacion) ? '💸 ' : '';
    // Orden: realizado, reservación, pago asociado, y el resto (ícono del tipo de transporte).
    blocks.push({ id: t.id, kind: 'transporte', esRealizado: !!t.realizado, title: `${checkT}${icono}${gastoT}${emoji}` + (TIPO_LABEL[t.tipo]?.split(' ').slice(1).join(' ') || t.tipo) + ': ' + (t.origen || '') + ' → ' + (t.destino || ''), ini, fin: Math.max(fin, ini + 15) });
  });
  itinerario.eventos.forEach(ev => {
    (ev.sedes || []).forEach(act => {
      if (act.diaId !== diaId) return;
      const ini = hhmmToMin(sedeHoraIni(act)), fin = hhmmToMin(sedeHoraFin(act));
      if (ini === null || fin === null) return;
      // v57: el nombre del festival va grande (título) y la actividad/sede específica va
      // abajo como nota — antes era al revés (la sede tapaba el nombre del festival si tenía
      // nombre propio, y el festival solo aparecía si la sede no tenía nombre).
      const miniEvento = (act.nombre && act.nombre !== ev.nombre) ? act.nombre : '';
      const gastoEv = (gastosVinculados[ev.id]||[]).some(g => !g.cotizacion) ? '💸 ' : '';
      blocks.push({ id: act.id, eventoId: ev.id, kind: 'eventoActividad', esRealizado: !!ev.realizado, notaPrevia: miniEvento, title: (ev.realizado ? '✅ ' : '') + gastoEv + '🎪 ' + (ev.nombre || act.nombre || '(sin nombre)'), ini, fin: Math.max(fin, ini + 15) });
    });
  });
  return blocks;
}

// Asigna columna/totalCols a cada bloque, para que los que se traslapan en horario
// se vean lado a lado (como Google Calendar) en vez de uno tapando al otro.
function calcularLayoutSolapado(blocks) {
  const ordenados = [...blocks].sort((a, b) => a.ini - b.ini || a.fin - b.fin);
  const visitado = new Set();

  ordenados.forEach((b, idx) => {
    if (visitado.has(idx)) return;
    let cluster = [idx];
    let cambiado = true;
    while (cambiado) {
      cambiado = false;
      ordenados.forEach((c, j) => {
        if (visitado.has(j) || cluster.includes(j)) return;
        const solapa = cluster.some(ci => ordenados[ci].ini < c.fin && c.ini < ordenados[ci].fin);
        if (solapa) { cluster.push(j); cambiado = true; }
      });
    }
    cluster.forEach(ci => visitado.add(ci));

    const clusterBlocks = cluster.map(ci => ordenados[ci]).sort((a, b) => a.ini - b.ini);
    const columnas = []; // hora de fin del último bloque puesto en cada columna
    clusterBlocks.forEach(b => {
      let col = columnas.findIndex(finCol => finCol <= b.ini);
      if (col === -1) { col = columnas.length; columnas.push(b.fin); }
      else columnas[col] = b.fin;
      b._col = col;
    });
    const totalCols = columnas.length;
    clusterBlocks.forEach(b => { b._totalCols = totalCols; });
  });

  return ordenados;
}

    lastAutoScrolledDia = currentDiaId;
  }
  lastRenderedPx = px;
}
function now_minutes() { const n = new Date(); return n.getHours() * 60 + n.getMinutes(); }

function blockHtml(b, px) {
  const top = b.ini * px, height = Math.max(20, (b.fin - b.ini) * px);
  return `<div class="cal-block ${b.kind}" id="cb-${b.id}" style="top:${top}px;height:${height}px" data-id="${b.id}">
    <div class="cal-resize-handle top"></div>
    <div class="cbtitle">${escHtml(b.title)}</div>
    <div class="cbtime">${minToHHMM(b.ini)}–${minToHHMM(b.fin)}</div>
    <div class="cal-resize-handle bottom"></div>
  </div>`;
}

// ── Mover / redimensionar bloques (Pointer Events: funciona en mobile y desktop) ──
function attachBlockDrag(el, b) {
  if (!el) return;
  const topHandle = el.querySelector('.cal-resize-handle.top');
  const bottomHandle = el.querySelector('.cal-resize-handle.bottom');
  el.addEventListener('pointerdown', (e) => {
    if (e.target === topHandle) return startResize(e, b, el, 'top');
    if (e.target === bottomHandle) return startResize(e, b, el, 'bottom');
    startMove(e, b, el);
  });
}

function startMove(e, b, el) {
  e.preventDefault();
  const startY = e.clientY;
  const origIni = b.ini, dur = b.fin - b.ini;
  let moved = false;
  el.setPointerCapture(e.pointerId);

  function onMove(ev) {
    const px = pxPerMin();
    const dy = (ev.clientY - startY) / px;
    if (Math.abs(dy) > 4) moved = true;
    if (!moved) return;
    el.classList.add('dragging');
    const newIni = Math.max(0, Math.min(1439 - dur, snap15(origIni + dy)));
    el.style.top = (newIni * px) + 'px';
    el.querySelector('.cbtime').textContent = `${minToHHMM(newIni)}–${minToHHMM(newIni + dur)}`;
  }
  function onUp(ev) {
    el.releasePointerCapture(e.pointerId);
    el.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (!moved) { openBlockDetail(b); return; }
    if (elFrom(ev, '#poolDespuesZone')) { unscheduleBlock(b, true); return; }
    if (elFrom(ev, '#poolSinHoraZone')) { unscheduleBlock(b, false); return; }
    const dy = (ev.clientY - startY) / pxPerMin();
    const newIni = Math.max(0, Math.min(1439 - dur, snap15(origIni + dy)));
    persistBlockTime(b, newIni, newIni + dur);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

async function unscheduleBlock(b, fullyUnassign) {
  if (b.kind === 'pendiente') {
    const p = itinerario.pendientes.find(x => x.id === b.id); if (!p) return;
    p.horaInicio = ''; p.horaFin = '';
    if (fullyUnassign) p.diaId = '';
    await postGAS({ action: 'updatePendiente', id: b.id, horaInicio: '', horaFin: '', diaId: fullyUnassign ? '' : p.diaId });
    showToast(fullyUnassign ? 'Movido a "para después" ✦' : 'Sin hora, sigue hoy ✦');
  } else if (b.kind === 'eventoActividad') {
    const ev = itinerario.eventos.find(x => x.id === b.eventoId); if (!ev) return;
    const act = (ev.sedes || []).find(x => x.id === b.id); if (!act) return;
    act.horaAsignada = ''; act.horaAsignadaFin = '';
    if (fullyUnassign) act.diaId = '';
    await postGAS({ action: 'updateEvento', id: ev.id, sedes: ev.sedes });
    showToast(fullyUnassign ? 'Movido a "para después" ✦' : 'Sin hora, sigue hoy ✦');
  } else {
    const t = itinerario.transporte.find(x => x.id === b.id); if (!t) return;
    const idx = t.opcionElegida || 0;
    if (t.opciones && t.opciones[idx]) { t.opciones[idx].salida = ''; t.opciones[idx].llegada = ''; }
    await postGAS({ action: 'updateTransporte', id: b.id, opciones: t.opciones, opcionElegida: idx });
    showToast('Transporte sin horario ✦');
  }
  renderSemana(); renderPoolPanel(); renderSpine();
}

function startResize(e, b, el, edge) {
  e.preventDefault(); e.stopPropagation();
  const startY = e.clientY;
  const origIni = b.ini, origFin = b.fin;
  el.setPointerCapture(e.pointerId);
  el.classList.add('dragging');

  function compute(ev) {
    const dy = snap15((ev.clientY - startY) / pxPerMin());
    if (edge === 'bottom') return { ini: origIni, fin: Math.max(origIni + 15, Math.min(1439, origFin + dy)) };
    return { ini: Math.max(0, Math.min(origFin - 15, origIni + dy)), fin: origFin };
  }
  function onMove(ev) {
    const px = pxPerMin();
    const { ini, fin } = compute(ev);
    el.style.top = (ini * px) + 'px';
    el.style.height = Math.max(20, (fin - ini) * px) + 'px';
    el.querySelector('.cbtime').textContent = `${minToHHMM(ini)}–${minToHHMM(fin)}`;
  }
  function onUp(ev) {
    el.releasePointerCapture(e.pointerId);
    el.classList.remove('dragging');
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    const { ini, fin } = compute(ev);
    persistBlockTime(b, ini, fin);
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

// v57 fix: justo después de soltar un bloque (sobre todo transporte), a veces el navegador
// dispara un "click" fantasma sobre el bloque recién movido — como el click de transporte abre
// el visor sin importar si el arrastre estaba bloqueado, eso hacía que se abriera la vista justo
// cuando solo se quería mover. Mientras el id esté acá, el listener de click lo ignora.
let _bloqueRecienMovidoId = null;
async function persistBlockTime(b, iniMin, finMin, diaId) {
  _bloqueRecienMovidoId = b.id;
  setTimeout(() => { if (_bloqueRecienMovidoId === b.id) _bloqueRecienMovidoId = null; }, 500);
  const horaInicio = minToHHMM(iniMin), horaFin = minToHHMM(finMin);
  let r;
  try {
    if (b.kind === 'pendiente') {
      const p = itinerario.pendientes.find(x => x.id === b.id);
      if (p) { p.horaInicio = horaInicio; p.horaFin = horaFin; if (diaId) p.diaId = diaId; }
      const body = { action: 'updatePendiente', id: b.id, horaInicio, horaFin };
      if (diaId) body.diaId = diaId;
      r = await postGAS(body);
    } else if (b.kind === 'eventoActividad') {
      const ev = itinerario.eventos.find(x => x.id === b.eventoId);
      if (!ev) return;
      const act = (ev.sedes || []).find(x => x.id === b.id);
      if (!act) return;
      act.horaAsignada = horaInicio; act.horaAsignadaFin = horaFin;
      if (diaId) act.diaId = diaId;
      r = await postGAS({ action: 'updateEvento', id: ev.id, sedes: ev.sedes });
    } else {
      const t = itinerario.transporte.find(x => x.id === b.id);
      if (!t) return;
      const idx = t.opcionElegida || 0;
      t.opciones = t.opciones && t.opciones.length ? t.opciones : [{}];
      if (!t.opciones[idx]) t.opciones[idx] = {};
      t.opciones[idx].salida = horaInicio; t.opciones[idx].llegada = horaFin;
      if (diaId) t.diaId = diaId;
      const body = { action: 'updateTransporte', id: b.id, opciones: t.opciones, opcionElegida: idx };
      if (diaId) body.diaId = diaId;
      r = await postGAS(body);
    }
  } catch (e) {
    showToast('⚠️ No se pudo guardar (sin conexión). Se restauró desde el servidor.');
    await loadItinerario();
    return;
  }
  if (!r || !r.ok) {
    showToast('⚠️ El servidor rechazó el cambio. Se restauró desde el servidor.');
    await loadItinerario();
    return;
  }
  renderSpine();
  renderSemana();
  renderPoolPanel();
}

function openBlockDetail(b) {
  if (b.kind === 'eventoActividad') { abrirVisorEvento(b.eventoId, b.id); return; }
  abrirVisor(b.kind, b.id);

// ── Panel lateral: transporte, hospedaje, pendientes sin hora ──
const POOL_KEYS = ['mapa', 'sinHora', 'despues', 'notas', 'transporte', 'hospedaje', 'recomendaciones', 'eventos', 'gastosDia'];
function getPoolOrder() {
  try {
    const saved = JSON.parse(localStorage.getItem('itin_poolOrder'));
    if (Array.isArray(saved) && saved.length === POOL_KEYS.length && POOL_KEYS.every(k => saved.includes(k))) return saved;
  } catch (e) {}
  return [...POOL_KEYS];
}
function movePoolSection(key, dir) {
  const order = getPoolOrder();
  const idx = order.indexOf(key);
  const newIdx = idx + dir;
  if (newIdx < 0 || newIdx >= order.length) return;
  [order[idx], order[newIdx]] = [order[newIdx], order[idx]];
  try { localStorage.setItem('itin_poolOrder', JSON.stringify(order)); } catch (e) {}
  renderPoolPanel();
}
function sectionArrows(key, order) {
  const idx = order.indexOf(key);
  const up = idx === 0 ? 'disabled style="opacity:.25"' : '';
  const down = idx === order.length - 1 ? 'disabled style="opacity:.25"' : '';
  return `<span style="display:inline-flex;flex-direction:column;margin-right:4px">
    <button class="icon-btn" style="font-size:9px;line-height:1;padding:1px" ${up} onclick="movePoolSection('${key}',-1)" title="Subir sección">▲</button>
    <button class="icon-btn" style="font-size:9px;line-height:1;padding:1px" ${down} onclick="movePoolSection('${key}',1)" title="Bajar sección">▼</button>
  </span>`;
}

// v57: noches que abarca un hospedaje activo — SIEMPRE recalculado en vivo de
// diaIdInicio/diaIdFin (nunca un valor guardado), para "Gastos del día" y para la notita del
// formulario de hospedaje.
function nochesDeHospedaje(h) {
  if (!h || !h.diaIdInicio || !h.diaIdFin) return 1;
  const dias = diasFiltrados();
  const i1 = dias.findIndex(d => d.id === h.diaIdInicio);
  const i2 = dias.findIndex(d => d.id === h.diaIdFin);
  if (i1 < 0 || i2 < 0 || i2 <= i1) return 1;
  return i2 - i1;
}
function eventosDelDiaFn(diaId) {
  const dias = diasFiltrados();
  const idx = dias.findIndex(d => d.id === diaId);
  if (idx < 0) return [];
  return itinerario.eventos.filter(e => {
    const i1 = dias.findIndex(d => d.id === e.diaIdInicio);
    const i2 = dias.findIndex(d => d.id === e.diaIdFin);
    if (i1 < 0) return false;
    const fin = i2 < 0 ? i1 : i2;
    return idx >= i1 && idx <= fin;
  });
}
// v57: todo lo que ya está asignado/activo ese día — para el selector "Asociar a" del formulario
// de gasto y para armar "Gastos del día".
function itemsAsignadosDelDia(diaId) {
  const pend = itinerario.pendientes.filter(p => p.diaId === diaId && (p.proyecto||'') === currentProyecto)
    .map(p => ({ tipo: 'pendiente', id: p.id, nombre: p.nombre || '(sin nombre)', icono: '📌' }));
  const trans = itinerario.transporte.filter(t => t.diaId === diaId)
    .map(t => ({ tipo: 'transporte', id: t.id, nombre: `${TIPO_LABEL[t.tipo]||t.tipo}: ${t.origen||''} → ${t.destino||''}`, icono: '🚆' }));
  const hosp = hospedajeOrdenParaDia(diaId).hospDelDia
    .map(h => ({ tipo: 'hospedaje', id: h.id, nombre: h.nombre || '(sin nombre)', icono: '🏨' }));
  const evt = eventosDelDiaFn(diaId)
    .map(e => ({ tipo: 'evento', id: e.id, nombre: e.nombre || '(sin nombre)', icono: '🎪' }));
  return [...pend, ...trans, ...hosp, ...evt];
}
// v58: lista completa de items del proyecto (sin importar el día) — para poder asociar un gasto
// a un lugar/transporte/hospedaje/evento aunque no esté programado ese día (ej. "para después"
// o programado en otro día). itemsAsignadosDelDia sigue usándose para el candidato de la IA
// (ahí sí conviene acotar al día, para no confundirla con toda la lista del viaje).
function itemsAsociablesProyecto() {
  const pend = itinerario.pendientes.filter(p => (p.proyecto||'') === currentProyecto)
    .map(p => ({ tipo: 'pendiente', id: p.id, nombre: p.nombre || '(sin nombre)', icono: '📌' }));
  const trans = itinerario.transporte
    .map(t => ({ tipo: 'transporte', id: t.id, nombre: `${TIPO_LABEL[t.tipo]||t.tipo}: ${t.origen||''} → ${t.destino||''}`, icono: '🚆' }));
  const hosp = itinerario.hospedaje
    .map(h => ({ tipo: 'hospedaje', id: h.id, nombre: h.nombre || '(sin nombre)', icono: '🏨' }));
  const evt = itinerario.eventos
    .map(e => ({ tipo: 'evento', id: e.id, nombre: e.nombre || '(sin nombre)', icono: '🎪' }));
  return { pend, trans, hosp, evt };
}
// v57: gastos que le tocan a este día en el panel lateral: los asociados explícitamente a él
// (gastosDelDia, campo "Día en itinerario") + los de cualquier item que ya se muestra ese día
// (pendiente/transporte/evento completos). El hospedaje es un caso aparte: en vez de repetir el
// gasto completo en cada día de la estadía, se reparte el total de sus gastos entre las noches
// actuales (pedido explícito del usuario — siempre recalculado en vivo, nunca un valor guardado).
function gastosDeEsteDia(diaId) {
  const lista = [];
  const vistos = new Set();
  const agregar = (g) => { if (vistos.has(g.id)) return; vistos.add(g.id); lista.push(g); };
  (gastosDelDia[diaId] || []).forEach(agregar);
  itinerario.pendientes.filter(p => p.diaId === diaId).forEach(p => (gastosVinculados[p.id]||[]).forEach(agregar));
  itinerario.transporte.filter(t => t.diaId === diaId).forEach(t => (gastosVinculados[t.id]||[]).forEach(agregar));
  // v57 fix: un evento/festival de varios días arrastraba el MISMO gasto (completo) a cada uno
  // de sus días — a diferencia del hotel, un gasto de evento (ej. comida de un día del festival)
  // no tiene sentido repartirlo entre todos los días; solo debe aparecer en el día real en que
  // se hizo (su fecha de compra), no en todo el rango del evento.
  const diaActualObj = itinerario.dias.find(d => d.id === diaId);
  eventosDelDiaFn(diaId).forEach(e => {
    const esMultiDia = e.diaIdInicio && e.diaIdFin && e.diaIdInicio !== e.diaIdFin;
    (gastosVinculados[e.id] || []).forEach(g => {
      if (esMultiDia && diaActualObj && g.fecha && g.fecha !== diaActualObj.fecha) return;
      agregar(g);
    });
  });
  // v57 fix: el día de checkout NO es una noche pagada ahí (esa noche ya se contó en el
  // checkin) — antes se usaba hospDelDia (incluye el día de checkout, para mostrarlo en el
  // calendario) y eso hacía que se sumara una noche de más en cada estadía.
  const _dias = diasFiltrados();
  const _idxHoy = _dias.findIndex(d => d.id === diaId);
  const hotelesConNocheHoy = itinerario.hospedaje.filter(h => {
    const i1 = _dias.findIndex(d => d.id === h.diaIdInicio);
    const i2 = _dias.findIndex(d => d.id === h.diaIdFin);
    if (i1 < 0 || i2 < 0) return false;
    return i2 > i1 ? (_idxHoy >= i1 && _idxHoy < i2) : (_idxHoy === i1); // i2<=i1: reserva de un solo día
  });
  hotelesConNocheHoy.forEach(h => {
    const gastosH = (gastosVinculados[h.id] || []).filter(g => !g.cotizacion);
    if (!gastosH.length) return;
    const totalH = gastosH.reduce((s,g) => s + Number(g.costo||0), 0);
    if (!totalH) return;
    const porNoche = Math.round((totalH / nochesDeHospedaje(h)) * 100) / 100;
    // Una sola línea sintética por hotel ese día (no una por cada gasto del hotel), para no
    // repetir N notas del mismo hotel — el gasto real (completo) se sigue editando desde ✏️ en
    // el hotel mismo, no desde acá.
    lista.push({
      id: 'hotelnoche-' + h.id + '-' + diaId, itemId: h.id, esHotelPorNoche: true,
      concepto: (h.nombre || 'Hotel') + ' (por noche)', costo: porNoche,
      notas: gastosH.map(g => g.notas).filter(Boolean).join(' · '),
      categoria: '🏨 Hospedaje',
      moneda: gastosH[0].moneda, cotizacion: false
    });
  });
  return lista;
}

// ── v57: Resumen imprimible del viaje (tabla día por día para PDF) ──────────
// Arma, para un día, la línea de tiempo de "qué se hizo" (pendientes, transporte, actividades de
// eventos, hospedaje elegido esa noche) ordenada por hora — sin costo todavía. Solo entra a la
// tabla del día lo que tiene día Y hora (como se ve en el visor/calendario). El hospedaje es la
// única excepción a lo de "hora" — pero solo el hotel con ⭐ elegido entra (candidatos sin
// confirmar, o transporte sin hora definida, no se meten al reporte — ni siquiera a "Para
// después", que es solo para pendientes). Lo que sí queda afuera por falta de hora (pendientes/
// actividades) se devuelve aparte, para esa sección.
function construirTimelineDia(dia) {
  const filas = [], extras = [];
  itinerario.pendientes.filter(p => p.diaId === dia.id && (p.proyecto||'') === currentProyecto).forEach(p => {
    if (!p.horaInicio) { extras.push({ nombre: p.nombre || '(sin nombre)', notas: p.notasPrevias || '' }); return; }
    filas.push({
      hora: p.horaInicio, nombre: (p.esRestaurante ? '🍴 ' : '📌 ') + (p.nombre || '(sin nombre)'),
      notas: p.notasPrevias || '', direccion: p.direccion || '',
      diario: `${p.evaluacion ? '⭐'.repeat(p.evaluacion) + ' ' : ''}${p.notasDiario || ''}`.trim(),
      iaComentario: p.sugerenciasIA || '',
      itemId: p.id, tipo: 'pendiente'
    });
  });
  itinerario.transporte.filter(t => t.diaId === dia.id).forEach(t => {
    const op = (t.opciones || [])[t.opcionElegida || 0];
    if (!(op && op.salida)) return; // sin hora de salida definida: no entra al reporte
    filas.push({
      hora: op.salida, nombre: '🚆 ' + (TIPO_LABEL[t.tipo] || t.tipo) + ': ' + (t.origen || '') + ' → ' + (t.destino || ''),
      notas: t.notas || '', direccion: [t.direccionOrigen, t.direccionDestino].filter(Boolean).join(' → '), diario: '',
      iaComentario: [t.sugerenciasIAOrigen, t.sugerenciasIADestino].filter(Boolean).join(' · '), itemId: t.id, tipo: 'transporte'
    });
  });
  eventosDelDiaFn(dia.id).forEach(ev => {
    (ev.sedes || []).filter(act => act.diaId === dia.id).forEach(act => {
      if (!sedeHoraIni(act)) { extras.push({ nombre: '🎪 ' + (act.nombre || ev.nombre || '(sin nombre)'), notas: '' }); return; }
      filas.push({
        hora: sedeHoraIni(act), nombre: '🎪 ' + (act.nombre || ev.nombre || '(sin nombre)'), notas: '',
        direccion: act.direccion || '',
        diario: `${ev.evaluacion ? '⭐'.repeat(ev.evaluacion) + ' ' : ''}${ev.notas || ''}`.trim(),
        iaComentario: ev.sugerenciasIA || '', itemId: ev.id, tipo: 'evento'
      });
    });
  });
  const _dias = diasFiltrados(); const _idxHoy = _dias.findIndex(d => d.id === dia.id);
  itinerario.hospedaje.filter(h => {
    if (!h.elegido && itinerario.hospedaje.length > 1) return false; // candidato sin confirmar: no entra
    const i1 = _dias.findIndex(d => d.id === h.diaIdInicio), i2 = _dias.findIndex(d => d.id === h.diaIdFin);
    if (i1 < 0 || i2 < 0) return false;
    return i2 > i1 ? (_idxHoy >= i1 && _idxHoy < i2) : (_idxHoy === i1);
  }).forEach(h => {
    const esCheckin = h.diaIdInicio === dia.id;
    filas.push({
      hora: esCheckin ? (h.horaCheckIn || '') : '', nombre: '🏨 ' + (h.nombre || '') + (esCheckin ? ' (check-in)' : ' (noche)'),
      notas: `${h.evaluacion ? '⭐'.repeat(h.evaluacion) + ' ' : ''}${h.notas || ''}`.trim(),
      direccion: h.direccion || '', diario: '', iaComentario: h.sugerenciasIA || '', itemId: h.id, tipo: 'hospedaje'
    });
  });
  filas.sort((a, b) => (a.hora || '99:99').localeCompare(b.hora || '99:99'));
  return { filas, extras };
}
// Junta la línea de tiempo con el costo real de gastosDeEsteDia (que ya sabe repartir el hotel
// por noche) — un gasto sin nada que calzarle en la línea de tiempo se agrega suelto al final.
const PR_COMO_LABEL = { Compartido: 'Compartido', VariosPagan: 'Varios pagan', Prestamo: 'Préstamo', Devolucion: 'Devolución', Personal: 'Personal', Cotizacion: 'Cotización' };
function prDesgloseDe(g) {
  const como = PR_COMO_LABEL[g.compartido] || '';
  const paga = g.quien_paga ? `Paga: ${g.quien_paga}` : '';
  return [paga, como].filter(Boolean).join(' · ');
}
function prTipoDeItem(itemId) {
  if (!itemId) return '';
  if (itinerario.pendientes.some(p => p.id === itemId)) return 'pendiente';
  if (itinerario.transporte.some(t => t.id === itemId)) return 'transporte';
  if (itinerario.hospedaje.some(h => h.id === itemId)) return 'hospedaje';
  if (itinerario.eventos.some(e => e.id === itemId)) return 'evento';
  return '';
}
function filasImprimirDia(dia) {
  const { filas: timeline, extras } = construirTimelineDia(dia);
  const gastos = gastosDeEsteDia(dia.id).filter(g => !g.cotizacion);
  const usados = new Set();
  timeline.forEach(f => {
    const g = gastos.find(x => x.itemId && x.itemId === f.itemId && !usados.has(x.id));
    if (g) { f.costo = Number(g.costo || 0); f.desglose = prDesgloseDe(g); f.notaGasto = g.notas || ''; usados.add(g.id); }
  });
  const sueltos = gastos.filter(g => !usados.has(g.id)).map(g => ({
    hora: '', nombre: '💴 ' + (g.concepto || '(sin concepto)'), notas: g.notas || '', costo: Number(g.costo || 0), desglose: prDesgloseDe(g),
    itemId: g.itemId || '', tipo: prTipoDeItem(g.itemId)
  }));
  const total = gastos.reduce((s, g) => s + Number(g.costo || 0), 0);
  return { filas: [...timeline, ...sueltos], total, extras };
}
// Total de todo el viaje, agrupado por apartado — se acumula sobre gastosDeEsteDia de cada día
// (el hotel ya viene repartido por noche ahí, así que sumar día por día no lo duplica).
function totalesPorApartado() {
  const cats = {};
  diasFiltrados().forEach(dia => {
    gastosDeEsteDia(dia.id).filter(g => !g.cotizacion).forEach(g => {
      const costo = Number(g.costo || 0);
      const cat = g.categoria || '❓ Sin categoría';
      cats[cat] = (cats[cat] || 0) + costo;
    });
  });
  return cats;
}
// Desglose de transporte por medio (avión/bus/carro/ferry/tren/etc.) — cuántos trayectos y
// cuánto costó cada uno, acotado a los días del proyecto actual.
const TIPO_RESUMEN_LABEL = { vuelo: '✈️ Aviones', tren: '🚆 Tren/monorriel', bus: '🚌 Camiones/autobuses', carro: '🚕 Taxis/carros', ferry: '⛴️ Ferry', caminando: '🚶 Caminando', bicicleta: '🚲 Bicicleta', otro: '🚏 Otro' };
function transporteResumenPorTipo() {
  const diaIds = new Set(diasFiltrados().map(d => d.id));
  const porTipo = {};
  itinerario.transporte.filter(t => diaIds.has(t.diaId)).forEach(t => {
    const tipo = t.tipo || 'otro';
    if (!porTipo[tipo]) porTipo[tipo] = { cantidad: 0, total: 0 };
    porTipo[tipo].cantidad++;
    porTipo[tipo].total += (gastosVinculados[t.id]||[]).filter(g => !g.cotizacion).reduce((s,g) => s + (Number(g.costo)||0), 0);
  });
  return porTipo;
}

// ── Balance compartido (motor adaptado de v31 de Compras_v46.html, acotado a este proyecto) ──
// Todos los gastos reales (no cotización) del proyecto actual, una sola vez cada uno — a
// diferencia de gastosDeEsteDia() (que reparte el hotel por noche y puede listar lo mismo en
// varios días), acá se necesita cada gasto UNA vez con su quien_paga/pagadores reales para que
// el balance no se infle.
function todosLosGastosReales() {
  const vistos = new Set(); const lista = [];
  const agregar = (g) => { if (vistos.has(g.id)) return; vistos.add(g.id); lista.push(g); };
  Object.values(gastosVinculados).forEach(arr => arr.forEach(agregar));
  Object.values(gastosDelDia).forEach(arr => arr.forEach(agregar));
  return lista.filter(g => !g.cotizacion);
}
function balanceParticipantesEf(g) {
  if (g.compartido === 'VariosPagan') {
    return Array.isArray(g.pagadores) ? g.pagadores.map(p => p.persona).filter(n => GPEOPLE.includes(n)) : [];
  }
  if (g.compartido === 'Compartido') return GPEOPLE.slice();
  return GPEOPLE.filter(n => n !== g.quien_paga); // Préstamo/Devolución: el otro de los 2
}
function balanceDeudas() {
  const debt = {}; GPEOPLE.forEach(a => { debt[a] = {}; });
  const add = (deudor, acreedor, m) => {
    if (!deudor || !acreedor || deudor === acreedor || !(m > 0)) return;
    if (!debt[deudor]) debt[deudor] = {};
    debt[deudor][acreedor] = (debt[deudor][acreedor] || 0) + m;
  };
  todosLosGastosReales().forEach(g => {
    const a = Number(g.costo) || 0; if (a <= 0) return;
    // Compartido con pagadores propios (montos distintos, ej. 50/20/20/10) — el ajuste sale de
    // comparar lo que cada quien puso contra su parte pareja (costo / participantes).
    if (g.compartido === 'Compartido' && Array.isArray(g.pagadores) && g.pagadores.length) {
      const parts = balanceParticipantesEf(g); const n = parts.length || 1; const share = a / n;
      const net = {};
      parts.forEach(p => { net[p] = (net[p] || 0) - share; });
      g.pagadores.forEach(pg => { if (GPEOPLE.includes(pg.persona)) net[pg.persona] = (net[pg.persona] || 0) + (Number(pg.monto) || 0); });
      const deudores = [], acreedores = [];
      Object.entries(net).forEach(([nm, v]) => { if (v < -0.5) deudores.push({ nm, v }); else if (v > 0.5) acreedores.push({ nm, v }); });
      deudores.sort((x, y) => x.v - y.v); acreedores.sort((x, y) => y.v - x.v);
      let i = 0, j = 0;
      while (i < deudores.length && j < acreedores.length) {
        const pay = Math.min(-deudores[i].v, acreedores[j].v);
        if (pay > 0.5) add(deudores[i].nm, acreedores[j].nm, pay);
        deudores[i].v += pay; acreedores[j].v -= pay;
        if (Math.abs(deudores[i].v) < 0.5) i++;
        if (Math.abs(acreedores[j].v) < 0.5) j++;
      }
      return;
    }
    const q = g.quien_paga; if (!GPEOPLE.includes(q)) return;
    if (g.compartido === 'Compartido') {
      const parts = balanceParticipantesEf(g); const n = parts.length || 1; const share = a / n;
      parts.forEach(p => { if (p !== q) add(p, q, share); });
    } else if (g.compartido === 'Prestamo' || g.compartido === 'Devolucion') {
      const parts = balanceParticipantesEf(g); const n = parts.length || 1; const share = a / n;
      parts.forEach(p => add(p, q, share));
    }
  });
  return debt;
}
function balanceNetos() {
  const debt = balanceDeudas(); const net = {}; GPEOPLE.forEach(n => net[n] = 0);
  GPEOPLE.forEach(d => { Object.keys(debt[d] || {}).forEach(c => { const m = debt[d][c]; net[d] -= m; if (net[c] === undefined) net[c] = 0; net[c] += m; }); });
  return net;
}
// Simplificación greedy → lista mínima de pagos {de, a, monto} para saldar todo.
function balanceSimplificar() {
  const net = balanceNetos();
  const deudores = [], acreedores = [];
  Object.keys(net).forEach(n => { const v = Math.round(net[n]); if (v < -0.5) deudores.push({ n, v }); else if (v > 0.5) acreedores.push({ n, v }); });
  deudores.sort((a, b) => a.v - b.v); acreedores.sort((a, b) => b.v - a.v);
  const pagos = []; let i = 0, j = 0;
  while (i < deudores.length && j < acreedores.length) {
    const pay = Math.min(-deudores[i].v, acreedores[j].v);
    if (pay > 0.5) pagos.push({ de: deudores[i].n, a: acreedores[j].n, monto: Math.round(pay) });
    deudores[i].v += pay; acreedores[j].v -= pay;
    if (Math.abs(deudores[i].v) < 0.5) i++;
    if (Math.abs(acreedores[j].v) < 0.5) j++;
  }
  return pagos;
}
// Cuánto puso cada quien de su bolsillo en total (bruto — no es lo mismo que el balance neto).
function totalPuestoPorPersona() {
  const tot = {}; GPEOPLE.forEach(n => tot[n] = 0);
  todosLosGastosReales().forEach(g => {
    const a = Number(g.costo) || 0; if (a <= 0) return;
    if (g.compartido === 'VariosPagan' && Array.isArray(g.pagadores)) {
      g.pagadores.forEach(pg => { if (GPEOPLE.includes(pg.persona)) tot[pg.persona] += Number(pg.monto) || 0; });
    } else if (GPEOPLE.includes(g.quien_paga)) {
      tot[g.quien_paga] += a;
    }
  });
  return tot;
}
// Total "personal" — lo que cada quien pagó que NO fue compartido (ni préstamo ni devolución):
// gastos marcados Personal (o sin marcar, viejo default) + su propia parte en Varios pagan.
function totalesPersonales() {
  const tot = {}; GPEOPLE.forEach(n => tot[n] = 0);
  todosLosGastosReales().forEach(g => {
    const a = Number(g.costo) || 0; if (a <= 0) return;
    if (g.compartido === 'VariosPagan' && Array.isArray(g.pagadores)) {
      g.pagadores.forEach(pg => { if (GPEOPLE.includes(pg.persona)) tot[pg.persona] += Number(pg.monto) || 0; });
    } else if ((g.compartido === 'Personal' || !g.compartido) && GPEOPLE.includes(g.quien_paga)) {
      tot[g.quien_paga] += a;
    }
  });
  return tot;
}
// Préstamos/devoluciones individuales (para listarlos aparte, quién a quién) — no confundir con
// el balance ya simplificado: acá se ve cada movimiento tal cual se registró.
function listaPrestamos() {
  return todosLosGastosReales().filter(g => (g.compartido === 'Prestamo' || g.compartido === 'Devolucion') && GPEOPLE.includes(g.quien_paga) && Number(g.costo) > 0).map(g => {
    const otro = GPEOPLE.find(n => n !== g.quien_paga);
    return { de: otro, a: g.quien_paga, monto: Number(g.costo) || 0, concepto: g.concepto || '', tipo: g.compartido };
  });
}

// v58: "💾 Guardar PDF" — genera y descarga el PDF directo (sin pasar por el diálogo de
// impresión del navegador), para tener un respaldo del resumen tal cual está en ese momento por
// si después se mueve o borra algo del itinerario. Carga html2pdf.js solo la primera vez que se
// usa (no en cada carga de la app), igual que ya se hace lazy con otras cosas pesadas.
function gCargarHtml2Pdf() {
  return new Promise((resolve, reject) => {
    if (window.html2pdf) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js';
    s.onload = () => resolve(); s.onerror = () => reject(new Error('No se pudo cargar html2pdf'));
    document.head.appendChild(s);
  });
}
// Guarda el PDF DENTRO de la app (sube a Drive, igual que las fotos, y queda listado en
// "⚙ Info técnica → 📎 Respaldos PDF") — no solo una descarga suelta al dispositivo, que se
// puede perder o quedar solo en un celular.

    const dataUri = await window.html2pdf().set({
      margin: 10, filename: nombre,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true },

    if (!r || !r.ok) { showToast('⚠️ No se pudo subir el PDF'); if (btn) { btn.disabled = false; btn.textContent = '💾 Guardar PDF (queda en ⚙ Info técnica)'; } return; }
    const urlVer = 'https://drive.google.com/file/d/' + r.fileId + '/view';
    // v58 fix: el PDF ya estaba subido a Drive en este punto (paso anterior), pero este segundo
    // guardado (la referencia que arma la lista de "Respaldos PDF") nunca se revisaba — si

    // nunca en Info técnica.
    const r2 = await postGAS({ action: 'guardarRespaldoPdf', proyecto: currentProyecto, nombre, url: urlVer, fileId: r.fileId });
    if (!r2 || !r2.ok) { showToast('⚠️ El PDF se subió pero no se pudo guardar su referencia — intenta de nuevo'); if (btn) { btn.disabled = false; btn.textContent = '💾 Guardar PDF (queda en ⚙ Info técnica)'; } return; }
    gRespaldosCache = null; // invalida caché para que "Info técnica" traiga este nuevo al abrir
    showToast('💾 PDF guardado en la app ✦');
  } catch (e) { showToast('⚠️ No se pudo generar el PDF'); }
  if (btn) { btn.disabled = false; btn.textContent = '💾 Guardar PDF (queda en ⚙ Info técnica)'; }
}
// ── Respaldos PDF guardados (listado en ⚙ Info técnica) ──
let gRespaldosCache = null;
async function gCargarRespaldosPdf() {
  // v58 fix: un arreglo vacío es "truthy" en JS — con `if (gRespaldosCache)` a secas, en cuanto
  // la primera carga volvía vacía (por lo que fuera) quedaba cacheado ese "vacío" para siempre,
  // sin volver a intentar. Ahora solo se usa la caché si de verdad ya se cargó (no es null).
  if (gRespaldosCache !== null) return gRespaldosCache;
  const r = await postGAS({ action: 'cargarRespaldosPdf', proyecto: currentProyecto });
  if (!r || !r.ok) { showToast('⚠️ No se pudieron cargar los respaldos'); return []; }
  gRespaldosCache = Array.isArray(r.respaldos) ? r.respaldos : [];
  return gRespaldosCache;
}
async function gRenderRespaldosPdf() {
  const cont = document.getElementById('respaldosPdfList');
  if (!cont) return;
  cont.innerHTML = 'Cargando…';
  const respaldos = await gCargarRespaldosPdf();
  if (!respaldos.length) { cont.innerHTML = '<div class="empty-mini">Sin respaldos guardados todavía — usa "💾 Guardar PDF" en el resumen imprimible.</div>'; return; }
  cont.innerHTML = respaldos.map(r => `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:12px">
      <a href="${escHtml(r.url)}" target="_blank" rel="noopener" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">📄 ${escHtml(r.nombre)}</a>
      <span style="color:var(--ink-3);white-space:nowrap;font-size:10.5px">${escHtml(fechaLocalISO(new Date(r.fecha)))}</span>
      <button class="icon-btn" style="font-size:12px" onclick="gEliminarRespaldoPdf('${r.id}')">🗑</button>
    </div>`).join('');
}
async function gEliminarRespaldoPdf(id) {
  if (!confirm('¿Eliminar este respaldo? También se borra el archivo de Drive.')) return;
  const r = await postGAS({ action: 'eliminarRespaldoPdf', id });
  if (r && r.ok) { gRespaldosCache = null; showToast('Respaldo eliminado'); gRenderRespaldosPdf(); }
  else showToast('⚠️ No se pudo eliminar');
}

function renderRecomendacionesGastronomicas(candidatos, order) {
  candidatos = candidatos || [];
  const grupos = {};
  candidatos.forEach(p => {
    const cat = p.antojo || '__sincategoria__';
    (grupos[cat] = grupos[cat] || []).push(p);
  });
  // Incluir los platillos maestros que no tengan restaurantes aún
  antojosMaestros.forEach(a => { if (!grupos[a]) grupos[a] = []; });
  // Ordenar: primero los maestros, luego "Sin categoría" al final
  const todosGrupos = Object.keys(grupos).sort((a, b) => {
    if (a === '__sincategoria__') return 1;
    if (b === '__sincategoria__') return -1;
    return a.localeCompare(b);
  });
  const totalItems = candidatos.length;

  const gruposHtml = todosGrupos.length
    ? todosGrupos.map((key, idx) => {
        const antojo = key === '__sincategoria__' ? 'Sin categoría' : key;
        const esMaestro = key !== '__sincategoria__';
        const items = grupos[key];
        const gId = `rec-g-${idx}`;
        const abierto = recoGruposAbiertos.has(key);
        const itemsOrdenados = [...items].sort((a,b)=>(a.orden||0)-(b.orden||0));
        const contenido = itemsOrdenados.length
          ? itemsOrdenados.map((p, idx) => `<div style="display:flex; align-items:flex-start; gap:3px">
              <div style="display:flex; flex-direction:column; gap:1px; padding-top:4px; flex-shrink:0">
                <button class="icon-btn" style="font-size:10px;padding:1px;line-height:1" onclick="moverPendienteGrupo('${escHtml(p.id)}','${escHtml(key)}',-1)" title="Subir" ${idx===0 ? 'disabled' : ''}>▲</button>
                <button class="icon-btn" style="font-size:10px;padding:1px;line-height:1" onclick="moverPendienteGrupo('${escHtml(p.id)}','${escHtml(key)}',1)" title="Bajar" ${idx===itemsOrdenados.length-1 ? 'disabled' : ''}>▼</button>
              </div>
              <div style="flex:1">${poolItemHtml(p)}</div>
            </div>`).join('')
          : `<div class="empty-mini">Aún no hay restaurantes. Toca ＋ para agregar uno.</div>`;
        const botonesExtra = esMaestro
          ? `<button class="icon-btn" style="font-size:12px; opacity:0.6" title="Renombrar" onclick="editarNombrePlatillo('${escHtml(antojo)}', document.getElementById('span-platillo-${idx}'))">✏️</button>
             <button class="icon-btn" style="font-size:12px; opacity:0.6" title="Eliminar platillo" onclick="eliminarPlatilloMaestro('${escHtml(antojo)}')">🗑</button>`
          : '';
        return `<div style="margin-bottom:6px">
          <div style="display:flex; align-items:center; gap:5px; margin-bottom:4px">
            <button onclick="toggleRecoGrupo('${escHtml(key)}','${gId}',this)" style="background:none;border:none;cursor:pointer;padding:0;font-size:11px;color:var(--ink-3)">${abierto ? '▼' : '▶'}</button>
            <span id="span-platillo-${idx}" style="padding:0; font-weight:700; color:${key === '__sincategoria__' ? 'var(--ink-3)' : 'var(--ink)'}; flex:1; font-size:12px; cursor:${esMaestro ? 'text' : 'default'}" ${esMaestro ? `ondblclick="editarNombrePlatillo('${escHtml(antojo)}', this)"` : ''}>🍴 ${escHtml(antojo)}</span>
            ${botonesExtra}
            <span style="font-size:10px;color:var(--ink-3)">${items.length}</span>
            <button class="btn-mini" onclick="agregarRestauranteAntojo('${escHtml(antojo === 'Sin categoría' ? '' : antojo)}')" style="font-size:10px">＋</button>
          </div>
          <div id="${gId}" style="display:${abierto ? '' : 'none'}">${contenido}</div>
        </div>`;
      }).join('')
    : `<div class="empty-mini">Toca "＋ Platillo" para agregar un antojo maestro.</div>`;
  return sectionWrap('recomendaciones', '🍴 Platillos y restaurantes', totalItems,
    `<button class="btn-mini" onclick="agregarPlatilloMaestro()" title="Nuevo platillo/antojo">＋ Platillo</button>`,
    gruposHtml);
}
// Se guarda en recoGruposAbiertos (fuera de este render) para que sobreviva al próximo
// re-render — antes cada re-render volvía a colapsar todo, aunque el usuario ya lo hubiera abierto.
function toggleRecoGrupo(key, gId, btnEl) {
  const el = document.getElementById(gId); if (!el) return;
  const abrir = el.style.display === 'none';
  el.style.display = abrir ? '' : 'none';
  if (btnEl) btnEl.textContent = abrir ? '▼' : '▶';
  if (abrir) recoGruposAbiertos.add(key); else recoGruposAbiertos.delete(key);
}

function agregarPlatilloMaestro() {
  const nombre = prompt('¿Cómo se llama el platillo o antojo?');
  if (!nombre || !nombre.trim()) return;
  const limpio = nombre.trim();
  if (antojosMaestros.includes(limpio)) { showToast('Ya existe'); return; }
  antojosMaestros = [...antojosMaestros, limpio].sort();
  renderPoolPanel(); // se ve de inmediato
  postGAS({ action: 'agregarAntojoMaestro', proyecto: currentProyecto, antojo: limpio })
    .then(() => showToast('Platillo agregado ✦'));
}

function editarNombrePlatillo(antojo, spanEl) {
  // Edición inline: reemplaza el span de texto por un input
  const viejo = antojo;
  const input = document.createElement('input');
  input.type = 'text';
  input.value = viejo;
  input.style.cssText = 'font-size:12px; border:1px dashed var(--gold); border-radius:4px; padding:2px 6px; width:120px; outline:none; font-family:var(--font-sans);';
  spanEl.replaceWith(input);
  input.focus(); input.select();
  const guardar = async () => {
    const nuevo = input.value.trim();
    if (!nuevo || nuevo === viejo) { input.replaceWith(spanEl); return; }
    if (antojosMaestros.includes(nuevo)) { showToast('Ya existe ese nombre'); input.replaceWith(spanEl); return; }
    antojosMaestros = antojosMaestros.map(a => a === viejo ? nuevo : a).sort();
    // También actualizar los pendientes que tienen ese antojo
    itinerario.pendientes.filter(p => p.antojo === viejo).forEach(p => {
      p.antojo = nuevo;
      postGAS({ action: 'updatePendiente', id: p.id, antojo: nuevo });
    });
    await postGAS({ action: 'editarAntojoMaestro', proyecto: currentProyecto, antojo: viejo, nuevoNombre: nuevo });
    showToast('Platillo renombrado ✦');
    renderPoolPanel();
  };
  input.addEventListener('blur', guardar);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } if (e.key === 'Escape') { input.replaceWith(spanEl); } });
}

// ── Arrastrar desde el pool hacia el calendario o hacia un día ──

let dragPreviewEl = null;
function showDragPreview(col, iniMin, dur) {
  const body = col.querySelector('.week-col-body');
  if (!body) return;
  if (!dragPreviewEl) { dragPreviewEl = document.createElement('div'); dragPreviewEl.className = 'drag-time-preview'; }
  if (dragPreviewEl.parentElement !== body) body.appendChild(dragPreviewEl);
  const px = pxPerMin();
  dragPreviewEl.style.top = (iniMin * px) + 'px';
  dragPreviewEl.style.height = Math.max(20, dur * px) + 'px';
  dragPreviewEl.textContent = minToHHMM(iniMin) + '–' + minToHHMM(iniMin + dur);
}
function hideDragPreview() {
  if (dragPreviewEl && dragPreviewEl.parentElement) dragPreviewEl.parentElement.removeChild(dragPreviewEl);
}

function startPoolDrag(e, item) {
  // v57: NO se hace preventDefault acá ni al arrancar el arrastre — en el celular eso le
  // robaba el gesto de scroll al panel lateral desde el primer toque (por eso no dejaba
  // bajar para ver más). Ahora se espera a ver hacia dónde se mueve el dedo: si es más
  // vertical que horizontal, se asume que es scroll y no se interfiere para nada; solo si
  // es claramente horizontal (hacia el calendario) se arma el arrastre de verdad.
  const startX = e.clientX, startY = e.clientY;
  let moved = false, scrolling = false, ghost = null;
  const pendObj = itinerario.pendientes.find(x => x.id === item.id);
  const dur = pendObj && pendObj.duracionMin ? Number(pendObj.duracionMin) : 60;

  function clearHighlights() {
    document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('drop-hover'));
    document.querySelectorAll('.week-col').forEach(c => c.classList.remove('drop-target'));
    const dz = document.getElementById('poolDespuesZone');
    const shz = document.getElementById('poolSinHoraZone');
    if (dz) dz.style.background = '';
    if (shz) shz.style.background = '';
    hideDragPreview();
  }
  function timeForCol(col, ev) {
    const body = col.querySelector('.week-col-body');
    if (!body) return null;
    const rect = body.getBoundingClientRect();
    const px = pxPerMin();
    return snap15(Math.max(0, Math.min(1380, (ev.clientY - rect.top) / px)));
  }

  function onMove(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!moved) {
      if (scrolling) return;
      if (Math.abs(dx) <= 6 && Math.abs(dy) <= 6) return; // todavía no se sabe qué gesto es
      if (Math.abs(dy) > Math.abs(dx)) { scrolling = true; return; } // vertical: es scroll, no tocar
      moved = true;
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.textContent = item.nombre || 'Mover';
      document.body.appendChild(ghost);
    }
    ev.preventDefault(); // recién ahora (arrastre horizontal confirmado) se bloquea el scroll nativo
    positionGhost(ghost, ev.clientX, ev.clientY);
    clearHighlights();

    const overDespues = elFrom(ev, '#poolDespuesZone');
    if (overDespues) { overDespues.style.background = 'var(--ok-light)'; ghost.textContent = item.nombre || 'Mover'; return; }
    const overSinHora = elFrom(ev, '#poolSinHoraZone');
    if (overSinHora) { overSinHora.style.background = 'var(--ok-light)'; ghost.textContent = item.nombre || 'Mover'; return; }

    const col = elFrom(ev, '.week-col');
    if (col) {
      col.classList.add('drop-target');
      const iniMin = timeForCol(col, ev);
      if (iniMin !== null) { showDragPreview(col, iniMin, dur); ghost.textContent = minToHHMM(iniMin) + '–' + minToHHMM(iniMin + dur); }
      return;
    }
    const chip = elFrom(ev, '.day-chip');
    if (chip) { chip.classList.add('drop-hover'); ghost.textContent = item.nombre || 'Mover'; }
  }
  async function onUp(ev) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (ghost) ghost.remove();
    clearHighlights();

    if (scrolling) return; // fue scroll, no un toque ni un arrastre — no hacer nada
    if (!moved) { abrirVisor('pendiente', item.id); return; }

    const overDespues = elFrom(ev, '#poolDespuesZone');
    if (overDespues) { await schedulePendiente(item.id, '', null, null); return; }
    const overSinHora = elFrom(ev, '#poolSinHoraZone');
    if (overSinHora) { await schedulePendiente(item.id, currentDiaId, null, null); return; }

    const col = elFrom(ev, '.week-col');
    if (col) {
      const diaId = col.dataset.dia;
      const iniMin = timeForCol(col, ev);
      if (iniMin === null) return;
      await schedulePendiente(item.id, diaId, iniMin, iniMin + dur);
      return;
    }
    const chip = elFrom(ev, '.day-chip');
    if (chip) { await schedulePendiente(item.id, chip.dataset.dia, null, null); return; }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

function positionGhost(ghost, x, y) { ghost.style.left = (x + 14) + 'px'; ghost.style.top = (y + 14) + 'px'; }
function elFrom(ev, selector) { const el = document.elementFromPoint(ev.clientX, ev.clientY); return el ? el.closest(selector) : null; }

// ── Arrastrar transporte (sobre todo los de "solo minutos") al calendario para fijarle hora ──
function startTransporteDrag(e, t) {
  // v57: mismo fix que en el panel de pendientes — no se preventDefault de entrada (le robaba
  // el scroll a la tarjeta desde el primer toque). Se espera a ver si el gesto es horizontal
  // (arrastre real hacia el calendario) o vertical (scroll), y recién ahí se decide.
  const startX = e.clientX, startY = e.clientY;
  let moved = false, scrolling = false, ghost = null;
  // Si tiene horario fijo ya definido (vuelo, tren, ferry, bus) y opciones con salida, no dejamos mover la hora
  const esHorarioFijo = !MODOS_SIN_HORARIO.includes(t.tipo);
  const opSel = (t.opciones || [])[t.opcionElegida || 0];
  const tieneSalida = opSel && opSel.salida;
  const dur = (opSel && opSel.duracionMin !== '' && opSel.duracionMin != null) ? Number(opSel.duracionMin) : 60;

  function clearHighlights() {
    document.querySelectorAll('.week-col').forEach(c => c.classList.remove('drop-target'));
    hideDragPreview();
  }
  function timeForCol(col, ev) {
    const body = col.querySelector('.week-col-body');
    if (!body) return null;
    const rect = body.getBoundingClientRect();
    const px = pxPerMin();
    return snap15(Math.max(0, Math.min(1380, (ev.clientY - rect.top) / px)));
  }
  function onMove(ev) {
    const dx = ev.clientX - startX, dy = ev.clientY - startY;
    if (!moved) {
      if (scrolling) return;
      if (Math.abs(dx) <= 6 && Math.abs(dy) <= 6) return;
      if (Math.abs(dy) > Math.abs(dx)) { scrolling = true; return; }
      moved = true;
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.textContent = `${t.origen || ''} → ${t.destino || ''}` || 'Mover';
      document.body.appendChild(ghost);
    }
    ev.preventDefault();
    positionGhost(ghost, ev.clientX, ev.clientY);
    clearHighlights();
    const col = elFrom(ev, '.week-col');
    if (col && col.dataset.dia === t.diaId) {
      col.classList.add('drop-target');
      const iniMin = timeForCol(col, ev);
      if (iniMin !== null) { showDragPreview(col, iniMin, dur); ghost.textContent = minToHHMM(iniMin) + '–' + minToHHMM(iniMin + dur); }
    }
  }
  async function onUp(ev) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (ghost) ghost.remove();
    clearHighlights();
    if (scrolling) return;
    if (!moved) { abrirVisor('transporte', t.id); return; }
    if (esHorarioFijo && tieneSalida) {
      if (!confirm('Este transporte ya tiene el horario definido (vuelo/tren/ferry/bus). ¿Deseas moverlo de todas formas?')) return;
    }
    const col = elFrom(ev, '.week-col');
    if (col && col.dataset.dia === t.diaId) {
      const iniMin = timeForCol(col, ev);
      if (iniMin === null) return;
      await fijarHorarioTransporteDesdeArrastre(t.id, iniMin, dur);
    }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}

async function fijarHorarioTransporteDesdeArrastre(transporteId, iniMin, dur) {
  const t = itinerario.transporte.find(x => x.id === transporteId);
  if (!t) return;
  const opciones = (t.opciones && t.opciones.length) ? t.opciones : [{ salida: '', llegada: '', notas: '' }];
  const idx = t.opcionElegida || 0;
  if (!opciones[idx]) opciones[idx] = { salida: '', llegada: '', notas: '' };
  opciones[idx].salida = minToHHMM(iniMin);
  opciones[idx].llegada = minToHHMM(iniMin + dur);
  t.opciones = opciones;
  t.opcionElegida = idx;
  // mantener sincronizado el desglose por modo si existe, para que al reabrir el formulario coincida
  if (t.modosData) {
    const m = (t.modosData.modos || []).find(x => x.modo === t.tipo);
    if (m) m.opciones = opciones;
  }
  renderSemana(); renderPoolPanel(); renderSpine();
  const body = { action: 'updateTransporte', id: transporteId, opciones, opcionElegida: idx };
  if (t.modosData) body.modosData = t.modosData;
  let r;
  try { r = await postGAS(body); } catch (e) { r = null; }
  if (!r || !r.ok) {
    showToast('⚠️ No se pudo guardar la hora. Se restauró desde el servidor.');
    await loadItinerario();
    return;
  }
  showToast('Hora fijada ✦');
}

async function schedulePendiente(id, diaId, iniMin, finMin) {
  const p = itinerario.pendientes.find(x => x.id === id); if (!p) return;
  p.diaId = diaId;
  if (iniMin !== null) { 
    p.horaInicio = minToHHMM(iniMin); 
    p.horaFin = minToHHMM(finMin); 
  } else {
    p.horaInicio = ''; 
    p.horaFin = ''; 
  }
  await postGAS({ action: 'updatePendiente', id, diaId, horaInicio: p.horaInicio, horaFin: p.horaFin });
  showToast('Ubicado ✦');
  renderSpine(); renderSemana(); renderPoolPanel();
}

// ── Arrastrar una actividad de un evento/festival desde el panel lateral al calendario ──
// (el evento en sí no se agenda — son sus actividades, cada una con su propio lugar/hora,
// igual que transporte tiene varias "opciones" adentro de un mismo transporte)
function startActividadDrag(e, eventoId, actividad) {
  // v57: mismo fix que Pendientes/Transporte — no se preventDefault de entrada (le robaba el
  // scroll a la lista desde el primer toque). Se espera a ver si el gesto es horizontal
  // (arrastre real hacia el calendario) o vertical (scroll), y recién ahí se decide.
  const startX = e.clientX, startY = e.clientY;
  let moved = false, scrolling = false, ghost = null;
  const dur = 60;

  function clearHighlights() {
    document.querySelectorAll('.day-chip').forEach(c => c.classList.remove('drop-hover'));
    document.querySelectorAll('.week-col').forEach(c => c.classList.remove('drop-target'));
    hideDragPreview();
  }
  function timeForCol(col, e2) {
    const body = col.querySelector('.week-col-body');
    if (!body) return null;
    const rect = body.getBoundingClientRect();
    const px = pxPerMin();
    return snap15(Math.max(0, Math.min(1380, (e2.clientY - rect.top) / px)));
  }
  function onMove(e2) {
    const dx = e2.clientX - startX, dy = e2.clientY - startY;
    if (!moved) {
      if (scrolling) return;
      if (Math.abs(dx) <= 6 && Math.abs(dy) <= 6) return;
      if (Math.abs(dy) > Math.abs(dx)) { scrolling = true; return; }
      moved = true;
      ghost = document.createElement('div');
      ghost.className = 'drag-ghost';
      ghost.textContent = actividad.nombre || 'Mover';
      document.body.appendChild(ghost);
    }
    e2.preventDefault();
    positionGhost(ghost, e2.clientX, e2.clientY);
    clearHighlights();
    const col = elFrom(e2, '.week-col');
    if (col) {
      col.classList.add('drop-target');
      const iniMin = timeForCol(col, e2);
      if (iniMin !== null) { showDragPreview(col, iniMin, dur); ghost.textContent = minToHHMM(iniMin) + '–' + minToHHMM(iniMin + dur); }
      return;
    }
    const chip = elFrom(e2, '.day-chip');
    if (chip) { chip.classList.add('drop-hover'); ghost.textContent = actividad.nombre || 'Mover'; }
  }
  async function onUp(e2) {
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    if (ghost) ghost.remove();
    clearHighlights();
    if (scrolling) return;
    if (!moved) {
      if (!actividad.diaId || !actividad.horaInicio) abrirAsignarActividad(eventoId, actividad.id);
      else abrirVisorEvento(eventoId, actividad.id);
      return;
    }
    const col = elFrom(e2, '.week-col');
    if (col) {
      const diaId = col.dataset.dia;
      const iniMin = timeForCol(col, e2);
      if (iniMin === null) return;
      await scheduleActividad(eventoId, actividad.id, diaId, iniMin, iniMin + dur);

    }
    const chip = elFrom(e2, '.day-chip');
    if (chip) { await scheduleActividad(eventoId, actividad.id, chip.dataset.dia, null, null); return; }
  }
  document.addEventListener('pointermove', onMove);
  document.addEventListener('pointerup', onUp);
}
async function scheduleActividad(eventoId, actividadId, diaId, iniMin, finMin) {
  const ev = itinerario.eventos.find(x => x.id === eventoId); if (!ev) return;
  const act = (ev.sedes || []).find(x => x.id === actividadId); if (!act) return;
  act.diaId = diaId;
  if (iniMin !== null) {
    act.horaAsignada = minToHHMM(iniMin);
    act.horaAsignadaFin = minToHHMM(finMin);
  } else {
    act.horaAsignada = '';
    act.horaAsignadaFin = '';
  }
  await postGAS({ action: 'updateEvento', id: eventoId, sedes: ev.sedes });
  showToast('Ubicado ✦');
  renderSpine(); renderSemana(); renderPoolPanel();
}
// Tocar (sin arrastrar) una actividad sin día/hora todavía: preguntar directo en vez de
// obligar a arrastrarla hasta el calendario.
function abrirAsignarActividad(eventoId, actividadId) {
  const ev = itinerario.eventos.find(x => x.id === eventoId); if (!ev) return;
  const act = (ev.sedes || []).find(x => x.id === actividadId); if (!act) return;
  modalEsFormulario = true;
  modalOpen(`
    <div class="modal-head"><span class="modal-title">🎪 ${escHtml(act.nombre || ev.nombre || 'Actividad')}</span><button class="modal-close" onclick="modalClose()">✕</button></div>
    <div class="modal-body">
      <div class="empty-mini" style="margin-bottom:10px">Todavía no tiene día ni hora — asignale uno para que aparezca en el calendario.</div>
      <div class="field"><label>Día</label>
        <select id="fActDia">
          <option value="">— Sin asignar —</option>
          ${diasFiltrados().map(d => `<option value="${d.id}" ${act.diaId===d.id?'selected':''}>${d.fecha}${d.zona?' · '+escHtml(d.zona):''}</option>`).join('')}
        </select>
      </div>
      <div class="row-2">

// ── Tarjeta de transporte ────────────────────────────────────
function formatOpcionTexto(o) {
  if (!o) return 'Sin horario';
  let base;
  if (o.salida && o.llegada) base = `${o.salida} → ${o.llegada}`;
  else if (o.salida && o.duracionMin !== '' && o.duracionMin != null) base = `Sale ${o.salida} (~${o.duracionMin} min)`;
  else if (o.duracionMin !== '' && o.duracionMin != null) base = `~${o.duracionMin} min`;
  else if (o.salida) base = `Sale ${o.salida}`;
  else base = 'Sin horario aún';
  // v58: precioEstimado es solo una cotización de referencia (manual o sugerida por IA) para
  // comparar entre opciones — no es un gasto real, por eso no se toca gastoVinculadoHtml/Gastos.
  return o.precioEstimado ? `${base} · 💬 ${o.precioEstimado}` : base;
}

// ── Visor: vista de lectura compartida (clic en un evento → visor → Editar) ──
const TIPO_COMIDA_ICON = { desayuno: '🍳', comida: '🍜', cena: '🍷', colacion: '🍪' };
const TIPO_COMIDA_LABEL = { desayuno: 'Desayuno', comida: 'Comida', cena: 'Cena', colacion: 'Colación' };
function diaLabel(diaId) {
  const d = itinerario.dias.find(x => x.id === diaId);
  return d ? `${d.fecha}${d.zona ? ' · ' + d.zona : ''}` : '';
}
function fechaBreve(fecha) {
  if (!fecha) return '';
  const date = new Date(fecha + 'T00:00:00');
  if (isNaN(date.getTime())) return '';
  const meses = ['ENE', 'FEB', 'MAR', 'ABR', 'MAY', 'JUN', 'JUL', 'AGO', 'SEP', 'OCT', 'NOV', 'DIC'];
  return `${date.getDate()}${meses[date.getMonth()]}`;
}
function etiquetaDiaHtml(numDia, fecha, color) {
  return `<span style="background:${color}dd; color:#fff; padding:2px 8px; border-radius:14px; font-weight:600; font-size:9.5px; box-shadow:0 1px 4px rgba(0,0,0,.25); white-space:nowrap; display:inline-block;">Día ${numDia}: ${fechaBreve(fecha)}</span>`;
}
function coordsMini(lat, lng) {
  if (!lat || !lng) return '';
  return `<div class="visor-coords">${escHtml(lat)}, ${escHtml(lng)}</div>`;
}

function abrirVisor(tipo, id, actividadId) {
  const box = document.getElementById('modalBox');
  if (box) { box.dataset.visorTipo = tipo; box.dataset.visorId = id; }
  if (tipo === 'pendiente') abrirVisorPendiente(id);
  else if (tipo === 'transporte') abrirVisorTransporte(id);
  else if (tipo === 'hospedaje') abrirVisorHospedaje(id);
  else if (tipo === 'evento') abrirVisorEvento(id, actividadId);
}

        ${reservadoToggleHtml('pendiente', p.id, p.reservado)}

      </div>
      <div class="visor-row">📅 ${p.diaId ? escHtml(diaLabel(p.diaId)) : 'Para después / si hay tiempo'}${p.horaInicio ? ` · 🕐 ${escHtml(p.horaInicio)}–${escHtml(p.horaFin || '')}` : ''}</div>

      <button class="icon-btn" style="font-size:10px;padding:1px;line-height:1${idx===lista.length-1?' opacity:.2':''}" onclick="moverPendienteZona('${p.id}','${zonaKey}','down')" title="Bajar" ${idx===lista.length-1 ? 'disabled' : ''}>▼</button>

function moverPendienteZona(id, zonaKey, dir) {
  const dia = diasFiltrados().find(d => d.id === currentDiaId);
  if (!dia) return;
  let lista;
  if (zonaKey === 'sinHora') {
    lista = itinerario.pendientes.filter(p => p.diaId === dia.id && (!p.horaInicio || !p.horaFin) && !p.antojo && !p.esRestaurante).sort((a,b)=>(a.orden||0)-(b.orden||0));
  } else {
    lista = itinerario.pendientes.filter(p => (p.proyecto || '') === currentProyecto && !p.antojo && !p.esRestaurante && (!p.horaInicio || !p.horaFin) && (!p.diaId || p.diaId !== dia.id)).sort((a,b)=>(a.orden||0)-(b.orden||0));
  }
  moverPendiente(id, lista, dir);
}
function moverPendiente(id, lista, dir) {
  const idx = lista.findIndex(p => p.id === id);
  if (idx < 0) return;
  const otro = dir === 'up' ? idx - 1 : idx + 1;
  if (otro < 0 || otro >= lista.length) return;
  const ordenA = lista[idx].orden || idx;
  const ordenB = lista[otro].orden || otro;
  lista[idx].orden = ordenB;
  lista[otro].orden = ordenA;
  renderPoolPanel();
  postGAS({ action: 'updatePendiente', id: lista[idx].id, orden: lista[idx].orden });
  postGAS({ action: 'updatePendiente', id: lista[otro].id, orden: lista[otro].orden });
}
function moverTransporte(id, diaId, dir) {
  const lista = itinerario.transporte
    .filter(t => t.diaId === diaId)
    .sort((a, b) => (a.orden || 0) - (b.orden || 0));
  const idx = lista.findIndex(t => t.id === id);
  if (idx < 0) return;
  const otro = dir === 'up' ? idx - 1 : idx + 1;
  if (otro < 0 || otro >= lista.length) return;
  const ordenA = lista[idx].orden || idx;
  const ordenB = lista[otro].orden || otro;
  lista[idx].orden = ordenB;
  lista[otro].orden = ordenA;
  renderPoolPanel(); // inmediato
  postGAS({ action: 'updateTransporte', id: lista[idx].id, orden: lista[idx].orden });
  postGAS({ action: 'updateTransporte', id: lista[otro].id, orden: lista[otro].orden });
}
async function toggleOcultarTransporte(id, btn) {
  const t = itinerario.transporte.find(x => x.id === id);
  if (!t) return;
  const opciones = t.opciones || [];
  const opSel = opciones[t.opcionElegida || 0];
  const sinHora = opciones.length > 0 && !(opSel && opSel.salida);
  if (sinHora) {
    // Sin hora nunca se ve en mapa/calendario, sin importar el botón — pedir la hora es lo que de verdad lo arregla.
    const horaTexto = prompt('Este transporte no tiene hora fija, por eso no se ve en el mapa ni en el calendario. ¿A qué hora sale? (HH:MM)', '');
    if (!horaTexto) return;
    const iniMin = hhmmToMin(horaTexto);
    if (iniMin === null) { showToast('Hora inválida, usa el formato HH:MM'); return; }
    const dur = (opSel && opSel.duracionMin != null && opSel.duracionMin !== '') ? Number(opSel.duracionMin) : 30;
    const idx = t.opcionElegida || 0;
    const nuevasOpciones = opciones.length ? [...opciones] : [{}];
    if (!nuevasOpciones[idx]) nuevasOpciones[idx] = {};
    nuevasOpciones[idx] = { ...nuevasOpciones[idx], salida: minToHHMM(iniMin), llegada: minToHHMM(iniMin + dur) };
    t.opciones = nuevasOpciones;
    t.ocultarMapa = false;
    await postGAS({ action: 'updateTransporte', id, opciones: nuevasOpciones, opcionElegida: idx, ocultarMapa: false });
    renderSemana(); renderPoolPanel(); renderSpine();
    if (document.getElementById('viewMapa').style.display !== 'none') renderMapaGeneral();
    showToast('Hora fijada — ahora sí se ve en mapa y calendario ✦');
    return;
  }
  t.ocultarMapa = !t.ocultarMapa;
  btn.textContent = t.ocultarMapa ? '🙈' : '👁️';
  btn.title = t.ocultarMapa ? 'Oculto del visor y mapa — toca para mostrar' : 'Visible — toca para ocultar del visor y mapa';
  await postGAS({ action: 'updateTransporte', id, ocultarMapa: t.ocultarMapa });
  renderSemana(); renderPoolPanel(); // refresca el calendario (visor de horas) y el panel
  if (document.getElementById('viewMapa').style.display !== 'none') renderMapaGeneral();
}

async function elegirModoEnCard(transporteId, modo, idx) {
  const t = itinerario.transporte.find(x => x.id === transporteId);
  if (!t || !t.modosData) return;
  const m = (t.modosData.modos || []).find(x => x.modo === modo);
  if (!m) return;
  t.tipo = modo;
  t.opciones = m.opciones || [];
  t.opcionElegida = idx;
  const body = { action: 'updateTransporte', id: transporteId, tipo: modo, opciones: t.opciones, opcionElegida: idx };
  // Si este modo trae su propia parada/estación (ej. parada de bus vs estación de tren), usarla en vez de la dirección general
  if (m.direccionOrigen) { t.direccionOrigen = m.direccionOrigen; body.direccionOrigen = m.direccionOrigen; }
  if (m.origenLat) { t.origenLat = m.origenLat; body.origenLat = m.origenLat; }
  if (m.origenLng) { t.origenLng = m.origenLng; body.origenLng = m.origenLng; }
  if (m.direccionDestino) { t.direccionDestino = m.direccionDestino; body.direccionDestino = m.direccionDestino; }
  if (m.destinoLat) { t.destinoLat = m.destinoLat; body.destinoLat = m.destinoLat; }
  if (m.destinoLng) { t.destinoLng = m.destinoLng; body.destinoLng = m.destinoLng; }
  renderSemana(); renderPoolPanel(); renderSpine();
  await postGAS(body);
  showToast('Cambiado a ' + (TIPO_LABEL[modo] || modo));
}

// v58: "🤖 Buscar bus/tren/otras opciones" directo desde el visor — para transportes viejos o
// cargados a mano que nunca pasaron por "Sugerir todo" y por eso no tienen modos alternos
// guardados (de ahí que el visor solo mostrara la opción ya elegida, sin nada más que comparar).
// Conserva tal cual el modo/horario ya elegido — solo agrega/actualiza los DEMÁS modos.
async function buscarOtrosModosVisor(id, btnEl) {
  const t = itinerario.transporte.find(x => x.id === id);
  if (!t) return;
  const textoOriginal = btnEl ? btnEl.innerHTML : '';
  if (btnEl) { btnEl.disabled = true; btnEl.innerHTML = '<span class="spinner-mini"></span> Pensando…'; }
  showToast('Buscando otras opciones…');
  const dia = itinerario.dias.find(d => d.id === t.diaId);
  const r = await postGAS({ action: 'sugerirTransporteCompleto', origenTexto: t.origen || '', destinoTexto: t.destino || '', pista: '', zona: dia ? dia.zona : '', fecha: dia ? dia.fecha : '' });
  if (btnEl) { btnEl.disabled = false; btnEl.innerHTML = textoOriginal; }
  if (!r.ok || !r.data) { showToast(r.error || 'No se pudo buscar'); return; }
  const nuevosModos = normalizarModosIA(r.data.modos || []);
  const modosFinal = nuevosModos.map(m => m.modo === t.tipo ? { ...m, opciones: t.opciones, aplica: true } : m);
  if (!modosFinal.some(m => m.modo === t.tipo)) modosFinal.unshift({ modo: t.tipo, aplica: true, tiempoTotal: '', opciones: t.opciones || [] });
  t.modosData = { modos: modosFinal, mixto: (t.modosData && t.modosData.mixto) || { requiere: false, descripcion: '' } };
  await postGAS({ action: 'updateTransporte', id: t.id, modosData: t.modosData });
  showToast('✨ Listo — se agregaron las otras opciones');
