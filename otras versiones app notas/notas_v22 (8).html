<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideas ✦</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset & base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1814; --ink-2: #5a5650; --ink-3: #9a9590;
  --cream: #faf8f4; --cream-2: #f2efe9; --cream-3: #e8e4dc; --line: rgba(26,24,20,0.10);
  --gold: #c9973a; --gold-light: #fdf3e1; --radius: 12px;
  --font-serif: 'Instrument Serif', Georgia, serif; --font-sans: 'DM Sans', sans-serif;
}
html, body { height: 100%; font-family: var(--font-sans); background: var(--cream); color: var(--ink); font-size: 14px; line-height: 1.6; }

/* ── Layout ───────────────────────────────────────────────── */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 240px; flex-shrink: 0; background: var(--cream-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 24px 0; overflow-y: auto; transition: width 0.25s ease, padding 0.25s ease, opacity 0.2s ease; }
.sidebar.collapsed { width: 0; padding: 0; opacity: 0; overflow: hidden; pointer-events: none; border-right: none; }
.sidebar-logo { font-family: var(--font-serif); font-size: 20px; padding: 0 20px 20px; border-bottom: 1px solid var(--line); margin-bottom: 16px; color: var(--ink); letter-spacing: -0.3px; display: flex; justify-content: space-between; align-items: center; }
.sidebar-logo span { color: var(--gold); cursor: pointer; user-select: none; transition: opacity 0.15s; }
.sidebar-logo span:hover { opacity: 0.75; }
/* Botón flotante para reabrir sidebar */
.sidebar-reopen { display: none; align-items: center; justify-content: center; padding: 8px 12px; background: var(--cream-2); border: 1px solid var(--line); border-left: none; border-radius: 0 8px 8px 0; cursor: pointer; font-family: var(--font-serif); font-size: 13px; color: var(--gold); transition: background 0.15s; flex-shrink: 0; white-space: nowrap; gap: 4px; }
.sidebar-reopen:hover { background: var(--cream-3); }
.app.sidebar-hidden .sidebar-reopen { display: flex; }

/* Switch de selección múltiple */
.multi-toggle { font-family: var(--font-sans); font-size: 11px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 6px; cursor: pointer; background: #fff; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line); }
.multi-toggle input { margin: 0; cursor: pointer; }
.multi-toggle:hover { border-color: var(--gold); }

/* Selector de modo de combinación: Todas a la vez (Y) / Cualquiera (O) / Ninguna (NOT) */
.combine-mode-row { display: flex; gap: 3px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 3px; }
.combine-mode-btn { flex: 1; padding: 5px 6px; border: none; background: none; border-radius: 16px; cursor: pointer; font-family: var(--font-sans); font-size: 10.5px; font-weight: 500; color: var(--ink-3); transition: background 0.15s, color 0.15s; white-space: nowrap; }
.combine-mode-btn:hover { color: var(--ink); }
.combine-mode-btn.active { background: var(--ink); color: var(--cream); }

/* Panel de filtro por fecha */
.date-filter-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-top: 6px; }
.date-quick-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.date-quick-btn { padding: 4px 9px; border-radius: 14px; border: 1px solid var(--line); background: var(--cream-2); cursor: pointer; font-family: var(--font-sans); font-size: 10.5px; color: var(--ink-2); transition: background 0.15s; }
.date-quick-btn:hover { background: var(--cream-3); }
.date-quick-btn.active { background: var(--gold-light); border-color: var(--gold); color: #7a5a10; }
.date-range-row { display: flex; flex-direction: column; gap: 6px; }
.date-range-row input[type="date"] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-sans); font-size: 12px; outline: none; }
.date-range-row input[type="date"]:focus { border-color: var(--gold); }
.date-filter-clear { font-size: 11px; color: var(--ink-3); background: none; border: none; cursor: pointer; text-align: left; padding: 4px 0 0; }
.date-filter-clear:hover { color: var(--ink); }

.sidebar-section { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 0 20px 8px; margin-top: 20px; }
.filter-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 20px; background: none; border: none; cursor: pointer; font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-2); text-align: left; transition: background 0.15s, color 0.15s; border-radius: 0; }
.filter-btn:hover { background: var(--cream-3); color: var(--ink); }
.filter-btn.active { background: var(--gold-light); color: #7a5a10; font-weight: 500; }
.filter-btn.excluded { background: #fde8e8; color: #b91c1c; font-weight: 500; text-decoration: line-through; }
.filter-btn.excluded .dot { background: #ef4444; }
.filter-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--ink-3); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; background: var(--cream); }
.search-wrap { flex: 1; position: relative; }
.search-wrap input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--cream-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; transition: border-color 0.15s; }
.search-wrap input:focus { border-color: var(--gold); background: #fff; }
.search-wrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 15px; pointer-events: none; }
.btn-add { display: flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius); background: var(--ink); color: var(--cream); border: none; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; transition: background 0.15s; white-space: nowrap; }
.btn-add:hover { background: #333; }
.count-bar { padding: 8px 24px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.clear-filters { font-size: 11px; background: var(--cream-3); padding: 2px 8px; border-radius: 12px; cursor: pointer; display: none; border:none; }
.clear-filters.visible { display: inline-block; }

/* Grid de ideas */
.ideas-wrap { flex: 1; overflow-y: auto; padding: 20px 24px; }
.ideas-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
  gap: 14px; 
  align-items: start; /* Esto evita que las tarjetas se estiren */
}
.idea-card { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: box-shadow 0.15s, border-color 0.15s; cursor: default; animation: fadeIn 0.2s ease; }
.idea-card:hover { border-color: var(--cream-3); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card-top-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--ink-3); letter-spacing: 0.05em; margin-bottom: 4px; }
.card-top-meta .proyecto { color: var(--gold); }
.card-text { 
  font-size: 13.5px; 
  line-height: 1.65; 
  color: var(--ink); 
  flex: 1; 
  margin-bottom: 4px; 
  max-height: 250px; /* Límite de altura */
  overflow-y: auto;  /* Scroll automático si el texto es muy largo */
  white-space: pre-wrap; /* Respeta saltos de línea y espacios */
  word-break: break-word;
}
.card-accion { font-size: 12px; background: #fdfdfa; border: 1px dashed #dcdacb; padding: 8px 10px; border-radius: 6px; color: #5a5746; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag-pill { font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 20px; cursor: pointer; transition: opacity 0.15s; background: var(--cream-2); color: var(--ink-2); border: 1px solid var(--line); }
.tag-pill:hover { opacity: 0.75; }

/* Tutor / Leccion Box UI */
.tutor-box { background:#f8fafc; border: 1px dashed #cbd5e1; padding:10px; border-radius:6px; margin-top:4px; font-size:12px; color:#334155; }
.tutor-box .original { margin-bottom: 6px; }
.tutor-box strong { font-weight: 500; }

.selectable-tag { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 20px; cursor: pointer; background: var(--cream-2); border: 1px solid var(--line); color: var(--ink-2); transition: all 0.15s; user-select: none; }
.selectable-tag:hover { border-color: var(--ink-3); }
.selectable-tag.active { background: var(--gold-light); color: #7a5a10; border-color: #e8c87a; }

/* Panel de etiquetas ya seleccionadas para esta nota (debajo del buscador) */
.selected-tags-label { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.selected-tags-row { display: flex; flex-wrap: wrap; gap: 6px; }
.selected-tag-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 4px 6px 4px 12px; border-radius: 20px; background: var(--gold-light); color: #7a5a10; border: 1px solid #e8c87a; }
.selected-tag-chip button { background: none; border: none; cursor: pointer; color: #a8801a; font-size: 13px; padding: 2px 4px; line-height: 1; border-radius: 50%; transition: background 0.15s; }
.selected-tag-chip button:hover { background: rgba(122,90,16,0.15); }
.card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.card-actions { display: flex; gap: 6px; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 15px; padding: 2px; transition: color 0.15s; line-height: 1; }
.icon-btn:hover { color: var(--ink); }
.empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--ink-3); }
.empty .emoji { font-size: 40px; margin-bottom: 12px; }

/* ── Modal base ───────────────────────────────────────────── */
.overlay { position: fixed; inset: 0; background: rgba(26,24,20,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; animation: fadeOverlay 0.08s ease; }
@keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15); animation: slideUp 0.2s ease; }
@keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: var(--font-serif); font-size: 20px; color: var(--ink); }
.modal-close { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 20px; line-height: 1; padding: 4px; transition: color 0.15s; }
.modal-close:hover { color: var(--ink); }
.modal-body { padding: 16px 24px 24px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
.field textarea, .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--cream-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; transition: border-color 0.15s; }
.field textarea { resize: vertical; min-height: 80px; }
.field textarea:focus, .field input:focus { border-color: var(--gold); background: #fff; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.btn-ai { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); background: var(--gold-light); color: #7a5a10; border: 1px solid #e8c87a; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; transition: background 0.15s; }
.btn-ai:hover { background: #fbe8b8; }
.btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
.btn-cancel { padding: 9px 18px; border-radius: var(--radius); background: none; border: 1px solid var(--line); color: var(--ink-2); cursor: pointer; font-family: var(--font-sans); font-size: 13px; transition: background 0.15s; }
.btn-cancel:hover { background: var(--cream-2); }
.btn-save { padding: 9px 20px; border-radius: var(--radius); background: var(--ink); color: var(--cream); border: none; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; transition: background 0.15s; }
.btn-save:hover { background: #333; }
.btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

/* Chat IA */
.chat-box { border: 1px solid var(--line); border-radius: var(--radius); background: var(--cream-2); max-height: 180px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chat-msg { padding: 8px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.6; max-width: 90%; }
.chat-msg.ai { background: #fff; border: 1px solid var(--line); align-self: flex-start; color: var(--ink); }
.chat-msg.user { background: var(--ink); color: var(--cream); align-self: flex-end; }
.chat-input-row { display: flex; gap: 8px; margin-top: 8px; }
.chat-input-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; font-family: var(--font-sans); font-size: 13px; outline: none; }
.chat-input-row input:focus { border-color: var(--gold); }
.chat-send { padding: 8px 14px; border-radius: var(--radius); background: var(--ink); color: var(--cream); border: none; cursor: pointer; font-size: 13px; transition: background 0.15s; }
.chat-send:hover { background: #333; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500; z-index: 999; animation: toastIn 0.2s ease; pointer-events: none; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.spinner { display: inline-block; width: 14px; height: 14px; }
.spinner::after { content: ''; display: block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* CSS PARA EDICION INLINE */
@keyframes goldenBlink { 0% { box-shadow: 0 0 0px transparent; border-color: var(--line); } 50% { box-shadow: 0 0 8px rgba(201, 151, 58, 0.5); border-color: var(--gold); } 100% { box-shadow: 0 0 0px transparent; border-color: var(--line); } }
.blinking-gold { animation: goldenBlink 1.5s infinite; transition: border-color 0.3s; }
.edit-input { width: 100%; font-family: var(--font-sans); font-size: 13.5px; line-height: 1.65; border: 1px dashed var(--gold); background: var(--cream-2); border-radius: 6px; padding: 8px; outline: none; resize: vertical; margin-bottom: 8px; }
.edit-input-small { width: 100%; font-family: var(--font-sans); font-size: 12px; border: 1px dashed var(--gold); background: var(--cream-2); border-radius: 4px; padding: 5px; outline: none; }

/* ── Formato de texto ─────────────────────────────────────── */
.format-toolbar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; padding: 6px; background: var(--cream-2); border: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; border-bottom: none; }
.format-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--ink-2); transition: background 0.15s, border-color 0.15s; padding: 0; }
.format-btn:hover { background: var(--cream-3); border-color: var(--ink-3); }
.format-btn.active { background: var(--gold-light); border-color: var(--gold); color: #7a5a10; }
.format-sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
.format-color-input { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: #fff; }
.content-editable { width: 100%; min-height: 110px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); background: var(--cream-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; transition: border-color 0.15s; white-space: pre-wrap; word-break: break-word; overflow-y: auto; max-height: 240px; }
.content-editable ul, .card-text ul { margin: 4px 0 4px 1.2em; padding: 0; }
.content-editable li, .card-text li { margin: 2px 0; }
.content-editable:focus { border-color: var(--gold); background: #fff; }
.content-editable:empty::before { content: attr(data-placeholder); color: var(--ink-3); }

/* ── Selector de color: botón + popup de 12 colores (posición relativa, nunca se va a la esquina) ── */
.color-btn-wrap { position: relative; display: inline-block; }
.color-popup { position: absolute; top: calc(100% + 6px); left: 0; display: none; flex-wrap: wrap; gap: 4px; background: #fff; padding: 8px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 350; width: 124px; }
.color-popup.open { display: flex; }
.color-popup-swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0,0,0,0.08); transition: transform 0.1s; padding: 0; }
.color-popup-swatch:hover { transform: scale(1.15); }
.color-popup-more { position: relative; overflow: hidden; background: linear-gradient(135deg, #ef4444, #eab308, #22c55e, #3b82f6, #a855f7); }
.color-popup-more input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; padding: 0; }

/* Popup de tamaño de imagen (aparece al hacer clic sobre una imagen insertada) */
.image-size-popup { position: fixed; display: flex; align-items: center; gap: 8px; background: var(--ink); padding: 8px 12px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 410; min-width: 200px; }
.image-size-popup button { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border: none; border-radius: 5px; cursor: pointer; font-size: 14px; color: var(--cream); transition: background 0.15s; padding: 0; flex-shrink: 0; }
.image-size-popup button:hover { background: rgba(255,255,255,0.25); }
.image-size-popup input[type="range"] { flex: 1; height: 4px; cursor: pointer; accent-color: var(--gold); }
.image-size-label { color: var(--cream); font-size: 11px; font-family: var(--font-sans); min-width: 32px; text-align: center; flex-shrink: 0; }

/* Menú flotante al seleccionar texto */
.float-format-menu { position: fixed; display: none; gap: 3px; background: var(--ink); padding: 5px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 300; }
.float-format-menu button { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: none; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--cream); transition: background 0.15s; padding: 0; }
.float-format-menu button:hover { background: rgba(255,255,255,0.15); }
.float-format-menu button.active { background: var(--gold); color: #1a1814; }
.float-format-menu input[type="color"] { width: 26px; height: 26px; padding: 0; border: none; border-radius: 5px; cursor: pointer; background: none; }

/* Botón de copiar en tarjeta */
.btn-copy { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 14px; padding: 2px; transition: color 0.15s, transform 0.15s; line-height: 1; }
.btn-copy:hover { color: var(--gold); }
.btn-copy.copied { color: #2e9e5b; transform: scale(1.15); }

/* ── Secciones de la barra lateral plegables ─────────────────── */
.sidebar-section-header { display: flex; align-items: center; justify-content: space-between; padding: 0 20px 8px; margin-top: 20px; cursor: pointer; user-select: none; }
.sidebar-section-header .title { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.sidebar-section-header .controls { display: flex; align-items: center; gap: 6px; }
.sidebar-section-header .chevron { font-size: 10px; color: var(--ink-3); transition: transform 0.2s; }
.sidebar-section-header.collapsed .chevron { transform: rotate(-90deg); }
.sidebar-add-btn { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 14px; line-height: 1; padding: 0 2px; transition: color 0.15s; }
.sidebar-add-btn:hover { color: var(--gold); }
.sidebar-section-body { overflow: hidden; max-height: 2000px; transition: max-height 0.25s ease; }
.sidebar-section-body.collapsed { max-height: 0; }
.sidebar-search-input { width: 100%; padding: 6px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-family: var(--font-sans); font-size: 12px; color: var(--ink); outline: none; transition: border-color 0.15s; }
.sidebar-search-input:focus { border-color: var(--gold); }
.sidebar-search-input::placeholder { color: var(--ink-3); }
.filter-row { display: flex; align-items: center; position: relative; }
.filter-row .filter-btn { flex: 1; }
.filter-row-actions { display: flex; align-items: center; gap: 2px; padding-right: 8px; visibility: hidden; }
.filter-row:hover .filter-row-actions { visibility: visible; }
.filter-row-actions button { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 11px; padding: 2px 3px; transition: color 0.15s; line-height: 1; }
.filter-row-actions button:hover { color: var(--ink); }

/* ── Dropdown híbrido (texto libre + flechita de sugerencias) ── */
.hybrid-select-wrap { position: relative; display: flex; }
.hybrid-select-wrap input { flex: 1; border-radius: var(--radius) 0 0 var(--radius) !important; border-right: none !important; }
.hybrid-select-arrow { width: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--cream-2); border: 1px solid var(--line); border-radius: 0 var(--radius) var(--radius) 0; cursor: pointer; color: var(--ink-3); font-size: 10px; transition: background 0.15s, color 0.15s; }
.hybrid-select-arrow:hover { background: var(--cream-3); color: var(--ink); }
.hybrid-dropdown { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 250; max-height: 180px; overflow-y: auto; display: none; }
.hybrid-dropdown.open { display: block; }

.hybrid-dropdown-item:hover { background: var(--cream-2); }
.hybrid-dropdown-empty { padding: 10px 12px; font-size: 12px; color: var(--ink-3); }

/* ── Selector de orden ────────────────────────────────────────── */

.sort-select:focus { border-color: var(--gold); }
</style>

<script>
// ── Config ───────────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwTtMX0TMhGDW9aCmTi8UM5BXXjuiYT4o4jNVotPhjcuwW1_J9Zq_IsK19_U50CiCgHDg/exec';

// ── Estado ───────────────────────────────────────────────────
let allIdeas = []; let allTags = [];
let currentView = 'todas'; let isMultiSelect = false;
let filters = { proyectos: [], tipos: [], animos: [], etiquetas: [] };
let excludedFilters = { proyectos: [], tipos: [], animos: [], etiquetas: [] }; // marcados con clic derecho para EXCLUIR
let combineMode = 'AND'; // 'AND' = todas a la vez, 'OR' = cualquiera, 'NOT' = ninguna (excluye la selección completa)
let dateFilter = { mode: null, start: null, end: null }; // mode: 'hoy'|'semana'|'mes'|'anio'|'rango'|null
let selectedTags = [];
let aiConversation = [];
let usingClaude = false;

// ── Sidebar toggle ───────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const app = document.querySelector('.app');
  sidebar.classList.toggle('collapsed');
  app.classList.toggle('sidebar-hidden');
}

// ── Formato de texto (sanitizado y utilidades) ───────────────
const ALLOWED_TAGS = new Set(['B','STRONG','I','EM','U','S','STRIKE','MARK','SPAN','BR','DIV','IMG']);
function sanitizeHtml(html) {
  if (!html) return '';
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const clean = (node) => {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 1) {
        if (!ALLOWED_TAGS.has(child.tagName)) {
          // Reemplaza el tag no permitido por sus hijos (evita scripts, etc.)
          while (child.firstChild) child.parentNode.insertBefore(child.firstChild, child);
          child.parentNode.removeChild(child);
          return;
        }
        if (child.tagName === 'IMG') {
          // Las imágenes solo se conservan si su src apunta a nuestras imágenes en Drive
          const src = child.getAttribute('src') || '';
          const isSafeImage = /^https:\/\/drive\.google\.com\/(thumbnail\?id=|uc\?export=view&id=)/.test(src);
          const widthPct = parseInt(child.dataset.widthPct || '60', 10) || 60;
          const safeWidth = Math.max(15, Math.min(100, widthPct));
          [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
          if (isSafeImage) {
            child.setAttribute('src', src);
            child.setAttribute('class', 'nota-img-resizable');
            child.setAttribute('data-width-pct', safeWidth);
            child.setAttribute('title', 'Clic para cambiar el tamaño');
            child.setAttribute('style', `width:${safeWidth}%;max-width:100%;border-radius:8px;display:block;margin:8px 0;cursor:pointer;`);
          } else {
            child.parentNode.removeChild(child); // imagen de origen no confiable: se elimina
          }
          return;
        }
        // Solo permitir el atributo style con color/background-color
        const style = child.getAttribute('style');
        [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
        if (style) {
          const safeStyle = style.split(';').filter(s => /^\s*(color|background-color)\s*:/.test(s)).join(';');
          if (safeStyle) child.setAttribute('style', safeStyle);
        }
        clean(child);
      }
    });
  };
  clean(tpl.content);
  return tpl.innerHTML;
}

// Marca visualmente (clase .active) los botones cuyo formato ya aplica a la selección actual
function syncToolbarState() {
  const map = { bold: 'bold', italic: 'italic', underline: 'underline', strikeThrough: 'strikeThrough' };
  document.querySelectorAll('.float-format-menu button, .format-toolbar .format-btn').forEach(btn => {
    const cmd = btn.getAttribute('data-cmd');
    if (cmd && map[cmd]) {
      try { btn.classList.toggle('active', document.queryCommandState(cmd)); } catch(e) {}
    }
  });
}

// Recuerda dónde estaba la selección de texto justo antes de abrir el selector de color
// (al abrir <input type="color">, el navegador quita el foco del editor y se pierde la selección)
let colorSavedRange = null;
let lastHilite = '#fdf3e1';
let lastForeColor = '#c9973a';
function rememberSelectionForColor() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) colorSavedRange = sel.getRangeAt(0).cloneRange();
}
function restoreColorSelection() {
  if (!colorSavedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(colorSavedRange);
  colorSavedRange = null;
}

// ── Popup de 12 colores rápidos + acceso al selector completo ──
const QUICK_COLORS_12 = ['#c9973a','#ef4444','#f97316','#eab308','#22c55e','#0ea5e9','#3b82f6','#a855f7','#ec4899','#1a1814','#ffffff','#fdf3e1'];

function toggleColorPopup(popupId) {
  const popup = document.getElementById(popupId);
  const isOpen = popup.classList.contains('open');
  closeAllColorPopups();
  if (isOpen) return; // ya estaba abierto: el clic lo cierra y no hace nada más

  // Determinar el comando según el id del popup: resaltado, color de texto o viñetas
  let command = 'foreColor';
  if (popupId.includes('hilite')) command = 'hiliteColor';
  else if (popupId.includes('bullet')) command = 'bulletList';
  // Guardamos la selección ANTES de mostrar el popup, ya que el clic en un swatch
  // (o abrir el selector nativo) puede mover el foco y perderla
  rememberSelectionForColor();

  popup.innerHTML = QUICK_COLORS_12.map(c =>
    `<button type="button" class="color-popup-swatch" style="background:${c}" onclick="pickQuickColor('${c}', '${command}', '${popupId}')"></button>`
  ).join('') + `
    <div class="color-popup-swatch color-popup-more" title="Más colores">
      <input type="color" onmousedown="rememberSelectionForColor()" onchange="pickQuickColor(this.value, '${command}', '${popupId}')">
    </div>`;
  popup.classList.add('open');
}

function closeAllColorPopups() { document.querySelectorAll('.color-popup').forEach(p => p.classList.remove('open')); }

// Inserta una viñeta de color al inicio de la línea actual (más seguro que <ul>/<li> + <style>,
// ya que no requiere permitir hojas de estilo adicionales en el sanitizador)
function applyBulletList(color) {
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const bulletSpan = document.createElement('span');
  bulletSpan.style.color = color;
  bulletSpan.textContent = '• ';
  range.collapse(true);
  range.insertNode(bulletSpan);
  // Mover el cursor justo después de la viñeta insertada
  range.setStartAfter(bulletSpan);
  range.setEndAfter(bulletSpan);
  sel.removeAllRanges();
  sel.addRange(range);
}

// Detecta si un nodo es una "viñeta": nuestro span con color, O simplemente texto que empieza con '• '
// (esto cubre el caso de texto pegado o escrito a mano con el símbolo de viñeta suelto)
function isBulletSpan(node) {
  if (!node) return false;
  if (node.nodeType === 1 && node.tagName === 'SPAN' && /^•\s/.test(node.textContent || '')) return true;
  if (node.nodeType === 3 && /^•\s*$/.test(node.textContent || '')) return true; // SOLO si el nodo es ÚNICAMENTE la viñeta (evita falsos positivos en medio de texto largo)
  return false;
}

// Color de una "viñeta" detectada: si es nuestro span, usamos su color; si es texto plano, el último color usado
function bulletColorOf(node) {
  if (node && node.nodeType === 1 && node.style && node.style.color) return node.style.color;
  return lastForeColor;
}

// Busca el primer nodo de la línea actual, retrocediendo desde un nodo dado
// hasta encontrar un <br> (inicio de línea) o el principio del editor.
function findLineStartNode(container, startNode) {
  let node = startNode;
  while (node && node.previousSibling) {
    if (node.previousSibling.nodeName === 'BR') return node;
    node = node.previousSibling;
  }
  return node;
}

// IMPORTANTE: esta función es deliberadamente conservadora y NUNCA usa preventDefault().
// Dejamos que el navegador maneje el Enter exactamente como siempre lo ha hecho (su comportamiento
// nativo, probado y confiable). Solo DESPUÉS de que el navegador ya insertó su salto de línea,
// revisamos (de forma asíncrona, sin tocar el documento mientras el navegador aún procesa la tecla)
// si la línea de la que venimos era una viñeta, y si es así, agregamos la viñeta de continuación.
// Si algo no es 100% claro, no hacemos nada: priorizamos nunca interferir con la escritura normal.
function handleBulletEnter(e) {
  if (e.key !== 'Enter' || e.shiftKey) return;

  let sel, range, container;
  try {
    sel = window.getSelection();
    if (!sel || !sel.rangeCount || !sel.isCollapsed) return;
    range = sel.getRangeAt(0);
    container = e.currentTarget;
  } catch (err) { return; }

  // Ubicamos el nodo "hijo directo del editor" justo antes del cursor, en su línea ACTUAL (antes del Enter)
  let beforeCursor = null;
  try {
    if (range.startContainer.nodeType === 3) {
      if (range.startOffset !== range.startContainer.textContent.length) return; // el cursor no está al final del texto, no intervenimos
      let node = range.startContainer;
      while (node && node.parentNode !== container) node = node.parentNode;
      beforeCursor = node;
    } else if (range.startContainer === container) {
      beforeCursor = range.startOffset > 0 ? container.childNodes[range.startOffset - 1] : null;
    } else {
      return; // estructura no reconocida con certeza: no intervenimos
    }
  } catch (err) { return; }

  if (!beforeCursor) return;
  const lineStart = findLineStartNode(container, beforeCursor);
  if (!isBulletSpan(lineStart)) return; // la línea actual no es una viñeta: comportamiento 100% normal

  // Si la viñeta está vacía (no hay texto después de ella en la línea), no continuamos la lista
  // (evita seguir agregando viñetas vacías indefinidamente).
  if (lineStart === beforeCursor && lineStart.nodeType === 1) return; // span de viñeta y el cursor está justo tras él, sin texto: línea vacía
  if (lineStart.nodeType === 3 && /^•\s*$/.test(lineStart.textContent || '')) return; // texto plano que es solo la viñeta: línea vacía

  // Confirmado: estamos en una línea con viñeta que SÍ tiene contenido. Dejamos que el navegador
  // inserte su salto de línea normal, y justo después agregamos la viñeta de continuación.
  const color = bulletColorOf(lineStart);
  setTimeout(() => {
    try {
      const sel2 = window.getSelection();
      if (sel2 && sel2.rangeCount > 0) applyBulletList(color);
    } catch (err) { /* si falla, simplemente no se agrega la viñeta extra; no hay riesgo de pérdida de datos */ }
  }, 0);
}

// ── Insertar imágenes (suben a Google Drive y se insertan donde estaba el cursor) ──
// isCard=true cuando se invoca desde una tarjeta ya guardada; false cuando es desde el modal
let imageInsertContext = { isCard: false, savedRange: null };

// ── Extraer texto de una imagen con IA (OCR) ─────────────────
// Sube la imagen igual que con insertar imagen, pero en vez de mostrarla,
// pide a la IA que transcriba el texto y lo pega como contenido editable.
async function handleOcrExtract(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Selecciona un archivo de imagen'); return; }
  if (file.size > 5 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 5MB)'); inputEl.value = ''; return; }

  const sel = window.getSelection();
  const savedRange = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).cloneRange() : null;

  showToast('Leyendo texto de la imagen…');
  try {
    const base64 = await fileToBase64(file);
    const r = await postGAS({ action: 'extractTextFromImage', imageBase64: base64, mimeType: file.type });
    if (r.ok && r.text) {
      const editor = document.getElementById('inputContenido');
      editor.focus();
      if (savedRange) { sel.removeAllRanges(); sel.addRange(savedRange); }
      // Insertamos el texto extraído como texto plano en la posición del cursor
      const textNode = document.createTextNode(r.text);
      const sel2 = window.getSelection();
      if (sel2.rangeCount > 0 && editor.contains(sel2.getRangeAt(0).startContainer)) {
        const range = sel2.getRangeAt(0);
        range.collapse(false);
        range.insertNode(textNode);
        range.setStartAfter(textNode);
        range.collapse(true);
        sel2.removeAllRanges();
        sel2.addRange(range);
      } else {
        editor.appendChild(textNode);
      }
      showToast('✨ Texto extraído');
    } else {
      showToast(r.error || 'No se pudo leer el texto de la imagen');
    }
  } catch (e) {
    showToast('Error al procesar la imagen');
  }
  inputEl.value = '';
}

async function handleImageUpload(inputEl, isCard) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Selecciona un archivo de imagen'); return; }
  if (file.size > 5 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 5MB)'); inputEl.value = ''; return; }

  // Guardamos dónde estaba el cursor antes de que se abra el diálogo de archivos
  // (igual que con los colores: abrir el selector de archivos puede mover el foco)
  const sel = window.getSelection();
  imageInsertContext.isCard = isCard;
  imageInsertContext.savedRange = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).cloneRange() : null;

  showToast('Subiendo imagen…');
  try {
    const base64 = await fileToBase64(file);
    const r = await postGAS({ action: 'uploadImage', imageBase64: base64, mimeType: file.type, fileName: file.name });
    if (r.ok && r.url) {
      insertImageAtSavedPosition(r.url, isCard);
      showToast('Imagen agregada ✦');
    } else {
      showToast(r.error || 'No se pudo subir la imagen');
    }
  } catch (e) {
    showToast('Error al subir la imagen');
  }
  inputEl.value = ''; // permite volver a subir el mismo archivo si se repite la acción
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]); // quita el prefijo data:...;base64,
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function insertImageAtSavedPosition(url, isCard) {
  const targetEl = isCard
    ? (activeCardId ? document.getElementById(`text-${activeCardId}`) : null)
    : document.getElementById('inputContenido');
  if (!targetEl) return;

  const sel = window.getSelection();
  if (imageInsertContext.savedRange) {
    sel.removeAllRanges();
    sel.addRange(imageInsertContext.savedRange);
  } else {
    targetEl.focus();
  }

  const img = document.createElement('img');
  img.src = url;
  img.style.maxWidth = '60%';
  img.style.width = '60%';
  img.style.borderRadius = '8px';
  img.style.display = 'block';
  img.style.margin = '8px 0';
  img.style.cursor = 'pointer';
  img.dataset.widthPct = '60';
  img.title = 'Clic para cambiar el tamaño';
  img.className = 'nota-img-resizable';

  if (sel.rangeCount > 0 && targetEl.contains(sel.getRangeAt(0).startContainer)) {
    const range = sel.getRangeAt(0);
    range.collapse(false);
    range.insertNode(img);
    range.setStartAfter(img);
    range.setEndAfter(img);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    targetEl.appendChild(img); // si no había selección válida dentro del editor, se agrega al final
  }

  if (isCard && activeCardId) saveCardEdit(activeCardId, targetEl);
  imageInsertContext.savedRange = null;
}

// Aplica directamente el porcentaje elegido en el slider (más confiable que arrastrar la imagen)

  imageSizeTarget.dataset.widthPct = pct;
  imageSizeTarget.style.width = pct + '%';

// Guarda la nota cuando se edita el formato directo en la tarjeta (sin abrir el modal)
let cardSaveTimers = {};
function saveCardEdit(id, el) {
  const idea = allIdeas.find(i => i.id === id);
  if (!idea) return;
  const newHtml = sanitizeHtml(el.innerHTML);
  if (newHtml === idea.contenido) return; // sin cambios
  idea.contenido = newHtml;
  clearTimeout(cardSaveTimers[id]);
  cardSaveTimers[id] = setTimeout(async () => {
    try { await postGAS({ action: 'updateIdea', id: id, text: newHtml }); } catch(e) { showToast('Error guardando cambios'); }
  }, 500);
}

// ── Copiar texto completo de una nota ─────────────────────────
async function copyIdeaText(id, btn) {
  const idea = allIdeas.find(i => i.id === id);
  if (!idea) return;
  // Texto plano (sin etiquetas HTML) para pegar en cualquier lugar
  const tmp = document.createElement('div');
  tmp.innerHTML = idea.contenido || '';
  const plainText = tmp.innerText || tmp.textContent || '';
  try {
    await navigator.clipboard.writeText(plainText);
    const original = btn.textContent;
    btn.textContent = '✅'; btn.classList.add('copied');
    setTimeout(() => { btn.textContent = original; btn.classList.remove('copied'); }, 1500);
  } catch(e) { showToast('No se pudo copiar'); }
}

function getCounts(key) {
  const counts = {};
  allIdeas.forEach(i => {
     if (key === 'etiquetas') {
       if (i.etiquetas) i.etiquetas.forEach(t => { const lower = t.toLowerCase(); counts[lower] = (counts[lower] || 0) + 1; });
     } else {
       // AQUI arreglamos que lea "nota" y "general" cuando esté vacío
       let rawVal = i[key];
       if (key === 'tipo' && (!rawVal || rawVal.trim() === '')) rawVal = 'nota';
       if (key === 'proyecto' && (!rawVal || rawVal.trim() === '')) rawVal = 'general';
       const val = (rawVal || '').toLowerCase().trim();
       if (val) counts[val] = (counts[val] || 0) + 1;
     }
  });
  return Object.entries(counts).sort((a, b) => a[0].localeCompare(b[0])); 
}

// Recuerda qué secciones de la barra lateral están plegadas y cuáles tienen la búsqueda abierta
let collapsedSections = {};
let searchOpenSections = {};

}

function toggleSectionSearch(keyName) {

function renderSidebarFilters() {
  const container = document.getElementById('dynamicSidebarFilters');
  const catProyectos = getCounts('proyecto'); const catTipos = getCounts('tipo');
  const catAnimos = getCounts('animo'); const catEtiquetas = getCounts('etiquetas');

  // singularField: el nombre de campo usado por bulkUpdateField en el backend
  const buildSection = (title, array, keyName, singularField) => {
    const isCollapsed = collapsedSections[keyName] ? 'collapsed' : '';
    const isSearchOpen = searchOpenSections[keyName];
    let sectionHtml = `
      <div class="sidebar-section-header ${isCollapsed}" onclick="toggleSidebarSection('${keyName}')">
        <span class="title">${title}</span>
        <div class="controls">
          <button class="sidebar-add-btn" title="Buscar ${title.toLowerCase()}" onclick="event.stopPropagation(); toggleSectionSearch('${keyName}')">🔍</button>
          <button class="sidebar-add-btn" title="Agregar ${title.toLowerCase()}" onclick="event.stopPropagation(); openAddCategoryPrompt('${singularField}')">＋</button>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="sidebar-section-body ${isCollapsed}" id="section-body-${keyName}" style="padding:0 12px; margin-bottom:12px;">`;
    if (isSearchOpen) {
      sectionHtml += `<input type="text" class="sidebar-search-input" id="search-input-${keyName}" placeholder="Buscar ${title.toLowerCase()}…" oninput="filterSidebarSection('${keyName}', this.value)" onclick="event.stopPropagation()">`;
    }
    if (array.length === 0) {
      sectionHtml += `<div style="font-size:11.5px; color:var(--ink-3); padding:4px 8px;">Sin elementos aún</div>`;
    }
    array.forEach(([name, count]) => {
      const isActive = filters[keyName].includes(name) ? 'active' : '';
      const isExcluded = excludedFilters[keyName] && excludedFilters[keyName].includes(name);
      const activeClass = isExcluded ? 'excluded' : (isActive ? 'active' : '');
      const rowId = `cat-row-${keyName}-${name.replace(/[^a-z0-9]/gi,'_')}`;
      sectionHtml += `
        <div class="filter-row" id="${rowId}" data-search-text="${escHtml(name.toLowerCase())}">
          <button class="filter-btn ${activeClass}" onclick="toggleFilter('${keyName}', '${escHtml(name)}')" oncontextmenu="event.preventDefault(); toggleExcludeFilter('${keyName}', '${escHtml(name)}')"><span class="dot"></span> ${escHtml(name)} <span style="margin-left:auto;font-size:11px;color:var(--ink-3)">${count}</span></button>
          <div class="filter-row-actions">
            <button title="Editar" onclick="event.stopPropagation(); startInlineEditCategory('${rowId}', '${singularField}', '${escHtml(name)}')">✏️</button>
            <button title="Eliminar" onclick="event.stopPropagation(); deleteCategoryDirect('${singularField}', '${escHtml(name)}')">🗑</button>
          </div>
        </div>`;
    });
    return sectionHtml + `</div>`;
  };
  let html = '';
  html += buildSection('Proyectos', catProyectos, 'proyectos', 'proyecto');
  html += buildSection('Tipos', catTipos, 'tipos', 'tipo');
  html += buildSection('Estados de Ánimo', catAnimos, 'animos', 'animo');
  html += buildSection('Etiquetas', catEtiquetas, 'etiquetas', 'etiqueta');
  container.innerHTML = html;
}

function startInlineEditCategory(rowId, field, oldValue) {
  const row = document.getElementById(rowId);

  row.innerHTML = `

async function confirmInlineRename(field, oldValue) {
  const input = document.getElementById('inline-edit-input');
  const newValue = input.value.trim();
  if (!newValue) { showToast('Escribe un nombre'); return; }
  if (newValue.toLowerCase() === oldValue.toLowerCase()) { renderSidebarFilters(); return; }
  try {
    const r = await postGAS({ action: 'bulkUpdateField', field, oldValue, newValue });
    if (r.ok) { showToast(`Actualizado en ${r.updated} nota(s)`); await loadIdeas(); }
    else { showToast(r.error || 'Error al renombrar'); renderSidebarFilters(); }
  } catch(e) { showToast('Error de red'); renderSidebarFilters(); }
}

function toIsoDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function setQuickDateFilter(mode) {
  const now = new Date();
  let start, end;
  if (mode === 'hoy') {
    start = end = toIsoDate(now);
  } else if (mode === 'semana') {
    const d = new Date(now);
    const dayOfWeek = (d.getDay() + 6) % 7; // lunes=0
    d.setDate(d.getDate() - dayOfWeek);
    start = toIsoDate(d);
    end = toIsoDate(now);
  } else if (mode === 'mes') {
    start = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-01`;
    end = toIsoDate(now);
  } else if (mode === 'anio') {
    start = `${now.getFullYear()}-01-01`;
    end = toIsoDate(now);
  }
  dateFilter = { mode, start, end };
  renderDateFilterPanel();
  renderIdeas();
}

function setRangeDateFilter() {
  const start = document.getElementById('dateRangeStart').value || null;
  const end = document.getElementById('dateRangeEnd').value || null;
  if (!start && !end) { clearDateFilter(); return; }
  dateFilter = { mode: 'rango', start, end };
  renderDateFilterPanel();
  renderIdeas();
}

function clearDateFilter() {
  dateFilter = { mode: null, start: null, end: null };
  renderDateFilterPanel();
  renderIdeas();
}

function toggleFilter(category, value) {
  // Si el valor ya estaba marcado como excluido, un clic normal lo quita de la exclusión primero
  const exIdx = excludedFilters[category].indexOf(value);
  if (exIdx > -1) { excludedFilters[category].splice(exIdx, 1); renderSidebarFilters(); renderIdeas(); return; }

  if (!isMultiSelect) {
    const wasActive = filters[category].includes(value);
    filters = { proyectos: [], tipos: [], animos: [], etiquetas: [] };
    if (!wasActive) filters[category].push(value);
  } else {
    const arr = filters[category]; const idx = arr.indexOf(value);
    if (idx > -1) arr.splice(idx, 1); else arr.push(value);
  }
  renderSidebarFilters(); renderIdeas();
}

// Clic derecho sobre un filtro: lo marca para EXCLUIR (en vez de incluir) esa nota
function toggleExcludeFilter(category, value) {
  if (!isMultiSelect) { showToast('Activa "Selección múltiple" para poder excluir filtros'); return; }
  filters[category] = filters[category].filter(v => v !== value); // si estaba incluido, lo quitamos de ahí
  const idx = excludedFilters[category].indexOf(value);
  if (idx > -1) excludedFilters[category].splice(idx, 1); else excludedFilters[category].push(value);
  renderSidebarFilters(); renderIdeas();
}

function clearAllFilters() {
  filters = { proyectos: [], tipos: [], animos: [], etiquetas: [] };
  excludedFilters = { proyectos: [], tipos: [], animos: [], etiquetas: [] };
  renderSidebarFilters(); renderIdeas();
}

// ── Render ideas ─────────────────────────────────────────────
function renderIdeas() {
  const grid = document.getElementById('ideasGrid');
  const search = document.getElementById('searchInput').value.toLowerCase().trim();
  let list = [...allIdeas].reverse();

  if (currentView === 'favoritas') list = list.filter(i => i.favorita);

  // ── Filtros por categoría con modo de combinación (AND / OR / NOT) ──
  const hasIncludeFilters = filters.proyectos.length || filters.tipos.length || filters.animos.length || filters.etiquetas.length;
  const hasExcludeFilters = excludedFilters.proyectos.length || excludedFilters.tipos.length || excludedFilters.animos.length || excludedFilters.etiquetas.length;

  const matchesCategory = (idea, keyName, value) => {
    if (keyName === 'etiquetas') return idea.etiquetas && idea.etiquetas.some(t => t.toLowerCase() === value);
    if (keyName === 'proyectos') return (idea.proyecto || 'general').toLowerCase() === value;
    if (keyName === 'tipos')     return (idea.tipo || 'nota').toLowerCase() === value;
    if (keyName === 'animos')    return (idea.animo || '').toLowerCase() === value;
    return false;
  };

  if (hasIncludeFilters) {
    // Reunimos todas las condiciones activas (de cualquier categoría) en una sola lista
    const allConditions = [];
    Object.keys(filters).forEach(keyName => filters[keyName].forEach(value => allConditions.push([keyName, value])));

    if (combineMode === 'AND') {
      list = list.filter(idea => allConditions.every(([k, v]) => matchesCategory(idea, k, v)));
    } else if (combineMode === 'OR') {
      list = list.filter(idea => allConditions.some(([k, v]) => matchesCategory(idea, k, v)));
    } else if (combineMode === 'NOT') {
      // "Ninguna": la nota se descarta si cumple CUALQUIERA de las condiciones seleccionadas
      list = list.filter(idea => !allConditions.some(([k, v]) => matchesCategory(idea, k, v)));
    }
  }

  // Exclusiones individuales marcadas con clic derecho (siempre se restan, sin importar el modo)
  if (hasExcludeFilters) {
    const excludeConditions = [];
    Object.keys(excludedFilters).forEach(keyName => excludedFilters[keyName].forEach(value => excludeConditions.push([keyName, value])));
    list = list.filter(idea => !excludeConditions.some(([k, v]) => matchesCategory(idea, k, v)));
  }

  // ── Filtro por fecha ────────────────────────────────────────
  if (dateFilter.mode) {
    list = list.filter(idea => {
      if (!idea.fecha) return false;
      const ideaDate = idea.fecha; // formato 'yyyy-MM-dd', comparable como string
      if (dateFilter.mode === 'rango') {
        if (dateFilter.start && ideaDate < dateFilter.start) return false;
        if (dateFilter.end && ideaDate > dateFilter.end) return false;
        return true;
      }
      return ideaDate >= dateFilter.start && ideaDate <= dateFilter.end;
    });
  }

  if (search) {
    list = list.filter(i => (i.contenido && i.contenido.toLowerCase().includes(search)) || (i.etiquetas && i.etiquetas.some(t => t.toLowerCase().includes(search))) || (i.animo && i.animo.toLowerCase().includes(search)) || (i.proyecto && i.proyecto.toLowerCase().includes(search)) || (i.tipo && i.tipo.toLowerCase().includes(search)) || (i.accion && i.accion.toLowerCase().includes(search)));
  }

  // ── Orden seleccionado por el usuario ──────────────────────
  const sortMode = document.getElementById('sortSelect').value;
  const plainText = (idea) => {
    const tmp = document.createElement('div'); tmp.innerHTML = idea.contenido || ''; return (tmp.innerText || '').toLowerCase();
  };
  if (sortMode === 'fecha-asc') list.reverse(); // ya viene más reciente primero por el .reverse() de arriba
  else if (sortMode === 'proyecto') list.sort((a, b) => (a.proyecto || 'general').localeCompare(b.proyecto || 'general'));
  else if (sortMode === 'tipo') list.sort((a, b) => (a.tipo || 'nota').localeCompare(b.tipo || 'nota'));
  else if (sortMode === 'animo') list.sort((a, b) => (a.animo || '').localeCompare(b.animo || ''));
  else if (sortMode === 'alfabetico') list.sort((a, b) => plainText(a).localeCompare(plainText(b)));
  // 'fecha-desc' es el orden por defecto (ya aplicado arriba), no requiere acción adicional

  const isFiltered = hasIncludeFilters || hasExcludeFilters || !!dateFilter.mode;
  document.getElementById('clearFiltersBtn').classList.toggle('visible', isFiltered);
  document.getElementById('countBar').textContent = list.length === 1 ? '1 registro' : `${list.length} registros`;

  if (list.length === 0) { grid.innerHTML = `<div class="empty"><div class="emoji">✦</div><p>No hay resultados para esta selección.</p></div>`; return; }

  grid.innerHTML = list.map(idea => `
    <div class="idea-card" data-id="${idea.id}">
      <div class="card-top-meta">
         <span class="proyecto">${escHtml(idea.proyecto || 'General')}</span>
         <span>${escHtml(idea.tipo || 'Nota')}</span>
      </div>
      
      <div class="card-text" id="text-${idea.id}" contenteditable="true" onblur="saveCardEdit('${idea.id}', this)" onmouseup="checkCardSelection(event, '${idea.id}')" onkeydown="handleBulletEnter(event)">${sanitizeHtml(idea.contenido)}</div>
      
${idea.leccion ? `
      <details class="tutor-box" style="cursor:pointer; outline:none;">
         <summary style="color:#0ea5e9; font-weight:500; margin-bottom:4px;">💡 Ver lección de inglés</summary>
         <div style="margin-top:6px; cursor:text;">
           <div class="original"><strong style="color:#ef4444;">❌ Escribiste:</strong> ${escHtml(idea.original)}</div>
           <div><strong style="color:#0ea5e9;">📘 Lección:</strong> ${escHtml(idea.leccion).replace(/\n/g, ' ')}</div>
         </div>
      </details>` : ''}

      ${idea.accion ? `<div class="card-accion">👉 ${escHtml(idea.accion)}</div>` : ''}
      
      <div class="card-tags" style="margin-top: 6px;">
        ${(idea.etiquetas || []).map(t => `<span class="tag-pill" onclick="toggleFilter('etiquetas', '${escHtml(t.toLowerCase())}')">${escHtml(t)}</span>`).join('')}
      </div>
      <div class="card-meta">
        <span>${idea.fecha || ''} ${idea.animo ? '· ' + escHtml(idea.animo) : ''}</span>
        <div class="card-actions">
          <button class="btn-copy" onclick="copyIdeaText('${idea.id}', this)" title="Copiar texto">📋</button>
          <button class="icon-btn" onclick="startEdit('${idea.id}')" title="Editar">✏️</button>
          <button class="icon-btn fav" onclick="toggleFav('${idea.id}', this)" title="Favorita">${idea.favorita ? '⭐' : '🔲'}</button>
          <button class="icon-btn" onclick="deleteIdea('${idea.id}')" title="Eliminar">🗑</button>
        </div>
      </div>
    </div>
  `).join('');
}

let suggestionLists = { proyecto: [], tipo: [], animo: [] };
function extractDynamicLists() {
  const getUnique = (key) => [...new Set(allIdeas.map(i => i[key]).filter(v => v && v.trim() !== ''))];
  suggestionLists.proyecto = [...new Set([...getUnique('proyecto'), ...pendingNewValues.proyecto])].sort((a,b)=>a.localeCompare(b));
  suggestionLists.tipo     = [...new Set([...getUnique('tipo'), ...pendingNewValues.tipo])].sort((a,b)=>a.localeCompare(b));
  suggestionLists.animo    = [...new Set([...getUnique('animo'), ...pendingNewValues.animo])].sort((a,b)=>a.localeCompare(b));
}

// ── Dropdown híbrido: escribes libre O eliges de la lista con la flechita ──
function toggleHybridDropdown(field) {
  const dropdown = document.getElementById(`dropdown-${field}`);
  const isOpen = dropdown.classList.contains('open');
  closeAllHybridDropdowns();
  if (!isOpen) { renderHybridDropdownList(field, ''); dropdown.classList.add('open'); }
}

function filterHybridDropdown(field) {
  const inputVal = document.getElementById(`input${field.charAt(0).toUpperCase()+field.slice(1)}`).value.toLowerCase();
  renderHybridDropdownList(field, inputVal);
  document.getElementById(`dropdown-${field}`).classList.add('open');
}

function renderHybridDropdownList(field, filterText) {
  const dropdown = document.getElementById(`dropdown-${field}`);
  const options = (suggestionLists[field] || []).filter(v => v.toLowerCase().includes(filterText));
  if (options.length === 0) {
    dropdown.innerHTML = `<div class="hybrid-dropdown-empty">Sin coincidencias. Puedes escribir uno nuevo.</div>`;
    return;
  }
  dropdown.innerHTML = options.map(v =>
    `<div class="hybrid-dropdown-item" onclick="selectHybridOption('${field}', '${escHtml(v)}')">${escHtml(v)}</div>`
  ).join('');
}

function selectHybridOption(field, value) {
  const inputId = `input${field.charAt(0).toUpperCase()+field.slice(1)}`;
  document.getElementById(inputId).value = value;
  closeAllHybridDropdowns();
}

function closeAllHybridDropdowns() { document.querySelectorAll('.hybrid-dropdown').forEach(d => d.classList.remove('open')); }
document.addEventListener('mousedown', (e) => { if (!e.target.closest('.hybrid-select-wrap')) closeAllHybridDropdowns(); });

// ── Favorita / Delete ─────────────────────────────────────────
async function toggleFav(id, btn) {
  const isFav = btn.textContent.trim() === '🔲'; btn.textContent = isFav ? '⭐' : '🔲';
  const idea = allIdeas.find(i => i.id === id); if (idea) idea.favorita = isFav;
  try { await postGAS({ action: 'toggleFav', id }); } catch(e) { btn.textContent = !isFav ? '⭐' : '🔲'; if (idea) idea.favorita = !isFav; }
}
async function deleteIdea(id) {
  if (!confirm('¿Eliminar esta idea?')) return;
  try { await postGAS({ action: 'deleteIdea', id }); allIdeas = allIdeas.filter(i => i.id !== id); renderSidebarFilters(); renderIdeas(); showToast('Eliminada'); } catch(e) {}
}

async function requestAutoFill(fromChat = false, useClaude = false) {
  const inputEl = document.getElementById('inputContenido');
  const text = inputEl.innerText.trim();
  if (!text && aiConversation.length === 0) { showToast('Escribe tu nota cruda primero'); return; }

  const btn = document.getElementById('btnAutoFill'); const sp = document.getElementById('aiSpinner'); const txt = document.getElementById('aiText');
  btn.disabled = true; sp.style.display = 'inline-block'; txt.textContent = 'Pensando...';
  inputEl.classList.add('blinking-gold');

  // Recolectar lo que YA escribiste para que la IA lo mejore
  const currentContext = {
    proyecto: document.getElementById('inputProyecto').value.trim(),
    tipo: document.getElementById('inputTipo').value.trim(),
    animo: document.getElementById('inputAnimo').value.trim(),
    accion: document.getElementById('inputAccion').value.trim()
  };

 try {
    // Extraemos tus categorías actuales para que la IA no invente
    const existingProyectos = [...new Set(allIdeas.map(i => i.proyecto).filter(Boolean))];
    const existingTipos = [...new Set(allIdeas.map(i => i.tipo).filter(Boolean))];
    const existingAnimos = [...new Set(allIdeas.map(i => i.animo).filter(Boolean))];

    const r = await postGAS({ 
      action: 'autoFill', 
      text: text, 
      current: currentContext, 
      conversacion: aiConversation,
      existingTags: allTags.map(t => t.etiqueta),
      existingProyectos: existingProyectos,
      existingTipos: existingTipos,
      existingAnimos: existingAnimos,
      useClaude: useClaude
    });

    // ── Solo si AMBAS IAs fallaron mostramos el aviso ──
    if (!r.ok && r.quotaExceeded) {
      btn.disabled = false; sp.style.display = 'none'; txt.textContent = '🪄 Asistente & Tutor IA';
      inputEl.classList.remove('blinking-gold');
      showToast('⚠️ IA no disponible en este momento. Intenta más tarde.');
      return;
    }

if (r.ok && r.data) {
       // Llenar formulario con la magia
       if (r.data.contenido) inputEl.innerText = r.data.contenido;
       if (r.data.proyecto)  document.getElementById('inputProyecto').value = r.data.proyecto;
       if (r.data.tipo)      document.getElementById('inputTipo').value = r.data.tipo;
       if (r.data.animo)     document.getElementById('inputAnimo').value = r.data.animo;
       if (r.data.accion)    document.getElementById('inputAccion').value = r.data.accion;
       
       if (r.data.original)  document.getElementById('inputOriginal').value = r.data.original;
       if (r.data.leccion)   document.getElementById('inputLeccion').value = r.data.leccion;
       
       if (r.data.etiquetas && Array.isArray(r.data.etiquetas)) {
          selectedTags = [...new Set([...selectedTags, ...r.data.etiquetas.map(t => t.toLowerCase().trim().replace(/\s+/g, '-'))])];
          renderModalTagCloud();
       }

       if (r.data.leccion) {
         const tp = document.getElementById('tutorPreview');
         tp.style.display = 'block';
         tp.innerHTML = `<strong>💡 Lección detectada:</strong> ${escHtml(r.data.leccion).replace(/\n/g, ' ')}`;
       } else { document.getElementById('tutorPreview').style.display = 'none'; }

       const modelLabel = r.usedModel === 'claude' ? '✨ Listo (vía Claude)' : '✨ Listo';
       showToast(modelLabel);
       
       document.getElementById('chatSection').style.display = 'block';
       if (!fromChat && aiConversation.length === 0) {
          aiConversation.push({ role: 'user', content: `Analiza esta nota:\n\n${text}` });
       }
       aiConversation.push({ role: 'assistant', content: r.rawAiResponse });
       appendChatMsg('ai', "He ajustado los campos. Si quieres cambiar algo, dímelo aquí.");
    } else {
       throw new Error(r.error || 'Error desconocido');
    }
  } catch(e) {
    // AHORA TE MOSTRARÁ EL ERROR REAL EN PANTALLA
    showToast(e.message || 'Error en la IA'); 
  }

  btn.disabled = false; sp.style.display = 'none'; txt.textContent = '🪄 Asistente & Tutor IA';
  inputEl.classList.remove('blinking-gold');
}

function sendChatMsg() {
  const input = document.getElementById('chatInput');
  const msg = input.value.trim();
  if (!msg) return;
  input.value = '';
  appendChatMsg('user', msg);
  aiConversation.push({ role: 'user', content: msg });
  requestAutoFill(true, usingClaude); // Mantiene el proveedor elegido
}

function appendChatMsg(role, text) {
  const box = document.getElementById('chatBox');
  const div = document.createElement('div'); div.className = `chat-msg ${role}`; div.textContent = text;
  box.appendChild(div); box.scrollTop = box.scrollHeight;
}

function renderModalTagCloud() {
  const container = document.getElementById('modalTagCloud');
  const allKnown = [...new Set([...getCounts('etiquetas').map(e=>e[0]), ...pendingNewValues.etiqueta.map(t=>t.toLowerCase()), ...selectedTags])];
  const filterText = (document.getElementById('tagInput').value || '').toLowerCase().trim();
  const filtered = filterText ? allKnown.filter(t => t.includes(filterText)) : allKnown;
  if (allKnown.length === 0) { container.innerHTML = '<span style="color:var(--ink-3);font-size:12px;">Sin etiquetas</span>'; }
  else if (filtered.length === 0) { container.innerHTML = '<span style="color:var(--ink-3);font-size:12px;">Sin coincidencias. Presiona Enter para crearla.</span>'; }
  else {
    container.innerHTML = filtered.map(t => {
      const isActive = selectedTags.includes(t);
      return `<span class="selectable-tag ${isActive ? 'active' : ''}" onclick="toggleModalTag('${escHtml(t)}')">${escHtml(t)}</span>`;
    }).join('');
  }
  renderSelectedTagsPanel();
}

// Muestra, debajo del buscador, las etiquetas ya elegidas para esta nota (como chips removibles)
function renderSelectedTagsPanel() {
  const panel = document.getElementById('selectedTagsPanel');
  if (!panel) return;
  if (selectedTags.length === 0) { panel.innerHTML = ''; return; }
  panel.innerHTML = `
    <div class="selected-tags-label">Etiquetas de esta nota (${selectedTags.length})</div>
    <div class="selected-tags-row">
      ${selectedTags.map(t => `<span class="selected-tag-chip">${escHtml(t)}<button type="button" onclick="toggleModalTag('${escHtml(t)}')" title="Quitar">✕</button></span>`).join('')}
    </div>`;
}

function toggleModalTag(tag) {
  const clean = tag.toLowerCase().trim(); const idx = selectedTags.indexOf(clean);
  if (idx > -1) selectedTags.splice(idx, 1); else selectedTags.push(clean);
  renderModalTagCloud();
}

function addTag(tag) { const clean = tag.toLowerCase().trim().replace(/\s+/g, '-'); if (clean && !selectedTags.includes(clean)) { selectedTags.push(clean); renderModalTagCloud(); } }
function handleTagInput(e) { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); const v = document.getElementById('tagInput').value.trim(); if (v) { addTag(v); document.getElementById('tagInput').value = ''; renderModalTagCloud(); } } }

async function saveIdea() {
  const contenidoEl = document.getElementById('inputContenido');
  const contenido = sanitizeHtml(contenidoEl.innerHTML.trim());
  const plainCheck = contenidoEl.innerText.trim();
  if (!plainCheck) { showToast('Escribe algo primero'); return; }
  const tagInputVal = document.getElementById('tagInput').value.trim();
  if (tagInputVal) addTag(tagInputVal);

  const editId = document.getElementById('editIdeaId').value;
  const body = {
    contenido: contenido, etiquetas: selectedTags,
    animo: document.getElementById('inputAnimo').value.trim(),
    proyecto: document.getElementById('inputProyecto').value.trim(),
    tipo: document.getElementById('inputTipo').value.trim(),
    accion: document.getElementById('inputAccion').value.trim(),
    original: document.getElementById('inputOriginal').value,
    leccion: document.getElementById('inputLeccion').value
  };

  const btn = document.getElementById('btnSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    let r;
    if (editId) {
       body.action = 'updateIdea'; body.id = editId; body.text = contenido; 
       r = await postGAS(body);
    } else {
       body.action = 'saveIdea'; r = await postGAS(body);
    }
    if (r.ok) { closeModal(true); showToast('Guardado ✦'); await loadIdeas(); } else showToast('Error');
  } catch(e) { showToast('Error de red'); }
  btn.disabled = false; btn.textContent = 'Guardar';
}

// ── Edición (Ahora abre el modal unificado) ──────────────────
function startEdit(id) {
  const idea = allIdeas.find(i => i.id === id);
  if(!idea) return;
  openModal();
  document.getElementById('modalTitle').textContent = 'Editar Entrada';
  document.getElementById('editIdeaId').value = idea.id;
  document.getElementById('inputContenido').innerHTML = sanitizeHtml(idea.contenido || '');
  document.getElementById('inputProyecto').value = idea.proyecto || '';
  document.getElementById('inputTipo').value = idea.tipo || '';
  document.getElementById('inputAnimo').value = idea.animo || '';
  document.getElementById('inputAccion').value = idea.accion || '';
  document.getElementById('inputOriginal').value = idea.original || '';
  document.getElementById('inputLeccion').value = idea.leccion || '';
  selectedTags = [...(idea.etiquetas || [])];
  
  if(idea.leccion) {
    const tp = document.getElementById('tutorPreview');
    tp.style.display = 'block'; tp.innerHTML = `<strong>💡 Lección previa:</strong> ${escHtml(idea.leccion).replace(/\n/g, ' ')}`;
  }
  renderModalTagCloud();
}

// Helpers
async function postGAS(body) { const form = new FormData(); form.append('payload', JSON.stringify(body)); const r = await fetch(GAS_URL, { method: 'POST', body: form }); return r.json(); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let toastTimer; function showToast(msg) { const existing = document.querySelector('.toast'); if (existing) existing.remove(); clearTimeout(toastTimer); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 2800); }

init();
</script>
