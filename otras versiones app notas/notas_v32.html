// Tag management in project form cell
function v29FilterTagCloud(ideaId, query) {
  const cloud=document.getElementById('ptTagCloud-'+ideaId);if(!cloud)return;
  const q=query.toLowerCase().trim();
  const idea=allIdeas.find(i=>i.id===ideaId);
  const existing=(idea&&idea.etiquetas)||[];
  const allKnown=[...new Set([...getCounts('etiquetas').map(e=>e[0]),...existing])];
  const filtered=q?allKnown.filter(t=>t.toLowerCase().includes(q)):allKnown;
  cloud.innerHTML=filtered.slice(0,20).map(t=>{
    const isActive=existing.includes(t);
    return `<span class="selectable-tag ${isActive?'active':''}" onclick="v29TogTag('${ideaId}','${escHtml(t)}')" oncontextmenu="event.stopPropagation();v28TagColorMenu(event,'${escHtml(t)}')">${escHtml(t)}</span>`;
  }).join('');
}

function v29TogTag(ideaId, tag) {
  const clean=tag.toLowerCase().trim();
  const idea=allIdeas.find(i=>i.id===ideaId);if(!idea)return;
  if(!idea.etiquetas)idea.etiquetas=[];
  const idx=idea.etiquetas.indexOf(clean);
  if(idx>-1)idea.etiquetas.splice(idx,1); else idea.etiquetas.push(clean);
  v29RefreshChips(ideaId,idea.etiquetas);
  v29FilterTagCloud(ideaId,document.getElementById('ptTagIn-'+ideaId)?.value||'');
  postGAS({action:'updateIdea',id:ideaId,text:idea.contenido||'',etiquetas:idea.etiquetas}).catch(()=>{});
}

function v29AddTag(ideaId, text) {
  const clean=text.trim().toLowerCase().replace(/\s+/g,'-');if(!clean)return;
  const idea=allIdeas.find(i=>i.id===ideaId);if(!idea)return;
  if(!idea.etiquetas)idea.etiquetas=[];
  if(!idea.etiquetas.includes(clean))idea.etiquetas.push(clean);
  v29RefreshChips(ideaId,idea.etiquetas);
  v29FilterTagCloud(ideaId,'');
  postGAS({action:'updateIdea',id:ideaId,text:idea.contenido||'',etiquetas:idea.etiquetas}).catch(()=>{});
}

function v29RmTag(ideaId, tag) {
  const idea=allIdeas.find(i=>i.id===ideaId);if(!idea)return;
  idea.etiquetas=(idea.etiquetas||[]).filter(t=>t!==tag);
  v29RefreshChips(ideaId,idea.etiquetas);
  v29FilterTagCloud(ideaId,document.getElementById('ptTagIn-'+ideaId)?.value||'');
  postGAS({action:'updateIdea',id:ideaId,text:idea.contenido||'',etiquetas:idea.etiquetas}).catch(()=>{});
}

function v29RefreshChips(ideaId, tags) {
  const chips=document.getElementById('ptChips-'+ideaId);if(!chips)return;
  chips.innerHTML=(tags||[]).map(t=>`<span class="selected-tag-chip">${escHtml(t)}<button type="button" onclick="v29RmTag('${ideaId}','${escHtml(t)}')" style="background:none;border:none;cursor:pointer;color:#a8801a;padding:0 3px;font-size:13px;line-height:1;">✕</button></span>`).join('');
}

// Render project table in split right panel
function v30RenderPtInSplitRight() {
  // Find or create the target container
  let target = document.getElementById('v30ptRight');
  if (!target) {
    const sr = document.getElementById('v27sr'); if(!sr)return;
    // Replace content after the mode bar
    const modeBar = sr.querySelector('.split-mode-row');
    let holder = sr.querySelector('#v30noteHolder,#v30ptRight');
    if (holder) holder.remove();
    target = document.createElement('div');
    target.id = 'v30ptRight';
    target.style.cssText = 'flex:1;overflow:hidden;display:flex;flex-direction:column;';
    sr.appendChild(target);
  }

  // Get current list from last render (stored globally)
  const list = window.v30LastList || allIdeas.slice().reverse();
  const cols = window.v27PtCols;
  const cw = {orig:200, cont:260, lec:200};

  const groups={},order=[];
  list.forEach(idea=>{const p=(idea.proyecto||'general').toLowerCase()||'general';if(!groups[p]){groups[p]=[];order.push(p);}groups[p].push(idea);});
  order.sort((a,b)=>{const aT=a==='task',bT=b==='task';if(aT&&!bT)return-1;if(!aT&&bT)return 1;return v27SortKey(a).localeCompare(v27SortKey(b));});

  let thead='<tr><th class="pt-th" style="min-width:260px;">Formulario</th>';
  if(cols.orig)thead+=`<th class="pt-th" id="ptH-orig" style="width:${cw.orig}px;">Original</th>`;
  if(cols.cont)thead+=`<th class="pt-th" id="ptH-cont" style="width:${cw.cont}px;">Contenido IA</th>`;
  if(cols.lec) thead+=`<th class="pt-th" id="ptH-lec" style="width:${cw.lec}px;">Lección</th>`;
  thead+='</tr>';

  let rows='';
  order.forEach(proj=>{
    const ideas=groups[proj],isTask=proj==='task';
    const projLabel=ideas[0].proyecto||'General';
    window.v27CurrentProj=projLabel;
    const nc=1+(cols.orig?1:0)+(cols.cont?1:0)+(cols.lec?1:0);
    rows+=`<tr><td colspan="${nc}" style="background:var(--cream-2);font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;padding:5px 10px;border-bottom:2px solid var(--line);">${isTask?'⚡ ':'📁 '}${escHtml(projLabel)}</td></tr>`;
    ideas.forEach(idea=>{
      const oid='ptO-'+idea.id,cid='ptC-'+idea.id,lid='ptL-'+idea.id;
      const isSelected=window.v27SplitSelId===idea.id;
      let row=`<tr id="ptRow-${idea.id}" style="${isSelected?'background:var(--gold-light);':''}">`
        +`<td style="vertical-align:top;border-right:1px solid var(--line);">${v29BuildFormCell(idea)}</td>`;
      if(cols.orig)row+=`<td style="vertical-align:top;border-right:1px solid var(--line);"><div class="pt-content-cell" id="${oid}" contenteditable="true" onblur="v30SaveOrig('${idea.id}','${oid}')" oninput="v30DebounceOrig('${idea.id}',this)" style="font-size:12px;">${sanitizeHtml(idea.original)||''}</div></td>`;
      if(cols.cont)row+=`<td style="vertical-align:top;border-right:1px solid var(--line);"><div class="pt-content-cell" id="${cid}" contenteditable="true" onblur="v27SaveCont('${idea.id}','${cid}')" oninput="v29DebounceSave('${idea.id}',this)">${sanitizeHtml(idea.contenido)}</div></td>`;
      if(cols.lec) row+=`<td style="vertical-align:top;"><div class="pt-content-cell" id="${lid}" contenteditable="true" onblur="v27SaveLec('${idea.id}','${lid}')" oninput="v29DebounceField('${idea.id}','lec',this)">${sanitizeHtml(idea.leccion)||''}</div></td>`;
      row+='</tr>';rows+=row;

function v31InitCol1Resize(){
  var th=document.querySelector('.pt-table thead th');
  if(!th||th.querySelector('.pt-col1-resizer'))return;
  var handle=document.createElement('div');handle.className='pt-col1-resizer';
  handle.onmousedown=function(e){
    e.preventDefault();handle.classList.add('dragging');
    var startX=e.pageX,startW=th.offsetWidth;
    function onMove(e2){
      var nw=Math.max(160,startW+e2.pageX-startX);
      th.style.width=nw+'px';th.style.minWidth=nw+'px';
      document.querySelectorAll('.pt-table td:first-child').forEach(function(td){td.style.width=nw+'px';});
    }
    function onUp(){handle.classList.remove('dragging');document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}
    document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
  };
  th.style.position='relative';th.appendChild(handle);
}

function v32SplitHi(cid,sid){var el=document.getElementById(cid);if(!el)return;el.focus();var sel=window.getSelection();var isHi=false;if(sel&&!sel.isCollapsed){var c=sel.getRangeAt(0).commonAncestorContainer;var n=c.nodeType===3?c.parentNode:c;var bg=window.getComputedStyle(n).backgroundColor;isHi=bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'&&bg!=='rgb(255, 255, 255)';}document.execCommand('hiliteColor',false,isHi?'transparent':(lastHilite||'#fef08a'));v29DebounceSave(sid,el);}

// ── Row ordering in proyecto table ─────────────────────────────────────────
function v32GetOrder(proj){return window.v32RowOrder[proj.toLowerCase()]||[];}
function v32SaveOrder(proj,ids){window.v32RowOrder[proj.toLowerCase()]=ids;localStorage.setItem('notas-row-order',JSON.stringify(window.v32RowOrder));}

function v32MoveRow(id,dir){
  var idea=allIdeas.find(function(i){return i.id===id;});if(!idea)return;
  var proj=(idea.proyecto||'general').toLowerCase();
  var order=v32GetOrder(proj);
  // Build current order from DOM
  var rows=document.querySelectorAll('[id^="ptRow-"]');
  var currentIds=[...rows].map(function(r){return r.id.replace('ptRow-','');}).filter(function(i){
    var a=allIdeas.find(function(n){return n.id===i;});
    return a&&(a.proyecto||'general').toLowerCase()===proj;
  });
  if(!currentIds.length)return;
  var idx=currentIds.indexOf(id);
  if(idx<0)return;
  if(dir==='up'&&idx>0){var tmp=currentIds[idx-1];currentIds[idx-1]=currentIds[idx];currentIds[idx]=tmp;}
  else if(dir==='down'&&idx<currentIds.length-1){var tmp2=currentIds[idx+1];currentIds[idx+1]=currentIds[idx];currentIds[idx]=tmp2;}
  else return;
  v32SaveOrder(proj,currentIds);
  renderIdeas();
}

// Override v27RenderProyecto to use custom order
var _origRP32=v27RenderProyecto;
v27RenderProyecto=function(list){
  // Apply custom order within each project group
  var groups={};
  list.forEach(function(idea){var p=(idea.proyecto||'general').toLowerCase()||'general';if(!groups[p])groups[p]=[];groups[p].push(idea);});
  Object.keys(groups).forEach(function(proj){
    var order=v32GetOrder(proj);
    if(order.length){
      var ordered=[];
      order.forEach(function(id){var i=groups[proj].find(function(n){return n.id===id;});if(i)ordered.push(i);});
      groups[proj].forEach(function(i){if(!ordered.find(function(n){return n.id===i.id;}))ordered.push(i);});
      groups[proj]=ordered;
    }
  });
  // Rebuild list with order applied
  var newList=[];
  var order2=[];
  list.forEach(function(i){var p=(i.proyecto||'general').toLowerCase()||'general';if(!order2.includes(p))order2.push(p);});
  order2.forEach(function(p){if(groups[p])newList=newList.concat(groups[p]);});
  _origRP32(newList.length?newList:list);
};
