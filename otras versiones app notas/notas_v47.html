<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ideas ✦ v47</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Reset & base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --ink: #1a1814; --ink-2: #5a5650; --ink-3: #9a9590;
  --cream: #faf8f4; --cream-2: #f2efe9; --cream-3: #e8e4dc; --line: rgba(26,24,20,0.10);
  --gold: #c9973a; --gold-light: #fdf3e1; --radius: 12px; --card-min: 280px;
  --font-serif: 'Instrument Serif', Georgia, serif; --font-sans: 'DM Sans', sans-serif;
}
html, body { height: 100%; font-family: var(--font-sans); background: var(--cream); color: var(--ink); font-size: 14px; line-height: 1.6; }

/* ── Layout ───────────────────────────────────────────────── */
.app { display: flex; height: 100vh; overflow: hidden; }
.sidebar { width: 240px; flex-shrink: 0; background: var(--cream-2); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 24px 0; overflow-y: auto; transition: width 0.25s ease, padding 0.25s ease, opacity 0.2s ease; }
.sidebar.collapsed { width: 0; padding: 0; opacity: 0; overflow: hidden; pointer-events: none; border-right: none; }
.sidebar-logo { font-family: var(--font-serif); font-size: 20px; padding: 0 20px 20px; border-bottom: 1px solid var(--line); margin-bottom: 16px; color: var(--ink); letter-spacing: -0.3px; display: flex; justify-content: space-between; align-items: center; }
.sidebar-logo span { color: var(--gold); cursor: pointer; user-select: none; transition: opacity 0.15s; }
.sidebar-logo span:hover { opacity: 0.75; }
/* Botón flotante para reabrir sidebar */
.sidebar-reopen { display: none; align-items: center; justify-content: center; padding: 8px 12px; background: var(--cream-2); border: 1px solid var(--line); border-left: none; border-radius: 0 8px 8px 0; cursor: pointer; font-family: var(--font-serif); font-size: 13px; color: var(--gold); transition: background 0.15s; flex-shrink: 0; white-space: nowrap; gap: 4px; }
.sidebar-reopen:hover { background: var(--cream-3); }
.app.sidebar-hidden .sidebar-reopen { display: flex; }

/* Switch de selección múltiple */
.multi-toggle { font-family: var(--font-sans); font-size: 11px; font-weight: 500; color: var(--ink-2); display: flex; align-items: center; gap: 6px; cursor: pointer; background: #fff; padding: 4px 10px; border-radius: 20px; border: 1px solid var(--line); }
.multi-toggle input { margin: 0; cursor: pointer; }
.multi-toggle:hover { border-color: var(--gold); }

/* Selector de modo de combinación: Todas a la vez (Y) / Cualquiera (O) / Ninguna (NOT) */
.combine-mode-row { display: flex; gap: 3px; background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 3px; }
.combine-mode-btn { flex: 1; padding: 5px 6px; border: none; background: none; border-radius: 16px; cursor: pointer; font-family: var(--font-sans); font-size: 10.5px; font-weight: 500; color: var(--ink-3); transition: background 0.15s, color 0.15s; white-space: nowrap; }
.combine-mode-btn:hover { color: var(--ink); }
.combine-mode-btn.active { background: var(--ink); color: var(--cream); }

/* Panel de filtro por fecha */
.date-filter-panel { background: #fff; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-top: 6px; }
.date-quick-row { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.date-quick-btn { padding: 4px 9px; border-radius: 14px; border: 1px solid var(--line); background: var(--cream-2); cursor: pointer; font-family: var(--font-sans); font-size: 10.5px; color: var(--ink-2); transition: background 0.15s; }
.date-quick-btn:hover { background: var(--cream-3); }
.date-quick-btn.active { background: var(--gold-light); border-color: var(--gold); color: #7a5a10; }
.date-range-row { display: flex; flex-direction: column; gap: 6px; }
.date-range-row input[type="date"] { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; font-family: var(--font-sans); font-size: 12px; outline: none; }
.date-range-row input[type="date"]:focus { border-color: var(--gold); }
.date-filter-clear { font-size: 11px; color: var(--ink-3); background: none; border: none; cursor: pointer; text-align: left; padding: 4px 0 0; }
.date-filter-clear:hover { color: var(--ink); }

.sidebar-section { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); padding: 0 20px 8px; margin-top: 20px; }
.filter-btn { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 20px; background: none; border: none; cursor: pointer; font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-2); text-align: left; transition: background 0.15s, color 0.15s; border-radius: 0; }
.filter-btn:hover { background: var(--cream-3); color: var(--ink); }
.filter-btn.active { background: var(--gold-light); color: #7a5a10; font-weight: 500; }
.filter-btn.excluded { background: #fde8e8; color: #b91c1c; font-weight: 500; text-decoration: line-through; }
.filter-btn.excluded .dot { background: #ef4444; }
.filter-btn .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--ink-3); }

/* Main */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; background: var(--cream); }
.search-wrap { flex: 1; position: relative; }
.search-wrap input { width: 100%; padding: 9px 12px 9px 36px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--cream-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; transition: border-color 0.15s; }
.search-wrap input:focus { border-color: var(--gold); background: #fff; }
.search-wrap .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--ink-3); font-size: 15px; pointer-events: none; }
.btn-add { display: flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: var(--radius); background: var(--ink); color: var(--cream); border: none; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; transition: background 0.15s; white-space: nowrap; }
.btn-add:hover { background: #333; }
.count-bar { padding: 8px 24px; font-size: 12px; color: var(--ink-3); border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: center; }
.clear-filters { font-size: 11px; background: var(--cream-3); padding: 2px 8px; border-radius: 12px; cursor: pointer; display: none; border:none; }
.clear-filters.visible { display: inline-block; }

/* Grid de ideas */
.ideas-wrap { flex: 1; overflow-y: auto; padding: 20px 24px; }
.ideas-grid { 
  display: grid; 
  grid-template-columns: repeat(auto-fill, minmax(var(--card-min),1fr));
  gap: 14px; align-items: start;
}



.idea-card {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: box-shadow 0.15s, border-color 0.15s;
  cursor: default;
  animation: fadeIn 0.2s ease;
}

/* Evita parpadeo visual de tarjetas dentro de Vista Proyecto */
.split-left .idea-card {
  animation: none !important;
}



.idea-card:hover { border-color: var(--cream-3); box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.card-top-meta { display: flex; justify-content: space-between; align-items: center; font-size: 11px; font-weight: 500; text-transform: uppercase; color: var(--ink-3); letter-spacing: 0.05em; margin-bottom: 4px; }
.card-top-meta .proyecto { color: var(--gold); }
.card-text { 
  font-size: 13.5px; 
  line-height: 1.65; 
  color: var(--ink); 
  flex: 1; 
  margin-bottom: 4px; 
  max-height: 250px; /* Límite de altura */
  overflow-y: auto;  /* Scroll automático si el texto es muy largo */
  white-space: pre-wrap; /* Respeta saltos de línea y espacios */
  word-break: break-word;
}
.card-accion { font-size: 12px; background: #fdfdfa; border: 1px dashed #dcdacb; padding: 8px 10px; border-radius: 6px; color: #5a5746; }
.card-tags { display: flex; flex-wrap: wrap; gap: 4px; }
.tag-pill { font-size: 11px; font-weight: 500; padding: 2px 9px; border-radius: 20px; cursor: pointer; transition: opacity 0.15s; background: var(--cream-2); color: var(--ink-2); border: 1px solid var(--line); }
.tag-pill:hover { opacity: 0.75; }

/* Tutor / Leccion Box UI */
.tutor-box { background:#f8fafc; border: 1px dashed #cbd5e1; padding:10px; border-radius:6px; margin-top:4px; font-size:12px; color:#334155; }
.tutor-box .original { margin-bottom: 6px; }
.tutor-box strong { font-weight: 500; }

.selectable-tag { font-size: 12px; font-weight: 500; padding: 5px 12px; border-radius: 20px; cursor: pointer; background: var(--cream-2); border: 1px solid var(--line); color: var(--ink-2); transition: all 0.15s; user-select: none; }
.selectable-tag:hover { border-color: var(--ink-3); }
.selectable-tag.active { background: var(--gold-light); color: #7a5a10; border-color: #e8c87a; }

/* Panel de etiquetas ya seleccionadas para esta nota (debajo del buscador) */
.selected-tags-label { font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px; }
.selected-tags-row { display: flex; flex-wrap: wrap; gap: 6px; }
.selected-tag-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 500; padding: 4px 6px 4px 12px; border-radius: 20px; background: var(--gold-light); color: #7a5a10; border: 1px solid #e8c87a; }
.selected-tag-chip button { background: none; border: none; cursor: pointer; color: #a8801a; font-size: 13px; padding: 2px 4px; line-height: 1; border-radius: 50%; transition: background 0.15s; }
.selected-tag-chip button:hover { background: rgba(122,90,16,0.15); }
.card-meta { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-3); margin-top: 4px; }
.card-actions { display: flex; gap: 6px; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 15px; padding: 2px; transition: color 0.15s; line-height: 1; }
.icon-btn:hover { color: var(--ink); }
.empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--ink-3); }
.empty .emoji { font-size: 40px; margin-bottom: 12px; }

/* ── Modal base ───────────────────────────────────────────── */
.overlay { position: fixed; inset: 0; background: rgba(26,24,20,0.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; animation: fadeOverlay 0.08s ease; }
@keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }
.modal { background: #fff; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15); animation: slideUp 0.2s ease; }
@keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-header { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; }
.modal-title { font-family: var(--font-serif); font-size: 20px; color: var(--ink); }
.modal-close { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 20px; line-height: 1; padding: 4px; transition: color 0.15s; }
.modal-close:hover { color: var(--ink); }
.modal-body { padding: 16px 24px 24px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
.field textarea, .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--cream-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; transition: border-color 0.15s; }
.field textarea { resize: vertical; min-height: 80px; }
.field textarea:focus, .field input:focus { border-color: var(--gold); background: #fff; }
.row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.btn-ai { display: flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: var(--radius); background: var(--gold-light); color: #7a5a10; border: 1px solid #e8c87a; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; transition: background 0.15s; }
.btn-ai:hover { background: #fbe8b8; }
.btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
.btn-cancel { padding: 9px 18px; border-radius: var(--radius); background: none; border: 1px solid var(--line); color: var(--ink-2); cursor: pointer; font-family: var(--font-sans); font-size: 13px; transition: background 0.15s; }
.btn-cancel:hover { background: var(--cream-2); }
.btn-save { padding: 9px 20px; border-radius: var(--radius); background: var(--ink); color: var(--cream); border: none; cursor: pointer; font-family: var(--font-sans); font-size: 13px; font-weight: 500; transition: background 0.15s; }
.btn-save:hover { background: #333; }
.btn-save:disabled { opacity: 0.4; cursor: not-allowed; }

/* Chat IA */
.chat-box { border: 1px solid var(--line); border-radius: var(--radius); background: var(--cream-2); max-height: 180px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.chat-msg { padding: 8px 12px; border-radius: 10px; font-size: 12.5px; line-height: 1.6; max-width: 90%; }
.chat-msg.ai { background: #fff; border: 1px solid var(--line); align-self: flex-start; color: var(--ink); }
.chat-msg.user { background: var(--ink); color: var(--cream); align-self: flex-end; }
.chat-input-row { display: flex; gap: 8px; margin-top: 8px; }
.chat-input-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; font-family: var(--font-sans); font-size: 13px; outline: none; }
.chat-input-row input:focus { border-color: var(--gold); }
.chat-send { padding: 8px 14px; border-radius: var(--radius); background: var(--ink); color: var(--cream); border: none; cursor: pointer; font-size: 13px; transition: background 0.15s; }
.chat-send:hover { background: #333; }

/* Toast */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--cream); padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 500; z-index: 999; animation: toastIn 0.2s ease; pointer-events: none; }
@keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
.spinner { display: inline-block; width: 14px; height: 14px; }
.spinner::after { content: ''; display: block; width: 14px; height: 14px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* CSS PARA EDICION INLINE */
@keyframes goldenBlink { 0% { box-shadow: 0 0 0px transparent; border-color: var(--line); } 50% { box-shadow: 0 0 8px rgba(201, 151, 58, 0.5); border-color: var(--gold); } 100% { box-shadow: 0 0 0px transparent; border-color: var(--line); } }
.blinking-gold { animation: goldenBlink 1.5s infinite; transition: border-color 0.3s; }
.edit-input { width: 100%; font-family: var(--font-sans); font-size: 13.5px; line-height: 1.65; border: 1px dashed var(--gold); background: var(--cream-2); border-radius: 6px; padding: 8px; outline: none; resize: vertical; margin-bottom: 8px; }
.edit-input-small { width: 100%; font-family: var(--font-sans); font-size: 12px; border: 1px dashed var(--gold); background: var(--cream-2); border-radius: 4px; padding: 5px; outline: none; }

/* ── Formato de texto ─────────────────────────────────────── */
.format-toolbar { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; padding: 6px; background: var(--cream-2); border: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; border-bottom: none; }
.format-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: #fff; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--ink-2); transition: background 0.15s, border-color 0.15s; padding: 0; }
.format-btn:hover { background: var(--cream-3); border-color: var(--ink-3); }
.format-btn.active { background: var(--gold-light); border-color: var(--gold); color: #7a5a10; }
.format-sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
.format-color-input { width: 28px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: #fff; }
.content-editable { width: 100%; min-height: 110px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); background: var(--cream-2); font-family: var(--font-sans); font-size: 13px; color: var(--ink); outline: none; transition: border-color 0.15s; white-space: pre-wrap; word-break: break-word; overflow-y: auto; max-height: 240px; }
.content-editable ul, .card-text ul { margin: 4px 0 4px 1.2em; padding: 0; }
.content-editable li, .card-text li { margin: 2px 0; }
.content-editable:focus { border-color: var(--gold); background: #fff; }
.content-editable:empty::before { content: attr(data-placeholder); color: var(--ink-3); }

/* ── Selector de color: botón + popup de 12 colores (posición relativa, nunca se va a la esquina) ── */
.color-btn-wrap { position: relative; display: inline-block; }
.color-popup { position: absolute; top: calc(100% + 6px); left: 0; display: none; flex-wrap: wrap; gap: 4px; background: #fff; padding: 8px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.2); z-index: 350; width: 124px; }
.color-popup.open { display: flex; }
.color-popup-swatch { width: 24px; height: 24px; border-radius: 50%; cursor: pointer; border: 2px solid rgba(0,0,0,0.08); transition: transform 0.1s; padding: 0; }
.color-popup-swatch:hover { transform: scale(1.15); }
.color-popup-more { position: relative; overflow: hidden; background: linear-gradient(135deg, #ef4444, #eab308, #22c55e, #3b82f6, #a855f7); }
.color-popup-more input[type="color"] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; border: none; padding: 0; }

/* Popup de tamaño de imagen (aparece al hacer clic sobre una imagen insertada) */
.image-size-popup { position: fixed; display: flex; align-items: center; gap: 8px; background: var(--ink); padding: 8px 12px; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 410; min-width: 200px; }
.image-size-popup button { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.1); border: none; border-radius: 5px; cursor: pointer; font-size: 14px; color: var(--cream); transition: background 0.15s; padding: 0; flex-shrink: 0; }
.image-size-popup button:hover { background: rgba(255,255,255,0.25); }
.image-size-popup input[type="range"] { flex: 1; height: 4px; cursor: pointer; accent-color: var(--gold); }
.image-size-label { color: var(--cream); font-size: 11px; font-family: var(--font-sans); min-width: 32px; text-align: center; flex-shrink: 0; }

/* Menú flotante al seleccionar texto */
.float-format-menu { position: fixed; display: none; gap: 3px; background: var(--ink); padding: 5px; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); z-index: 300; }
.float-format-menu button { width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; background: none; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; color: var(--cream); transition: background 0.15s; padding: 0; }
.float-format-menu button:hover { background: rgba(255,255,255,0.15); }
.float-format-menu button.active { background: var(--gold); color: #1a1814; }
.float-format-menu input[type="color"] { width: 26px; height: 26px; padding: 0; border: none; border-radius: 5px; cursor: pointer; background: none; }

/* Botón de copiar en tarjeta */
.btn-copy { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 14px; padding: 2px; transition: color 0.15s, transform 0.15s; line-height: 1; }
.btn-copy:hover { color: var(--gold); }
.btn-copy.copied { color: #2e9e5b; transform: scale(1.15); }

/* ── Secciones de la barra lateral plegables ─────────────────── */
.sidebar-section-header { display: flex; align-items: center; justify-content: space-between; padding: 6px 20px 10px; margin-top: 16px; cursor: pointer; user-select: none; }
.sidebar-section-header .title { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.sidebar-section-header .controls { display: flex; align-items: center; gap: 10px; }
.sidebar-section-header .chevron { font-size: 16px; color: var(--ink-3); transition: transform 0.2s; padding: 4px; line-height: 1; }
.sidebar-section-header.collapsed .chevron { transform: rotate(-90deg); }
.sidebar-add-btn { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 16px; line-height: 1; padding: 4px 6px; transition: color 0.15s; }
.sidebar-add-btn:hover { color: var(--gold); }
.sidebar-section-body { overflow: hidden; max-height: 2000px; transition: max-height 0.25s ease; }
.sidebar-section-body.collapsed { max-height: 0; }
.sidebar-search-input { width: 100%; padding: 6px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-family: var(--font-sans); font-size: 12px; color: var(--ink); outline: none; transition: border-color 0.15s; }
.sidebar-search-input:focus { border-color: var(--gold); }
.sidebar-search-input::placeholder { color: var(--ink-3); }
.filter-row { display: flex; align-items: center; position: relative; }
.filter-row .filter-btn { flex: 1; }
.filter-row-actions { display: flex; align-items: center; gap: 2px; padding: 0 8px 0 4px; visibility: hidden; position: absolute; right: 0; top: 0; bottom: 0; background: var(--cream-3); border-radius: 0 6px 6px 0; }

.filter-row-actions button { background: none; border: none; cursor: pointer; color: var(--ink-3); font-size: 11px; padding: 2px 3px; transition: color 0.15s; line-height: 1; }

/* ── Dropdown híbrido (texto libre + flechita de sugerencias) ── */

.hybrid-select-wrap input { flex: 1; border-radius: var(--radius) 0 0 var(--radius) !important; border-right: none !important; }
.hybrid-select-arrow { width: 30px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: var(--cream-2); border: 1px solid var(--line); border-radius: 0 var(--radius) var(--radius) 0; cursor: pointer; color: var(--ink-3); font-size: 10px; transition: background 0.15s, color 0.15s; }
.hybrid-select-arrow:hover { background: var(--cream-3); color: var(--ink); }
.hybrid-dropdown { position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(0,0,0,0.12); z-index: 250; max-height: 180px; overflow-y: auto; display: none; }
.hybrid-dropdown.open { display: block; }
.hybrid-dropdown-item { padding: 8px 12px; font-size: 13px; color: var(--ink); cursor: pointer; transition: background 0.15s; }
.hybrid-dropdown-item:hover { background: var(--cream-2); }
.hybrid-dropdown-empty { padding: 10px 12px; font-size: 12px; color: var(--ink-3); }

/* ── Selector de orden ────────────────────────────────────────── */
.sort-select { padding: 6px 10px; border: 1px solid var(--line); border-radius: var(--radius); background: #fff; font-family: var(--font-sans); font-size: 12px; color: var(--ink-2); outline: none; cursor: pointer; }

/* Botón de notas técnicas — discreto */

.dev-note-panel { position: fixed; bottom: 16px; right: 16px; width: 320px; max-height: 70vh; background: #fff; border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,0.18); z-index: 300; display: none; flex-direction: column; overflow: hidden; }
.dev-note-panel.on { display: flex; }
.dev-note-hdr { padding: 10px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--ink-3); font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.dev-note-hdr button { background: none; border: none; color: var(--ink-3); cursor: pointer; font-size: 14px; }
.dev-note-body { padding: 10px 14px; overflow-y: auto; flex: 1; }
.dev-note-textarea { width: 100%; min-height: 120px; border: 1px solid var(--line); border-radius: 8px; background: var(--cream-2); color: var(--ink); font-size: 12px; font-family: 'SF Mono', Consolas, monospace; padding: 8px 10px; outline: none; resize: vertical; line-height: 1.5; }
.dev-note-textarea:focus { border-color: var(--gold); }
.dev-note-meta { font-size: 10px; color: var(--ink-3); margin-top: 6px; }
.dev-note-footer { padding: 8px 14px; border-top: 1px solid var(--line); display: flex; gap: 6px; }

.dev-note-footer button.primary { background: var(--ink); color: var(--cream); border-color: var(--ink); }

/* -- Checkboxes de Tareas -- */
.chk-box {
  display: inline-block;
  cursor: pointer;
  user-select: none;
  font-size: 15px;
  color: var(--ink-2);
  transition: color 0.15s, transform 0.1s;
  vertical-align: middle;
}
.chk-box:hover {
  transform: scale(1.1);
  color: var(--ink);
}

.fav-search-chips-bar{display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
.fav-search-chips-bar::-webkit-scrollbar{display:none;}
.fav-chip-top{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--gold-light);border:1px solid #e8c87a;color:#7a5a10;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.fav-chip-top:hover{background:#fbe8b8;}
.sort-handle{cursor:ns-resize;color:var(--ink-3);font-size:14px;padding:0 3px;user-select:none;}
.sort-handle:hover{color:var(--gold);}
.row-order-btns{display:flex;flex-direction:column;gap:1px;}
.row-order-btn{background:none;border:none;cursor:pointer;font-size:10px;color:var(--ink-3);padding:0 2px;line-height:1.2;}
.row-order-btn:hover{color:var(--gold);}
.input-with-arrow{position:relative;display:block;}
.input-with-arrow input{padding-right:20px;}
.input-with-arrow::after{content:'▾';position:absolute;right:6px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--ink-3);font-size:10px;}

/* v33 */
.content-toggle-btn{font-size:9px;font-weight:600;padding:1px 6px;border-radius:8px;border:1px solid var(--line);background:var(--cream-2);cursor:pointer;color:var(--ink-3);letter-spacing:.04em;transition:all .15s;flex-shrink:0;}
.content-toggle-btn:hover{border-color:var(--gold);color:#7a5a10;}
.content-toggle-btn.ia-mode{background:var(--gold-light);border-color:#e8c87a;color:#7a5a10;}
.proj-selector-wrap{position:relative;display:inline-flex;align-items:center;}
.proj-selector-btn{font-size:12px;font-weight:700;color:var(--gold);text-transform:uppercase;background:none;border:none;cursor:pointer;padding:3px 6px;border-radius:6px;display:flex;align-items:center;gap:3px;}
.proj-selector-btn:hover{background:var(--gold-light);}
.proj-selector-dropdown{position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:60;min-width:160px;max-height:200px;overflow-y:auto;display:none;}
.proj-selector-dropdown.open{display:block;}
.proj-selector-dropdown input{width:100%;padding:6px 10px;border:none;border-bottom:1px solid var(--line);font-family:var(--font-sans);font-size:12px;outline:none;border-radius:10px 10px 0 0;}
.proj-selector-item{padding:7px 12px;cursor:pointer;font-size:12px;color:var(--ink);transition:background .1s;}
.proj-selector-item:hover{background:var(--cream-2);}
.proj-selector-item.active{color:var(--gold);font-weight:600;}
.color-popup-recent{display:flex;gap:4px;padding:4px 0 6px;border-bottom:1px solid var(--line);margin-bottom:6px;}
.color-popup-preview{height:14px;border-radius:4px;margin-top:6px;border:1px solid rgba(0,0,0,.1);transition:background .15s;}
/* Fix proyecto form to look like modal */
.pt-select-wrap{position:relative;display:flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--cream-2);overflow:hidden;}
.pt-select-wrap input{flex:1;padding:6px 24px 6px 10px;border:none;background:transparent;font-family:var(--font-sans);font-size:12px;color:var(--ink);outline:none;}
.pt-select-wrap .pt-arr{position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:10px;color:var(--ink-3);pointer-events:none;}
.pt-select-wrap:focus-within{border-color:var(--gold);background:#fff;}
/* Split header clean 2-row */
.split-hdr-row1{padding:8px 14px;display:flex;align-items:center;gap:8px;background:var(--cream-2);border-bottom:none;flex-shrink:0;}
.split-hdr-row1 .s-proj{font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;}
.split-hdr-row1 .s-tipo{font-size:11px;color:var(--ink-3);}
.split-hdr-row1 .s-date{font-size:11px;color:var(--ink-3);margin-left:auto;}
.split-hdr-row1 .s-acts{display:flex;gap:4px;flex-shrink:0;}
/* Búsquedas favoritas always visible strip */
.fav-strip{padding:3px 20px;display:flex;align-items:center;gap:5px;flex-wrap:nowrap;overflow-x:auto;background:var(--cream);border-bottom:1px solid var(--line);scrollbar-width:none;min-height:0;}
.fav-strip:empty,.fav-strip.hidden{display:none;}
.fav-strip-lbl{font-size:9px;color:var(--ink-3);flex-shrink:0;text-transform:uppercase;letter-spacing:.05em;}
.fav-strip-chip{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--gold-light);border:1px solid #e8c87a;color:#7a5a10;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.fav-strip-chip:hover{background:#fbe8b8;}

/* v34 */
.fav-always-strip{display:flex;align-items:center;gap:5px;padding:0 20px;height:0;overflow:hidden;background:var(--gold-light);border-bottom:0px solid #e8c87a;transition:height .2s,padding .2s,border-width .2s;}
.fav-always-strip.has-favs{height:34px;padding:0 20px;border-bottom-width:1px;}
.fav-save-btn-count{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--gold-light);border:1px solid #e8c87a;color:#7a5a10;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.fav-save-btn-count:hover{background:#fbe8b8;}
.task-top-badge{font-weight:700;color:#c2410c!important;background:#fff7ed;padding:1px 7px;border-radius:8px;border-left:3px solid #f97316;}
.pt-row-resize-handle{position:absolute;bottom:0;left:0;right:0;height:4px;cursor:ns-resize;background:transparent;z-index:2;}
.pt-row-resize-handle:hover{background:var(--gold);opacity:.4;}
.proj-inner-search{display:flex;align-items:center;gap:6px;flex:1;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:0 8px;}
.proj-inner-search input{flex:1;border:none;outline:none;font-family:var(--font-sans);font-size:12px;background:transparent;color:var(--ink);padding:5px 0;}
.note-search-bar{display:none;align-items:center;gap:6px;padding:6px 14px;background:var(--cream-2);border-bottom:1px solid var(--line);flex-shrink:0;}
.note-search-bar.open{display:flex;}
.note-search-bar input{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:5px 10px;font-family:var(--font-sans);font-size:12px;outline:none;background:#fff;}
.note-search-bar input:focus{border-color:var(--gold);}
.note-search-highlight{background:#fef08a;}

/* v35 */
.fav-panel-btn{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--gold-light);border:1px solid #e8c87a;color:#7a5a10;cursor:pointer;white-space:nowrap;}
.fav-panel{position:absolute;top:calc(100% + 4px);right:0;z-index:80;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);min-width:200px;max-height:280px;display:none;}
.fav-panel.open{display:flex;flex-direction:column;}
.fav-panel-hdr{padding:8px 12px;border-bottom:1px solid var(--line);font-size:11px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;flex-shrink:0;}
.fav-panel-list{overflow-y:auto;flex:1;}
.fav-panel-item{display:flex;align-items:center;gap:6px;padding:7px 10px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--line);}
.fav-panel-item:hover{background:var(--cream-2);}
.fav-panel-item.dragging{opacity:.5;}
.fav-panel-drag{cursor:grab;color:var(--ink-3);font-size:14px;flex-shrink:0;}
.fav-panel-name{flex:1;font-size:12px;color:var(--ink);}
.fav-panel-del{background:none;border:none;cursor:pointer;color:var(--ink-3);font-size:11px;opacity:.4;}
.fav-panel-del:hover{opacity:1;color:#ef4444;}
.fav-panel-add{padding:7px 10px;font-size:11px;color:var(--gold);cursor:pointer;border-top:1px solid var(--line);text-align:center;flex-shrink:0;}
.fav-panel-add:hover{background:var(--gold-light);}
/* Compact split header - 1 line */
.split-hdr-compact{display:flex;align-items:center;gap:3px;padding:5px 10px;border-bottom:1px solid var(--line);background:var(--cream-2);flex-shrink:0;flex-wrap:nowrap;overflow:hidden;}
.split-hdr-meta{font-size:10px;color:var(--ink-2);display:flex;align-items:center;gap:3px;flex-shrink:0;min-width:0;}
.split-hdr-meta .shp{font-weight:600;color:var(--gold);text-transform:uppercase;font-size:10px;}
.split-sep{width:1px;height:14px;background:var(--line);flex-shrink:0;margin:0 2px;}
.split-acts-compact{display:flex;align-items:center;gap:2px;flex-shrink:0;margin-left:auto;}
.fmt-micro{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--line);border-radius:4px;cursor:pointer;font-size:10px;color:var(--ink-2);padding:0;flex-shrink:0;}
.fmt-micro:hover{background:var(--cream-3);}

/* ── v37 additions ─────────────────────────────────────────── */
.v37-scope-btn { flex:1; padding:4px 6px; border-radius:10px; border:1px solid var(--line); background:var(--cream-2); font-family:var(--font-sans); font-size:10px; font-weight:500; color:var(--ink-3); cursor:pointer; text-align:center; transition:background 0.15s, color 0.15s; white-space:nowrap; }
.v37-scope-btn:hover { background:var(--cream-3); color:var(--ink); }
.v37-scope-btn.active { background:var(--gold-light); color:#7a5a10; border-color:#e8c87a; }
.v37-active-chip { display:inline-flex; align-items:center; gap:3px; font-size:11px; padding:2px 7px; border-radius:12px; background:var(--cream-3); border:1px solid var(--line); color:var(--ink-2); white-space:nowrap; }
.v37-active-chip.saved { background:var(--gold-light); border-color:#e8c87a; color:#7a5a10; }
.v37-active-chip button { background:none; border:none; cursor:pointer; color:inherit; font-size:11px; padding:0 1px; line-height:1; opacity:.7; }
.v37-active-chip button:hover { opacity:1; }
.v37-fav-item { border-bottom:1px solid var(--line); }
.v37-fav-item:last-child { border-bottom:none; }
.v37-proj-sort { padding:4px 7px; border:1px solid var(--line); border-radius:8px; background:#fff; font-family:var(--font-sans); font-size:11px; color:var(--ink-2); outline:none; cursor:pointer; }
.row-2-1 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }

/* v39: Fix profundo — primera columna de Vista Proyecto realmente angosta.
   No bastaba con el th: el contenido interno (inputs, chips, grid Proyecto/Tipo)
   seguía empujando la tabla a ensancharse. Se limita también el td y .pt-form-inner. */
.pt-table th:first-child,
.pt-table td:first-child{
  width:80px;
  min-width:80px;
  max-width:80px;
  overflow:hidden;
}
.pt-table td:first-child .pt-form-inner{
  width:100%;
  min-width:0!important;
  max-width:100%!important;
  overflow-y:auto;
  overflow-x:hidden;
  padding:4px!important;
}
.pt-table td:first-child input,
.pt-table td:first-child .pt-select-wrap{
  min-width:0!important;
  width:100%!important;
  max-width:100%!important;
  box-sizing:border-box;
}
.pt-table td:first-child input{
  padding-left:3px!important;
  padding-right:3px!important;
  font-size:10px!important;
}
.pt-table td:first-child .selected-tag-chip{
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.pt-table td:first-child .pt-form-inner > div[style*="grid-template-columns"]{
  grid-template-columns:minmax(0,1fr)!important;
}
/* v39: nombres largos en sidebar no deben tapar los botones de acción */
.filter-row{display:flex;align-items:center;gap:2px;}
.filter-row .filter-btn{min-width:0;overflow:hidden;}
.filter-row .filter-btn .cat-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.filter-row .filter-btn .dot{flex-shrink:0;}
.filter-row .filter-btn > span[style*="margin-left:auto"]{flex-shrink:0;}
.filter-row-actions{flex-shrink:0;}
/* v40: nombre completo cuando NO está en hover (los botones de acción solo ocupan
   espacio real al pasar el mouse, antes reservaban el espacio siempre con visibility:hidden) */
.filter-row .filter-btn{padding-right:20px;}
.filter-row:hover .filter-btn{padding-right:20px;}
</style>
</head>
<body>

<!-- Menú flotante de formato al seleccionar texto en tarjetas -->
<div class="float-format-menu" id="floatFormatMenu">
  <button type="button" data-cmd="bold" title="Negrita" onclick="applyCardFormat('bold')"><b>B</b></button>
  <button type="button" data-cmd="italic" title="Cursiva" onclick="applyCardFormat('italic')"><i>I</i></button>
  <button type="button" data-cmd="underline" title="Subrayar" onclick="applyCardFormat('underline')"><u>U</u></button>
  <button type="button" data-cmd="strikeThrough" title="Tachar" onclick="applyCardFormat('strikeThrough')"><s>S</s></button>
  <div class="color-btn-wrap">
    <button type="button" title="Resaltar (clic para elegir color)" onclick="toggleColorPopup('popup-hilite-float')">🖍️</button>
    <div class="color-popup" id="popup-hilite-float"></div>
  </div>
  <div class="color-btn-wrap">
    <button type="button" title="Color de texto (clic para elegir color)" onclick="toggleColorPopup('popup-fore-float')"><b style="color:var(--gold)">A</b></button>
    <div class="color-popup" id="popup-fore-float"></div>
  </div>
  <div class="color-btn-wrap">
    <button type="button" title="Añadir viñeta al inicio de cada línea seleccionada (color actual del texto)" onclick="applyCardFormat('bulletList', null)">•≡</button>
  </div>

<button type="button" title="Añadir lista de tareas" onclick="insertTaskbox()">☑</button>
  <button type="button" title="Insertar imagen" onclick="document.getElementById('imageFileInputFloat').click()">🖼️</button>
  <input type="file" id="imageFileInputFloat" accept="image/*" style="display:none" onchange="handleImageUpload(this, true)">
  <button type="button" title="Quitar formato" onclick="applyCardFormat('removeFormat')">✕</button>
</div>


<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span onclick="toggleSidebar()" title="Ocultar menú">Ideas ✦</span>
    </div>
    <div style="padding:0 12px;">
       <button class="filter-btn active" data-view="todas" onclick="setView('todas', this)">
         <span style="font-size:15px">📋</span> Todas
       </button>
       <button class="filter-btn" data-view="favoritas" onclick="setView('favoritas', this)">
         <span style="font-size:15px">⭐</span> Favoritas
       </button>
       <button class="filter-btn" data-view="tareas" onclick="setView('tareas', this)">
         <span style="font-size:15px">✅</span> Tareas
       </button>
       <label class="filter-btn" style="margin-top:4px;cursor:pointer;display:flex;align-items:center;gap:8px;" for="multiSelectCb">
         <input type="checkbox" id="multiSelectCb" onchange="toggleMultiSelect()" style="margin:0;flex-shrink:0;cursor:pointer;">
         Selección múltiple
       </label>
       <div id="combineModeWrap" style="display:none; margin-top:8px;">
         <div class="combine-mode-row">
           <button type="button" class="combine-mode-btn active" data-mode="AND" onclick="setCombineMode('AND')" title="Deben cumplirse todas las condiciones a la vez">Todas a la vez</button>
           <button type="button" class="combine-mode-btn" data-mode="OR" onclick="setCombineMode('OR')" title="Basta con cumplir alguna condición">Cualquiera</button>
           <button type="button" class="combine-mode-btn" data-mode="NOT" onclick="setCombineMode('NOT')" title="Excluye lo que coincida con la selección">Ninguna</button>
         </div>
       </div>
       <button type="button" class="filter-btn" onclick="toggleDateFilterPanel()" style="margin-top:6px;">
         <span style="font-size:15px">📅</span> Filtrar por fecha
       </button>
       <div id="dateFilterPanel" style="display:none;"></div>
    </div>
    <!-- v37: Guardar búsqueda -->
    <div style="padding:2px 12px 4px;">
      <button class="filter-btn" onclick="promptSaveSearch27()" style="color:var(--gold);font-size:12px;">
        <span style="font-size:14px;">💾</span> Guardar búsqueda actual
      </button>
    </div>
    <!-- v37: Alcance de búsqueda -->
    <div style="padding:4px 12px 10px;">
      <div style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:5px;font-weight:500;">Alcance de búsqueda</div>
      <div style="display:flex;gap:3px;" id="v37ScopeBtns">
        <button class="v37-scope-btn active" id="scope-cards" onclick="v37SetScope('cards')" title="Buscar solo en tarjetas">🃏 Tarjetas</button>
        <button class="v37-scope-btn" id="scope-proyecto" onclick="v37SetScope('proyecto')" title="Buscar en vista proyecto">⊞ Proyecto</button>
        <button class="v37-scope-btn" id="scope-both" onclick="v37SetScope('both')" title="Buscar en ambas vistas">∞ Ambas</button>
      </div>
    </div>
    <!-- v37: Búsquedas guardadas (sidebar, collapsible, collapsed by default) -->
    <div id="v37FavSection">
      <div class="sidebar-section-header collapsed" id="v37FavHdr" onclick="v37TogFavSection()">
        <span class="title">Búsquedas guardadas</span>
        <div class="controls">
          <button class="sidebar-add-btn" onclick="event.stopPropagation();promptSaveSearch27()" title="Guardar búsqueda actual">＋</button>
          <span class="chevron">▾</span>
        </div>
      </div>
      <div class="sidebar-section-body collapsed" id="v37FavBody" style="padding:0 12px 8px;">
        <div id="v37FavList"></div>
      </div>
    </div>
    <div id="favSearchesSection"></div>
    <div id="dynamicSidebarFilters"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <button class="sidebar-reopen" onclick="toggleSidebar()" title="Mostrar menú">Ideas ✦ ›</button>
      <div style="display:flex;flex-direction:column;flex:1;gap:4px;">
        <div class="search-wrap">
          <span class="ico">🔍</span>
          <input type="text" placeholder="Buscar notas, proyectos, etiquetas…" id="searchInput" oninput="renderIdeas()">
        </div>
      </div>
      <div class="view-toggle-group" title="Tipo de vista">
        <button class="view-toggle-btn active" id="vbtn-grid" onclick="setViewMode27('grid')" title="Individual">📋</button>
        <button class="view-toggle-btn" id="vbtn-split" onclick="setViewMode27('split')" title="Pantalla dividida">▌▐</button>
        <button class="view-toggle-btn" id="vbtn-proyecto" onclick="setViewMode27('proyecto')" title="Por proyecto">⊞</button>
      </div>
      <button class="btn-add" onclick="openModal()">＋ Nueva</button>
      <button class="dev-note-btn" onclick="devNoteToggle27()" title="Notas técnicas">·</button>
    </div>

    <div class="count-bar">
       <span id="countBar">Cargando…</span>
       <button class="clear-filters" id="clearFiltersBtn" onclick="clearAllFilters()">Borrar filtros ✕</button>
       <div id="v37ActiveFilters" style="display:flex;gap:4px;flex-wrap:wrap;align-items:center;flex:1;"></div>
       <div class="zoom-wrap" style="margin-left:auto;">
         <span style="font-size:10px;color:var(--ink-3);">🔎</span>
         <input type="range" class="zoom-slider" min="1" max="5" id="zoomSlider" value="3" oninput="setZoom27(this.value)" title="Zoom">
         <span class="zoom-lbl" id="zoomLbl">60%</span>
       </div>
       <span style="width:1px;height:18px;background:var(--line);display:inline-block;margin:0 4px;flex-shrink:0;"></span>
       <select class="sort-select" id="sortSelect" onchange="renderIdeas()">
         <option value="fecha-desc">Más recientes</option>
         <option value="fecha-asc">Más antiguas</option>
         <option value="proyecto">Proyecto A-Z</option>
         <option value="tipo">Tipo A-Z</option>
         <option value="animo">Ánimo A-Z</option>
         <option value="alfabetico">Contenido A-Z</option>
       </select>
    </div>
    <div class="ideas-wrap" id="ideasWrap">
      <div class="ideas-grid" id="ideasGrid">
        <div class="empty"><div class="emoji">✦</div><p>Cargando tus notas…</p></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal nueva idea / Edición profunda -->
<div class="overlay" id="modalOverlay" style="display:none" onclick="closeOnBackdrop(event)">
<div class="modal" id="modal">
  <div class="modal-header">
    <span class="modal-title" id="modalTitle">Nueva Entrada</span>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="modal-fav-btn" id="modalFavBtn" onclick="toggleFavInModal27()" title="Favorita" style="display:none;">☆</button>
      <button class="modal-close" onclick="closeModal(false)">✕</button>
    </div>
  </div>
  <div class="modal-body">
    <input type="hidden" id="editIdeaId">
    
    <div class="field">
      <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
        <label style="margin:0;">Contenido</label>
        <button class="btn-ai" id="btnAutoFill" onclick="requestAutoFill()" style="padding: 4px 10px; font-size:11px;">
           <span id="aiSpinner" style="display:none"><span class="spinner"></span></span>
           <span id="aiText">🪄 Asistente & Tutor IA</span>
        </button>
      </div>
      <div class="format-toolbar" id="mainToolbar">
        <button type="button" class="format-btn" onmousedown="event.preventDefault()" data-cmd="bold" onclick="applyFormat('bold')" title="Negrita"><b>B</b></button>
        <div class="format-sep"></div>
        <div class="hilite-grp color-btn-wrap">
          <button type="button" class="format-btn" onmousedown="event.preventDefault()" onclick="applyForeColor27()" title="Color de texto"><b id="foreColorPrev27" style="color:var(--gold)">A</b></button>
          <button type="button" class="format-btn hilite-arr" onclick="toggleColorPopup('popup-fore-modal')" title="Elegir color de texto">▾</button>
          <div class="color-popup" id="popup-fore-modal"></div>
        </div>
        <div class="format-sep"></div>

<script>
// ── Config ───────────────────────────────────────────────────
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwTtMX0TMhGDW9aCmTi8UM5BXXjuiYT4o4jNVotPhjcuwW1_J9Zq_IsK19_U50CiCgHDg/exec';

// ── Estado ───────────────────────────────────────────────────
let allIdeas = []; let allTags = [];
let currentView = 'todas'; let isMultiSelect = false;
let filters = { proyectos: [], tipos: [], animos: [], etiquetas: [] };
let excludedFilters = { proyectos: [], tipos: [], animos: [], etiquetas: [] }; // marcados con clic derecho para EXCLUIR
let combineMode = 'AND'; // 'AND' = todas a la vez, 'OR' = cualquiera, 'NOT' = ninguna (excluye la selección completa)
let dateFilter = { mode: null, start: null, end: null }; // mode: 'hoy'|'semana'|'mes'|'anio'|'rango'|null

let aiConversation = [];
let usingClaude = false;

// ── Sidebar toggle ───────────────────────────────────────────
function toggleSidebar() {
  const sidebar = document.getElementById('sidebar');
  const app = document.querySelector('.app');
  sidebar.classList.toggle('collapsed');
  app.classList.toggle('sidebar-hidden');
}

// ── Formato de texto (sanitizado y utilidades) ───────────────
const ALLOWED_TAGS = new Set(['B','STRONG','I','EM','U','S','STRIKE','MARK','SPAN','BR','DIV','IMG','UL','LI']);
function sanitizeHtml(html) {
  if (!html) return '';
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const clean = (node) => {
    [...node.childNodes].forEach(child => {
      if (child.nodeType === 1) {
        if (!ALLOWED_TAGS.has(child.tagName)) {
          // Reemplaza el tag no permitido por sus hijos (evita scripts, etc.)
          while (child.firstChild) child.parentNode.insertBefore(child.firstChild, child);
          child.parentNode.removeChild(child);
          return;
        }
        if (child.tagName === 'IMG') {
          // Las imágenes solo se conservan si su src apunta a nuestras imágenes en Drive
          const src = child.getAttribute('src') || '';
          const isSafeImage = /^https:\/\/drive\.google\.com\/(thumbnail\?id=|uc\?export=view&id=)/.test(src);
          const widthPct = parseInt(child.dataset.widthPct || '60', 10) || 60;
          const safeWidth = Math.max(15, Math.min(100, widthPct));
          [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
          if (isSafeImage) {
            child.setAttribute('src', src);
            child.setAttribute('class', 'nota-img-resizable');
            child.setAttribute('data-width-pct', safeWidth);
            child.setAttribute('title', 'Clic para cambiar el tamaño');
            child.setAttribute('style', `width:${safeWidth}%;max-width:100%;border-radius:8px;display:block;margin:8px 0;cursor:pointer;`);
          } else {
            child.parentNode.removeChild(child); // imagen de origen no confiable: se elimina
          }
          return;
        }


// Solo permitir el atributo style con color/background-color y EXCEPCIÓN PARA CHECKBOXES
        const style = child.getAttribute('style');
        const isChk = child.getAttribute('class') === 'chk-box';
        [...child.attributes].forEach(attr => child.removeAttribute(attr.name));
        
        if (style) {
          const safeStyle = style.split(';').filter(s => /^\s*(color|background-color)\s*:/.test(s)).join(';');
          if (safeStyle) child.setAttribute('style', safeStyle);
        }
        
        if (child.tagName === 'SPAN' && isChk) {
          child.setAttribute('class', 'chk-box');
          child.setAttribute('contenteditable', 'false');
        }



        clean(child);
      }
    });
  };
  clean(tpl.content);
  return tpl.innerHTML;
}

// Marca visualmente (clase .active) los botones cuyo formato ya aplica a la selección actual
function syncToolbarState() {
  const map = { bold: 'bold', italic: 'italic', underline: 'underline', strikeThrough: 'strikeThrough' };
  document.querySelectorAll('.float-format-menu button, .format-toolbar .format-btn').forEach(btn => {
    const cmd = btn.getAttribute('data-cmd');
    if (cmd && map[cmd]) {
      try { btn.classList.toggle('active', document.queryCommandState(cmd)); } catch(e) {}
    }
  });
}

// Recuerda dónde estaba la selección de texto justo antes de abrir el selector de color
// (al abrir <input type="color">, el navegador quita el foco del editor y se pierde la selección)
let colorSavedRange = null;
let lastHilite = '#fef08a';
let lastForeColor = '#c9973a';
function rememberSelectionForColor() {
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0 && !sel.isCollapsed) colorSavedRange = sel.getRangeAt(0).cloneRange();
}
function restoreColorSelection() {
  if (!colorSavedRange) return;
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(colorSavedRange);
  colorSavedRange = null;
}

// ── Popup de 12 colores rápidos + acceso al selector completo ──
const QUICK_COLORS_12 = ['#c9973a','#ef4444','#f97316','#eab308','#22c55e','#0ea5e9','#3b82f6','#a855f7','#ec4899','#1a1814','#ffffff','#fdf3e1'];

function toggleColorPopup(popupId) {
  const popup = document.getElementById(popupId);
  const isOpen = popup.classList.contains('open');
  closeAllColorPopups();
  if (isOpen) return; // ya estaba abierto: el clic lo cierra y no hace nada más

  // Determinar el comando según el id del popup: resaltado, color de texto o viñetas
  let command = 'foreColor';
  if (popupId.includes('hilite')) command = 'hiliteColor';
  else if (popupId.includes('bullet')) command = 'bulletList';
  // Guardamos la selección ANTES de mostrar el popup, ya que el clic en un swatch
  // (o abrir el selector nativo) puede mover el foco y perderla
  rememberSelectionForColor();

  popup.innerHTML = QUICK_COLORS_12.map(c =>
    `<button type="button" class="color-popup-swatch" style="background:${c}" onclick="pickQuickColor('${c}', '${command}', '${popupId}')"></button>`
  ).join('') + `
    <div class="color-popup-swatch color-popup-more" title="Más colores">
      <input type="color" onmousedown="rememberSelectionForColor()" onchange="pickQuickColor(this.value, '${command}', '${popupId}')">
    </div>`;
  popup.classList.add('open');
}

function closeAllColorPopups() { document.querySelectorAll('.color-popup').forEach(p => p.classList.remove('open')); }

// Inserta una viñeta de color al inicio de la línea actual (más seguro que <ul>/<li> + <style>,
// ya que no requiere permitir hojas de estilo adicionales en el sanitizador)
// Detecta el color de texto "actual" en el punto del cursor (el mismo que usarías para escribir),
// para que la viñeta nueva combine con lo que ya tienes seleccionado o escrito ahí.
// Color a usar para la viñeta: el mismo "último color de texto" que ya usas con el botón A
// (se eliminó queryCommandValue por ser una API poco confiable entre navegadores)
function getCurrentTextColor() {
  return lastForeColor;
}

// Agrega una viñeta "• " (con el color actual del texto) al inicio de cada línea que toque la
// selección actual. Si no hay selección (solo cursor), se aplica únicamente a la línea del cursor.





// Agrega una lista de viñetas real (como en Word)
function applyBulletListToSelection() {
  document.execCommand('insertUnorderedList', false, null);
}


//////////////////////////////////////////////////////////////////////////////////

function isBulletSpan(node) {
  if (!node) return false;
  if (node.nodeType === 1 && node.tagName === 'SPAN' && /^•\s/.test(node.textContent || '')) return true;
  if (node.nodeType === 3 && /^•\s*$/.test(node.textContent || '')) return true; // SOLO si el nodo es ÚNICAMENTE la viñeta (evita falsos positivos en medio de texto largo)
  return false;
}

// ── Insertar imágenes (suben a Google Drive y se insertan donde estaba el cursor) ──
// isCard=true cuando se invoca desde una tarjeta ya guardada; false cuando es desde el modal
let imageInsertContext = { isCard: false, savedRange: null };

// ── Extraer texto de una imagen con IA (OCR) ─────────────────
// Sube la imagen igual que con insertar imagen, pero en vez de mostrarla,
// pide a la IA que transcriba el texto y lo pega como contenido editable.
async function handleOcrExtract(inputEl) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Selecciona un archivo de imagen'); return; }
  if (file.size > 5 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 5MB)'); inputEl.value = ''; return; }

  // v37: respeta la celda específica (vista proyecto / split) si se pidió desde ahí
  const v37Target = window._v33imgTarget;
  const editor = (v37Target && v37Target.ci) ? document.getElementById(v37Target.ci) : document.getElementById('inputContenido');
  if (!editor) { window._v33imgTarget = null; inputEl.value = ''; return; }

  const sel = window.getSelection();
  const savedRange = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).cloneRange() : null;

  showToast('Leyendo texto de la imagen…');
  try {
    const base64 = await fileToBase64(file);
    const r = await postGAS({ action: 'extractTextFromImage', imageBase64: base64, mimeType: file.type });
    if (r.ok && r.text) {
      editor.focus();
      if (savedRange) { sel.removeAllRanges(); sel.addRange(savedRange); }
      // Insertamos el texto extraído como texto plano en la posición del cursor
      const textNode = document.createTextNode(r.text);
      const sel2 = window.getSelection();
      if (sel2.rangeCount > 0 && editor.contains(sel2.getRangeAt(0).startContainer)) {
        const range = sel2.getRangeAt(0);
        range.collapse(false);
        range.insertNode(textNode);
        range.setStartAfter(textNode);
        range.collapse(true);
        sel2.removeAllRanges();
        sel2.addRange(range);
      } else {
        editor.appendChild(textNode);
      }
      if (v37Target && v37Target.ci && v37Target.ii) v37SaveByCellId(v37Target.ci, v37Target.ii);
      showToast('✨ Texto extraído');
    } else {
      showToast(r.error || 'No se pudo leer el texto de la imagen');
    }
  } catch (e) {
    showToast('Error al procesar la imagen');
  }
  window._v33imgTarget = null;
  inputEl.value = '';
}

async function handleImageUpload(inputEl, isCard) {
  const file = inputEl.files && inputEl.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Selecciona un archivo de imagen'); return; }
  if (file.size > 5 * 1024 * 1024) { showToast('La imagen es muy grande (máx. 5MB)'); inputEl.value = ''; return; }

  // Guardamos dónde estaba el cursor antes de que se abra el diálogo de archivos
  // (igual que con los colores: abrir el selector de archivos puede mover el foco)
  const sel = window.getSelection();
  imageInsertContext.isCard = isCard;
  imageInsertContext.savedRange = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).cloneRange() : null;

  showToast('Subiendo imagen…');
  try {
    const base64 = await fileToBase64(file);
    const r = await postGAS({ action: 'uploadImage', imageBase64: base64, mimeType: file.type, fileName: file.name });
    if (r.ok && r.url) {
      insertImageAtSavedPosition(r.url, isCard);
      showToast('Imagen agregada ✦');
    } else {
      showToast(r.error || 'No se pudo subir la imagen');
    }
  } catch (e) {
    showToast('Error al subir la imagen');
  }
  inputEl.value = ''; // permite volver a subir el mismo archivo si se repite la acción
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]); // quita el prefijo data:...;base64,
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function insertImageAtSavedPosition(url, isCard) {
  // v37: si la imagen se pidió desde una celda específica (vista proyecto / split),
  // _v33imgTarget tiene prioridad sobre la lógica antigua modal/tarjeta.
  const v37Target = window._v33imgTarget;
  let targetEl;
  if (v37Target && v37Target.ci) {
    targetEl = document.getElementById(v37Target.ci);
  } else {
    targetEl = isCard
      ? (activeCardId ? document.getElementById(`text-${activeCardId}`) : null)
      : document.getElementById('inputContenido');
  }
  if (!targetEl) { window._v33imgTarget = null; return; }

  const sel = window.getSelection();
  if (imageInsertContext.savedRange) {
    sel.removeAllRanges();
    sel.addRange(imageInsertContext.savedRange);
  } else {
    targetEl.focus();
  }

  const img = document.createElement('img');
  img.src = url;
  img.style.maxWidth = '60%';
  img.style.width = '60%';
  img.style.borderRadius = '8px';
  img.style.display = 'block';
  img.style.margin = '8px 0';
  img.style.cursor = 'pointer';
  img.dataset.widthPct = '60';
  img.title = 'Clic para cambiar el tamaño';
  img.className = 'nota-img-resizable';
  img.onerror = function() {
    showToast('⚠️ La imagen se subió pero no se pudo cargar la vista previa. Revisa los permisos de la carpeta en Drive.');
    img.style.border = '2px dashed #ef4444';
    img.style.minHeight = '60px';
    img.alt = 'Imagen no disponible';
  };

  if (sel.rangeCount > 0 && targetEl.contains(sel.getRangeAt(0).startContainer)) {
    const range = sel.getRangeAt(0);
    range.collapse(false);
    range.insertNode(img);
    range.setStartAfter(img);
    range.setEndAfter(img);
    sel.removeAllRanges();
    sel.addRange(range);
  } else {
    targetEl.appendChild(img); // si no había selección válida dentro del editor, se agrega al final
  }

  if (v37Target && v37Target.ci && v37Target.ii) {
    v37SaveByCellId(v37Target.ci, v37Target.ii);
  } else if (isCard && activeCardId) {
    saveCardEdit(activeCardId, targetEl);
  }
  imageInsertContext.savedRange = null;
  window._v33imgTarget = null;
}

// ── Redimensionar imágenes con un clic (delegado: funciona en notas nuevas y guardadas) ──
document.addEventListener('click', (e) => {
  if (e.target.classList && e.target.classList.contains('nota-img-resizable')) {
    e.preventDefault();
    e.stopPropagation();
    openImageSizePopup(e.target);
  }
});

let imageSizeTarget = null;

function openImageSizePopup(img) {
  closeImageSizePopup(); // limpia cualquier popup anterior ANTES de asignar el nuevo target
  imageSizeTarget = img;
  const popup = document.createElement('div');
  popup.id = 'imageSizePopup';
  popup.className = 'image-size-popup';
  const rect = img.getBoundingClientRect();
  popup.style.left = Math.max(8, Math.min(window.innerWidth - 220, rect.left)) + 'px';
  popup.style.top = Math.max(8, rect.top - 50) + 'px';
  const currentPct = parseInt(img.dataset.widthPct || '60', 10) || 60;
  popup.innerHTML = `
    <input type="range" id="imageSizeSlider" min="15" max="100" step="1" value="${currentPct}" oninput="resizeImageTo(this.value)">
    <span class="image-size-label" id="imageSizeLabel">${currentPct}%</span>
    <button type="button" onclick="resizeImageTo(60)" title="Tamaño original (60%)">↺</button>
  `;
  document.body.appendChild(popup);
}

// Aplica directamente el porcentaje elegido en el slider (más confiable que arrastrar la imagen)
function resizeImageTo(pct) {
  if (!imageSizeTarget) return;
  pct = Math.max(15, Math.min(100, parseInt(pct, 10) || 60));
  imageSizeTarget.dataset.widthPct = pct;
  imageSizeTarget.style.width = pct + '%';
  const label = document.getElementById('imageSizeLabel');
  if (label) label.textContent = pct + '%';
  const slider = document.getElementById('imageSizeSlider');
  if (slider) slider.value = pct;
  // Guardar el cambio si la imagen vive dentro de una tarjeta ya persistida
  const cardEl = imageSizeTarget.closest('.card-text');
  if (cardEl && cardEl.id.startsWith('text-')) saveCardEdit(cardEl.id.replace('text-', ''), cardEl);
}

function closeImageSizePopup() {
  const existing = document.getElementById('imageSizePopup');
  if (existing) existing.remove();
  imageSizeTarget = null;

function getCounts(key) {
  const counts = {};
  allIdeas.forEach(i => {
    if (key === 'etiquetas') {
      if (i.etiquetas) i.etiquetas.forEach(t => { const l=t.toLowerCase(); counts[l]=(counts[l]||0)+1; });
    } else {
      let rawVal = i[key];
      if (key==='tipo' && (!rawVal||rawVal.trim()==='')) rawVal='nota';
      if (key==='proyecto' && (!rawVal||rawVal.trim()==='')) rawVal='general';
      const val=(rawVal||'').toLowerCase().trim();
      if(val) counts[val]=(counts[val]||0)+1;
    }
  });
  // v42: añade categorías del catálogo (Sheets) que aún no tienen ninguna nota —
  // antes solo aparecían en el sidebar una vez que se les asignaba una nota.
  const catKeyMap = { proyecto:'proyectos', tipo:'tipos', animo:'animos', etiquetas:'etiquetas' };
  const catKey = catKeyMap[key];
  const catalogVals = (window.v37CatalogOptions && window.v37CatalogOptions[catKey]) || [];
  catalogVals.forEach(v => { if (v && !(v in counts)) counts[v] = 0; });
  return Object.entries(counts).sort((a,b)=>{
    return v27SortKey(a[0]).localeCompare(v27SortKey(b[0]));
  });
}
