function pad2(n) { return String(n).padStart(2, '0'); }
function toIsoDate(d) { return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }

function setQuickDateFilter(mode) {
  const now = new Date();
  let start, end;
  if (mode === 'hoy') {
    start = end = toIsoDate(now);
  } else if (mode === 'semana') {
    const d = new Date(now);
    const dayOfWeek = (d.getDay() + 6) % 7; // lunes=0
    d.setDate(d.getDate() - dayOfWeek);
    start = toIsoDate(d);
    end = toIsoDate(now);
  } else if (mode === 'mes') {
    start = `${now.getFullYear()}-${pad2(now.getMonth()+1)}-01`;
    end = toIsoDate(now);
  } else if (mode === 'anio') {
    start = `${now.getFullYear()}-01-01`;
    end = toIsoDate(now);
  }
  dateFilter = { mode, start, end };
  renderDateFilterPanel();
  renderIdeas();
}

function setRangeDateFilter() {
  const start = document.getElementById('dateRangeStart').value || null;
  const end = document.getElementById('dateRangeEnd').value || null;
  if (!start && !end) { clearDateFilter(); return; }
  dateFilter = { mode: 'rango', start, end };
  renderDateFilterPanel();
  renderIdeas();
}

function clearDateFilter() {
  dateFilter = { mode: null, start: null, end: null };
  renderDateFilterPanel();
  renderIdeas();
}

function toggleFilter(category, value) {
  // Sentido 2: si estás en "Tareas" o "Favoritas" sin Selección múltiple, elegir
  // un filtro de categoría regresa automáticamente la vista a "Todas" primero.
  if (!isMultiSelect && (currentView === 'favoritas' || currentView === 'tareas')) v46ResetViewToTodas();
  // Si el valor ya estaba marcado como excluido, un clic normal lo quita de la exclusión primero
  const exIdx = excludedFilters[category].indexOf(value);
  if (exIdx > -1) { excludedFilters[category].splice(exIdx, 1); renderSidebarFilters(); renderIdeas(); return; }

  if (!isMultiSelect) {
    const wasActive = filters[category].includes(value);
    filters = { proyectos: [], tipos: [], animos: [], etiquetas: [] };
    if (!wasActive) filters[category].push(value);
  } else {
    const arr = filters[category]; const idx = arr.indexOf(value);
    if (idx > -1) arr.splice(idx, 1); else arr.push(value);
  }
  renderSidebarFilters(); renderIdeas();
}

// Clic derecho sobre un filtro: lo marca para EXCLUIR (en vez de incluir) esa nota
function toggleExcludeFilter(category, value) {
  if (!isMultiSelect) { showToast('Activa "Selección múltiple" para poder excluir filtros'); return; }
  filters[category] = filters[category].filter(v => v !== value); // si estaba incluido, lo quitamos de ahí
  const idx = excludedFilters[category].indexOf(value);
  if (idx > -1) excludedFilters[category].splice(idx, 1); else excludedFilters[category].push(value);
  renderSidebarFilters(); renderIdeas();
}

function clearAllFilters() {
  filters = { proyectos: [], tipos: [], animos: [], etiquetas: [] };
  excludedFilters = { proyectos: [], tipos: [], animos: [], etiquetas: [] };
  renderSidebarFilters(); renderIdeas();
}

// ── Render ideas ─────────────────────────────────────────────
function renderIdeas() {
  const grid = document.getElementById('ideasGrid');
  const searchRaw = document.getElementById('searchInput').value;
  const search = v34norm(searchRaw);
  const vm27Early = window.viewMode27 || 'grid';

  // --- 0. Detectar notas nuevas para inyectarlas y que no se pierdan si un panel está congelado ---
  if (!window.v44KnownIds) window.v44KnownIds = [];
  const currentAllIds = allIdeas.map(i => i.id);
  const newIds = currentAllIds.filter(id => !window.v44KnownIds.includes(id));
  if (newIds.length > 0) {
      if (window.v44CardsIds) window.v44CardsIds.push(...newIds);
      if (window.v44TableIds) window.v44TableIds.push(...newIds);
      window.v44KnownIds = currentAllIds;
  }
  
  // --- 1. Calcular el filtro ACTUAL del control remoto (Sidebar + Buscador) ---
  let currentFiltered = [...allIdeas].reverse();
  if (currentView === 'favoritas') currentFiltered = currentFiltered.filter(i => i.favorita);
  if (currentView === 'tareas') currentFiltered = currentFiltered.filter(i => i.tarea);

  const hasIncludeFilters = filters.proyectos.length || filters.tipos.length || filters.animos.length || filters.etiquetas.length;
  const hasExcludeFilters = excludedFilters.proyectos.length || excludedFilters.tipos.length || excludedFilters.animos.length || excludedFilters.etiquetas.length;
  
  const matchesCategory = (idea, keyName, value) => {
    if (keyName === 'etiquetas') return idea.etiquetas && idea.etiquetas.some(t => t.toLowerCase() === value);
    if (keyName === 'proyectos') return (idea.proyecto || 'general').toLowerCase() === value;
    if (keyName === 'tipos')     return (idea.tipo || 'nota').toLowerCase() === value;
    if (keyName === 'animos')    return (idea.animo || '').toLowerCase() === value;
    return false;
  };

  if (hasIncludeFilters) {
    const allConds = [];
    Object.keys(filters).forEach(k => filters[k].forEach(v => allConds.push([k, v])));
    if (combineMode === 'AND') currentFiltered = currentFiltered.filter(idea => allConds.every(([k, v]) => matchesCategory(idea, k, v)));
    else if (combineMode === 'OR') currentFiltered = currentFiltered.filter(idea => allConds.some(([k, v]) => matchesCategory(idea, k, v)));
    else if (combineMode === 'NOT') currentFiltered = currentFiltered.filter(idea => !allConds.some(([k, v]) => matchesCategory(idea, k, v)));
  }
  if (hasExcludeFilters) {
    const excConds = [];
    Object.keys(excludedFilters).forEach(k => excludedFilters[k].forEach(v => excConds.push([k, v])));
    currentFiltered = currentFiltered.filter(idea => !excConds.some(([k, v]) => matchesCategory(idea, k, v)));
  }
  if (dateFilter.mode) {
    currentFiltered = currentFiltered.filter(idea => {
      if (!idea.fecha) return false;
      if (dateFilter.mode === 'rango') {
        if (dateFilter.start && idea.fecha < dateFilter.start) return false;
        if (dateFilter.end && idea.fecha > dateFilter.end) return false;
        return true;
      }
      return idea.fecha >= dateFilter.start && idea.fecha <= dateFilter.end;
    });
  }
  if (search) {
    currentFiltered = currentFiltered.filter(i => (i.contenido && v34norm(i.contenido).includes(search)) || (i.original && v34norm(i.original).includes(search)) || (i.leccion && v34norm(i.leccion).includes(search)) || (i.etiquetas && i.etiquetas.some(t => v34norm(t).includes(search))) || (i.animo && v34norm(i.animo).includes(search)) || (i.proyecto && v34norm(i.proyecto).includes(search)) || (i.tipo && v34norm(i.tipo).includes(search)) || (i.accion && v34norm(i.accion).includes(search)));
  }

  // --- 2. ENRUTAMIENTO INDEPENDIENTE: El botón decide a qué pantalla le manda el filtro ---
  const v37Scope = window.v37SearchScope || 'cards';
  const currentFilteredIds = currentFiltered.map(i => i.id);

  // Inicializar en primera carga
  if (!window.v44CardsIds) window.v44CardsIds = currentFilteredIds;
  if (!window.v44TableIds) window.v44TableIds = currentFilteredIds;

  if (v37Scope === 'cards') {
      window.v44CardsIds = currentFilteredIds;
      // La tabla mantiene sus notas congeladas, ignorando el filtro actual
  } else if (v37Scope === 'proyecto') {
      window.v44TableIds = currentFilteredIds;
      // Las tarjetas mantienen sus notas congeladas
  } else {
      window.v44CardsIds = currentFilteredIds;
      window.v44TableIds = currentFilteredIds;
  }

  // --- 3. Reconstruir listas independientes basadas en su propio estado ---
  let listForCards = allIdeas.filter(i => window.v44CardsIds.includes(i.id)).reverse();
  let listForTable = allIdeas.filter(i => window.v44TableIds.includes(i.id)).reverse();

  // Para otras vistas (cuadrícula, split), no hay tabla, así que usamos el actual directo
  if (vm27Early !== 'proyecto') {
      listForCards = currentFiltered; 
  }

  // --- 4. Aplicar Ordenamientos (Sort) Independientes ---
  let sortMode;
  if (vm27Early === 'proyecto') {
    const ptSel = document.getElementById('v37ProjSortSel');
    sortMode = ptSel ? ptSel.value : 'fecha-desc';
  } else {
    sortMode = document.getElementById('sortSelect').value;
  }
  const plainText = (idea) => {
    const tmp = document.createElement('div'); tmp.innerHTML = idea.contenido || ''; return (tmp.innerText || '').toLowerCase();
  };
  const v37ApplySort = (arr) => {
    if (sortMode === 'fecha-asc') return arr.slice().reverse();
    if (sortMode === 'proyecto')  return arr.slice().sort((a, b) => (a.proyecto || 'general').localeCompare(b.proyecto || 'general'));
    if (sortMode === 'tipo')      return arr.slice().sort((a, b) => (a.tipo || 'nota').localeCompare(b.tipo || 'nota'));
    if (sortMode === 'animo')     return arr.slice().sort((a, b) => (a.animo || '').localeCompare(b.animo || ''));
    if (sortMode === 'alfabetico')return arr.slice().sort((a, b) => plainText(a).localeCompare(plainText(b)));
    return arr; 
  };
  listForCards = v37ApplySort(listForCards);
  listForTable = v37ApplySort(listForTable);

  // --- 5. Lógica Visual (Count Bar, Anti-Parpadeo, Renderizado) ---
  const activeList27 = (vm27Early === 'proyecto' && v37Scope === 'proyecto') ? listForTable : 
                       (vm27Early === 'proyecto' && v37Scope === 'cards') ? listForCards : 
                       currentFiltered;
                       
  const isFiltered = hasIncludeFilters || hasExcludeFilters || !!dateFilter.mode || !!search;
  document.getElementById('clearFiltersBtn').classList.toggle('visible', isFiltered);
  document.getElementById('countBar').textContent = activeList27.length === 1 ? '1 registro' : `${activeList27.length} registros`;

  if (vm27Early !== 'proyecto' && window.v31Pinned && window.v31Pinned.size > 0) {
    listForCards = listForCards.slice().sort(function(a,b){var aP=window.v31Pinned.has(a.id),bP=window.v31Pinned.has(b.id);if(aP&&!bP)return -1;if(!aP&&bP)return 1;return 0;});
  }
  window.v30LastList = activeList27;
  
  const wrapEl27 = document.getElementById('ideasWrap');
  if (vm27Early === 'split')    { if(wrapEl27) v27RenderSplit(listForCards);    return; }
  if (vm27Early === 'proyecto') { if(wrapEl27) v27RenderProyecto(listForTable, listForCards); return; }
  
  // Grid mode
  if (wrapEl27) {
    wrapEl27.style.cssText = 'flex:1;overflow-y:auto;padding:16px 20px;';
    wrapEl27.innerHTML = '<div class="ideas-grid" id="ideasGrid"></div>';
  }
  const gridEl27 = document.getElementById('ideasGrid');
  if (gridEl27) {
    if (listForCards.length === 0) {
      gridEl27.innerHTML = '<div class="empty"><div class="emoji">✦</div><p>No hay resultados.</p></div>';
    } else {
      gridEl27.innerHTML = listForCards.map(i => v27BuildCard(i, false)).join('');
      requestAnimationFrame(()=>gridEl27.querySelectorAll('.card-text').forEach(el=>{
        if(el.scrollHeight>el.clientHeight+4){const card=el.closest('.idea-card');if(card){const b=card.querySelector('.card-exp-btn');if(b)b.classList.add('vis');}}
      }));
    }
  }
}






let suggestionLists = { proyecto: [], tipo: [], animo: [] };
// v42: catálogo completo desde Sheets (_Categorias) — incluye valores que aún no
// tienen ninguna nota asignada, para que el sidebar y los dropdowns los muestren.
window.v37CatalogOptions = { proyectos: [], tipos: [], animos: [], etiquetas: [] };


function extractDynamicLists() {
  const getUnique = (key) => [...new Set(allIdeas.map(i => i[key]).filter(v => v && v.trim() !== ''))];
  const buildLocal = (key) => [...new Set([...getUnique(key), ...pendingNewValues[key]])];
  // Primero con lo que ya hay en notas, mientras llega el catálogo del backend
  suggestionLists.proyecto = buildLocal('proyecto').sort((a,b)=>a.localeCompare(b));
  suggestionLists.tipo     = buildLocal('tipo').sort((a,b)=>a.localeCompare(b));
  suggestionLists.animo    = buildLocal('animo').sort((a,b)=>a.localeCompare(b));

  // Also load from GAS catalog (_Categorias + tag colors) — se fusiona con lo anterior
  // v47: antes, si este fetch fallaba (red lenta, arranque en frío de Apps Script,
  // etc.) se tragaba el error en silencio y el catálogo quedaba vacío — dando la
  // impresión de que las categorías agregadas con "+" se "borraban" al refrescar
  // la página. Ahora reintenta una vez y avisa con un toast si de verdad falla,
  // en vez de desaparecer sin explicación.
  v47FetchAllOptions().then(d=>{
      if(!d) return;
      // Merge catalog values into native datalists (autocompletado nativo de respaldo)
      const merge=(id,vals)=>{
        const dl=document.getElementById(id); if(!dl)return;
        const existing=new Set([...dl.options].map(o=>o.value.toLowerCase()));
        vals.forEach(v=>{if(v&&!existing.has(v.toLowerCase())){const o=document.createElement('option');o.value=v;dl.appendChild(o);}});
      };
      merge('list-proyecto', d.proyectos||[]);
      merge('list-tipo',     d.tipos||[]);
      merge('list-animo',    d.animos||[]);

      // v42: fusiona el catálogo completo de Sheets en suggestionLists, para que el
      // dropdown híbrido (modal Y Vista Proyecto) muestre TODO lo que ya tenías
      // creado en _Categorias, aunque aún no tenga ninguna nota asignada.
      const mergeSugg = (key, vals) => {
        suggestionLists[key] = [...new Set([...suggestionLists[key], ...(vals||[])])].sort((a,b)=>a.localeCompare(b));
      };
      mergeSugg('proyecto', d.proyectos);
      mergeSugg('tipo',     d.tipos);
      mergeSugg('animo',    d.animos);
      window.v37CatalogOptions = {
        proyectos: (d.proyectos||[]).map(v=>v.toLowerCase()),
        tipos:     (d.tipos||[]).map(v=>v.toLowerCase()),
        animos:    (d.animos||[]).map(v=>v.toLowerCase()),
        etiquetas: (d.etiquetas||[]).map(v=>v.toLowerCase())
      };
      renderSidebarFilters(); // refleja categorías sin notas aún (cuentan con 0)

      // Apply tag colors
      if(d.tagColors&&Object.keys(d.tagColors).length){
        Object.assign(window.v27TagColors||{},d.tagColors);
        window.v27TagColors=Object.assign(window.v27TagColors||{},d.tagColors);
        v28ApplyTagColors&&v28ApplyTagColors();
      }
      // v39: colores y fijados de proyecto/tipo/ánimo/etiqueta (desde _Categorias)
      if (d.categorias && typeof v37ApplyCatMeta === 'function') v37ApplyCatMeta(d.categorias);
  });
}

// v47: trae el catálogo completo (_Categorias en Sheets) — única fuente de verdad
// para el sidebar. Reintenta una vez ante fallo de red/backend antes de avisar.
function v47FetchAllOptions(retriesLeft) {
  if (retriesLeft === undefined) retriesLeft = 1;
  return fetch(`${GAS_URL}?action=getAllOptions&t=${Date.now()}`)
    .then(r => r.json())
    .then(d => {
      if (!d.ok) {
        if (retriesLeft > 0) return new Promise(res => setTimeout(res, 900)).then(() => v47FetchAllOptions(retriesLeft - 1));
        showToast('No se pudieron cargar las categorías del Sheet: ' + (d.error || 'error desconocido'));
        return null;
      }
      return d;
    })
    .catch(() => {
      if (retriesLeft > 0) return new Promise(res => setTimeout(res, 900)).then(() => v47FetchAllOptions(retriesLeft - 1));
      showToast('No se pudo conectar para cargar categorías del Sheet — vuelve a intentar');
      return null;
    });
}

// ── Dropdown híbrido: escribes libre O eliges de la lista con la flechita ──
// v42: generalizado para aceptar ids dinámicos — así lo puede usar tanto el modal
// (ids fijos inputProyecto/dropdown-proyecto) como cada fila de Vista Proyecto
// (ids únicos por nota, ej. inputProyecto-ID123/dropdown-proyecto-ID123).
function v41Cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }







function toggleHybridDropdown(field, inputId, dropdownId) {
  inputId = inputId || `input${v41Cap(field)}`;
  dropdownId = dropdownId || `dropdown-${field}`;
  const dropdown = document.getElementById(dropdownId);
  if (!dropdown) return;
  const isOpen = dropdown.classList.contains('open');
  closeAllHybridDropdowns();
  if (!isOpen) { renderHybridDropdownList(field, '', inputId, dropdownId); dropdown.classList.add('open'); }
}

function filterHybridDropdown(field, inputId, dropdownId) {
  inputId = inputId || `input${v41Cap(field)}`;
  dropdownId = dropdownId || `dropdown-${field}`;
  const inputEl = document.getElementById(inputId); if (!inputEl) return;
  renderHybridDropdownList(field, inputEl.value.toLowerCase(), inputId, dropdownId);
  const dd = document.getElementById(dropdownId); if (dd) dd.classList.add('open');
}

function renderHybridDropdownList(field, filterText, inputId, dropdownId) {
  inputId = inputId || `input${v41Cap(field)}`;
  dropdownId = dropdownId || `dropdown-${field}`;
  const dropdown = document.getElementById(dropdownId); if (!dropdown) return;
  const options = (suggestionLists[field] || []).filter(v => v.toLowerCase().includes(filterText));
  if (options.length === 0) {
    dropdown.innerHTML = `<div class="hybrid-dropdown-empty">Sin coincidencias. Puedes escribir uno nuevo.</div>`;
    return;
  }
  dropdown.innerHTML = options.map(v =>
    `<div class="hybrid-dropdown-item" onclick="selectHybridOption('${field}', '${escHtml(v)}', '${inputId}', '${dropdownId}')">${escHtml(v)}</div>`
  ).join('');
}

function selectHybridOption(field, value, inputId, dropdownId) {
  inputId = inputId || `input${v41Cap(field)}`;
  const inputEl = document.getElementById(inputId);
  if (inputEl) {
    inputEl.value = value;
    // Dispara 'change' para que los inputs de Vista Proyecto (que guardan con
    // onchange) se actualicen solos, sin tener que pasar el id de la nota aquí.
    inputEl.dispatchEvent(new Event('change', { bubbles: true }));
  }
  closeAllHybridDropdowns();
}

function closeAllHybridDropdowns() { document.querySelectorAll('.hybrid-dropdown').forEach(d => d.classList.remove('open')); }
document.addEventListener('mousedown', (e) => { if (!e.target.closest('.hybrid-select-wrap')) closeAllHybridDropdowns(); });

    proyecto: document.getElementById('inputProyecto').value.trim(),
    tipo: document.getElementById('inputTipo').value.trim(),
    animo: document.getElementById('inputAnimo').value.trim(),
    accion: document.getElementById('inputAccion').value.trim()
  };

 try {
    // Extraemos tus categorías actuales para que la IA no invente
    const existingProyectos = [...new Set(allIdeas.map(i => i.proyecto).filter(Boolean))];
    const existingTipos = [...new Set(allIdeas.map(i => i.tipo).filter(Boolean))];
    const existingAnimos = [...new Set(allIdeas.map(i => i.animo).filter(Boolean))];

    const r = await postGAS({ 
      action: 'autoFill', 
      text: text, 
      current: currentContext, 
      conversacion: aiConversation,
      existingTags: allTags.map(t => t.etiqueta),
      existingProyectos: existingProyectos,
      existingTipos: existingTipos,
      existingAnimos: existingAnimos,
      useClaude: useClaude
    });

    // ── Solo si AMBAS IAs fallaron mostramos el aviso ──
    if (!r.ok && r.quotaExceeded) {
      btn.disabled = false; sp.style.display = 'none'; txt.textContent = '🪄 Asistente & Tutor IA';
      inputEl.classList.remove('blinking-gold');
      showToast('⚠️ IA no disponible en este momento. Intenta más tarde.');
      return;
    }

if (r.ok && r.data) {
       // Llenar formulario con la magia
       if (r.data.contenido) inputEl.innerText = r.data.contenido;
       if (r.data.proyecto)  document.getElementById('inputProyecto').value = r.data.proyecto;
       if (r.data.tipo)      document.getElementById('inputTipo').value = r.data.tipo;
       if (r.data.animo)     document.getElementById('inputAnimo').value = r.data.animo;
       if (r.data.accion)    document.getElementById('inputAccion').value = r.data.accion;
       
       if (r.data.original)  document.getElementById('inputOriginal').value = r.data.original;
       if (r.data.leccion)   document.getElementById('inputLeccion').value = r.data.leccion;
       
       if (r.data.etiquetas && Array.isArray(r.data.etiquetas)) {
          selectedTags = [...new Set([...selectedTags, ...r.data.etiquetas.map(t => t.toLowerCase().trim().replace(/\s+/g, '-'))])];
          renderModalTagCloud();
       }

       if (r.data.leccion) {
         const tp = document.getElementById('tutorPreview');
         tp.style.display = 'block';
         tp.innerHTML = `<strong>💡 Lección detectada:</strong> ${escHtml(r.data.leccion).replace(/\n/g, ' ')}`;
       } else { document.getElementById('tutorPreview').style.display = 'none'; }

       const modelLabel = r.usedModel === 'claude' ? '✨ Listo (vía Claude)' : '✨ Listo';
       showToast(modelLabel);
       
       document.getElementById('chatSection').style.display = 'block';
       if (!fromChat && aiConversation.length === 0) {
          aiConversation.push({ role: 'user', content: `Analiza esta nota:\n\n${text}` });
       }
       aiConversation.push({ role: 'assistant', content: r.rawAiResponse });
       appendChatMsg('ai', "He ajustado los campos. Si quieres cambiar algo, dímelo aquí.");
    } else {
       throw new Error(r.error || 'Error desconocido');
    }
  } catch(e) {
    // AHORA TE MOSTRARÁ EL ERROR REAL EN PANTALLA
    showToast(e.message || 'Error en la IA'); 
  }

  btn.disabled = false; sp.style.display = 'none'; txt.textContent = '🪄 Asistente & Tutor IA';

}

  if (allKnown.length === 0) { container.innerHTML = '<span style="color:var(--ink-3);font-size:12px;">Sin etiquetas</span>'; }

// Helpers
async function postGAS(body) {
  const form = new FormData();
  form.append('payload', JSON.stringify(body));
  const r = await fetch(GAS_URL, { method: 'POST', body: form });
  const raw = await r.text();
  try {
    return JSON.parse(raw);
  } catch (e) {
    // Si el backend no devuelve JSON válido, lo más probable es que el Apps Script
    // desplegado esté desactualizado (acción no reconocida) o haya un error de permisos.
    return { ok: false, error: 'Respuesta inesperada del servidor. Verifica que implementaste la última versión del Apps Script.' };
  }
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let toastTimer; function showToast(msg) { const existing = document.querySelector('.toast'); if (existing) existing.remove(); clearTimeout(toastTimer); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 2800); }

// ── Soporte para Pegar Imágenes Directamente (Ctrl+V / Cmd+V) ──
document.addEventListener('paste', async (e) => {
  const activeEl = document.activeElement;
  const isModalEditor = activeEl && activeEl.id === 'inputContenido';
  const isInlineEditor = activeEl && activeEl.classList && activeEl.classList.contains('card-text');
  
  // Solo actuar si estamos escribiendo dentro de una nota (modal o tarjeta)
  if (!isModalEditor && !isInlineEditor) return; 

  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (let item of items) {
    if (item.type.indexOf('image/') === 0) {
      e.preventDefault(); // Evita que se pegue como código base64 gigante e ilegible
      const file = item.getAsFile();
      if (!file) continue;
      if (file.size > 5 * 1024 * 1024) { 
        showToast('La imagen es muy grande (máx. 5MB)'); 
        continue; 
      }

      // Guardar la posición del cursor antes de subir la imagen
      const sel = window.getSelection();
      imageInsertContext.isCard = isInlineEditor;
      imageInsertContext.savedRange = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).cloneRange() : null;

      showToast('Subiendo imagen pegada…');
      try {
        const base64 = await fileToBase64(file);
        // Usamos tu función existente de Google Apps Script para subirla a Drive
        const r = await postGAS({ action: 'uploadImage', imageBase64: base64, mimeType: file.type, fileName: 'imagen_pegada.png' });
        
        if (r.ok && r.url) {
          insertImageAtSavedPosition(r.url, isInlineEditor);
          showToast('Imagen agregada ✦');
        } else {
          showToast(r.error || 'No se pudo subir la imagen pegada');
        }
      } catch (err) {
        showToast('Error al subir la imagen');
      }
    }
  }
});

    } else {
      el.textContent = '☐';
      el.style.color = '';

document.addEventListener('keydown', (e) => {
  const editor = document.activeElement;
  if (e.key === 'Enter' && !e.shiftKey && (editor.id === 'inputContenido' || editor.classList.contains('card-text'))) {
    
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    
    let node = sel.focusNode;
    let block = node.nodeType === 3 ? node.parentNode : node;
    
    while (block && block.parentNode !== editor && block !== editor) { block = block.parentNode; }
    
    const chk = block ? block.querySelector('.chk-box') : null;
    if (chk) {
      e.preventDefault();
      const cleanText = block.textContent.replace(/[☐☑\u00A0\s]/g, '');
      
      if (cleanText === '') {
         block.innerHTML = '<br>';
         const range = document.createRange();
         range.selectNodeContents(block);
         range.collapse(true);
         sel.removeAllRanges(); sel.addRange(range);
      } else {
         document.execCommand('insertHTML', false, '<br><span class="chk-box" contenteditable="false">☐</span>&nbsp;');
      }
    }
  }
});

// v46: resumen legible de los filtros activos — usado tanto en el título de
// Vista Proyecto como disponible para el resto de la UI (misma fuente de verdad:
// filters/excludedFilters/dateFilter/búsqueda/búsqueda guardada).
function v46Cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }
function v46BuildFilterSummary() {
  if (window.v37ActiveSearchId && window.v27FavSearches) {
    const fs = window.v27FavSearches.find(s => s.id === window.v37ActiveSearchId);
    if (fs) return 'Búsq. Guardada: ' + fs.nombre;
  }
  const parts = [];
  const catLabel = { proyectos: 'Proyecto', tipos: 'Tipo', etiquetas: 'Etiquetas', animos: 'Estado de ánimo' };
  ['proyectos', 'tipos', 'etiquetas', 'animos'].forEach(cat => {
    if (filters[cat] && filters[cat].length) parts.push(catLabel[cat] + ': ' + filters[cat].map(v => v46Cap(v)).join(', '));
  });
  const searchVal = (document.getElementById('searchInput') || {}).value;
  if (searchVal && searchVal.trim()) parts.push('Búsqueda: "' + searchVal.trim() + '"');
  if (typeof dateFilter !== 'undefined' && dateFilter && dateFilter.mode) {
    const dLabel = { hoy: 'Hoy', semana: 'Esta semana', mes: 'Este mes', anio: 'Este año', rango: 'Rango' }[dateFilter.mode] || dateFilter.mode;
    parts.push('Fecha: ' + dLabel);
  }
  return parts.length ? parts.join(', ') : 'Todos los proyectos';
}

function v27RenderProyecto(list, listCards) {
  // v40: listCards es OPCIONAL — el panel de tarjetas que vive a la izquierda,
  // adentro de esta misma vista, puede tener su propio set filtrado (alcance de
  // búsqueda "Tarjetas" vs "Proyecto"). Si no se pasa, usa la misma lista de la tabla.
  if (listCards === undefined) listCards = list;
  const wrap=document.getElementById('ideasWrap');if(!wrap)return;
  const cols=window.v27PtCols;
  // v37: sincroniza el proyecto seleccionado (sidebar o dropdown) en lugar de usar
  // el último grupo recorrido — antes window.v27CurrentProj quedaba con el ÚLTIMO
  // proyecto iterado, no con el que el usuario realmente tenía seleccionado.
  

// Usa tu nueva variable local de la tabla
const projFilter = window.v37TableProj || ''; 

// Actualiza la variable que usa el botón "Nueva Entrada" para que coincida con la tabla
window.v27CurrentProj = projFilter; 

// v46: mientras hay texto en el buscador Y el alcance de búsqueda incluye la
// tabla (Proyecto o Ambas), el filtro de proyecto del topbar se ignora
// temporalmente para poder buscar en TODOS los proyectos. Apenas el buscador
// queda vacío, se vuelve a respetar el proyecto seleccionado como filtro normal.
const v46SearchActive = !!(document.getElementById('searchInput').value || '').trim();
const v46ScopeNow = window.v37SearchScope || 'cards';
const v46BypassProjFilter = v46SearchActive && (v46ScopeNow === 'proyecto' || v46ScopeNow === 'both');

// Filtra la lista LOCALMENTE para la tabla:
if (projFilter && !v46BypassProjFilter) {
    list = list.filter(i => (i.proyecto || 'general').toLowerCase() === projFilter.toLowerCase());
}

// v46: etiqueta de solo lectura (ya no un desplegable) — muestra el/los filtros
// activos, vinculada a la misma info que la barra de "N registros".
const v46TopLabel = v46BuildFilterSummary();

  // LEFT: compact cards (same as split view) — usa listCards (alcance "Tarjetas")
  const leftHTML=listCards.length
    ?listCards.map(i=>v27BuildCard(i,false)).join('')
    :'<div class="empty"><div class="emoji">✦</div><p>Sin resultados</p></div>';

  // ── v43: ANTI-PARPADEO — si la tabla (alcance "Proyecto") no cambió y solo
  // cambió el panel de tarjetas (alcance "Tarjetas"), no reconstruimos toda la
  // tabla: eso perdía el cursor/foco mientras escribías o buscabas. Solo se
  // actualiza el panel izquierdo y salimos. ──
  const tableSignature = list.map(i => i.id).join(',');
  const existingRight = document.getElementById('v29ptRight');
  const existingLeftGrid = document.querySelector('#v29ptLeft .ideas-grid');
  if (existingRight && existingLeftGrid && window._lastTableSig === tableSignature) {
    existingLeftGrid.innerHTML = leftHTML;
    requestAnimationFrame(() => {
      existingLeftGrid.querySelectorAll('.card-text').forEach(el => {
        if (el.scrollHeight > el.clientHeight + 4) {
          const card = el.closest('.idea-card');
          if (card) { const b = card.querySelector('.card-exp-btn'); if (b) b.classList.add('vis'); }
        }
      });
    });
    return; // No se reconstruye la tabla de la derecha
  }
  window._lastTableSig = tableSignature;

  wrap.style.cssText='flex:1;overflow:hidden;padding:0;';

  // RIGHT: project table — usa list (alcance "Proyecto")
  const groups={},order=[];
  list.forEach(idea=>{const p=(idea.proyecto||'general').toLowerCase()||'general';if(!groups[p]){groups[p]=[];order.push(p);}groups[p].push(idea);});
  order.sort((a,b)=>{return v27SortKey(a).localeCompare(v27SortKey(b));});

  const cw={form:window.v39FirstColW||80,orig:220,cont:290,lec:220};
  const colItems=[{k:'form',l:'Formulario / Datos'},{k:'orig',l:'Original (lo que escribí)'},{k:'cont',l:'Contenido IA (editable)'},{k:'lec',l:'Lección / Resultado'}]

async function v27PtAI(id) {
  const idea=allIdeas.find(i=>i.id===id);if(!idea)return;
  const oid='ptO-'+id, cid='ptC-'+id, lid='ptL-'+id;
  const origEl=document.getElementById(oid)||document.getElementById(cid);
  const contEl=document.getElementById(cid);
  const lecEl=document.getElementById(lid);
  if(!contEl){showToast('Activa la columna Contenido IA para usar ✦ IA');return;}
  const rawText=origEl.innerText||origEl.textContent||'';
  if(!rawText.trim()){showToast('Escribe algo en "Original" primero');return;}
  if(lecEl)lecEl.textContent='Procesando…';
  if(contEl&&contEl!==origEl)contEl.style.opacity='0.5';
  const eP=[...new Set(allIdeas.map(i=>i.proyecto).filter(Boolean))];
  const eT=[...new Set(allIdeas.map(i=>i.tipo).filter(Boolean))];
  const eA=[...new Set(allIdeas.map(i=>i.animo).filter(Boolean))];
  const r=await postGAS({action:'autoFill',text:rawText,current:{proyecto:idea.proyecto||'',tipo:idea.tipo||'',animo:idea.animo||'',accion:idea.accion||''},conversacion:[],existingTags:allTags.map(t=>t.etiqueta),existingProyectos:eP,existingTipos:eT,existingAnimos:eA}).catch(()=>({ok:false}));
  if(!r.ok){if(lecEl)lecEl.textContent='Error';if(contEl)contEl.style.opacity='1';return;}
  if(r.data){
    // Update contenido if improved
    // Write AI result to Contenido column (not Original)
    if(contEl)contEl.style.opacity='1';
    if(r.data.contenido){
      contEl.innerHTML=sanitizeHtml(r.data.contenido);
      idea.contenido=sanitizeHtml(r.data.contenido);
      await postGAS({action:'updateIdea',id,text:idea.contenido}).catch(()=>{});
    }
    // Show lesson
    const lecText=r.data.leccion||'';
    if(lecEl){lecEl.textContent=lecText;idea.leccion=lecText;if(lecText)await postGAS({action:'updateIdea',id,text:idea.contenido,leccion:lecText}).catch(()=>{});}
    if(!lecText&&lecEl)lecEl.textContent='✓ Sin correcciones de inglés';
  }
}

// ── v42: IA libre por fila — hace lo mismo que ✦IA (corrige y clasifica) PERO
// además detecta la marca #IA# en "Original": si está presente, el resto del
// texto se trata como una instrucción o pregunta (ej. "#IA# resume esto",
// "#IA# escribe 5 superfoods", "#IA# según esta imagen qué...") y la responde/
// ejecuta directamente, en vez de solo corregirla. También puede leer imágenes
// insertadas en la fila con el botón 🖼️ (las saca directo de Drive). ──
async function v41PtFreeAI(id) {
  const idea=allIdeas.find(i=>i.id===id);if(!idea)return;
  const oid='ptO-'+id, cid='ptC-'+id, lid='ptL-'+id;
  const origEl=document.getElementById(oid)||document.getElementById(cid);
  const contEl=document.getElementById(cid);
  const lecEl=document.getElementById(lid);
  if(!contEl){showToast('Activa la columna Contenido IA para usar 🤖 IA');return;}
  const rawText=(origEl.innerText||origEl.textContent||'').trim();
  // Busca imágenes insertadas en Original o en Contenido IA (los <img> que sube el botón 🖼️)
  const imgEls=[...(origEl.querySelectorAll('img')||[]), ...(contEl.querySelectorAll('img')||[])];
  const imageUrls=[...new Set(imgEls.map(im=>im.src).filter(Boolean))];
  if(!rawText && imageUrls.length===0){showToast('Escribe algo (o adjunta una imagen) en "Original" primero');return;}
  if(lecEl)lecEl.textContent='Procesando…';
  contEl.style.opacity='0.5';
  const eP=[...new Set(allIdeas.map(i=>i.proyecto).filter(Boolean))];
  const eT=[...new Set(allIdeas.map(i=>i.tipo).filter(Boolean))];
  const eA=[...new Set(allIdeas.map(i=>i.animo).filter(Boolean))];
  const r=await postGAS({
    action:'ptFreeAI', text:rawText, imageUrls,
    current:{proyecto:idea.proyecto||'',tipo:idea.tipo||'',animo:idea.animo||'',accion:idea.accion||''},
    existingTags:allTags.map(t=>t.etiqueta), existingProyectos:eP, existingTipos:eT, existingAnimos:eA
  }).catch(()=>({ok:false}));
  contEl.style.opacity='1';
  if(!r.ok){if(lecEl)lecEl.textContent='Error: '+(r.error||'desconocido');showToast('Error en IA libre');return;}
  if(r.resultado){
    contEl.innerHTML=sanitizeHtml(r.resultado);
    idea.contenido=sanitizeHtml(r.resultado);
  }
  // Si detectó instrucción (#IA#) puede no traer clasificación — solo actualiza lo que venga
  const updBody={action:'updateIdea',id,text:idea.contenido};
  if(r.proyecto){idea.proyecto=r.proyecto;updBody.proyecto=r.proyecto;document.getElementById('inputProyecto-'+id)&&(document.getElementById('inputProyecto-'+id).value=r.proyecto);}
  if(r.tipo){idea.tipo=r.tipo;updBody.tipo=r.tipo;document.getElementById('inputTipo-'+id)&&(document.getElementById('inputTipo-'+id).value=r.tipo);}
  if(r.animo){idea.animo=r.animo;updBody.animo=r.animo;document.getElementById('inputAnimo-'+id)&&(document.getElementById('inputAnimo-'+id).value=r.animo);}
  if(r.etiquetas&&Array.isArray(r.etiquetas)&&r.etiquetas.length){
    const merged=[...new Set([...(idea.etiquetas||[]),...r.etiquetas.map(t=>t.toLowerCase().trim())])];
    idea.etiquetas=merged; updBody.etiquetas=merged;
    const chipsEl=document.getElementById('ptChips-'+id);
    if(chipsEl)chipsEl.innerHTML=merged.map(function(t){return '<span class="selected-tag-chip" style="cursor:pointer;background:#fff;" onclick="toggleProjectInnerFilter(&apos;'+t+'&apos;)" title="Filtrar dentro de este proyecto">'+escHtml(t)+'<button type="button" onclick="event.stopPropagation();v29RmTag(&apos;'+id+'&apos;,&apos;'+t+'&apos;)" style="background:none;border:none;cursor:pointer;color:#a8801a;padding:0 3px;font-size:13px;line-height:1;">✕</button></span>';}).join('');
  }
  const nota=r.nota||'';
  if(lecEl){lecEl.textContent=nota||'✓ Listo (sin notas adicionales)';idea.leccion=nota;updBody.leccion=nota;}
  await postGAS(updBody).catch(()=>{});
  showToast('🤖 Listo');
}

// Column resize
function v27StartResize(thId, e) {
  e.preventDefault();e.stopPropagation();
  const th=document.getElementById(thId);if(!th)return;
  const startX=e.pageX, startW=th.offsetWidth;
  // v39: la columna "Formulario" (1ra) tiene min/max-width:80px por CSS para que
  // arranque angosta de verdad; al arrastrarla hay que ir liberando ese máximo en
  // el th, el td y el contenido interno (.pt-form-inner), si no, el arrastre no
  // tiene efecto visible.
  if (thId === 'ptH-form') {
    function onMoveForm(e2){
      const nw=Math.max(80,startW+e2.pageX-startX);
      window.v39FirstColW = nw;
      th.style.width=nw+'px'; th.style.minWidth='80px'; th.style.maxWidth=nw+'px';
      document.querySelectorAll('.pt-table td:first-child').forEach(function(td){
        td.style.width=nw+'px'; td.style.minWidth='80px'; td.style.maxWidth=nw+'px'; td.style.overflow='hidden';
        const inn=td.querySelector('.pt-form-inner');
        if(inn) inn.style.maxWidth='100%';
      });
    }
    function onUpForm(){
      document.removeEventListener('mousemove',onMoveForm);document.removeEventListener('mouseup',onUpForm);
      localStorage.setItem('notas-pt-col1-width', String(window.v39FirstColW||80));
    }
    document.addEventListener('mousemove',onMoveForm);document.addEventListener('mouseup',onUpForm);
    return;
  }
  function onMove(e2){th.style.width=Math.max(80,startW+e2.pageX-startX)+'px';}
  function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}

// Tag management in project form cell
function v29FilterTagCloud(ideaId, query) {
  const cloud=document.getElementById('ptTagCloud-'+ideaId);if(!cloud)return;
  const q=query.toLowerCase().trim();
  const idea=allIdeas.find(i=>i.id===ideaId);
  const existing=(idea&&idea.etiquetas)||[];
  const allKnown=[...new Set([...getCounts('etiquetas').map(e=>e[0]),...existing])];
  const filtered=q?allKnown.filter(t=>t.toLowerCase().includes(q)):allKnown;
  cloud.innerHTML=filtered.slice(0,20).map(t=>{
    const isActive=existing.includes(t);
    return `<span class="selectable-tag ${isActive?'active':''}" onclick="v29TogTag('${ideaId}','${escHtml(t)}')" oncontextmenu="event.stopPropagation();v28TagColorMenu(event,'${escHtml(t)}')">${escHtml(t)}</span>`;
  }).join('');
}

function v29TogTag(ideaId, tag) {
  const clean=tag.toLowerCase().trim();
  const idea=allIdeas.find(i=>i.id===ideaId);if(!idea)return;
  if(!idea.etiquetas)idea.etiquetas=[];
  const idx=idea.etiquetas.indexOf(clean);
  if(idx>-1)idea.etiquetas.splice(idx,1); else idea.etiquetas.push(clean);
  v29RefreshChips(ideaId,idea.etiquetas);
  v29FilterTagCloud(ideaId,document.getElementById('ptTagIn-'+ideaId)?.value||'');
  postGAS({action:'updateIdea',id:ideaId,text:idea.contenido||'',etiquetas:idea.etiquetas}).catch(()=>{});
}

function v29AddTag(ideaId, text) {
  const clean=text.trim().toLowerCase().replace(/\s+/g,'-');if(!clean)return;
  const idea=allIdeas.find(i=>i.id===ideaId);if(!idea)return;
  if(!idea.etiquetas)idea.etiquetas=[];
  if(!idea.etiquetas.includes(clean))idea.etiquetas.push(clean);
  v29RefreshChips(ideaId,idea.etiquetas);
  v29FilterTagCloud(ideaId,'');
  postGAS({action:'updateIdea',id:ideaId,text:idea.contenido||'',etiquetas:idea.etiquetas}).catch(()=>{});
}

function v29RmTag(ideaId, tag) {
  const idea=allIdeas.find(i=>i.id===ideaId);if(!idea)return;
  idea.etiquetas=(idea.etiquetas||[]).filter(t=>t!==tag);
  v29RefreshChips(ideaId,idea.etiquetas);
  v29FilterTagCloud(ideaId,document.getElementById('ptTagIn-'+ideaId)?.value||'');

openAddCategoryPrompt=async function(field){
  const label={proyecto:'proyecto',tipo:'tipo',animo:'estado de ánimo',etiqueta:'etiqueta'}[field];
  const value=prompt(`Nombre del nuevo ${label}:`);
  if(!value||!value.trim())return;

  // agregamos AL INSTANTE al catálogo que sí lee el sidebar (getCounts lee

    const lc=clean.toLowerCase();
    if(!window.v37CatalogOptions[ck].includes(lc))window.v37CatalogOptions[ck].push(lc);
  }
  // Despliega la sección para que se vea sin tener que expandirla a mano
  const sectionKey=ck;
  if(sectionKey && typeof collapsedSections!=='undefined') collapsedSections[sectionKey]=false;
  renderSidebarFilters();
  try{
    await postGAS({action:'addCategoria',tipo:field,valor:clean});

function v32MoveRow(id,dir){
  var idea=allIdeas.find(function(i){return i.id===id;});if(!idea)return;
  var proj=(idea.proyecto||'general').toLowerCase();
  var order=v32GetOrder(proj);
  // Build current order from DOM
  var rows=document.querySelectorAll('[id^="ptRow-"]');
  var currentIds=[...rows].map(function(r){return r.id.replace('ptRow-','');}).filter(function(i){
    var a=allIdeas.find(function(n){return n.id===i;});
    return a&&(a.proyecto||'general').toLowerCase()===proj;
  });
  if(!currentIds.length)return;
  var idx=currentIds.indexOf(id);
  if(idx<0)return;
  if(dir==='up'&&idx>0){var tmp=currentIds[idx-1];currentIds[idx-1]=currentIds[idx];currentIds[idx]=tmp;}
  else if(dir==='down'&&idx<currentIds.length-1){var tmp2=currentIds[idx+1];currentIds[idx+1]=currentIds[idx];currentIds[idx]=tmp2;}
  else return;
  v32SaveOrder(proj,currentIds);
  renderIdeas();
}

// Override v27RenderProyecto to use custom order
var _origRP32=v27RenderProyecto;
v27RenderProyecto=function(list, listCards){ // v43: ahora también recibe y reenvía listCards
  // Apply custom order within each project group
  var groups={};
  list.forEach(function(idea){var p=(idea.proyecto||'general').toLowerCase()||'general';if(!groups[p])groups[p]=[];groups[p].push(idea);});
  Object.keys(groups).forEach(function(proj){
    var order=v32GetOrder(proj);
    if(order.length){
      var ordered=[];
      order.forEach(function(id){var i=groups[proj].find(function(n){return n.id===id;});if(i)ordered.push(i);});
      groups[proj].forEach(function(i){if(!ordered.find(function(n){return n.id===i.id;}))ordered.push(i);});
      groups[proj]=ordered;
    }
  });
  // Rebuild list with order applied
  var newList=[];
  var order2=[];
  list.forEach(function(i){var p=(i.proyecto||'general').toLowerCase()||'general';if(!order2.includes(p))order2.push(p);});
  order2.forEach(function(p){if(groups[p])newList=newList.concat(groups[p]);});
  // v43: antes aquí se perdía listCards (quedaba undefined SIEMPRE), por eso el
  // panel de tarjetas dentro de Vista Proyecto nunca recibía su propia lista —
  // el alcance de búsqueda "Tarjetas" no podía funcionar ahí.
  _origRP32(newList.length?newList:list, listCards);
};

function v34ToggleNoteSearch(id){
  var bar=document.getElementById('nsbar-'+id);if(!bar)return;
  bar.classList.toggle('open');
  if(bar.classList.contains('open'))bar.querySelector('input').focus();
  else{bar.querySelector('input').value='';v34SearchInNote(id,'v27sc-'+id,'');}
}
function v34CloseNoteSearch(id){var bar=document.getElementById('nsbar-'+id);if(!bar)return;bar.classList.remove('open');bar.querySelector('input').value='';v34SearchInNote(id,'v27sc-'+id,'');}
function v34SearchInNote(id,cid,q){
  var el=document.getElementById(cid);if(!el)return;
  // Remove old highlights
  el.querySelectorAll('.note-search-highlight').forEach(function(n){
    n.outerHTML=n.textContent;
  });
  if(!q||!q.trim()){document.getElementById('nsCount-'+id)&&(document.getElementById('nsCount-'+id).textContent='');return;}
  var nq=v34norm(q);
  // Highlight matches in text nodes
  function walkAndHighlight(node){
    if(node.nodeType===3){
      var t=node.textContent;
      var nt=v34norm(t);
      var idx=nt.indexOf(nq);
      if(idx<0)return;
      var before=t.slice(0,idx),match=t.slice(idx,idx+q.length),after=t.slice(idx+q.length);
      var span=document.createElement('span');span.className='note-search-highlight';span.textContent=match;
      var frag=document.createDocumentFragment();
      if(before)frag.appendChild(document.createTextNode(before));
      frag.appendChild(span);
      if(after)frag.appendChild(document.createTextNode(after));
      node.parentNode.replaceChild(frag,node);
    }else if(node.nodeType===1&&!node.classList.contains('note-search-highlight')){
      Array.from(node.childNodes).forEach(walkAndHighlight);
    }
  }
  walkAndHighlight(el);
  var count=el.querySelectorAll('.note-search-highlight').length;
  var cnt=document.getElementById('nsCount-'+id);if(cnt)cnt.textContent=count?count+' hallado(s)':'Sin resultados';
  if(count)el.querySelectorAll('.note-search-highlight')[0].scrollIntoView({block:'nearest'});
}

// v39: al agrandar la fila, el contenido interno (.pt-content-cell / .pt-form-inner)
// tenía un max-height:180px fijo en CSS (regla heredada de v31) que lo seguía
// recortando aunque la fila/celda creciera — por eso "el scroll seguía chiquito".
// Ahora sincronizamos el max-height interno con la altura real de la fila.
function v39SyncInnerMaxHeight(td, rowHeightPx){
  var inner = td.querySelector('.pt-content-cell, .pt-form-inner');
  if (inner) inner.style.maxHeight = Math.max(60, rowHeightPx - 16) + 'px';
}
function v34AddRowResizers(){
  document.querySelectorAll('#v29ptWrap tr[id^="ptRow-"] td').forEach(function(td){
    if(td.querySelector('.pt-row-resize-handle'))return;
    td.style.position='relative';
    var h=document.createElement('div');
    h.className='pt-row-resize-handle';
    h.title='Arrastra para ajustar altura de fila';
    h.onmousedown=function(e){
      e.preventDefault();
      var row=td.closest('tr');if(!row)return;
      var startY=e.pageY,startH=row.offsetHeight;
      function onMove(e2){
        var nh=Math.max(60,startH+e2.pageY-startY);
        row.style.height=nh+'px';
        row.querySelectorAll('td').forEach(function(c){
          c.style.height=nh+'px';
          v39SyncInnerMaxHeight(c, nh);
        });
      }
      function onUp(){
        document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);
        var id=row.id.replace('ptRow-','');
        window.v34RowHeights[id]=row.offsetHeight;
        localStorage.setItem('notas-row-heights',JSON.stringify(window.v34RowHeights));
      }
      document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);
    };
    td.appendChild(h);
  });
  // Apply saved heights
  Object.keys(window.v34RowHeights).forEach(function(id){
    var row=document.getElementById('ptRow-'+id);
    if(!row)return;
    var h=window.v34RowHeights[id];
    row.style.height=h+'px';
    row.querySelectorAll('td').forEach(function(c){
      c.style.height=h+'px';
      v39SyncInnerMaxHeight(c, h);
    });
  });
}

  (Object.keys(excludedFilters || {})).forEach(function(cat) {
    (excludedFilters[cat] || []).forEach(function(val) {
      chips.push('<span class="v37-active-chip" style="text-decoration:line-through;background:#fde8e8;border-color:#fca5a5;color:#b91c1c;">🚫 '+escHtml(val)
        +'<button onclick="toggleExcludeFilter(\''+cat+'\',\''+escHtml(val)+'\')">✕</button></span>');
    });
  });

  // Date filter
  if (dateFilter && dateFilter.mode) {
    var dLabel = {hoy:'Hoy', semana:'Esta semana', mes:'Este mes', anio:'Este año', rango:'Rango'}[dateFilter.mode] || dateFilter.mode;
    chips.push('<span class="v37-active-chip">📅 '+dLabel+'<button onclick="clearDateFilter()">✕</button></span>');
  }

  // Search text — v39: el chip ahora indica si el alcance elegido REALMENTE
  // está filtrando la vista actual, para que sea evidente cuándo el alcance
  // "tarjetas/proyecto/ambas" tiene efecto y cuándo no.
  var searchText = (document.getElementById('searchInput')||{}).value;
  if (searchText && searchText.trim()) {
    var v37VM = window.viewMode27 || 'grid';
    var v37ScopeNow = window.v37SearchScope || 'cards';
    var v37AppliesNow = v37ScopeNow === 'both' || (v37ScopeNow === 'cards' && v37VM !== 'proyecto') || (v37ScopeNow === 'proyecto' && v37VM === 'proyecto');
    if (v37AppliesNow) {
      chips.push('<span class="v37-active-chip">🔍 "'+escHtml(searchText.trim())+'"</span>');
    } else {
      chips.push('<span class="v37-active-chip" style="opacity:.55;" title="No filtra esta vista: el alcance de búsqueda elegido no la incluye">🔍 "'+escHtml(searchText.trim())+'" (no aplica aquí)</span>');
    }
  }

  area.innerHTML = chips.join('');
}

function v37ClearSavedSearch() {
  window.v37ActiveSearchId = null;
  clearAllFilters();
}

// Override v27ApplyFavSearch to track + show in count-bar + highlight sidebar

clearAllFilters = function() {

};

// ── Hide/show outer sortSelect based on view mode ────────────────────────────

// ── Override v29BuildFormCell: reorder + compact ──────────────────────────────
v29BuildFormCell = function(idea) {
  var id = idea.id;
  var tags = (idea.etiquetas||[]).map(function(t) {
    return '<span class="selected-tag-chip" style="cursor:pointer;background:#fff;" onclick="toggleProjectInnerFilter(\''+escHtml(t)+'\')" title="Filtrar dentro de este proyecto">'+escHtml(t)+'<button type="button" onclick="event.stopPropagation();v29RmTag(\''+id+'\',\''+escHtml(t)+'\')" style="background:none;border:none;cursor:pointer;color:#a8801a;padding:0 3px;font-size:13px;line-height:1;">✕</button></span>';
  }).join('');
  return '<div class="pt-form-inner" style="padding:6px 8px;display:flex;flex-direction:column;gap:5px;">'
    // ① Acción
    +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:2px;">Acción</div>'
    +'<input type="text" value="'+escHtml(idea.accion||'')+'" onblur="v27UpdatePt(\''+id+'\',\'accion\',this.value)" placeholder="Paso a seguir (opcional)" style="width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-family:var(--font-sans);font-size:11px;outline:none;background:var(--cream-2);color:var(--ink);"></div>'
    // ② Etiquetas (chips ahora clicables: filtran Vista Proyecto por esa etiqueta)
    +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:2px;">Etiquetas</div>'
    +'<div id="ptChips-'+id+'" style="display:flex;flex-wrap:wrap;gap:3px;min-height:16px;">'+tags+'</div>'
    +'<input type="text" placeholder="Buscar o añadir (Enter)" id="ptTagIn-'+id+'"'
    +' oninput="v29FilterTagCloud(\''+id+'\',this.value)"'
    +' onkeydown="if(event.key===\'Enter\'||event.key===\',\'){event.preventDefault();v29AddTag(\''+id+'\',this.value);this.value=\'\';}"'
    +' style="width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:8px;font-family:var(--font-sans);font-size:11px;outline:none;background:var(--cream-2);color:var(--ink);margin-top:3px;">'
    +'<div id="ptTagCloud-'+id+'" style="display:flex;flex-wrap:wrap;gap:3px;margin-top:3px;max-height:50px;overflow-y:auto;padding:3px;background:#fff;border:1px solid var(--line);border-radius:8px;"></div></div>'
    // ③ Proyecto + Tipo (2 per row, compact) — v42: dropdown híbrido (escribir libre O elegir de lista)
    +'<div style="display:grid;grid-template-columns:1fr 1fr;gap:5px;">'
    +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:2px;">Proyecto</div>'
    +'<div class="hybrid-select-wrap">'
    +'<input type="text" id="inputProyecto-'+id+'" value="'+escHtml(idea.proyecto||'')+'" placeholder="Proyecto" style="font-size:11px;padding:5px 22px 5px 7px;"'
    +' oninput="filterHybridDropdown(\'proyecto\',\'inputProyecto-'+id+'\',\'dropdown-proyecto-'+id+'\')"'
    +' onfocus="filterHybridDropdown(\'proyecto\',\'inputProyecto-'+id+'\',\'dropdown-proyecto-'+id+'\')"'
    +' onchange="v27UpdatePt(\''+id+'\',\'proyecto\',this.value)">'
    +'<div class="hybrid-select-arrow" style="width:22px;font-size:9px;" onclick="toggleHybridDropdown(\'proyecto\',\'inputProyecto-'+id+'\',\'dropdown-proyecto-'+id+'\')">▾</div>'
    +'<div class="hybrid-dropdown" id="dropdown-proyecto-'+id+'" style="font-size:11px;"></div>'
    +'</div></div>'
    +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:2px;">Tipo</div>'
    +'<div class="hybrid-select-wrap">'
    +'<input type="text" id="inputTipo-'+id+'" value="'+escHtml(idea.tipo||'')+'" placeholder="Tipo" style="font-size:11px;padding:5px 22px 5px 7px;"'
    +' oninput="filterHybridDropdown(\'tipo\',\'inputTipo-'+id+'\',\'dropdown-tipo-'+id+'\')"'
    +' onfocus="filterHybridDropdown(\'tipo\',\'inputTipo-'+id+'\',\'dropdown-tipo-'+id+'\')"'
    +' onchange="v27UpdatePt(\''+id+'\',\'tipo\',this.value)">'
    +'<div class="hybrid-select-arrow" style="width:22px;font-size:9px;" onclick="toggleHybridDropdown(\'tipo\',\'inputTipo-'+id+'\',\'dropdown-tipo-'+id+'\')">▾</div>'
    +'<div class="hybrid-dropdown" id="dropdown-tipo-'+id+'" style="font-size:11px;"></div>'
    +'</div></div>'
    +'</div>'
    // ③b Ánimo
    +'<div><div style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-bottom:2px;">Ánimo</div>'
    +'<div class="hybrid-select-wrap">'
    +'<input type="text" id="inputAnimo-'+id+'" value="'+escHtml(idea.animo||'')+'" placeholder="Ánimo" style="font-size:11px;padding:5px 22px 5px 7px;"'
    +' oninput="filterHybridDropdown(\'animo\',\'inputAnimo-'+id+'\',\'dropdown-animo-'+id+'\')"'
    +' onfocus="filterHybridDropdown(\'animo\',\'inputAnimo-'+id+'\',\'dropdown-animo-'+id+'\')"'
    +' onchange="v27UpdatePt(\''+id+'\',\'animo\',this.value)">'
    +'<div class="hybrid-select-arrow" style="width:22px;font-size:9px;" onclick="toggleHybridDropdown(\'animo\',\'inputAnimo-'+id+'\',\'dropdown-animo-'+id+'\')">▾</div>'
    +'<div class="hybrid-dropdown" id="dropdown-animo-'+id+'" style="font-size:11px;"></div>'
    +'</div></div>'
    // ④ Fecha (small)
    +'<div style="font-size:9px;color:var(--ink-3);">📅 '+escHtml(idea.fecha||'Sin fecha')+'</div>'
    // ⑤ Buttons
    +'<div class="card-actions" style="flex-wrap:wrap;padding-top:2px;">'
    +'<button class="btn-copy" onclick="copyIdeaText(\''+id+'\',this)" title="Copiar">📋</button>'
    +'<button class="icon-btn" onclick="duplicateIdea(\''+id+'\')" title="Duplicar">📄</button>'
    +'<button class="icon-btn" onclick="startEdit(\''+id+'\')" title="Editar">✏️</button>'
    +'<button class="icon-btn fav" onclick="toggleFav(\''+id+'\',this)">'+(idea.favorita?'⭐':'☆')+'</button>'
    +'<button class="icon-btn task" onclick="toggleTask(\''+id+'\',this)" title="Tarea">'+(idea.tarea?'✅':'☐')+'</button>'
    +'<button class="icon-btn" onclick="deleteIdea(\''+id+'\')" title="Eliminar">🗑</button>'
    +'<button class="icon-btn" onclick="v27PtAI(\''+id+'\')" title="✦ IA: corrige y clasifica (proyecto/tipo/ánimo/etiquetas)" style="font-weight:700;color:var(--gold);">✦IA</button>'
    +'<button class="icon-btn" onclick="v41PtFreeAI(\''+id+'\')" title="🤖 IA libre: corrige y clasifica igual que ✦IA. Si escribes #IA# en Original, responde/ejecuta esa instrucción o pregunta en vez de solo corregir (puede leer imágenes adjuntas)." style="font-weight:700;color:#0ea5e9;">🤖IA</button>'
    +'<div class="row-order-btns"><button class="row-order-btn" onclick="v32MoveRow(\''+id+'\',\'up\')">▲</button><button class="row-order-btn" onclick="v32MoveRow(\''+id+'\',\'down\')">▼</button></div>'
    +'</div>'
    +'</div>';
};
v27BuildFormCell = v29BuildFormCell;

// ── v37 init ──────────────────────────────────────────────────────────────────
var _origInitV37 = init;
init = async function() {
  await _origInitV37();
  v37RenderFavSidebar();
  v37RenderActiveFilters();
  // Hide outer sort if in proyecto mode
  var outerSort = document.getElementById('sortSelect');
  if (outerSort && (window.viewMode27 || 'grid') === 'proyecto') outerSort.style.display = 'none';
};

init();
</script>
