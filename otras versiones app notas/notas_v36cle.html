async function requestAutoFill(fromChat = false, useClaude = false) {
  const inputEl = document.getElementById('inputContenido');
  const text = inputEl.innerText.trim();
  if (!text && aiConversation.length === 0) { showToast('Escribe tu nota cruda primero'); return; }

  const btn = document.getElementById('btnAutoFill'); const sp = document.getElementById('aiSpinner'); const txt = document.getElementById('aiText');
  btn.disabled = true; sp.style.display = 'inline-block'; txt.textContent = 'Pensando...';
  inputEl.classList.add('blinking-gold');

  // Recolectar lo que YA escribiste para que la IA lo mejore
  const currentContext = {
    proyecto: document.getElementById('inputProyecto').value.trim(),
    tipo: document.getElementById('inputTipo').value.trim(),
    animo: document.getElementById('inputAnimo').value.trim(),
    accion: document.getElementById('inputAccion').value.trim()
  };

 try {
    // Extraemos tus categorías actuales para que la IA no invente
    const existingProyectos = [...new Set(allIdeas.map(i => i.proyecto).filter(Boolean))];
    const existingTipos = [...new Set(allIdeas.map(i => i.tipo).filter(Boolean))];
    const existingAnimos = [...new Set(allIdeas.map(i => i.animo).filter(Boolean))];

    const r = await postGAS({ 
      action: 'autoFill', 
      text: text, 
      current: currentContext, 
      conversacion: aiConversation,
      existingTags: allTags.map(t => t.etiqueta),
      existingProyectos: existingProyectos,
      existingTipos: existingTipos,
      existingAnimos: existingAnimos,
      useClaude: useClaude
    });

    // ── Solo si AMBAS IAs fallaron mostramos el aviso ──
    if (!r.ok && r.quotaExceeded) {
      btn.disabled = false; sp.style.display = 'none'; txt.textContent = '🪄 Asistente & Tutor IA';
      inputEl.classList.remove('blinking-gold');
      showToast('⚠️ IA no disponible en este momento. Intenta más tarde.');
      return;
    }

if (r.ok && r.data) {
       // Llenar formulario con la magia
       if (r.data.contenido) inputEl.innerText = r.data.contenido;
       if (r.data.proyecto)  document.getElementById('inputProyecto').value = r.data.proyecto;
       if (r.data.tipo)      document.getElementById('inputTipo').value = r.data.tipo;
       if (r.data.animo)     document.getElementById('inputAnimo').value = r.data.animo;
       if (r.data.accion)    document.getElementById('inputAccion').value = r.data.accion;
       
       if (r.data.original)  document.getElementById('inputOriginal').value = r.data.original;
       if (r.data.leccion)   document.getElementById('inputLeccion').value = r.data.leccion;
       
       if (r.data.etiquetas && Array.isArray(r.data.etiquetas)) {
          selectedTags = [...new Set([...selectedTags, ...r.data.etiquetas.map(t => t.toLowerCase().trim().replace(/\s+/g, '-'))])];
          renderModalTagCloud();
       }

       if (r.data.leccion) {
         const tp = document.getElementById('tutorPreview');
         tp.style.display = 'block';
         tp.innerHTML = `<strong>💡 Lección detectada:</strong> ${escHtml(r.data.leccion).replace(/\n/g, ' ')}`;
       } else { document.getElementById('tutorPreview').style.display = 'none'; }

       const modelLabel = r.usedModel === 'claude' ? '✨ Listo (vía Claude)' : '✨ Listo';
       showToast(modelLabel);
       
       document.getElementById('chatSection').style.display = 'block';
       if (!fromChat && aiConversation.length === 0) {
          aiConversation.push({ role: 'user', content: `Analiza esta nota:\n\n${text}` });
       }
       aiConversation.push({ role: 'assistant', content: r.rawAiResponse });
       appendChatMsg('ai', "He ajustado los campos. Si quieres cambiar algo, dímelo aquí.");
    } else {
       throw new Error(r.error || 'Error desconocido');
    }
  } catch(e) {
    // AHORA TE MOSTRARÁ EL ERROR REAL EN PANTALLA
    showToast(e.message || 'Error en la IA'); 
  }

  btn.disabled = false; sp.style.display = 'none'; txt.textContent = '🪄 Asistente & Tutor IA';
  inputEl.classList.remove('blinking-gold');
}

function renderModalTagCloud() {
  const container = document.getElementById('modalTagCloud');
  const allKnown = [...new Set([...getCounts('etiquetas').map(e=>e[0]), ...pendingNewValues.etiqueta.map(t=>t.toLowerCase()), ...selectedTags])];
  const filterText = (document.getElementById('tagInput').value || '').toLowerCase().trim();
  const filtered = filterText ? allKnown.filter(t => t.includes(filterText)) : allKnown;
  if (allKnown.length === 0) { container.innerHTML = '<span style="color:var(--ink-3);font-size:12px;">Sin etiquetas</span>'; }
  else if (filtered.length === 0) { container.innerHTML = '<span style="color:var(--ink-3);font-size:12px;">Sin coincidencias. Presiona Enter para crearla.</span>'; }
  else {
    container.innerHTML = filtered.map(t => {
      const isActive = selectedTags.includes(t);
      return `<span class="selectable-tag ${isActive ? 'active' : ''}" onclick="toggleModalTag('${escHtml(t)}')">${escHtml(t)}</span>`;
    }).join('');
  }
  renderSelectedTagsPanel();
}

// Muestra, debajo del buscador, las etiquetas ya elegidas para esta nota (como chips removibles)
function renderSelectedTagsPanel() {
  const panel = document.getElementById('selectedTagsPanel');
  if (!panel) return;
  if (selectedTags.length === 0) { panel.innerHTML = ''; return; }
  panel.innerHTML = `
    <div class="selected-tags-label">Etiquetas de esta nota (${selectedTags.length})</div>
    <div class="selected-tags-row">
      ${selectedTags.map(t => `<span class="selected-tag-chip">${escHtml(t)}<button type="button" onclick="toggleModalTag('${escHtml(t)}')" title="Quitar">✕</button></span>`).join('')}
    </div>`;
}

function toggleModalTag(tag) {
  const clean = tag.toLowerCase().trim(); const idx = selectedTags.indexOf(clean);
  if (idx > -1) selectedTags.splice(idx, 1); else selectedTags.push(clean);
  renderModalTagCloud();
}

function addTag(tag) { const clean = tag.toLowerCase().trim().replace(/\s+/g, '-'); if (clean && !selectedTags.includes(clean)) { selectedTags.push(clean); renderModalTagCloud(); } }
function handleTagInput(e) { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); const v = document.getElementById('tagInput').value.trim(); if (v) { addTag(v); document.getElementById('tagInput').value = ''; renderModalTagCloud(); } } }

async function saveIdea() {
  const contenidoEl = document.getElementById('inputContenido');
  const contenido = sanitizeHtml(contenidoEl.innerHTML.trim());
  const plainCheck = contenidoEl.innerText.trim();
  if (!plainCheck) { showToast('Escribe algo primero'); return; }
  // Limpiar el input de etiquetas sin agregarlo — solo se guarda si el usuario
  // presionó Enter explícitamente (ver handleTagInput). Si dejó texto sin confirmar,

  document.getElementById('tagInput').value = '';

  const editId = document.getElementById('editIdeaId').value;
  const body = {
    contenido: contenido, etiquetas: selectedTags,
    animo: document.getElementById('inputAnimo').value.trim(),
    proyecto: document.getElementById('inputProyecto').value.trim(),

    accion: document.getElementById('inputAccion').value.trim(),
    original: document.getElementById('inputOriginal').value,
    leccion: document.getElementById('inputLeccion').value
  };

  const btn = document.getElementById('btnSave'); btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    let r;
    if (editId) {
       body.action = 'updateIdea'; body.id = editId; body.text = contenido; 
       r = await postGAS(body);
    } else {
       body.action = 'saveIdea'; r = await postGAS(body);
    }
    if (r.ok) { closeModal(true); showToast('Guardado ✦'); await loadIdeas(); } else showToast('Error');
  } catch(e) { showToast('Error de red'); }
  btn.disabled = false; btn.textContent = 'Guardar';
}

// Helpers
async function postGAS(body) {
  const form = new FormData();
  form.append('payload', JSON.stringify(body));
  const r = await fetch(GAS_URL, { method: 'POST', body: form });
  const raw = await r.text();
  try {
    return JSON.parse(raw);
  } catch (e) {
    // Si el backend no devuelve JSON válido, lo más probable es que el Apps Script
    // desplegado esté desactualizado (acción no reconocida) o haya un error de permisos.
    return { ok: false, error: 'Respuesta inesperada del servidor. Verifica que implementaste la última versión del Apps Script.' };
  }
}
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
let toastTimer; function showToast(msg) { const existing = document.querySelector('.toast'); if (existing) existing.remove(); clearTimeout(toastTimer); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); toastTimer = setTimeout(() => t.remove(), 2800); }

// ── Soporte para Pegar Imágenes Directamente (Ctrl+V / Cmd+V) ──
document.addEventListener('paste', async (e) => {
  const activeEl = document.activeElement;
  const isModalEditor = activeEl && activeEl.id === 'inputContenido';
  const isInlineEditor = activeEl && activeEl.classList && activeEl.classList.contains('card-text');
  
  // Solo actuar si estamos escribiendo dentro de una nota (modal o tarjeta)
  if (!isModalEditor && !isInlineEditor) return; 

  const items = (e.clipboardData || e.originalEvent.clipboardData).items;
  for (let item of items) {
    if (item.type.indexOf('image/') === 0) {
      e.preventDefault(); // Evita que se pegue como código base64 gigante e ilegible
      const file = item.getAsFile();
      if (!file) continue;
      if (file.size > 5 * 1024 * 1024) { 
        showToast('La imagen es muy grande (máx. 5MB)'); 
        continue; 
      }

      // Guardar la posición del cursor antes de subir la imagen
      const sel = window.getSelection();
      imageInsertContext.isCard = isInlineEditor;
      imageInsertContext.savedRange = (sel && sel.rangeCount > 0) ? sel.getRangeAt(0).cloneRange() : null;

      showToast('Subiendo imagen pegada…');
      try {
        const base64 = await fileToBase64(file);
        // Usamos tu función existente de Google Apps Script para subirla a Drive
        const r = await postGAS({ action: 'uploadImage', imageBase64: base64, mimeType: file.type, fileName: 'imagen_pegada.png' });
        
        if (r.ok && r.url) {
          insertImageAtSavedPosition(r.url, isInlineEditor);
          showToast('Imagen agregada ✦');
        } else {
          showToast(r.error || 'No se pudo subir la imagen pegada');
        }
      } catch (err) {
        showToast('Error al subir la imagen');
      }
    }
  }
});

    if (!sel.rangeCount) return;
    
    let node = sel.focusNode;
    let block = node.nodeType === 3 ? node.parentNode : node;
    
    while (block && block.parentNode !== editor && block !== editor) { block = block.parentNode; }
    
    const chk = block ? block.querySelector('.chk-box') : null;
    if (chk) {
      e.preventDefault();
      const cleanText = block.textContent.replace(/[☐☑\u00A0\s]/g, '');
      
      if (cleanText === '') {
         block.innerHTML = '<br>';
         const range = document.createRange();
         range.selectNodeContents(block);
         range.collapse(true);
         sel.removeAllRanges(); sel.addRange(range);
      } else {
         document.execCommand('insertHTML', false, '<br><span class="chk-box" contenteditable="false">☐</span>&nbsp;');
      }
    }
  }
});

function insertTaskbox() {
  restoreColorSelection();
  const editor = document.getElementById('inputContenido');
  if (!activeCardId && document.activeElement !== editor) editor.focus();
  
  document.execCommand('insertHTML', false, `<span class="chk-box" contenteditable="false">☐</span>&nbsp;`);
  
  if (activeCardId) {
    const el = document.getElementById(`text-${activeCardId}`);
    if (el) saveCardEdit(activeCardId, el);
  }
}

// ── Color util ────────────────────────────────────────────────────────────────
function v36isLight(hex) {
  if (!hex || hex.length < 7) return true;
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (r*299+g*587+b*114)/1000 > 155;
}

async function v36loadFavSearches() {

function v36RenderFavSection() {

  }
  html += '<div style="padding:4px 20px 8px;"><button class="filter-btn" onclick="v36saveSearch()" style="color:var(--gold);font-weight:500;"><span>💾</span> Guardar búsqueda actual</button></div>';

function v36saveSearch() {
  const name = prompt('Nombre para esta búsqueda:');
  if (!name || !name.trim()) return;
  const filtros = {proyectos:[...filters.proyectos], tipos:[...filters.tipos], animos:[...filters.animos], etiquetas:[...filters.etiquetas], search:document.getElementById('searchInput').value||''};
  postGAS({action:'saveFavSearch', nombre:name.trim(), filtros}).then(function(r) {
    if (r.ok) { showToast('Búsqueda guardada ✦'); v36loadFavSearches(); }
    else showToast('Error');
  }).catch(function() { showToast('Error'); });
}
function v36applyFavSearch(id) {
  const fs = window.v36FavSearches.find(s => s.id === id);
  if (!fs) return;
  const f = fs.filtros || {};
  filters = {proyectos:f.proyectos||[], tipos:f.tipos||[], animos:f.animos||[], etiquetas:f.etiquetas||[]};
  if (f.search) document.getElementById('searchInput').value = f.search;
  renderSidebarFilters(); renderIdeas(); showToast('Búsqueda aplicada');
}
async function v36delFavSearch(id) {
  if (!confirm('¿Eliminar esta búsqueda guardada?')) return;
  try {
    const r = await postGAS({action:'deleteFavSearch', id});
    if (r.ok) { window.v36FavSearches = window.v36FavSearches.filter(s => s.id !== id); v36RenderFavSection(); showToast('Eliminada'); }
  } catch(e) {}
}

    const ta = document.createElement('textarea'); ta.value = ne.innerText||''; ta.style.cssText='position:fixed;opacity:0;';
    document.body.appendChild(ta); ta.focus(); ta.select();
    try { document.execCommand('copy'); ok = true; } catch(e2) {} document.body.removeChild(ta);
  }
  showToast(ok ? 'Copiado ✦' : 'No se pudo copiar');
}

function v36TFHi(ci,ii){var el=v36getEl(ci);if(!el)return;el.focus();var sel=window.getSelection();var isHi=false;if(sel&&!sel.isCollapsed){var c=sel.getRangeAt(0).commonAncestorContainer;var n=c.nodeType===3?c.parentNode:c;var bg=window.getComputedStyle(n).backgroundColor;isHi=bg&&bg!=='rgba(0, 0, 0, 0)'&&bg!=='transparent'&&bg!=='rgb(255, 255, 255)';}document.execCommand('hiliteColor',false,isHi?'transparent':(lastHilite||'#fef08a'));if(ii)v36autoSave(ii,el);}

function v36searchInNote(id,cid,q){var el=document.getElementById(cid);if(!el)return;el.querySelectorAll('.note-highlight').forEach(function(n){n.outerHTML=n.textContent;});if(!q||!q.trim()){var cnt=document.getElementById('nsCnt-'+id);if(cnt)cnt.textContent='';return;}var nq=v36norm(q);function walk(node){if(node.nodeType===3){var t=node.textContent;var nt=v36norm(t);var idx=nt.indexOf(nq);if(idx<0)return;var span=document.createElement('span');span.className='note-highlight';span.textContent=t.slice(idx,idx+q.length);var frag=document.createDocumentFragment();if(idx>0)frag.appendChild(document.createTextNode(t.slice(0,idx)));frag.appendChild(span);if(idx+q.length<t.length)frag.appendChild(document.createTextNode(t.slice(idx+q.length)));node.parentNode.replaceChild(frag,node);}else if(node.nodeType===1&&!node.classList.contains('note-highlight')){Array.from(node.childNodes).forEach(walk);}}walk(el);var c2=el.querySelectorAll('.note-highlight').length;var cnt2=document.getElementById('nsCnt-'+id);if(cnt2)cnt2.textContent=c2?c2+' resultado(s)':'Sin resultados';if(c2)el.querySelectorAll('.note-highlight')[0].scrollIntoView({block:'nearest'});}

function v36renderProyecto(list) {

    : '';
  // Project selector label

  // Build groups
  const groups={}, order=[];
  list.forEach(function(idea){var p=(idea.proyecto||'general').toLowerCase()||'general';if(!groups[p]){groups[p]=[];order.push(p);}groups[p].push(idea);});
  const itemMeta=JSON.parse(localStorage.getItem('notas-item-meta')||'{}');
  order.sort(function(a,b){var aP=itemMeta[a]&&itemMeta[a].pinned,bP=itemMeta[b]&&itemMeta[b].pinned;if(aP&&!bP)return -1;if(!aP&&bP)return 1;return v36norm(a).localeCompare(v36norm(b));});
  // Build thead
  let thead='<tr>';
  if(cols.form) thead+='<th class="pt-th" id="ptH-form" style="min-width:220px;position:sticky;left:0;z-index:6;background:var(--cream-2);">Formulario / Datos<div class="pt-col-resize" onmousedown="v36startResize(\'ptH-form\',event)"></div></th>';

  thead+='</tr>';
  // Build rows
  let rows='';
  order.forEach(function(proj){
    const ideas=groups[proj];
    if(!ideas||!ideas.length)return;
    window.v36currentProj = ideas[0].proyecto||'General';
    const nc=(cols.form?1:0)+(cols.orig?1:0)+(cols.cont?1:0)+(cols.lec?1:0)||1;
    rows+='<tr class="pt-proj-hdr"><td colspan="'+nc+'" style="position:sticky;left:0;">📁 '+escHtml(ideas[0].proyecto||'General')+' <span style="font-weight:400;opacity:.6;">('+ideas.length+')</span></td></tr>';
    ideas.forEach(function(idea){
      const oid='ptO-'+idea.id, cid='ptC-'+idea.id, lid='ptL-'+idea.id;
      let row='<tr id="ptRow-'+idea.id+'">';
      if(cols.form) row+='<td data-col="form" style="position:sticky;left:0;background:#fff;z-index:3;vertical-align:top;border-right:1px solid var(--line);">'+v36buildFormCell(idea)+'</td>';
      if(cols.orig) row+='<td data-col="orig" style="border-right:1px solid var(--line);vertical-align:top;"><div class="pt-content-cell" id="'+oid+'" contenteditable="true" onblur="v36saveOrig(\''+idea.id+'\',\''+oid+'\')" oninput="v36debounceOrig(\''+idea.id+'\',this)" style="font-size:12px;">'+v36sanitize(idea.original||'')+'</div></td>';
      if(cols.cont) row+='<td data-col="cont" style="border-right:1px solid var(--line);vertical-align:top;"><div class="pt-content-cell" id="'+cid+'" contenteditable="true" onblur="v36saveCont(\''+idea.id+'\',\''+cid+'\')" oninput="v36debounce(\''+idea.id+'\',this)">'+v36sanitize(idea.contenido)+'</div></td>';
      if(cols.lec)  row+='<td data-col="lec" style="vertical-align:top;"><div class="pt-content-cell" id="'+lid+'" contenteditable="true" onblur="v36saveLec(\''+idea.id+'\',\''+lid+'\')" oninput="v36debounceLec(\''+idea.id+'\',this)">'+v36sanitize(idea.leccion||'')+'</div></td>';
      row+='</tr>'; rows+=row;
    });
  });
  wrap.innerHTML='<div class="pt-wrap"><div class="pt-topbar">'
    +'<div style="display:flex;gap:3px;align-items:center;">'
    +'<button type="button" class="format-btn" style="width:24px;height:24px;" onmousedown="event.preventDefault()" onclick="document.execCommand(\'bold\',false,null)"><b>B</b></button>'
    +'<button type="button" class="format-btn" style="width:24px;height:24px;" onmousedown="event.preventDefault()" onclick="document.execCommand(\'italic\',false,null)"><i>I</i></button>'
    +'<button type="button" class="format-btn" style="width:24px;height:24px;" onmousedown="event.preventDefault()" onclick="document.execCommand(\'underline\',false,null)"><u>U</u></button>'
    +'<button type="button" class="format-btn" style="width:24px;height:24px;" onmousedown="event.preventDefault()" onclick="document.execCommand(\'hiliteColor\',false,lastHilite||\'#fef08a\')" title="Resaltar">🖍️</button>'
    +'<button type="button" class="format-btn" style="width:24px;height:24px;" onmousedown="event.preventDefault()" onclick="document.execCommand(\'removeFormat\',false,null)">✕</button>'
    +'</div>'
    +'<div class="proj-selector-wrap" style="position:relative;margin-left:8px;">'
    +'<button style="font-size:11px;font-weight:700;color:var(--gold);text-transform:uppercase;background:none;border:none;cursor:pointer;padding:3px 6px;border-radius:6px;" onclick="v36toggleProjSel()">📁 <span id="v36ProjLbl">'+escHtml(projLabel)+'</span> ▾</button>'
    +'<div id="v36ProjDd" style="display:none;position:absolute;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:60;min-width:160px;max-height:200px;overflow-y:auto;">'
    +'<input type="text" placeholder="Buscar..." oninput="v36filterProjDd(this.value)" id="v36ProjSearch" style="width:100%;padding:5px 8px;border:none;border-bottom:1px solid var(--line);font-family:var(--font-sans);font-size:12px;outline:none;">'
    +'<div id="v36ProjList"></div></div></div>'
    +(favHTML ? '<div style="margin-left:8px;flex:1;overflow:hidden;">'+favHTML+'</div>' : '')
    +'<div style="position:relative;margin-left:auto;">'
    +'<button class="pt-cols-btn" onclick="const m=document.getElementById(\'v36ColMenu\');m.style.display=m.style.display===\'none\'?\'block\':\'none\'">⚙️ Columnas</button>'
    +'<div id="v36ColMenu" style="display:none;position:absolute;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:50;right:0;top:calc(100% + 4px);min-width:180px;">'+colMenu+'</div>'
    +'</div></div>'
    +'<div class="pt-table-wrap"><table class="pt-table" style="width:max-content;min-width:100%;"><thead style="position:sticky;top:0;z-index:5;">'+thead+'</thead><tbody>'+rows+'</tbody></table></div>'
    +'<button class="pt-add-row" onclick="v36NewEntry()">＋ Nueva Entrada'+(window.v36currentProj?' en '+escHtml(window.v36currentProj):'')+'</button>'
    +'</div>';
  setTimeout(function(){document.querySelectorAll('.ptCloud-,[ id^="ptCloud-"]').forEach(function(el){var id=el.id.replace('ptCloud-','');v36filterCloud(id,'');});},100);
}

function v36toggleCol(key,val){window.v36ptCols[key]=val;var thMap={form:'ptH-form',orig:'ptH-orig',cont:'ptH-cont',lec:'ptH-lec'};var th=document.getElementById(thMap[key]);if(th)th.style.display=val?'':'none';document.querySelectorAll('[data-col="'+key+'"]').forEach(function(td){td.style.display=val?'':'none';});}
function v36startResize(thId,e){e.preventDefault();e.stopPropagation();var th=document.getElementById(thId);if(!th)return;var startX=e.pageX,startW=th.offsetWidth;function onMove(e2){th.style.width=Math.max(80,startW+e2.pageX-startX)+'px';}function onUp(){document.removeEventListener('mousemove',onMove);document.removeEventListener('mouseup',onUp);}document.addEventListener('mousemove',onMove);document.addEventListener('mouseup',onUp);}

function v36toggleProjSel(){var dd=document.getElementById('v36ProjDd');if(!dd)return;var isOpen=dd.style.display!=='none';if(isOpen){dd.style.display='none';return;}v36filterProjDd('');dd.style.display='block';var inp=document.getElementById('v36ProjSearch');if(inp){inp.value='';inp.focus();}setTimeout(function(){document.addEventListener('click',function cl(e){if(!dd.contains(e.target)){dd.style.display='none';document.removeEventListener('click',cl);}},{once:true});},0);}
function v36filterProjDd(q){var list=document.getElementById('v36ProjList');if(!list)return;var projs=getCounts('proyecto').map(function(p){return p[0];});var filtered=q?projs.filter(function(p){return v36norm(p).includes(v36norm(q));}):projs;list.innerHTML='<div style="padding:6px 10px;cursor:pointer;font-size:12px;color:var(--ink);" onclick="v36selectProj(\'\')">Todos los proyectos</div>'+filtered.map(function(p){return '<div style="padding:6px 10px;cursor:pointer;font-size:12px;color:var(--ink);" onclick="v36selectProj(\''+escHtml(p)+'\')">'+escHtml(p)+'</div>';}).join('');}
function v36selectProj(proj){window.v36currentProj=proj;var dd=document.getElementById('v36ProjDd');if(dd)dd.style.display='none';var lbl=document.getElementById('v36ProjLbl');if(lbl)lbl.textContent=proj?proj.toUpperCase():'Todos los proyectos';filters.proyectos=proj?[proj.toLowerCase()]:[];renderSidebarFilters();renderIdeas();}

function v36filterCloud(ideaId,q){var cloud=document.getElementById('ptCloud-'+ideaId);if(!cloud)return;var idea=allIdeas.find(function(i){return i.id===ideaId;});var existing=(idea&&idea.etiquetas)||[];var allKnown=[...new Set([...getCounts('etiquetas').map(e=>e[0]),...existing])];var nq=v36norm(q);var filtered=nq?allKnown.filter(function(t){return v36norm(t).includes(nq);}):allKnown;cloud.innerHTML=filtered.slice(0,16).map(function(t){var isA=existing.includes(t);return '<span class="selectable-tag'+(isA?' active':'')+'" onclick="v36togTag(\''+ideaId+'\',\''+escHtml(t)+'\')">'+escHtml(t)+'</span>';}).join('');}
function v36togTag(ideaId,tag){var clean=tag.toLowerCase().trim();var idea=allIdeas.find(function(i){return i.id===ideaId;});if(!idea)return;if(!idea.etiquetas)idea.etiquetas=[];var idx=idea.etiquetas.indexOf(clean);if(idx>-1)idea.etiquetas.splice(idx,1);else idea.etiquetas.push(clean);v36refreshChips(ideaId,idea.etiquetas);v36filterCloud(ideaId,document.getElementById('ptTagIn-'+ideaId)?document.getElementById('ptTagIn-'+ideaId).value:'');postGAS({action:'updateIdea',id:ideaId,text:idea.contenido||'',etiquetas:idea.etiquetas}).catch(function(){});}
function v36addTag(ideaId,text){var clean=text.trim().toLowerCase().replace(/\s+/g,'-');if(!clean)return;var idea=allIdeas.find(function(i){return i.id===ideaId;});if(!idea)return;if(!idea.etiquetas)idea.etiquetas=[];if(!idea.etiquetas.includes(clean))idea.etiquetas.push(clean);v36refreshChips(ideaId,idea.etiquetas);postGAS({action:'updateIdea',id:ideaId,text:idea.contenido||'',etiquetas:idea.etiquetas}).catch(function(){});}
function v36rmTag(ideaId,tag){var idea=allIdeas.find(function(i){return i.id===ideaId;});if(!idea)return;idea.etiquetas=(idea.etiquetas||[]).filter(function(t){return t!==tag;});v36refreshChips(ideaId,idea.etiquetas);postGAS({action:'updateIdea',id:ideaId,text:idea.contenido||'',etiquetas:idea.etiquetas}).catch(function(){});}
function v36refreshChips(ideaId,tags){var chips=document.getElementById('ptChips-'+ideaId);if(!chips)return;chips.innerHTML=(tags||[]).map(function(t){return '<span class="selected-tag-chip">'+escHtml(t)+'<button type="button" onclick="v36rmTag(\''+ideaId+'\',\''+escHtml(t)+'\')" style="background:none;border:none;cursor:pointer;color:#a8801a;padding:0 2px;font-size:12px;line-height:1;">✕</button></span>';}).join('');}

function v36saveCont(id,cid){var el=document.getElementById(cid);if(!el)return;var html=v36sanitize(el.innerHTML);var idea=allIdeas.find(function(i){return i.id===id;});if(!idea)return;idea.contenido=html;clearTimeout(window._v36ct&&window._v36ct[id]);if(!window._v36ct)window._v36ct={};window._v36ct[id]=setTimeout(function(){postGAS({action:'updateIdea',id:id,text:html}).catch(function(){});},700);}
function v36saveOrig(id,oid){var el=document.getElementById(oid);if(!el)return;var html=v36sanitize(el.innerHTML);var idea=allIdeas.find(function(i){return i.id===id;});if(!idea)return;idea.original=html;clearTimeout(window._v36ot&&window._v36ot[id]);if(!window._v36ot)window._v36ot={};window._v36ot[id]=setTimeout(function(){postGAS({action:'updateIdea',id:id,text:idea.contenido||'',original:html}).catch(function(){});},700);}
function v36saveLec(id,lid){var el=document.getElementById(lid);if(!el)return;var html=v36sanitize(el.innerHTML);var idea=allIdeas.find(function(i){return i.id===id;});if(!idea)return;idea.leccion=html;postGAS({action:'updateIdea',id:id,text:idea.contenido||'',leccion:html}).catch(function(){});}
function v36debounce(id,el){clearTimeout(window._v36db&&window._v36db[id]);if(!window._v36db)window._v36db={};window._v36db[id]=setTimeout(function(){v36saveCont(id,'ptC-'+id);},600);}
function v36debounceOrig(id,el){clearTimeout(window._v36dbo&&window._v36dbo[id]);if(!window._v36dbo)window._v36dbo={};window._v36dbo[id]=setTimeout(function(){v36saveOrig(id,'ptO-'+id);},600);}
function v36debounceLec(id,el){clearTimeout(window._v36dbl&&window._v36dbl[id]);if(!window._v36dbl)window._v36dbl={};window._v36dbl[id]=setTimeout(function(){v36saveLec(id,'ptL-'+id);},600);}
async function v36updatePt(id,field,value){var idea=allIdeas.find(function(i){return i.id===id;});if(idea)idea[field]=value;var body={action:'updateIdea',id:id,text:(idea&&idea.contenido)||''};body[field]=value;await postGAS(body).catch(function(){});}
async function v36ptAI(id){
  var idea=allIdeas.find(function(i){return i.id===id;});if(!idea)return;
  var origEl=document.getElementById('ptO-'+id),contEl=document.getElementById('ptC-'+id),lecEl=document.getElementById('ptL-'+id);
  var rawText=(origEl&&(origEl.innerText||origEl.textContent))||idea.contenido||'';
  if(!rawText.trim()){showToast('Escribe algo en Original primero');return;}
  if(lecEl)lecEl.textContent='Procesando…';
  if(contEl)contEl.style.opacity='0.5';
  var eP=[...new Set(allIdeas.map(function(i){return i.proyecto;}).filter(Boolean))];
  var eT=[...new Set(allIdeas.map(function(i){return i.tipo;}).filter(Boolean))];
  var eA=[...new Set(allIdeas.map(function(i){return i.animo;}).filter(Boolean))];
  var r=await postGAS({action:'autoFill',text:rawText,current:{proyecto:idea.proyecto||'',tipo:idea.tipo||'',animo:idea.animo||'',accion:idea.accion||''},conversacion:[],existingTags:allTags.map(function(t){return t.etiqueta;}),existingProyectos:eP,existingTipos:eT,existingAnimos:eA}).catch(function(){return {ok:false};});
  if(contEl)contEl.style.opacity='1';
  if(!r.ok){if(lecEl)lecEl.textContent='Error';return;}
  if(r.data){
    if(r.data.contenido&&contEl){contEl.innerHTML=v36sanitize(r.data.contenido);idea.contenido=v36sanitize(r.data.contenido);await postGAS({action:'updateIdea',id:id,text:idea.contenido}).catch(function(){});}
    var lecText=r.data.leccion||'';
    if(lecEl){lecEl.textContent=lecText;idea.leccion=lecText;if(lecText)await postGAS({action:'updateIdea',id:id,text:idea.contenido||'',leccion:lecText}).catch(function(){});}
    if(!lecText&&lecEl)lecEl.textContent='✓ Sin correcciones';
  }
}

// ── extractDynamicLists: merge _Categorias from GAS ──────────────────────────
const _origEDL = extractDynamicLists;
extractDynamicLists = function() {
  _origEDL();
  fetch(GAS_URL+'?action=getAllOptions&t='+Date.now())
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d.ok) return;
      function merge(id,vals){var dl=document.getElementById(id);if(!dl)return;var existing=new Set([...dl.options].map(function(o){return o.value.toLowerCase();}));vals.forEach(function(v){if(v&&!existing.has(v.toLowerCase())){var o=document.createElement('option');o.value=v;dl.appendChild(o);}});}
      merge('list-proyecto',d.proyectos||[]);merge('list-tipo',d.tipos||[]);merge('list-animo',d.animos||[]);
      if(d.tagColors&&Object.keys(d.tagColors).length){var m=JSON.parse(localStorage.getItem('notas-item-meta')||'{}');Object.keys(d.tagColors).forEach(function(t){if(!m[t])m[t]={};if(d.tagColors[t])m[t].color=d.tagColors[t];});localStorage.setItem('notas-item-meta',JSON.stringify(m));v36ApplyItemColors();}
    }).catch(function(){});
};

// ── Override openModal for fav button ────────────────────────────────────────
const _origOpenModal = openModal;
openModal = function() {
  _origOpenModal();
  const fb = document.getElementById('modalFavBtn');
  if (fb) fb.style.display = 'none';
};
